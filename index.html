/* ═══════════════════════════════════════════════════════
   불러오는 중 화면 (정식 1.03에서 크게 손봄)

   ★ 왜 고쳤나
   전에는 동그라미만 돌고 "성도 정보를 불러오는 중..." 한 줄뿐이었다.
   첫 접속에는 명단 234KB 를 받으므로 20~30초가 걸릴 수 있는데,
   화면에 아무 변화가 없으면 ★ 멈춘 것처럼 보인다 ★.
   그래서 어르신들이 앱을 닫고 다시 시도하셨고, 그것이 '튕긴다'는
   느낌을 더 키웠다.

   이제 무엇을 받고 있는지, 몇 초가 지났는지, 왜 걸리는지를 알려 준다.
   "처음 한 번만 걸립니다" 라는 말이 있으면 기다려 주신다.
═══════════════════════════════════════════════════════ */
const STEP_TEXT = {
  auth:    '로그인을 확인하고 있습니다',
  config:  '교회 설정을 받고 있습니다',
  logo:    '교회 로고를 받고 있습니다',
  members: '성도 명단을 받고 있습니다',
  photos:  '사진을 받고 있습니다',
  /* 파이어베이스 SDK 가 깨져 화면을 다시 불러오는 중 (1.07) */
  recover: '연결을 다시 맺고 있습니다'
};

function LoadingView({ text, step, first }) {
  const [sec, setSec] = useState(0);
  useEffect(() => {
    const t = setInterval(() => setSec(v => v + 1), 1000);
    return () => clearInterval(t);
  }, []);

  return h('div', {
    className:'screen',
    style:{ alignItems:'center', justifyContent:'center', gap:'16px', padding:'28px 26px' }
  },
    h('div', { className:'spinner', style:{ width:'40px', height:'40px' } }),
    h('p', { style:{ fontSize:'16px', color:'var(--text)', fontWeight:700, textAlign:'center' } },
      (step && STEP_TEXT[step]) || text || '불러오는 중...'),

    /* 처음 접속하시는 분께는 왜 걸리는지 먼저 알려 드린다 */
    first && h('p', {
      style:{ fontSize:'13.5px', color:'var(--text-2)', textAlign:'center', lineHeight:1.75,
              maxWidth:'320px' }
    },
      '처음 접속하실 때는 성도 명단을 한 번 받아 둡니다.', h('br'),
      h('b', null, '20~30초쯤 걸릴 수 있습니다.'), h('br'),
      h('span', { style:{ color:'var(--text-3)' } }, '다음부터는 바로 열립니다.')),

    /* 되살리는 중 — 비밀번호를 다시 치지 않는다는 것을 알려 준다 */
    step === 'recover' && h('p', {
      style:{ fontSize:'13.5px', color:'var(--text-2)', textAlign:'center', lineHeight:1.75,
              maxWidth:'320px' }
    },
      '잠깐 화면을 다시 불러옵니다.', h('br'),
      h('b', null, '비밀번호를 다시 치지 않아도 됩니다.')),

    /* 5초가 지나면 초를 보여 준다 — 멈춘 것이 아니라는 신호 */
    sec >= 5 && h('p', {
      style:{ fontSize:'12.5px', color:'var(--text-3)', fontWeight:700 }
    }, sec + '초 지났습니다'),

    sec >= 20 && sec < 28 && h('p', {
      style:{ fontSize:'12.5px', color:'var(--text-3)', textAlign:'center', lineHeight:1.7,
              maxWidth:'300px' }
    }, '신호가 약한 곳에서는 더 걸립니다.', h('br'),
       h('b', null, '앱을 닫지 말고'), ' 조금 더 기다려 주세요.'),

    /* ★ 28초가 지나면 스스로 빠져나올 길을 드린다 (1.10)
       무언가에 걸려 멈춘 경우, 예전에는 앱을 강제로 닫는 수밖에 없었다.
       화면을 다시 불러오면 로그인은 그대로 남아 있으므로
       비밀번호를 다시 치지 않는다. */
    sec >= 28 && h('div', {
      style:{ display:'flex', flexDirection:'column', alignItems:'center', gap:'10px',
              maxWidth:'300px' }
    },
      h('p', { style:{ fontSize:'13px', color:'var(--text-2)', textAlign:'center', lineHeight:1.7 } },
        '너무 오래 걸리고 있습니다.', h('br'),
        h('b', null, '비밀번호는 다시 치지 않아도 됩니다.')),
      h('button', {
        type:'button', className:'btn btn-primary btn-sm',
        onClick: () => { try { location.reload(); } catch(e) {} }
      }, h('i', { className:'ti ti-refresh', style:{ fontSize:'16px' } }), '다시 시도')
    )
  );
}

/* ═══════════════════════════════════════════════════════
   로그인 화면 (1.16)

   ★ 판마다 다르게 생겼다 — BUILD 주석 참고

     BUILD 'member'  성도판
       로고 · 교회 이름 · 비밀번호 · 로그인, 이것뿐이다.
       섬기는 분 칸이 아예 없다 (임원 주소를 한 줄로 알려 준다).

     BUILD 'admin'   임원판
       담당자 · 안내실 · 전도인 ★세 칸이 한꺼번에★ 보인다.
       이 주소를 여는 분은 전부 섬기는 분이므로 감출 이유가 없다.
       기본은 ★담당자★ — 구역장·부장이 가장 많이 쓰신다.

     BUILD 'all'     통합판(설치판·손으로 쓰는 파일)
       첫 화면은 성도 하나뿐이고, 담당자·안내실·전도인은
       우측 위 [≡] 단추 안에 들어 있다.

   ★ 로그인 방식 자체는 하나도 바뀌지 않았다
   signInSmart · signInLeaderCode · signInAs · 계정 규칙 모두 그대로다.
   고르는 자리만 판에 따라 달라진다.
═══════════════════════════════════════════════════════ */

/* 섬기는 분 세 등급 — 라벨·아이콘·한 줄 설명.
   '임원'(ROLE_LABEL) 과 달리 로그인 화면에서는 '담당자'라 부른다 (1.06 그대로). */
const LOGIN_ROLES = [
  { key:'leader', label:'담당자', icon:'users',       desc:'구역 · 부서' },
  { key:'admin',  label:'안내실', icon:'user-shield', desc:'명단 · 사진 · 설정' },
  { key:'master', label:'전도인', icon:'notes',       desc:'출석 · 심방' }
];
const LOGIN_ROLE_OF = LOGIN_ROLES.reduce((o, r) => { o[r.key] = r; return o; }, {});

/* 담당 구역 대신 고르는 「전체 명단」 — 옛 leader@ 계정이다.
   구역 번호일 수 없는 글자를 표로 쓴다. */
const LEAD_ALL = '*';
/* 콤보 맨 아래 「구역 번호 직접 적기」 — 구역 번호일 수 없는 글자를 표로 쓴다 */
const LEAD_TYPE = '#';

function LoginView({ onLogin, theme, toggle, logoUrl, guCodes }) {
  /* 임원판은 담당자로 시작한다 — 구역장·부장이 가장 많이 여신다 */
  const [mode, setMode] = useState(BUILD === 'admin' ? 'leader' : 'member');
  const [pwd,  setPwd]  = useState('');
  const [err,  setErr]  = useState('');
  const [code, setCode] = useState('');
  const [busy, setBusy] = useState(false);
  /* [≡] 메뉴가 펼쳐져 있나 (통합판에서만 쓴다) */
  const [menu, setMenu] = useState(false);
  /* 담당자가 고른 구역·부서 — 기기가 기억한다 (매번 고르지 않게) */
  const [typing, setTyping] = useState(false);   /* 구역 번호를 직접 적는 중인가 */
  /* 콤보에 「고르세요」 칸이 없으므로, 처음부터 ★맨 위 항목★ 을 고른 상태로 둔다.
     화면에 보이는 것과 속으로 들고 있는 값이 어긋나면 안 되기 때문이다.
     지난번에 고르셨던 곳이 있으면 그것이 먼저다. */
  const [lead, setLead] = useState(() => {
    let saved = '';
    try { saved = localStorage.getItem('gsc_lead_code') || ''; } catch(e) {}
    if (saved) return saved;
    const gu = (typeof GU_CODES_FIXED !== 'undefined' && GU_CODES_FIXED.length)
                 ? GU_CODES_FIXED : null;
    if (gu) return String(gu[0]);
    const dept = Object.keys(DEPT_ACCOUNTS);
    return dept.length ? dept[0] : '';
  });

  const menuRef = useRef(null);
  const pwdRef  = useRef(null);

  const hasGu = !!(guCodes && guCodes.length);
  const HAS_MENU = (BUILD === 'all');      /* 우측 위 [≡] */
  const HAS_SEG  = (BUILD === 'admin');    /* 세 칸 한꺼번에 */
  const staff    = mode !== 'member';
  const cur      = LOGIN_ROLE_OF[mode] || null;
  /* 성도 로그인으로 돌아가는 길은 [≡] 가 있는 판에만 있다 */
  const showBack = HAS_MENU && staff;

  /* 메뉴 바깥을 누르거나 ESC 를 누르면 닫는다.
     휴대폰은 mousedown 이 늦게 오는 기기가 있어 touchstart 도 함께 듣는다. */
  useEffect(() => {
    if (!menu) return;
    const away = e => {
      if (menuRef.current && !menuRef.current.contains(e.target)) setMenu(false);
    };
    const esc = e => { if (e.key === 'Escape') setMenu(false); };
    document.addEventListener('mousedown',  away);
    document.addEventListener('touchstart', away);
    document.addEventListener('keydown',    esc);
    return () => {
      document.removeEventListener('mousedown',  away);
      document.removeEventListener('touchstart', away);
      document.removeEventListener('keydown',    esc);
    };
  }, [menu]);

  /* 등급을 옮길 때 — 치던 비밀번호와 오류는 반드시 지운다.
     안내실 비밀번호를 치다 말고 전도인으로 옮겼는데 그대로 남아 있으면
     엉뚱한 계정으로 로그인을 시도하게 된다. */
  function pick(m) {
    setMode(m); setMenu(false);
    setPwd(''); setErr(''); setCode('');
    setTimeout(() => { try { pwdRef.current && pwdRef.current.focus(); } catch(e) {} }, 30);
  }

  /* 고른 담당 범위를 사람이 읽는 말로 */
  function leadName(v) {
    if (v === LEAD_ALL) return '전체 명단';
    if (/^[0-9]+$/.test(v)) return v + '구역';
    return (DEPT_BY_ID[DEPT_ACCOUNTS[v]] || {}).name || v;
  }

  async function submit() {
    if (busy) return;
    if (!pwd) { setErr('비밀번호를 입력해 주세요.'); return; }
    if (mode === 'leader' && !lead) { setErr('담당하시는 구역이나 부서를 골라 주세요.'); return; }
    setBusy(true); setErr(''); setCode('');
    try {
      const role = mode !== 'leader'   ? await signInSmart(mode, pwd)
                 : lead === LEAD_ALL   ? await signInAs('leader', pwd)
                                       : await signInLeaderCode(lead, pwd);
      if (mode === 'leader') {
        try { localStorage.setItem('gsc_lead_code', lead); } catch(e) {}
      }
      setPwd('');
      await onLogin(role, pwd);
    } catch(e) {
      setErr(authErrMsg(e));
      setCode(String((e && e.code) || (e && e.message) || ''));
      setPwd('');
      await signOutAll();
    }
    setBusy(false);
  }

  /* 다른 주소를 알려 주는 한 줄 — 임원판에서만 쓴다.
     성도판에는 애초에 담당자·안내실·전도인으로 들어갈 길이 없으므로
     (signInSmart 가 member@ 만 받는다) 성도 화면에는 안내가 필요 없다. */
  const crossLink =
      (BUILD === 'admin' && SITE_MEMBER)
        ? { href:SITE_MEMBER, q:'성도이신가요?', a:'성도 주소록으로' }
    : null;

  return h('div', {
    className:'screen',
    style:{ alignItems:'center', justifyContent:'center', padding:'28px 20px', position:'relative' }
  },

    /* ── 좌측 상단 — 성도 로그인으로 돌아가기 (통합판의 등급 화면에서만) ── */
    showBack && h('button', {
      type:'button', className:'lback', disabled:busy,
      onClick: () => pick('member'),
      style:{ position:'absolute', top:'calc(16px + env(safe-area-inset-top))', left:'16px' }
    },
      h('i', { className:'ti ti-chevron-left' }), '성도 로그인'),

    /* ── 우측 상단 — 화면 밝기 · [≡] 등급 메뉴 ───────────────── */
    h('div', {
      style:{ position:'absolute', top:'calc(16px + env(safe-area-inset-top))', right:'16px',
              display:'flex', alignItems:'center', gap:'8px' }
    },
      h('button', {
        onClick: toggle, type:'button', className:'act',
        title: theme === 'dark' ? '밝은 화면으로' : '어두운 화면으로'
      }, h('i', { className: 'ti ti-' + (theme === 'dark' ? 'sun' : 'moon') })),

      /* [≡] — 담당자·안내실·전도인이 여기 들어 있다 (통합판만).
         ref 를 이 묶음에만 걸어야 밝기 단추를 눌렀을 때 메뉴가 닫힌다. */
      HAS_MENU && h('div', { ref:menuRef, style:{ position:'relative' } },
        h('button', {
          type:'button', disabled:busy,
          className:'act' + (menu || staff ? ' on' : ''),
          title:'담당자 · 안내실 · 전도인 로그인',
          'aria-label':'담당자 · 안내실 · 전도인 로그인',
          'aria-haspopup':'menu',
          'aria-expanded': menu ? 'true' : 'false',
          onClick: () => { setMenu(v => !v); setErr(''); }
        }, h('i', { className:'ti ti-menu-2' })),

        menu && h('div', { className:'lmenu', role:'menu' },
          h('div', { className:'lmenu-h' }, '섬기는 분 로그인'),
          LOGIN_ROLES.map(r => h('button', {
            key:r.key, type:'button', role:'menuitem',
            className: mode === r.key ? 'on' : '',
            onClick: () => pick(r.key)
          },
            h('i', { className:'ti ti-' + r.icon }),
            h('span', { className:'lmenu-t' },
              h('b', null, r.label),
              h('span', { className:'lmenu-s' }, r.desc)),
            mode === r.key && h('i', { className:'ti ti-check lmenu-ck' })
          )),
          staff && h('div', { className:'lmenu-d' }),
          staff && h('button', {
            type:'button', role:'menuitem', onClick: () => pick('member')
          },
            h('i', { className:'ti ti-arrow-back-up' }),
            h('span', { className:'lmenu-t' }, h('b', null, '성도 로그인')))
        )
      )
    ),

    /* ── 가운데 ────────────────────────────────────────────── */
    h('div', { className:'fade', style:{ width:'100%', maxWidth:'340px', textAlign:'center' } },
      h('div', {
        style:{ width:'84px', height:'84px', borderRadius:'24px',
                background: logoUrl ? '#FFFFFF' : 'var(--bar-bg)',
                border: logoUrl ? '1px solid var(--border-2)' : 'none',
                display:'flex', alignItems:'center', justifyContent:'center',
                margin:'0 auto 18px',
                boxShadow: logoUrl ? '0 8px 24px rgba(0,0,0,.08)' : '0 10px 30px rgba(31,78,121,.28)',
                overflow:'hidden', padding: logoUrl ? '10px' : 0 }
      },
        logoUrl
          ? h('img', { src: logoUrl, alt:'교회 로고', style:{ width:'100%', height:'100%', objectFit:'contain' } })
          : h('i', { className:'ti ti-building-church', style:{ fontSize:'38px', color:'#fff' } })
      ),

      /* 임원판에는 제목 아래 안내 줄이 없다 (1.16 — 「임원 전용」 한 줄 삭제).
         그 줄이 차지하던 자리만큼 아래 컨트롤이 위로 올라오도록,
         비어 보이지 않을 만큼의 아랫여백만 제목에 직접 준다. */
      h('p', {
        style:{ fontSize:'24px', fontWeight:800, letterSpacing:'-.03em',
                marginBottom: HAS_SEG ? '24px' : '6px' }
      }, APP_TITLE),

      /* 통합판의 등급 화면 — 어느 등급으로 들어가는 중인지 */
      HAS_MENU && staff && cur && h('div', { style:{ margin:'10px 0 4px' } },
        h('span', {
          className:'bdg',
          style:{ background:'var(--soft)', color:'var(--navy)',
                  border:'1px solid var(--soft-bd)', fontSize:'12.5px', padding:'5px 13px' }
        }, h('i', { className:'ti ti-' + cur.icon, style:{ fontSize:'14px' } }), cur.label + ' 로그인')),

      /* 임원판(HAS_SEG)에는 안내 줄을 두지 않는다 — 제목 아랫여백으로 대신한다 */
      !HAS_SEG && h('p', { style:{ fontSize:'15px', color:'var(--text-2)', margin:'8px 0 26px' } },
        '비밀번호를 입력해 주세요'),

      h('div', { style:{ display:'flex', flexDirection:'column', gap:'12px', textAlign:'left' } },

        /* ── 임원판 — 세 칸이 한꺼번에 보인다 ─────────────────── */
        HAS_SEG && h('div', { className:'seg' },
          LOGIN_ROLES.map(r => h('button', {
            key:r.key, type:'button', disabled:busy,
            className: mode === r.key ? 'on' : '',
            style:{ fontSize:'14.5px', padding:'11px 4px' },
            onClick: () => pick(r.key)
          }, r.label))
        ),

        /* 담당자 — 구역·부서를 먼저 고른다.
           구역 목록을 아직 모르는 기기에서는 직접 적는 칸이 나온다. */
        /* ── 담당자 — 구역·부서를 콤보 하나로 고른다 ──────────────
             구역 목록(CHURCH_CFG.guCodes)을 모르는 교회에서도 콤보는 늘 나온다.
             그때는 맨 아래 「구역 번호 직접 적기」를 고르시면 숫자 칸이 열린다. */
        mode === 'leader' && h(React.Fragment, null,
          h('select', {
            value: typing ? LEAD_TYPE : lead, disabled:busy,
            onChange: e => {
              const v = e.target.value;
              if (v === LEAD_TYPE) { setTyping(true); setLead(''); }
              else { setTyping(false); setLead(v); }
              setErr('');
            },
            style:{ fontSize:'16px', fontWeight:700, textAlign:'center' }
          },
            /* 고르는 칸에는 ★실제로 쓰는 것만★ 둔다.
               안내 문구·전체 명단 칸은 없앴다 — 담당자는 자기 구역·부서만 고르면 된다.
               (부장·총괄은 예전대로 「성도」 칸에 임원용 비밀번호를 넣으시면 된다) */
            hasGu
              ? h('optgroup', { label:'구역' },
                  guCodes.map(c => h('option', { key:c, value:c }, c + '구역')))
              : null,
            h('optgroup', { label:'부서' },
              Object.keys(DEPT_ACCOUNTS).map(k => {
                const d = DEPT_BY_ID[DEPT_ACCOUNTS[k]];
                return h('option', { key:k, value:k }, (d && d.name) || k);
              })),
            /* 구역 목록을 아직 안 적은 교회를 위한 비상구 — 우리 교회에는 안 나온다 */
            hasGu ? null : h('option', { value:LEAD_TYPE }, '구역 번호 직접 적기')
          ),

          /* 목록에 없는 구역이거나 목록을 모를 때 — 숫자로 적는다 */
          typing && h('input', {
            type:'text', inputMode:'numeric', disabled:busy, autoFocus:true,
            placeholder:'담당 구역 번호 (예: 11)',
            value:/^[0-9]*$/.test(lead) ? lead : '',
            onChange: e => { setLead(e.target.value.replace(/[^0-9]/g, '')); setErr(''); },
            style:{ textAlign:'center', fontSize:'19px', fontWeight:800, letterSpacing:'.1em' }
          })
        ),

        h('input', {
          ref:pwdRef,
          type:'password', disabled:busy,
          placeholder: (mode === 'leader' ? '담당자' : ROLE_LABEL[mode]) + ' 비밀번호',
          value:pwd, autoFocus:true,
          onChange: e => { setPwd(e.target.value); setErr(''); },
          onKeyDown: e => e.key === 'Enter' && submit(),
          style:{ textAlign:'center', letterSpacing:'.28em', fontSize:'19px', fontWeight:700, padding:'15px 14px' }
        }),
        err && h('div', { className:'note note-bad', style:{ textAlign:'center', fontSize:'13.5px' } },
          err,
          code && h('div', {
            style:{ marginTop:'6px', paddingTop:'6px', borderTop:'1px solid currentColor',
                    opacity:.75, fontSize:'11px', wordBreak:'break-all',
                    fontFamily:'ui-monospace,SFMono-Regular,monospace' }
          }, code, ' · 저장 ', PERSIST_MODE, IS_STANDALONE ? ' · 홈화면앱' : ' · 브라우저')
        ),
        h('button', { onClick:submit, type:'button', disabled:busy, className:'btn btn-primary btn-block' },
          busy
            ? h('span', { className:'spinner', style:{ width:'17px', height:'17px', borderWidth:'2px' } })
            : h('i', { className:'ti ti-login-2', style:{ fontSize:'19px' } }),
          busy ? '확인 중...' : '로그인')
      )
    ),

    /* ── 화면 가장 하단 ─ 잘못 찾아오신 분께 다른 주소를 한 줄로 안내 ── */
    crossLink && h('p', {
      style:{ position:'absolute', left:0, right:0,
              bottom:'calc(20px + env(safe-area-inset-bottom))',
              textAlign:'center', fontSize:'13px', color:'var(--text-3)' }
    },
      crossLink.q + ' ',
      h('a', {
        href:crossLink.href,
        style:{ color:'var(--navy)', fontWeight:700, textDecoration:'none',
                borderBottom:'1.5px solid var(--soft-bd)', paddingBottom:'1px' }
      }, crossLink.a, ' ›'))
  );
}

/* ═══════════════════════════════════════════════════════
   내 메모장에 담기 (1.02 추가)

   ★ 먼저 알아야 할 기술적 한계 — 왜 '바로 열기'가 아닌가

   T맵·네이버맵·카카오맵은 각 회사가 ★ 공개한 주소 규칙 ★ 이 있어
   웹에서 tmap://... 처럼 부르면 그 앱이 바로 열린다.

   그런데 메모 앱은 사정이 다르다.
   · 아이폰 기본 '메모' — 애플이 글을 넣어 여는 공개 방법을 ★ 제공하지 않는다 ★.
     (mobilenotes:// 로 앱만 열리는 비공식 방법이 있지만 글은 못 넣는다)
   · 삼성 노트 — 삼성도 공개된 주소 규칙이 없다.
   즉 "웹에서 메모 앱을 지정해 글까지 넣어 여는 것"은 원리적으로 불가능하다.

   ★ 그래서 어떻게 했나 — 공유 창(Web Share)을 쓴다

   navigator.share() 로 휴대폰의 ★ 공유 창 ★ 을 띄운다.
   그 창에는 아이폰이면 '메모', 삼성폰이면 '삼성 노트'·'Keep' 등이
   그대로 나오고, 누르면 ★ 그 글이 담긴 새 메모가 열린다 ★.
   지도 앱처럼 한 번에 열리는 것은 아니고 '공유 창에서 메모 한 번 더 누르기'다.
   설정할 것이 하나도 없고 아이폰·안드로이드 모두 된다.

   ★ 진짜 한 번에 열고 싶으신 분을 위해 (아이폰만, 선택)

   아이폰 '단축어' 앱으로 단축어를 하나 만들어 두면
   shortcuts:// 로 부를 수 있어 ★ 한 번 눌러 바로 저장 ★ 이 된다.
   이 화면의 [한 번에 저장 설정] 에서 단축어 이름을 적어 두면
   그 뒤로는 공유 창을 거치지 않는다. 기기별로 기억한다.

   ★ 공유 창도 안 되는 기기 (컴퓨터 브라우저 등)
   메모 내용을 클립보드에 복사해 드리고 붙여넣기 하시라고 안내한다.

   ── 메모에 들어가는 글 ──────────────────────────────────
   2026-09-03 17:00 김규동
   (빈 줄 두 개 — 이어서 바로 적으실 수 있게)

   동명이인구분이 있으면 김규동(2) 처럼 붙인다.
   같은 이름이 둘일 때 메모만 보고 누구인지 알 수 없으면 안 되기 때문이다.
═══════════════════════════════════════════════════════ */
const IS_IOS = (() => {
  try {
    const ua = navigator.userAgent || '';
    if (/iPad|iPhone|iPod/.test(ua)) return true;
    /* 아이패드는 최근 기종에서 맥으로 보고한다 */
    return navigator.platform === 'MacIntel' && (navigator.maxTouchPoints || 0) > 1;
  } catch(e) { return false; }
})();

function noteStamp(d) {
  const t = d || new Date();
  const p = n => String(n).padStart(2, '0');
  return t.getFullYear() + '-' + p(t.getMonth() + 1) + '-' + p(t.getDate()) +
         ' ' + p(t.getHours()) + ':' + p(t.getMinutes());
}

function noteText(member) {
  const dup = String((member && member['동명이인구분']) || '').trim();
  const name = ((member && member['이름']) || '') + (dup ? '(' + dup + ')' : '');
  return noteStamp() + ' ' + name + '\n\n';
}

function readNoteShortcut() {
  try { return localStorage.getItem('gsc_note_shortcut') || ''; } catch(e) { return ''; }
}

/* 단축어를 부른다 (정식 1.03에서 두 방식 모두 되도록 고침)

   ★ 왜 두 가지로 보내는가 — 실제로 겪은 문제

   처음에는 input=text 로 글만 넘겼다. 그러려면 단축어의 '메모에 추가'
   내용 칸에 ★ 변수 ★ 「단축어 입력」이 들어 있어야 한다.
   그런데 그 칸에 「단축어 입력」이라는 ★ 글자를 그대로 타이핑 ★ 하기 쉽다.
   그러면 메모에 날짜·이름이 아니라 "단축어 입력" 이라는 글자가 적힌다.
   변수는 파란 알약 모양이고 글자는 검은 글씨인데, 화면에서 구분이 쉽지 않다.

   그래서 이제 두 가지를 함께 한다.
     ① 글을 클립보드에 복사해 둔다  → '클립보드 가져오기' 방식 단축어가 쓴다
     ② input=text 로도 넘긴다        → '단축어 입력' 변수 방식 단축어가 쓴다
   어느 방식으로 만드셨든 똑같이 동작한다.
   ①은 변수를 손으로 넣을 필요가 없어 훨씬 안전하므로 안내에서 먼저 권한다. */
async function runNoteShortcut(name, text) {
  try { await copyText(text); } catch(e) {}
  try {
    window.location.href = 'shortcuts://x-callback-url/run-shortcut'
      + '?name=' + encodeURIComponent(name)
      + '&input=text&text=' + encodeURIComponent(text);
    return true;
  } catch(e) { return false; }
}

function NoteButton({ member }) {
  const [msg,  setMsg]  = useState('');
  const [kind, setKind] = useState('warn');
  const [open, setOpen] = useState(false);
  const [sc,   setSc]   = useState(readNoteShortcut);
  const [scIn, setScIn] = useState('');
  const watchRef = useRef(null);

  /* 단축어가 정말 열렸는지 확인한다.
     열렸으면 이 화면이 가려진다. 1.6초 뒤에도 그대로 보이고 있으면
     이름이 틀렸거나 단축어가 없는 것이다 — 조용히 실패하지 않게 알려 준다. */
  function watchOpened() {
    if (watchRef.current) clearTimeout(watchRef.current.t);
    const onHide = () => {
      if (document.visibilityState === 'hidden' && watchRef.current) {
        clearTimeout(watchRef.current.t);
        document.removeEventListener('visibilitychange', onHide);
        watchRef.current = null;
      }
    };
    document.addEventListener('visibilitychange', onHide);
    const t = setTimeout(() => {
      document.removeEventListener('visibilitychange', onHide);
      watchRef.current = null;
      if (document.visibilityState !== 'visible') return;
      setKind('bad');
      setMsg('단축어 「' + sc + '」 가 열리지 않았습니다. 이름이 한 글자라도 다르면 열리지 않습니다. '
           + '아래 [단축어 설정 바꾸기] 에서 이름을 다시 확인하시거나, 설정을 지우고 공유 창 방식을 쓰세요. '
           + '(내용은 클립보드에 복사해 두었으니 메모 앱에 붙여넣으실 수 있습니다)');
    }, 1600);
    watchRef.current = { t };
  }

  useEffect(() => () => { if (watchRef.current) clearTimeout(watchRef.current.t); }, []);

  async function go() {
    const text = noteText(member);
    setMsg('');

    /* ① 아이폰 단축어를 정해 두셨으면 공유 창을 거치지 않는다 */
    if (sc) {
      await runNoteShortcut(sc, text);
      watchOpened();
      return;
    }

    /* ② 공유 창 — 아이폰 '메모', 삼성 노트, Keep 등이 여기에 나온다 */
    if (navigator.share) {
      try {
        await navigator.share({ text });
        return;
      } catch(e) {
        /* 사용자가 창을 닫은 것은 오류가 아니다 — 아무 말도 하지 않는다 */
        const n = String((e && e.name) || '');
        if (n === 'AbortError' || n === 'NotAllowedError') return;
      }
    }

    /* ③ 공유 창이 없는 기기 — 복사해 드리고 붙여넣기 안내 */
    const ok = await copyText(text);
    setKind(ok ? 'warn' : 'bad');
    setMsg(ok
      ? '내용을 복사했습니다. 메모 앱을 열고 붙여넣기(화면 길게 누르기 → 붙여넣기) 해 주세요.'
      : '이 기기에서는 자동으로 열 수 없습니다. 아래 내용을 손으로 적어 주세요 — ' + noteText(member).trim());
  }

  /* 설정 화면에서 바로 시험해 볼 수 있게 — 고쳤는지 확인하려고 상세 화면을
     다시 열지 않아도 되게 하려는 것이다 */
  async function testSc() {
    const name = (scIn.trim() || sc);
    if (!name) return;
    setMsg('');
    await runNoteShortcut(name, noteStamp() + ' 시험\n\n');
    watchOpened();
  }

  function saveSc() {
    const v = scIn.trim();
    if (!v) return;
    try { localStorage.setItem('gsc_note_shortcut', v); } catch(e) {}
    setSc(v); setScIn('');
    setKind('ok');
    setMsg('단축어 이름을 「' + v + '」 로 정했습니다. 위 [시험해 보기] 로 확인해 보세요.');
  }
  function clearSc() {
    try { localStorage.removeItem('gsc_note_shortcut'); } catch(e) {}
    setSc(''); setScIn(''); setOpen(false);
    setKind('warn');
    setMsg('공유 창 방식으로 되돌렸습니다.');
  }

  const label = { fontSize:'13.5px', fontWeight:800, color:'var(--navy)', marginBottom:'6px' };
  const body  = { fontSize:'12.5px', color:'var(--text-2)', lineHeight:1.75 };

  return h('div', null,
    h('button', {
      type:'button', onClick:go, className:'btn btn-ghost btn-block',
      title:'오늘 날짜·시간과 이름을 넣어 내 휴대폰 메모장에 담습니다'
    },
      h('i', { className:'ti ti-notes', style:{ fontSize:'19px' } }),
      /* ★ '저장' 이라는 말을 쓰지 않는다.
         같은 화면 아래에 심방 메모의 [저장] 이 있어 헷갈린다.
         심방 메모는 교회가 함께 보는 기록, 이것은 내 휴대폰의 개인 메모다.
         그 차이가 이름에서 드러나야 한다. */
      '내 메모장에 담기',
      h('span', {
        style:{ fontSize:'12px', fontWeight:700, opacity:.65, marginLeft:'2px' }
      }, sc ? '· 단축어' : '')
    ),

    /* 무엇이 적히는지 미리 보여 드린다 — 눌러 보기 전에 알 수 있게 */
    h('p', {
      style:{ fontSize:'12px', color:'var(--text-3)', marginTop:'7px',
              textAlign:'center', lineHeight:1.6 }
    },
      h('span', {
        style:{ fontFamily:'ui-monospace,SFMono-Regular,monospace', fontWeight:700,
                color:'var(--text-2)' }
      }, noteText(member).trim()),
      h('br'),
      sc ? '단축어로 바로 담깁니다'
         : (navigator.share ? '공유 창에서 「메모」를 누르시면 담깁니다'
                            : '복사해 드리니 메모 앱에 붙여넣어 주세요')
    ),

    msg && h('div', {
      className:'note note-' + kind,
      style:{ marginTop:'9px', fontSize:'13px' }
    }, msg),

    /* 아이폰에서 한 번에 담고 싶으신 분을 위한 선택 설정 */
    IS_IOS && h('div', { style:{ marginTop:'8px', textAlign:'center' } },
      h('button', {
        type:'button', onClick: () => setOpen(o => !o),
        style:{ background:'none', border:'none', cursor:'pointer', padding:'6px 8px',
                fontSize:'12.5px', fontWeight:700, color:'var(--navy)',
                textDecoration:'underline', textUnderlineOffset:'3px' }
      }, sc ? '단축어 설정 바꾸기' : '한 번 눌러 바로 담기 (아이폰)')
    ),

    open && h('div', {
      style:{ marginTop:'10px', padding:'14px', borderRadius:'var(--r)',
              background:'var(--surface)', border:'1px solid var(--border-2)',
              textAlign:'left' }
    },
      h('p', { style:{ fontSize:'14px', fontWeight:800, color:'var(--navy)', marginBottom:'10px' } },
        '아이폰 단축어로 한 번에 담기'),

      /* 실제로 가장 많이 나는 실수를 맨 위에 적어 둔다 */
      h('div', { className:'note note-warn', style:{ marginBottom:'12px', fontSize:'12.5px' } },
        h('b', null, '메모에 「단축어 입력」이라는 글자가 적혔다면'), h('br'),
        '단축어를 만들 때 그 칸에 ', h('b', null, '글자를 직접 타이핑'), ' 하신 것입니다. ',
        '거기에는 글자가 아니라 ', h('b', null, '변수(파란 알약 모양)'), ' 가 들어가야 합니다.',
        h('br'),
        '아래 ', h('b', null, '① 클립보드 방식'), ' 으로 다시 만드시면 변수를 손으로 넣을 일이 ',
        '없어 그런 실수가 나지 않습니다.'),

      /* ① 권장 — 변수를 손으로 넣지 않는 방법 */
      h('p', { style:label }, '① 클립보드 방식 (권장 · 쉽습니다)'),
      h('p', { style:body },
        h('b', null, '1.'), ' 아이폰 ', h('b', null, '「단축어」'), ' 앱을 엽니다', h('br'),
        h('b', null, '2.'), ' 오른쪽 위 ', h('b', null, '+'), ' → 새 단축어', h('br'),
        h('b', null, '3.'), ' 검색해서 ', h('b', null, '「클립보드 가져오기」'), ' 를 추가합니다', h('br'),
        h('b', null, '4.'), ' 이어서 ', h('b', null, '「메모에 추가」'), ' 를 추가합니다', h('br'),
        h('span', { style:{ color:'var(--text-3)' } },
          '   → 내용 칸이 「클립보드」로 ', h('b', null, '저절로 채워집니다'), '. 손댈 것 없습니다.'), h('br'),
        h('b', null, '5.'), ' 단축어 이름을 정합니다 ', h('span', { style:{ color:'var(--text-3)' } }, '(예: 성도메모)'), h('br'),
        h('b', null, '6.'), ' 그 이름을 아래 칸에 똑같이 적고 저장하세요'),

      h('div', { style:{ height:'1px', background:'var(--border)', margin:'14px 0' } }),

      /* ② 이미 만드신 분을 위한 고치는 방법 */
      h('p', { style:label }, '② 이미 만든 단축어를 고치려면'),
      h('p', { style:body },
        h('b', null, '1.'), ' 단축어 앱에서 그 단축어를 엽니다', h('br'),
        h('b', null, '2.'), ' 「메모에 추가」 안의 ', h('b', null, '「단축어 입력」 글자를 지웁니다'), h('br'),
        h('b', null, '3.'), ' 그 칸을 누르면 ', h('b', null, '키보드 위쪽'), ' 에 ',
        h('span', {
          style:{ display:'inline-block', padding:'1px 8px', borderRadius:'999px',
                  background:'var(--soft)', color:'var(--navy)', fontWeight:800,
                  border:'1px solid var(--soft-bd)' }
        }, '단축어 입력'),
        ' 이라는 ', h('b', null, '알약 모양'), ' 이 나옵니다', h('br'),
        h('b', null, '4.'), ' ', h('b', null, '그 알약을 누르세요.'),
        ' 칸 안에 색이 있는 알약으로 들어가야 맞습니다.', h('br'),
        h('span', { style:{ color:'var(--bad)', fontWeight:700 } },
          '   ✕ 검은 글씨로 「단축어 입력」  →  그 글자가 그대로 적힙니다'), h('br'),
        h('span', { style:{ color:'var(--ok)', fontWeight:700 } },
          '   ○ 색 있는 알약 「단축어 입력」  →  날짜·시간·이름이 적힙니다')),

      h('div', { style:{ display:'flex', gap:'8px', marginTop:'14px' } },
        h('input', {
          type:'text', value:scIn, placeholder: sc || '단축어 이름 (예: 성도메모)',
          onChange: e => setScIn(e.target.value),
          onKeyDown: e => e.key === 'Enter' && saveSc(),
          style:{ flex:1, minWidth:0 }
        }),
        h('button', {
          type:'button', onClick:saveSc, disabled: !scIn.trim(),
          className:'btn btn-primary btn-sm', style:{ flexShrink:0, padding:'0 14px' }
        }, '저장')
      ),

      (sc || scIn.trim()) && h('button', {
        type:'button', onClick:testSc,
        className:'btn btn-ghost btn-sm btn-block', style:{ marginTop:'8px' }
      }, h('i', { className:'ti ti-player-play', style:{ fontSize:'16px' } }), '시험해 보기'),
      (sc || scIn.trim()) && h('p', {
        style:{ fontSize:'11.5px', color:'var(--text-3)', marginTop:'6px', lineHeight:1.6 }
      }, '메모에 ', h('b', null, '「' + noteStamp() + ' 시험」'), ' 이라고 적히면 제대로 된 것입니다. ',
         '「단축어 입력」이라고 적히면 위 ② 를 다시 해 주세요.'),

      sc && h('button', {
        type:'button', onClick:clearSc,
        className:'btn btn-ghost btn-sm btn-block',
        style:{ marginTop:'10px', color:'var(--bad)' }
      }, '단축어 설정 지우기 (공유 창 방식으로)'),

      h('p', { style:{ fontSize:'11.5px', color:'var(--text-3)', marginTop:'12px', lineHeight:1.65 } },
        '이 앱은 ', h('b', null, '두 방식 모두'), ' 지원합니다. 클립보드에 복사하는 것과 ',
        '단축어 입력으로 넘기는 것을 함께 하므로, 어느 방식으로 만드셨든 됩니다.', h('br'),
        '이름은 이 휴대폰에만 기억됩니다. 다른 휴대폰에서는 다시 정해 주세요.')
    )
  );
}

/* ═══════════════════════════════════════════════════════
   출석상태 고르기 — 상세 화면과 출석표에서 함께 쓴다

   임원(구역장) 이상이면 세 버튼이 나오고, 성도에게는 배지만 보인다.
   저장은 누른 즉시 attend/status 에 그 한 사람 칸만 쓴다.
═══════════════════════════════════════════════════════ */
const ATT_BTN_TONE  = { '출석A':'ok', '출석B':'warn', '미출석':'bad' };
const MARK_BTN_TONE = { '전입':'navy', '전출':'bad', '구원':'violet' };

/* 배지 묶음 — 상태 하나 + 달려 있는 표식들 (고치지 못하는 등급에게 보이는 모습) */
function AttBadges({ value, dark, style, exempt }) {
  const c = parseAtt(value);
  const b = getBadge(c.state, dark);
  return h('span', { style:{ display:'inline-flex', flexWrap:'wrap', gap:'5px', ...(style || {}) } },
    exempt ? null : h(Bdg, { t:c.state, bg:b.bg, cl:b.cl }),
    c.marks.map(k => {
      const t = getMarkBadge(k, dark);
      return h(Bdg, { key:k, t:k, bg:t.bg, cl:t.cl });
    })
  );
}

function AttPicker({ value, canEdit, onPick, dark, compact, exempt }) {
  const [busy, setBusy] = useState(false);
  const [err,  setErr]  = useState('');
  const cur = parseAtt(value);
  const out = cur.marks.indexOf('전출') >= 0;   /* 전출 = 미출석에 묶인다 */

  if (!canEdit) {
    return h('div', { className: compact ? '' : 'irow-v' },
      h(AttBadges, { value, dark, exempt }));
  }

  async function send(state, marks) {
    if (busy) return;
    const next = attText(state, marks);
    if (next === attText(cur.state, cur.marks)) return;
    setBusy(true); setErr('');
    try { await onPick(next); } catch(e) { setErr(fsErrMsg(e)); }
    setBusy(false);
  }

  /* 전출이 달려 있으면 상태는 미출석에 묶인다 — 단추를 잠근다 */
  function pickState(v) { if (!out) send(v, cur.marks); }

  function toggleMark(k) {
    const on = cur.marks.indexOf(k) >= 0;
    if (k === '전출') {
      /* 내리면 미출석은 그대로 두고 표식만 뗀다 */
      return on ? send('미출석', []) : send('미출석', ['전출']);
    }
    /* 전입·구원은 전출과 함께 달 수 없다 — 켜면 전출을 내려 준다 */
    const base = cur.marks.filter(x => x !== '전출');
    send(out ? '미출석' : cur.state,
         on ? base.filter(x => x !== k) : base.concat([k]));
  }

  const btn = (v, on, click, toneVar, disabled) => h('button', {
    key:v, type:'button', disabled: busy || disabled,
    onClick: () => click(v),
    className: on ? 'on' : '',
    style:{ fontSize: compact ? '13px' : '14px', padding: compact ? '7px 2px' : '9px 3px',
            color: on ? 'var(--' + toneVar + ')' : undefined,
            fontWeight: on ? 800 : 600 }
  }, v);

  const segStyle = {
    marginTop: compact ? 0 : '5px', maxWidth: compact ? '100%' : '330px',
    padding:'3px', gap:'3px', opacity: busy ? .6 : 1
  };

  return h('div', null,
    /* ★ 영아·유아·영유아는 상태 단추를 내린다 (isAttExempt 주석 참고) */
    !exempt && h('div', { className:'seg', style:segStyle },
      ATT_STATES.map(v => btn(v, cur.state === v, pickState, ATT_BTN_TONE[v], out))
    ),
    /* ── 표식 — 여럿을 함께 달 수 있다 ── */
    h('div', { className:'seg', style:{ ...segStyle, marginTop: exempt ? 0 : '6px' } },
      ATT_MARKS.map(k => btn(k, cur.marks.indexOf(k) >= 0, toggleMark, MARK_BTN_TONE[k], false))
    ),
    h('p', { style:{ fontSize:'12px', color:'var(--text-3)', marginTop:'6px', lineHeight:1.55 } },
      exempt
        ? h(React.Fragment, null,
            h('b', null, '영유아'), ' 는 출석A·출석B·미출석을 매기지 않습니다. ',
            '집계에서는 「영유아」 칸에 그대로 들어갑니다. 표식만 달아 두세요.')
        : h(React.Fragment, null,
            h('b', null, '전출'), ' 을 켜면 자동으로 ', h('b', null, '미출석'), ' 이 됩니다. ',
            h('b', null, '전입·구원'), ' 은 출석A·출석B·미출석 어디에나 함께 달 수 있습니다.')),
    err && h('p', { className:'note note-bad', style:{ marginTop:'6px', fontSize:'13px' } }, err)
  );
}

/* ═══ 전체집계 표 짜기 (정식 1.18) ═══════════════════════
   [전체집계] 와 [전체집계2] 가 같은 자료를 쓰되 가로·세로만 바꿔 그린다.
   그래서 세는 일은 여기서 한 번만 하고, 그리는 일만 화면마다 따로 한다.

     · 한 사람은 출석A·출석B·교회학교·영유아·미출석 중 ★한 칸★ 에만 든다
     · 전입·전출·구원은 표식이라 위 칸과 겹쳐서 또 나온다
     · 봉사회-봉 · 어머니회-어 · 은장회-은 · 청년회-청 으로 줄여 적는다
     · 네 회 어디에도 안 드는 분이 계시면 「기」 칸이 저절로 하나 더 생긴다
═══════════════════════════════════════════════════════ */
const ALL_HOE = ['봉', '어', '은', '청', '기'];
function allHoeKey(m) {
  const so = String((m && m['소속']) || '').trim();
  if (so === '봉사회')   return '봉';
  if (so === '어머니회') return '어';
  if (so === '은장회' || so === '은빛장년회') return '은';
  if (so === '청년회' || so === '대학부')     return '청';
  return '기';
}
function buildAllTally(members, attStatus, gus) {
  const ko = (x, y) => x.localeCompare(y, 'ko');
  const blank = () => {
    const o = { school:[], baby:[], absent:[], into:[], out:[], saved:[] };
    ALL_HOE.forEach(k => { o['a' + k] = []; o['b' + k] = []; });
    return o;
  };
  const rows = gus.map(gu => {
    const list = members.filter(m =>
      (String(m['구역'] || '').trim() || '미지정') === gu);
    const c = blank();
    list.forEach(m => {
      const f  = effAttFull(m, attStatus);
      const nm = String(m['이름'] || '').trim();
      if (f.marks.indexOf('전입') >= 0) c.into.push(nm);
      if (f.marks.indexOf('전출') >= 0) c.out.push(nm);
      if (f.marks.indexOf('구원') >= 0) c.saved.push(nm);
      if (isAttExempt(m)) { c.baby.push(nm); return; }
      if (f.state === '미출석') { c.absent.push(nm); return; }
      if (deptOf(m)) { c.school.push(nm); return; }
      c[(f.state === '출석B' ? 'b' : 'a') + allHoeKey(m)].push(nm);
    });
    Object.keys(c).forEach(k => c[k].sort(ko));
    return { gu, n: list.length, c };
  });
  const useEtc = rows.some(r => r.c['a기'].length || r.c['b기'].length);
  const subs   = useEtc ? ALL_HOE : ALL_HOE.slice(0, 4);
  const KEYS   = subs.map(k => 'a' + k).concat(subs.map(k => 'b' + k))
                     .concat(['school', 'baby', 'absent', 'into', 'out', 'saved']);
  const GROUPS = [
    { t:'출석A',   c:'var(--ok)',     subs: subs, keys: subs.map(k => 'a' + k) },
    { t:'출석B',   c:'var(--warn)',   subs: subs, keys: subs.map(k => 'b' + k) },
    { t:'교회학교', c:'var(--navy-2)', subs: null, keys: ['school'] },
    { t:'영유아',   c:'var(--violet)', subs: null, keys: ['baby'] },
    { t:'미출석',   c:'var(--bad)',    subs: null, keys: ['absent'] },
    { t:'전입',     c:'var(--violet)', subs: null, keys: ['into'] },
    { t:'전출',     c:'var(--bad)',    subs: null, keys: ['out'] },
    { t:'구원',     c:'var(--navy-2)', subs: null, keys: ['saved'] }
  ];
  /* 칸 → 이름 색 (그 항목 제목과 같은 색) · 칸 → 그 항목의 마지막 칸인가 */
  const COL = {}, SEP = {}, LABEL = {};
  GROUPS.forEach((g, gi) => {
    g.keys.forEach((k, ki) => {
      COL[k]   = g.c;
      LABEL[k] = g.subs ? (g.t + ' ' + g.subs[ki]) : g.t;
      if (ki === g.keys.length - 1 && gi < GROUPS.length - 1) SEP[k] = 1;
    });
  });
  const total = {}; KEYS.forEach(k => { total[k] = 0; });
  rows.forEach(r => KEYS.forEach(k => { total[k] += r.c[k].length; }));
  const allN = rows.reduce((s, r) => s + r.n, 0);
  return { rows, subs, KEYS, GROUPS, COL, SEP, LABEL, total, allN };
}

/* ═══ 전체집계를 엑셀로 (정식 1.18) ═════════════════════════
   화면에 보이는 표를 ★글자색·칸색·구분선·틀고정까지 그대로★ 담은
   진짜 엑셀 파일(.xlsx)로 만든다.

   ★ 왜 직접 만드나
     이 앱이 쓰는 엑셀 라이브러리(SheetJS 무료판)는 색과 선을 저장하지
     못한다. 그래서 엑셀 파일 속살(OOXML)을 직접 적고, 사진 내려받기에
     이미 쓰고 있는 makeStoreZip 으로 묶는다. 라이브러리를 더 받지
     않으므로 인터넷이 느린 곳에서도 곧바로 저장된다.
   ★ 색은 ★화면에서 그대로 읽어 온다★ — 교회마다 색이 다르기 때문이다.
═══════════════════════════════════════════════════════ */

/* CSS 색(var(--ok) 같은 것)을 엑셀이 쓰는 AARRGGBB 로 바꾼다 */
function cssHex(varName) {
  try {
    const d = document.createElement('div');
    d.style.color = 'var(' + varName + ')';
    d.style.display = 'none';
    document.body.appendChild(d);
    const c = getComputedStyle(d).color;
    d.remove();
    const m = c.match(/[0-9.]+/g);
    if (!m || m.length < 3) return 'FF222222';
    const hx = n => ('0' + Math.round(Number(n)).toString(16)).slice(-2).toUpperCase();
    return 'FF' + hx(m[0]) + hx(m[1]) + hx(m[2]);
  } catch (e) { return 'FF222222'; }
}

const XQ = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

/* 0 → A, 26 → AA */
function xlCol(i) {
  let s = '', n = i + 1;
  while (n > 0) { const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n - 1) / 26); }
  return s;
}

/* grid = { cols:[너비], rows:[{ht, cells:[{v, num, s}]}], merges:[], freeze:{x,y} }
   s = { c:글자색, b:굵게, sz:크기, f:칸색, br/bb:'thin'|'med', bl/bt:'thin',
         wrap:줄바꿈, ha:'center'|'left', va:'top'|'center' } */
function buildXlsx(sheetName, grid) {
  const LINE = cssHex('--line'), GRID = cssHex('--border');
  const fonts   = ['<font><sz val="10"/><color rgb="FF222222"/><name val="맑은 고딕"/></font>'];
  const fills   = ['<fill><patternFill patternType="none"/></fill>',
                   '<fill><patternFill patternType="gray125"/></fill>'];
  const borders = ['<border><left/><right/><top/><bottom/><diagonal/></border>'];
  const xfs     = ['<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'];
  const cF = {}, cG = {}, cB = {}, cX = {};

  const fontId = s => {
    const k = (s.c || '') + '|' + (s.b ? 1 : 0) + '|' + (s.sz || 10);
    if (cF[k] == null) {
      cF[k] = fonts.length;
      fonts.push('<font><sz val="' + (s.sz || 10) + '"/>' + (s.b ? '<b/>' : '') +
                 '<color rgb="' + (s.c || 'FF222222') + '"/><name val="맑은 고딕"/></font>');
    }
    return cF[k];
  };
  const fillId = s => {
    if (!s.f) return 0;
    if (cG[s.f] == null) {
      cG[s.f] = fills.length;
      fills.push('<fill><patternFill patternType="solid"><fgColor rgb="' + s.f +
                 '"/><bgColor indexed="64"/></patternFill></fill>');
    }
    return cG[s.f];
  };
  const side = (tag, kind) => {
    if (!kind) return '<' + tag + '/>';
    const st = kind === 'med' ? 'medium' : 'thin';
    const co = kind === 'med' ? LINE : GRID;
    return '<' + tag + ' style="' + st + '"><color rgb="' + co + '"/></' + tag + '>';
  };
  const borderId = s => {
    const k = [s.bl || '', s.br || '', s.bt || '', s.bb || ''].join('|');
    if (k === '|||') return 0;
    if (cB[k] == null) {
      cB[k] = borders.length;
      borders.push('<border>' + side('left', s.bl) + side('right', s.br) +
                   side('top', s.bt) + side('bottom', s.bb) + '<diagonal/></border>');
    }
    return cB[k];
  };
  const styleId = s => {
    if (!s) return 0;
    const k = JSON.stringify(s);
    if (cX[k] == null) {
      const fi = fontId(s), gi = fillId(s), bi = borderId(s);
      cX[k] = xfs.length;
      xfs.push('<xf numFmtId="0" fontId="' + fi + '" fillId="' + gi + '" borderId="' + bi +
               '" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1">' +
               '<alignment horizontal="' + (s.ha || 'center') + '" vertical="' + (s.va || 'top') +
               '"' + (s.wrap ? ' wrapText="1"' : '') + '/></xf>');
    }
    return cX[k];
  };

  /* ── 시트 ── */
  let sd = '';
  grid.rows.forEach((row, ri) => {
    let cs = '';
    row.cells.forEach((cell, ci) => {
      if (cell == null) return;
      const ref = xlCol(ci) + (ri + 1);
      const si  = styleId(cell.s);
      if (cell.num)
        cs += '<c r="' + ref + '" s="' + si + '"><v>' + Number(cell.v || 0) + '</v></c>';
      else if (cell.v === '' || cell.v == null)
        cs += '<c r="' + ref + '" s="' + si + '"/>';
      else
        cs += '<c r="' + ref + '" s="' + si + '" t="inlineStr"><is><t xml:space="preserve">' +
              XQ(cell.v) + '</t></is></c>';
    });
    sd += '<row r="' + (ri + 1) + '"' +
          (row.ht ? ' ht="' + row.ht + '" customHeight="1"' : '') + '>' + cs + '</row>';
  });
  const cols = '<cols>' + grid.cols.map((w, i) =>
    '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" customWidth="1"/>').join('') + '</cols>';
  const fz = grid.freeze
    ? '<pane xSplit="' + grid.freeze.x + '" ySplit="' + grid.freeze.y + '" topLeftCell="' +
      xlCol(grid.freeze.x) + (grid.freeze.y + 1) + '" activePane="bottomRight" state="frozen"/>'
    : '';
  const mg = (grid.merges && grid.merges.length)
    ? '<mergeCells count="' + grid.merges.length + '">' +
      grid.merges.map(r => '<mergeCell ref="' + r + '"/>').join('') + '</mergeCells>' : '';
  const sheet = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    '<sheetViews><sheetView tabSelected="1" workbookViewId="0">' + fz + '</sheetView></sheetViews>' +
    '<sheetFormatPr defaultRowHeight="15"/>' + cols +
    '<sheetData>' + sd + '</sheetData>' + mg + '</worksheet>';

  const styles = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    '<fonts count="' + fonts.length + '">' + fonts.join('') + '</fonts>' +
    '<fills count="' + fills.length + '">' + fills.join('') + '</fills>' +
    '<borders count="' + borders.length + '">' + borders.join('') + '</borders>' +
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
    '<cellXfs count="' + xfs.length + '">' + xfs.join('') + '</cellXfs>' +
    '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>' +
    '</styleSheet>';

  const wb = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" ' +
    'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
    '<sheets><sheet name="' + XQ(sheetName) + '" sheetId="1" r:id="rId1"/></sheets></workbook>';

  const wbRel = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>' +
    '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
    '</Relationships>';

  const rootRel = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
    '</Relationships>';

  const ct = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
    '<Default Extension="xml" ContentType="application/xml"/>' +
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
    '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
    '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
    '</Types>';

  const enc = new TextEncoder();
  const zip = makeStoreZip([
    { name:'[Content_Types].xml',       data: enc.encode(ct) },
    { name:'_rels/.rels',               data: enc.encode(rootRel) },
    { name:'xl/workbook.xml',           data: enc.encode(wb) },
    { name:'xl/_rels/workbook.xml.rels', data: enc.encode(wbRel) },
    { name:'xl/styles.xml',             data: enc.encode(styles) },
    { name:'xl/worksheets/sheet1.xml',  data: enc.encode(sheet) }
  ]);
  return new Blob([zip], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

function saveBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.setAttribute('download', name);       /* 파일 이름 — 속성으로 확실히 붙인다 */
  a.rel = 'noopener';
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  /* 브라우저가 이름을 읽어 갈 틈을 준 뒤에 치운다 (곧바로 지우면
     휴대폰 브라우저에서 'download' 라는 이름으로 저장되는 일이 있다) */
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 4000);
}

/* 전체집계(T)를 엑셀로 — kind 'all' 은 세로가 구역, 'all2' 는 세로가 항목 */
function saveAllTallyXlsx(T, kind) {
  /* ★ 엑셀 바탕은 ★하얗게 두지 않는다★ (정식 1.18).
       기본 흰 칸은 인쇄하면 밋밋하고 칸 구분이 잘 안 보인다.
       그래서 아주 연한 종이색을 깔고, 한 줄 건너 한 줄은 조금 더 진하게 한다.
     ★ 색은 화면 설정(밝게/어둡게)과 상관없이 ★늘 밝은 종이 기준★ 이다.
       어둡게 쓰시던 분이 저장해도 흰 종이에 흰 글씨가 나오지 않는다. */
  const PAPER = 'FFF7F9FC';      /* 기본 칸 — 하얀색이 아닌 아주 연한 색 */
  const ALT   = 'FFEAF1F8';      /* 한 줄 건너 한 줄 */
  const HEAD  = 'FFDCE7F2';      /* 머리줄 */
  const SUMF  = 'FFE3F1EA';      /* 합계 */
  const TXT   = 'FF1F2937', SUB = 'FF7B8794';
  /* 종이 위에서 읽히도록 너무 밝은 색은 어둡게 눌러 준다 */
  const ink = hx => {
    const s = String(hx || '').replace(/^FF/i, '');
    const r = parseInt(s.slice(0, 2), 16), g = parseInt(s.slice(2, 4), 16), b = parseInt(s.slice(4, 6), 16);
    if (isNaN(r) || isNaN(g) || isNaN(b)) return TXT;
    const lum = (r * 0.299 + g * 0.587 + b * 0.114) / 255;
    if (lum <= 0.52) return 'FF' + s.toUpperCase();
    const k = (0.42 / lum);
    const p = n => ('0' + Math.max(0, Math.min(255, Math.round(n * k))).toString(16)).slice(-2).toUpperCase();
    return 'FF' + p(r) + p(g) + p(b);
  };
  /* ★ 항목 색은 화면에서 'var(--ok)' 같은 글로 들고 있다.
       엑셀은 AARRGGBB 여덟 자리만 알아듣기 때문에 여기서 바꿔 준다.
       (이걸 빠뜨리면 파일은 만들어지지만 엑셀이 열지 못한다.) */
  const hexOf = v => {
    const s = String(v || '');
    const m = /^var\((--[A-Za-z0-9-]+)\)$/.exec(s);
    if (m) return ink(cssHex(m[1]));
    if (s.charAt(0) === '#') return ink('FF' + s.slice(1).toUpperCase());
    return TXT;
  };
  const COL = {};
  T.KEYS.forEach(k => { COL[k] = hexOf(T.COL[k]); });
  const GC = T.GROUPS.map(g => hexOf(g.c));
  const ht = n => Math.max(17, n * 13.5 + 5);          /* 이름 수에 맞춘 줄 높이 */
  const nl = arr => arr.length ? arr.join('\n') : '·';
  const ts = new Date();
  const stamp = ts.getFullYear() + ('0' + (ts.getMonth() + 1)).slice(-2) + ('0' + ts.getDate()).slice(-2);
  let grid, name;

  if (kind === 'all') {
    /* 가로 = 항목, 세로 = 구역 */
    const cells1 = [{ v:'구역', s:{ c:TXT, b:1, f:HEAD, bl:'thin', bt:'thin', br:'med', bb:'thin' } }];
    const cells2 = [null];
    const merges = ['A1:A2'];
    let ci = 1;
    T.GROUPS.forEach((g, gi) => {
      const last = gi === T.GROUPS.length - 1;
      const n = g.subs ? g.subs.length : 1;
      cells1.push({ v:g.t, s:{ c:GC[gi], b:1, f:HEAD, bt:'thin', br: last ? 'thin' : 'med', bb:'thin' } });
      for (let k = 1; k < n; k++)
        cells1.push({ v:'', s:{ c:GC[gi], b:1, f:HEAD, bt:'thin', br: k === n - 1 && !last ? 'med' : 'thin', bb:'thin' } });
      if (n > 1) merges.push(xlRef(ci, 0) + ':' + xlRef(ci + n - 1, 0));
      else merges.push(xlRef(ci, 0) + ':' + xlRef(ci, 1));
      if (g.subs) {
        g.subs.forEach((s, si) =>
          cells2.push({ v:s, s:{ c:GC[gi], b:1, f:HEAD, br: si === n - 1 && !last ? 'med' : 'thin', bb:'thin' } }));
      } else {
        cells2.push(null);
      }
      ci += n;
    });
    const rows = [{ ht:18, cells:cells1 }, { ht:16, cells:cells2 }];
    T.rows.forEach((r, ri) => {
      const alt = ri % 2 ? ALT : PAPER;
      const maxN = T.KEYS.reduce((m, k) => Math.max(m, r.c[k].length), 1);
      rows.push({ ht: ht(maxN), cells: [
        { v:(r.gu === '미지정' ? '미지정' : r.gu + '구역') + ' (' + r.n + '명)',
          s:{ c:TXT, b:1, f:alt, ha:'left', bl:'thin', br:'med', bb:'thin' } }
      ].concat(T.KEYS.map(k => ({
        v: nl(r.c[k]),
        s: { c: r.c[k].length ? COL[k] : SUB, f:alt, wrap:1,
             br: T.SEP[k] ? 'med' : 'thin', bb:'thin' }
      }))) });
    });
    rows.push({ ht:18, cells: [{ v:'합계 (' + T.allN + '명)',
      s:{ c:TXT, b:1, f:SUMF, ha:'left', bl:'thin', br:'med', bb:'thin' } }]
      .concat(T.KEYS.map(k => ({ v:T.total[k], num:1,
        s:{ c:COL[k], b:1, f:SUMF, va:'center', br: T.SEP[k] ? 'med' : 'thin', bb:'thin' } }))) });
    grid = { cols:[14].concat(T.KEYS.map(() => 11)), rows, merges, freeze:{ x:1, y:2 } };
    name = FILE_TAG + '_전체집계_' + stamp + '.xlsx';
  } else {
    /* 가로 = 구역, 세로 = 항목 */
    const head = [{ v:'항목', s:{ c:TXT, b:1, f:HEAD, ha:'left', bl:'thin', bt:'thin', br:'med', bb:'thin' } }]
      .concat(T.rows.map((r, ri) => ({
        v:(r.gu === '미지정' ? '미지정' : r.gu) + '\n(' + r.n + '명)',
        s:{ c:TXT, b:1, f: ri % 2 ? ALT : HEAD, wrap:1, va:'center', bt:'thin', br:'thin', bb:'thin' } })))
      .concat([{ v:'합계', s:{ c:TXT, b:1, f:SUMF, va:'center', bt:'thin', br:'thin', bb:'thin' } }]);
    const rows = [{ ht:26, cells:head }];
    T.KEYS.forEach(k => {
      const maxN = T.rows.reduce((m, r) => Math.max(m, r.c[k].length), 1);
      rows.push({ ht: ht(maxN), cells: [
        { v:T.LABEL[k] + ' (' + T.total[k] + '명)',
          s:{ c:COL[k], b:1, f:HEAD, ha:'left', bl:'thin', br:'med', bb: T.SEP[k] ? 'med' : 'thin' } }
      ].concat(T.rows.map((r, ri) => ({
        v: nl(r.c[k]),
        s: { c: r.c[k].length ? COL[k] : SUB, f: ri % 2 ? ALT : PAPER, wrap:1,
             br:'thin', bb: T.SEP[k] ? 'med' : 'thin' }
      }))).concat([{ v:T.total[k], num:1,
        s:{ c:COL[k], b:1, f:SUMF, va:'center', br:'thin', bb: T.SEP[k] ? 'med' : 'thin' } }]) });
    });
    grid = { cols:[16].concat(T.rows.map(() => 11)).concat([8]), rows, merges:[], freeze:{ x:1, y:1 } };
    name = FILE_TAG + '_전체집계2_' + stamp + '.xlsx';
  }
  saveBlob(buildXlsx(kind === 'all' ? '전체집계' : '전체집계2', grid), name);
}
function xlRef(c, r) { return xlCol(c) + (r + 1); }

/* 이름을 한 줄에 하나씩 쌓은 칸 — 두 표가 함께 쓴다 */
function allCell(arr, key, color, cls) {
  return arr.length
    ? h('td', { key: key, className: cls, style:{ color: color } },
        arr.map((n, i) => h('div', { key: n + '_' + i, className:'nm' }, n)))
    : h('td', { key: key, className: (cls ? cls + ' ' : '') + 'e' }, '\u00b7');
}

/* ═══ 성도 등록 요청 (정식 1.19) ═══════════════════════════
   구역 담당자가 새로 오신 분·구원받으신 분을 적어 두면
   안내실이 그 내용을 다듬어 주소록에 올린다.

   ★ 왜 attend 밑에 두나
     보안 규칙이 attend/{id} 쓰기를 ★임원 이상★ 에게 열어 두었다
     (groups·events 만 뺀다). 그래서 규칙을 한 줄도 고치지 않고
     구역 담당자가 적을 수 있다. 성도는 attend 를 읽지 못하므로
     아직 등록 전인 분의 정보가 성도 화면으로 새지 않는다.
   ★ 한 사람에 문서 하나 (req_R…)
     여러 구역에서 같은 때에 적어도 서로 덮어쓰지 않는다.
   ★ 사진은 요청 문서 안에 작게 담아 두었다가, 안내실이 주소록에
     올릴 때 photos·thumbs 로 옮긴다 (사진 쓰기는 안내실만 되므로).
═══════════════════════════════════════════════════════ */
const REQ_PREFIX = 'req_';
const REQ_DIM = 300, REQ_Q = 0.7;          /* 요청에 담는 사진 — 작게 */
const REQ_REASONS = ['전입', '구원'];

function newReqId() {
  return 'R' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}
function blankReq() {
  return { id:'', 이름:'', 구역:'미배정', 소속:'', 성별:'', 휴대폰:'', 주소:'',
           생년월:'', 구원년월:'', 비고:'', 사유:'전입', photo:'', by:'', at:'' };
}
async function fbLoadReqs() {
  const q = _db.collection('attend')
    .orderBy(firebase.firestore.FieldPath.documentId())
    .startAt(REQ_PREFIX).endAt(REQ_PREFIX + '');
  const s = await withTimeout(q.get(), FS_TIMEOUT, '등록 요청 불러오기');
  const out = [];
  s.forEach(d => { const v = d.data(); if (v && v.id) out.push(v); });
  out.sort((a, b) => String(b.at || '').localeCompare(String(a.at || '')));
  return out;
}
async function fbSaveReq(rec) {
  await withTimeout(_db.collection('attend').doc(REQ_PREFIX + rec.id).set(rec),
                    45000, '등록 요청 저장');
}
async function fbDeleteReq(id) {
  await withTimeout(_db.collection('attend').doc(REQ_PREFIX + id).delete(),
                    FS_TIMEOUT, '등록 요청 지우기');
}
/* 요청 한 건 → 주소록에 넣을 성도 한 줄 */
function reqToMember(r) {
  return {
    '고유ID': r.id, '이름': String(r.이름 || '').trim(), '구역': String(r.구역 || '').trim(),
    '소속': r.소속 || '', '성별': r.성별 || '', '휴대폰': r.휴대폰 || '',
    '주소': r.주소 || '', '생년월': r.생년월 || '', '구원년월': r.구원년월 || '',
    '비고': r.비고 || '',
    /* 새로 오신 분은 그 표식을 그대로 달아 드린다 (출석상태 칸) */
    '출석상태': r.사유 === '구원' ? '출석A 구원' : '출석A 전입'
  };
}

/* ── 요청 적는 칸 — 구역 담당자와 안내실이 같은 폼을 쓴다 ── */
function ReqForm({ rec, set, guPick, guCodes, soList, busy }) {
  const row = (label, node, hint) => h('div', { key:label, style:{ marginBottom:'11px' } },
    h('label', { style:{ display:'block', fontSize:'13px', fontWeight:800,
                         color:'var(--text-2)', marginBottom:'5px' } }, label,
      hint ? h('span', { style:{ fontWeight:600, color:'var(--text-3)' } }, '  ' + hint) : null),
    node);
  const put = (k, v) => set({ ...rec, [k]: v });
  const inp = (k, extra) => h('input', Object.assign({
    type:'text', value: rec[k] || '', disabled: busy,
    onChange: e => put(k, e.target.value)
  }, extra || {}));

  async function onPhoto(e) {
    const file = e.target.files[0]; if (!file) return;
    try {
      const img = await loadImageFromFile(file);
      put('photo', toDataUrl(img, REQ_DIM, REQ_Q));
    } catch (err) { alert('사진을 읽지 못했습니다: ' + err.message); }
    e.target.value = '';
  }

  return h('div', null,
    /* 사진 */
    h('div', { style:{ display:'flex', alignItems:'center', gap:'12px', marginBottom:'14px' } },
      h('div', {
        style:{ width:'72px', height:'72px', borderRadius:'50%', flexShrink:0,
                border:'2px solid var(--border-2)', overflow:'hidden',
                background:'var(--surface-2)', display:'flex',
                alignItems:'center', justifyContent:'center' }
      }, rec.photo
          ? h('img', { src:rec.photo, alt:'', style:{ width:'100%', height:'100%', objectFit:'cover' } })
          : h('i', { className:'ti ti-user', style:{ fontSize:'30px', color:'var(--text-3)' } })),
      h('div', { style:{ flex:1, minWidth:0 } },
        h('label', { className:'btn btn-ghost btn-sm', style:{ display:'inline-flex', cursor:'pointer' } },
          h('i', { className:'ti ti-camera', style:{ fontSize:'18px' } }),
          rec.photo ? '사진 바꾸기' : '사진 넣기',
          h('input', { type:'file', accept:'image/*', disabled:busy,
                       style:{ display:'none' }, onChange:onPhoto })),
        rec.photo && h('button', {
          type:'button', className:'btn btn-ghost btn-sm', disabled:busy,
          style:{ marginLeft:'6px' }, onClick: () => put('photo', '')
        }, '지우기'))),

    row('이름', inp('이름', { placeholder:'예: 김성도' })),
    row('구역',
      guPick
        ? h('select', { value: rec.구역 || '미배정', disabled:busy,
                        onChange: e => put('구역', e.target.value) },
            h('option', { value:'미배정' }, '미배정 (아직 안 정함)'),
            (guCodes || []).map(g => h('option', { key:g, value:g }, g + '구역')))
        : h('input', { type:'text', value:'미배정', disabled:true }),
      guPick ? '' : '구역은 안내실이 정합니다'),
    row('소속',
      h('select', { value: rec.소속 || '', disabled:busy,
                    onChange: e => put('소속', e.target.value) },
        h('option', { value:'' }, '(고르지 않음)'),
        (soList || []).map(s => h('option', { key:s, value:s }, s)))),
    row('성별',
      h('div', { style:{ display:'flex', gap:'7px' } },
        ['남', '여'].map(g => h('button', {
          key:g, type:'button', disabled:busy,
          className: 'btn btn-sm ' + (rec.성별 === g ? 'btn-primary' : 'btn-ghost'),
          style:{ flex:1 }, onClick: () => put('성별', rec.성별 === g ? '' : g)
        }, g)))),
    row('휴대폰', inp('휴대폰', { type:'tel', placeholder:'010-0000-0000' })),
    row('주소', h('textarea', { rows:2, value: rec.주소 || '', disabled:busy,
                               placeholder:'도로명 주소',
                               onChange: e => put('주소', e.target.value) })),
    row('생년월', inp('생년월', { placeholder:'1970.05', inputMode:'numeric' }), '연.월'),
    row('구원년월', inp('구원년월', { placeholder:'2026.09', inputMode:'numeric' }), '연.월'),
    row('사유',
      h('div', { style:{ display:'flex', gap:'7px' } },
        REQ_REASONS.map(g => h('button', {
          key:g, type:'button', disabled:busy,
          className: 'btn btn-sm ' + (rec.사유 === g ? 'btn-primary' : 'btn-ghost'),
          style:{ flex:1 }, onClick: () => put('사유', g)
        }, g)))),
    row('비고', h('textarea', { rows:2, value: rec.비고 || '', disabled:busy,
                               placeholder:'전입·구원에 관한 짧은 설명',
                               onChange: e => put('비고', e.target.value) }))
  );
}

/* 요청 한 건을 줄로 보여 준다 */
function ReqRow({ r, right }) {
  return h('div', {
    style:{ display:'flex', alignItems:'center', gap:'10px', padding:'9px 2px',
            borderTop:'1px solid var(--border)' }
  },
    h('div', {
      style:{ width:'38px', height:'38px', borderRadius:'50%', flexShrink:0,
              overflow:'hidden', background:'var(--surface-2)', display:'flex',
              alignItems:'center', justifyContent:'center' }
    }, r.photo
        ? h('img', { src:r.photo, alt:'', style:{ width:'100%', height:'100%', objectFit:'cover' } })
        : h('i', { className:'ti ti-user', style:{ fontSize:'19px', color:'var(--text-3)' } })),
    h('div', { style:{ flex:1, minWidth:0 } },
      h('div', { style:{ fontSize:'15px', fontWeight:800 } }, r.이름 || '(이름 없음)',
        h('span', {
          style:{ marginLeft:'6px', fontSize:'11.5px', fontWeight:800, padding:'2px 7px',
                  borderRadius:'999px', background:'var(--soft)', color:'var(--navy)' }
        }, r.사유 || '전입')),
      h('div', { style:{ fontSize:'12px', color:'var(--text-3)', marginTop:'2px' } },
        (r.구역 && r.구역 !== '미배정' ? r.구역 + '구역 · ' : '미배정 · ') +
        (r.by ? r.by + '구역에서 보냄' : '보낸 이 모름') +
        (r.at ? ' · ' + String(r.at).slice(0, 10) : ''))),
    right);
}

/* ═══ 흩어진 식구 띠 (정식 1.19) ═══════════════════════════
   가족으로 묶여 있어도 ★구역이 다르거나 주소가 달라★
   이 가정 자리에 함께 서지 못하는 분들이다.
   전화·메모 단추도, 전화번호도 없이 ★얼굴과 이름만★ 놓는다 —
   여기서 전화를 거는 자리가 아니라 '이런 식구가 더 있다' 고
   알려 주는 자리이기 때문이다.
   누르면 그분이 계신 구역으로 목록이 다시 조회된다. */
function KinStrip({ list, photos, dark, onPick }) {
  return h('div', { className:'kinstrip' },
    list.map(p => {
      /* 사진이 없으면 소속 빛깔의 동그라미를 둔다 —
         Avatar 는 사진이 없을 때 이름을 그리는데, 바로 아래에
         이름이 또 있어 같은 글씨가 두 번 겹쳐 보이기 때문이다. */
      const av = getAv(p, dark);
      return h('button', {
        key: p['고유ID'], type:'button', className:'kin',
        title: (String(p['구역'] || '').trim() ? p['구역'] + '구역' : '구역 미지정') + ' 보기',
        onClick: () => onPick(p)
      },
        (photos && photos[p['고유ID']])
          ? h(Avatar, { member:p, photos, size:38 })
          : h('span', { className:'kin-f', style:{ background:av.bg, color:av.cl } },
              h('i', { className:'ti ti-user' })),
        h('span', { className:'kin-t' }, p['이름'])
      );
    })
  );
}

/* ═══════════════════════════════════════════════════════
   성도 목록 (이름 전용 초성 검색)
═══════════════════════════════════════════════════════ */
function MainView({ members, photos, logoUrl, onLogout, onSelect, theme, toggle, role, fieldVis,
                    onAdminPanel, onAttend, attStatus, listCfg, view, setView, scrollRef, onHome,
                    family, reqs }) {
  /* 검색·필터·스크롤 위치는 App이 들고 있다.
     성도 한 명을 보고 목록으로 돌아와도 보던 자리 그대로 이어진다. */
  const search = view.search, fGu = view.fGu, fSo = view.fSo, fAtt = view.fAtt;
  const fCat = view.fCat || '';
  const setSearch = v => setView(o => ({ ...o, search:v, limit:60 }));
  const setFGu    = v => setView(o => ({ ...o, fGu:v,    limit:60 }));
  const setFSo    = v => setView(o => ({ ...o, fSo:v,    limit:60 }));
  const setFAtt   = v => setView(o => ({ ...o, fAtt:v,   limit:60 }));
  const setFCat   = v => setView(o => ({ ...o, fCat:v,   limit:60 }));
  const renderLimit = view.limit;
  const setRenderLimit = v => setView(o => ({
    ...o, limit: typeof v === 'function' ? v(o.limit) : v
  }));
  const dark = theme === 'dark';

  const isStaff  = ROLES[role] >= ROLES.admin;
  const isLeader = ROLES[role] >= ROLES.leader;   /* 임원부터 = 출석표를 쓸 수 있는 등급 */
  const seeJik   = canSee('직분',    role, fieldVis);
  const seeGu    = canSee('구역',    role, fieldVis);
  const seeSo    = canSee('소속',    role, fieldVis);
  const seeAtt   = canSee('출석상태', role, fieldVis);
  const seePhone = canSee('휴대폰',  role, fieldVis) || canSee('집전화', role, fieldVis);
  const seeArea  = canSee('지역',    role, fieldVis);

  /* ═══ 성도 등록 요청 → 목록에 보일 줄 (정식 1.19) ═══
     구역 담당자가 관리화면 [성도 등록 요청] 에 적어 둔 분들이다.
     아직 주소록에 없는 분이라 members 와 섞지 않고 따로 들고 있다가
     구역 칸에서 「미배정」 을 고르셨을 때만 이 줄들을 보여 드린다. */
  const reqRows = useMemo(() => (reqs || []).map(r => ({
    ...reqToMember(r),
    __req: true, __reqBy: r.by || '', __reqAt: r.at || '', __reqWhy: r.사유 || ''
  })), [reqs]);
  const reqPhotos = useMemo(() => {
    const o = {};
    (reqs || []).forEach(r => { if (r.photo) o[r.id] = r.photo; });
    return o;
  }, [reqs]);
  /* 요청이 한 건이라도 있을 때만 구역 칸에 「미배정」 을 올린다 */
  const seeReq = isLeader && reqRows.length > 0;
  const onReq  = seeReq && fGu === '미배정';

  const uGu = useMemo(() => {
    const gs = [...new Set(members.map(m => m['구역']).filter(Boolean))]
      .sort((a,b) => (parseInt(a,10)||999) - (parseInt(b,10)||999));
    return seeReq ? gs.concat(['미배정']) : gs;
  }, [members, seeReq]);

  /* ═══ 직분 고르기 (정식 1.18 — 엑셀 「직분 카테고리」 칸을 그대로 씀) ═══
     명단의 「직분 카테고리」 칸을 '/' 로 쪼개 ★겹치지 않는 낱개★ 를 모아
     콤보에 올린다. 하나를 고르면 그 카테고리가 적힌 사람이 모두 나온다.
     ★ 뒤에 인원수를 적어 둔다 — 「구역임원 (83)」 처럼 몇 분인지 미리 보인다.
       한 사람이 같은 카테고리를 두 번 적었어도 한 번만 센다.
     ★ 차례는 교회가 정한 CAT_ORDER 를 먼저 따르고, 나머지는 가나다순이다. */
  const jikOpts = useMemo(() => {
    const cnt = {};
    members.forEach(m => {
      const seen = {};
      splitRoles(m['직분 카테고리']).forEach(c => {
        if (seen[c]) return;          /* 같은 사람이 같은 카테고리를 두 번 적은 경우 */
        seen[c] = 1;
        cnt[c] = (cnt[c] || 0) + 1;
      });
    });
    const rows = Object.keys(cnt)
      .sort((a, b) => (catRank(a) - catRank(b)) || a.localeCompare(b, 'ko'))
      .map(c => ({ name: c, n: cnt[c] }));
    return { rows, total: rows.length };
  }, [members]);
  const uSo = useMemo(() => {
    const s = [...new Set(members.map(m => m['소속']).filter(Boolean))];
    return s.sort((a,b) => {
      const ia = SO_ORDER.indexOf(a), ib = SO_ORDER.indexOf(b);
      return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
    });
  }, [members]);

  /* 가족 정렬표 — 명단이나 가족 설정이 바뀔 때만 다시 만든다.
     검색·필터를 칠 때마다 다시 만들면 어르신 휴대폰에서 글자가 밀린다. */
  const famIdx  = useMemo(() => buildFamilySortIndex(members, family), [members, family]);
  const famSort = useMemo(() => sortByFamily(famIdx), [famIdx]);

  /* ⚡ [이름 전용 초성 검색 필터] */
  /* 「미배정」 을 고르셨으면 주소록 대신 등록 요청 줄을 건다 */
  const listBase = onReq ? reqRows : members;
  const filtered = useMemo(() => listBase.filter(m => {
    if (search) {
      const s = search.toLowerCase().replace(/\s/g,'');
      
      // 1. 일반 텍스트 전체 검색 (이름, 직분, 직분 카테고리, 전화, 지역, 주소, 소속)
      const hay = [(m['이름']||''), (m['직분']||''), (m['직분 카테고리']||''),
                   (m['휴대폰']||''), (m['집전화']||''),
                   (m['지역']||''), (m['주소']||''), (m['소속']||'')]
                  .join('|').toLowerCase().replace(/\s/g,'');

      // 2. '이름' 항목 전용 초성 추출
      const name = (m['이름'] || '').toLowerCase().replace(/\s/g,'');
      const nameChoseong = getChoseong(name);

      // 일반 검색어 일치 OR 이름 초성 검색 일치
      if (!hay.includes(s) && !nameChoseong.includes(s)) return false;
    }
    /* 전출·미출석을 목록에서 감추는 설정 (정식 1.12).
       ★ 출석 칸으로 직접 그것을 고르셨을 때는 감추지 않는다.
         찾으려고 고른 것을 감추면 아무것도 안 나와 고장으로 보인다. */
    if (!fAtt && !listShows(m, attStatus, listCfg, seeAtt)) return false;
    if (fGu && m['구역'] !== fGu) return false;
    if (fSo && m['소속'] !== fSo) return false;
    /* 직분 — 「직분」 칸을 '/' 로 쪼갠 낱개와 정확히 맞는지 본다 (1.16).
       '소망부자매차장 / 이삭부반주' 처럼 겸직이어도 각각으로 걸린다. */
    if (fCat && splitRoles(m['직분 카테고리']).indexOf(fCat) === -1) return false;
    /* 출석 필터 — 출석A·출석B·미출석은 상태와 맞는지, 전입·전출·구원은 표식이 달렸는지 본다 */
    if (fAtt) {
      const f = effAttFull(m, attStatus);
      if (ATT_MARKS.indexOf(fAtt) >= 0) { if (f.marks.indexOf(fAtt) < 0) return false; }
      else if (isAttExempt(m) || f.state !== fAtt) return false;   /* 영유아는 상태로 걸리지 않는다 */
    }
    return true;
  }).sort(famSort), [listBase, search, fGu, fSo, fAtt, fCat, attStatus, listCfg, seeAtt, famSort]);

  /* ═══ 흩어진 식구 찾기 (정식 1.19) ═══
     ① famAll — 가족 열쇠(가족번호 또는 집주소)별로 온 식구를 모아 둔다.
     ② shownIds — 지금 목록에 실제로 나와 있는 분들.
     가정의 맨 아랫줄에서 ①에서 ②와 '이 구역' 을 빼면
     구역이 달라·주소가 달라 함께 못 선 식구만 남는다. */
  const famAll = useMemo(() => {
    const map = new Map();
    members.forEach(m => {
      const c = famIdx[m['고유ID']];
      if (!c || !c.key) return;
      if (!map.has(c.key)) map.set(c.key, []);
      map.get(c.key).push(m);
    });
    map.forEach(g => g.sort((a, b) =>
      ((parseInt(a['구역'], 10) || 999) - (parseInt(b['구역'], 10) || 999)) ||
      String(a['이름'] || '').localeCompare(String(b['이름'] || ''), 'ko')));
    return map;
  }, [members, famIdx]);

  const shownIds = useMemo(() => {
    const s = {};
    filtered.forEach(m => { s[m['고유ID']] = 1; });
    return s;
  }, [filtered]);

  /* 얼굴이나 이름을 누르면 그분 구역으로 조회한다.
     구역을 못 보는 등급(성도)이거나 구역이 비어 있으면
     대신 그분 이름으로 찾아 드린다. */
  const pickKin = useCallback(p => {
    const gu = String(p['구역'] || '').trim();
    const byGu = seeGu && !!gu;
    setView(o => ({ ...o,
      search: byGu ? '' : String(p['이름'] || ''),
      fGu: byGu ? gu : '', fSo:'', fAtt:'', fCat:'', limit:60 }));
    try { window.scrollTo({ top:0, behavior:'smooth' }); }
    catch (e) { window.scrollTo(0, 0); }
  }, [seeGu, setView]);

  /* 목록에서 빠진 인원 수 — 임원 이상에게만 알려 준다.
     설정을 켜 둔 것을 잊고 '왜 인원이 줄었지?' 하지 않도록. */
  const hiddenN = useMemo(() => {
    const c = normListCfg(listCfg);
    if (!c.hideAway && !c.hideAbsent) return 0;
    return members.filter(m => !listShows(m, attStatus, listCfg, seeAtt)).length;
  }, [members, attStatus, listCfg, seeAtt]);

  const notice = normListCfg(listCfg).notice;

  /* 610명을 한 번에 그리면 휴대폰이 버벅인다.
     화면에 보일 만큼만 그리고, 내려갈수록 이어서 붙인다.
     (필터를 바꿀 때만 처음으로 — 상세에서 돌아온 경우는 그대로) */

  /* 상세 화면에서 돌아왔을 때 보던 자리로 */
  useEffect(() => {
    const y = scrollRef.current || 0;
    if (!y) return;
    let n = 0;
    const back = () => {
      window.scrollTo(0, y);
      if (++n < 10 && Math.abs(window.scrollY - y) > 4) requestAnimationFrame(back);
    };
    requestAnimationFrame(back);
  }, []);

  useEffect(() => {
    if (renderLimit >= filtered.length) return;
    const grow = () => {
      const rest = document.documentElement.scrollHeight - window.innerHeight - window.scrollY;
      if (rest < 1000) setRenderLimit(v => Math.min(filtered.length, v + 60));
    };
    window.addEventListener('scroll', grow, { passive:true });
    const t = setTimeout(grow, 60);
    return () => { window.removeEventListener('scroll', grow); clearTimeout(t); };
  }, [filtered, renderLimit]);

  const renderedList = useMemo(() => filtered.slice(0, renderLimit), [filtered, renderLimit]);

  const groups = useMemo(() => {
    const map = new Map();
    renderedList.forEach(m => {
      const k = m['구역'] || '미지정';
      if (!map.has(k)) map.set(k, []);
      map.get(k).push(m);
    });
    return [...map.entries()];
  }, [renderedList]);

  /* 윗쪽 출석 숫자 — 구역 담당자께는 ★자기 구역★ 것만 보여 드린다 (정식 1.18).
     교회 전체 숫자는 담당자께 쓸모가 적고, 바로 아래 명단도 자기 구역이라
     숫자와 명단이 어긋나 보이면 고장으로 여기시기 때문이다.
     부서 담당자·안내실·전도인은 예전처럼 교회 전체를 센다. */
  const statGu = useMemo(() => {
    const sc = myScope();
    return (sc && sc.kind === 'gu') ? sc.code : '';
  }, [role]);

  const stats = useMemo(() => {
    const list = statGu
      ? members.filter(m => String(m['구역'] || '').trim() === statGu)
      : members;
    let aCnt = 0, bCnt = 0, absent = 0, baby = 0, inN = 0, outN = 0, saveN = 0;
    list.forEach(m => {
      const f = effAttFull(m, attStatus);
      /* 전입·전출·구원은 ★표식★ 이라 출석A·B·미출석과 나란히 달린다.
         영유아께도 표식은 달 수 있으므로 아래 영유아 거르기보다 먼저 센다. */
      if (f.marks.indexOf('전입') >= 0) inN++;
      if (f.marks.indexOf('전출') >= 0) outN++;
      if (f.marks.indexOf('구원') >= 0) saveN++;
      /* 영아·유아·영유아는 출석A·출석B·미출석 어디에도 넣지 않는다 */
      if (isAttExempt(m)) { baby++; return; }
      if (f.state === '출석A')      aCnt++;
      else if (f.state === '출석B') bCnt++;
      else                          absent++;
    });
    return { total: list.length, aCnt, bCnt, absent, baby, inN, outN, saveN };
  }, [members, attStatus, statGu]);

  /* 이름 옆의 「식구 N」 — 목록에 함께 보이는 식구만 센다 (정식 1.12).
     전출·미출석을 감춰 두었는데 여기서 세면 눌러 들어가도
     그 사람이 없어 숫자가 맞지 않는다. */
  const famCount = useMemo(() => {
    const shown = members.filter(m => listShows(m, attStatus, listCfg, seeAtt));
    const byAddr = new Map();
    shown.forEach(m => {
      const a = normAddr(m['주소']);
      if (a.length < 10) return;
      byAddr.set(a, (byAddr.get(a) || 0) + 1);
    });
    const out = {};
    shown.forEach(m => {
      const a = normAddr(m['주소']);
      out[m['고유ID']] = a.length >= 10 ? Math.max(0, (byAddr.get(a) || 1) - 1) : 0;
    });
    return out;
  }, [members, attStatus, listCfg, seeAtt]);

  const hasFilter = search || fGu || fSo || fAtt || fCat;

  return h('div', { className:'screen' },
    h(AppBar, {
      title:APP_TITLE, icon:'building-church', logoUrl, onHome,
      left: isStaff
        ? h('span', {
            style:{ fontSize:'12px', fontWeight:800, padding:'4px 10px', borderRadius:'999px',
                    background:'var(--bar-chip)', border:'1px solid var(--bar-chip-bd)',
                    color:'var(--bar-fg)', whiteSpace:'nowrap' }
          }, (myScope() && myScope().name) || ROLE_LABEL[role])
        : null,
      right: h(React.Fragment, null,
        /* 출석표 아이콘은 상단바에서 뺐다 (1.16) — 화면 가운데의 큰
           [주일 출석표 열기] 단추가 어르신께 훨씬 잘 보이기 때문이다. */
        /* 관리 화면 — 안내실·전도인 둘 다 들어간다.
           등급은 onAdminPanel 을 넘길 때 이미 가려 두었으므로 여기서 또 보지 않는다. */
        onAdminPanel
          ? h(NBtn, { onClick:onAdminPanel, icon:'settings', title:'관리 화면' }) : null,
        h(ThemeBtn, { theme, toggle }),
        h(NBtn, { onClick:onLogout, icon:'logout', title:'로그아웃' })
      )
    }),

    h('div', { className:'wrap', style:{ paddingTop:'14px' } },

      /* 출석상태를 볼 수 있는 등급(기본: 임원부터)에게만 통계를 보여 준다.
         자세한 집계는 출석표 [집계] 탭에 있다.

         ★ 구역 담당자께는 여섯 칸을 보여 드린다 (정식 1.18) —
           전체 · 출석A · 출석B · 미출석 · 전입 · 구원.
           구역에서 챙기실 것은 영유아 수가 아니라 ★새로 오신 분(전입)★ 과
           ★구원받으신 분★ 이기 때문이다. 세 칸씩 두 줄로 놓아
           320px 어르신 휴대폰에서도 숫자가 크게 보인다.
         ★ 안내실·전도인·부서 담당자께는 예전 그대로 —
           전체 · 출석A · 출석B · 미출석 (+영유아). 교회 전체 숫자는
           영유아를 빼면 넷을 더해도 전체와 맞지 않아 고장처럼 보이기 때문이다. */
      seeAtt && (() => {
        const tiles = [
          { l:'전체',   v:stats.total,  c:'var(--navy)' },
          { l:'출석A',  v:stats.aCnt,   c:'var(--ok)' },
          { l:'출석B',  v:stats.bCnt,   c:'var(--warn)' },
          { l:'미출석', v:stats.absent, c:'var(--bad)' }
        ];
        if (statGu) {
          /* 구역 담당자 — 여섯 칸. 전출은 미출석 안에 이미 들어 있어 뺀다. */
          tiles.push({ l:'전입', v:stats.inN,   c:'var(--violet)' });
          tiles.push({ l:'구원', v:stats.saveN, c:'var(--navy-2)' });
        } else {
          /* 안내실·전도인·부서 담당자 — 일곱 칸 (정식 1.18).
             교회 전체에서는 영유아 수보다 ★전입·전출·구원★ 이 훨씬 자주 쓰인다. */
          tiles.push({ l:'전입', v:stats.inN,   c:'var(--violet)' });
          tiles.push({ l:'전출', v:stats.outN,  c:'var(--bad)' });
          tiles.push({ l:'구원', v:stats.saveN, c:'var(--navy-2)' });
        }
        /* ★ 언제나 한 줄로 놓는다 (정식 1.18). 칸이 늘어날수록 글씨를 줄여
             320px 어르신 휴대폰에서도 '미출석' 과 세 자리 숫자가 잘리지 않게 한다. */
        const tiny  = tiles.length >= 7;
        const small = tiles.length >= 5;
        /* 구역 담당자께는 어느 구역 숫자인지 한 줄로 밝혀 둔다 —
           아래 「구역」 칸을 다른 구역으로 바꾸셔도 이 숫자는 담당 구역 것이다. */
        return h(React.Fragment, null,
          statGu ? h('div', {
            style:{ fontSize:'12px', fontWeight:700, color:'var(--text-3)',
                    margin:'0 2px 6px', letterSpacing:'-.02em' }
          }, statGu + '구역 기준') : null,
          h('div', { style:{ display:'grid',
                   gridTemplateColumns:'repeat(' + tiles.length + ',1fr)',
                   gap: tiny ? '3px' : small ? '4px' : '5px', marginBottom:'12px' } },
          tiles.map(({l,v,c}) => h('div', { key:l, className:'stat',
                                            style:{ padding: tiny ? '8px 0' : small ? '9px 1px' : '11px 2px' } },
            h('div', { className:'stat-v',
                       style:{ color:c, fontSize: tiny ? '15px' : small ? '17px' : '20px',
                               whiteSpace:'nowrap' } }, v),
            h('div', { className:'stat-l',
                       style:{ fontSize: tiny ? '9.5px' : small ? '10.5px' : '11px',
                               letterSpacing:'-.05em', whiteSpace:'nowrap' } }, l)
          ))));
      })(),

      /* 어르신 손가락으로 상단 아이콘을 찾기 어려우실 수 있어
         임원 등급에게는 큰 버튼을 한 줄 더 둔다. */
      isLeader && onAttend && h('button', {
        type:'button', onClick:onAttend, className:'btn btn-primary btn-block',
        style:{ marginBottom:'12px' }
      },
        h('i', { className:'ti ti-clipboard-check', style:{ fontSize:'20px' } }),
        '주일 출석표 열기'),

      h('div', { style:{ position:'relative' } },
        h('i', {
          className:'ti ti-search',
          style:{ position:'absolute', left:'15px', top:'50%', transform:'translateY(-50%)',
                  color:'var(--text-3)', fontSize:'19px', pointerEvents:'none' }
        }),
        h('input', {
          type:'search', placeholder:'이름 · 이름초성(ㄱㄱㄷ) · 전화 · 주소 검색',
          value:search, onChange: e => setSearch(e.target.value),

                           폭을 잘라 말줄임하지 않고 줄바꿈에 맡겨 온전히 읽히게 한다.
                           (전부 보시려면 눌러서 상세 화면으로) */
                        /* 목록에서는 훈장 아이콘을 달지 않는다. 아이콘이 19px을 먹는데
                           좁은 기기에서는 그 19px 때문에 직분 이름이 잘린다.
                           목록에서는 배지 색(네이비)만으로 소속과 충분히 구분되고,
                           아이콘은 상세 화면에 그대로 남아 있다. */
                        jikList.slice(0, 2).map((r, i) => h('span', {
                          key:'jk' + i, className:'mrole', title: jikList.join(' / ')
                        }, h('span', { className:'mrole-t' }, r))),
                        jikList.length > 2 && h('span', {
                          className:'mrole-n', title: jikList.join(' / ')
                        }, '+' + (jikList.length - 2)),
                        seeSo && h(Bdg, { t:m['소속'], bg:av.bg, cl:av.cl }),
                        m.__req && h(Bdg, { t:'등록요청', bg:'var(--soft)', cl:'var(--navy)',
                                            icon:'user-plus' }),
                        seeAtt && !isAttExempt(m) && att !== '출석A' && h(Bdg, { t:att, bg:badge.bg, cl:badge.cl }),
                        seeAtt && marks.map(k => {
                          const t = getMarkBadge(k, dark);
                          return h(Bdg, { key:k, t:k, bg:t.bg, cl:t.cl });
                        }),

                          style:{ fontSize:'12.5px', color:'var(--navy)', fontWeight:700,
                                  display:'inline-flex', alignItems:'center', gap:'2px' }
                        }, h('i', { className:'ti ti-users', style:{ fontSize:'14px' } }), fc)
                      ),
                      h('div', { className:'msub' },
                        phone && h('span', null, phone),
                        seeArea && m['지역'] && h('span', { style:{ color:'var(--text-3)' } }, '· ' + m['지역']),
                        /* 요청 줄에는 누가 언제 보냈는지를 적어 둔다 */
                        m.__req && h('span', { style:{ color:'var(--text-3)' } },
                          (phone ? '· ' : '') +
                          (m.__reqBy ? m.__reqBy + '구역에서 보냄' : '보낸 구역 모름') +
                          (m.__reqAt ? ' · ' + String(m.__reqAt).slice(0, 10) : ''))
                      )
                    ),
                    h(CallActions, { phone })
                  );

                  const strip = kin.length
                    ? h(KinStrip, { list:kin, photos, dark, onPick:pickKin }) : null;
                  return (strip || famEnds)
                    ? h(React.Fragment, { key: m['고유ID'] }, card, strip,
                        famEnds ? h('div', { className:'fline' }) : null)
                    : card;
                })
              )
            )),

        renderLimit < filtered.length && h('div', {
          style:{ textAlign:'center', padding:'20px', color:'var(--text-3)',
                  fontSize:'14px', fontWeight:600, display:'flex',
                  alignItems:'center', justifyContent:'center', gap:'8px' }
        },
          h('span', { className:'spinner', style:{ width:'15px', height:'15px', borderWidth:'2px' } }),
          (filtered.length - renderLimit) + '명 더 있습니다'
