}
function loadImageFromUrl(url) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onerror = () => rej(new Error('이미지를 열 수 없습니다'));
    img.onload  = () => res(img);
    img.src = url;
  });
}

function toDataUrl(img, maxDim, q) {
  const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  if (!iw || !ih) throw new Error('이미지 크기를 읽을 수 없습니다');
  let w = iw, hh = ih;
  if (w > hh && w > maxDim)      { hh = Math.round(hh * maxDim / w); w = maxDim; }
  else if (hh > maxDim)          { w = Math.round(w * maxDim / hh); hh = maxDim; }
  const c = document.createElement('canvas');
  c.width = w; c.height = hh;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, w, hh);
  ctx.drawImage(img, 0, 0, w, hh);
  const out = c.toDataURL('image/jpeg', q);
  if (!out || out.length < 100) throw new Error('이미지 변환 실패');
  return out;
}

function toDataUrlCapped(img, maxDim, q, cap) {
  let dim = maxDim, quality = q, out = toDataUrl(img, dim, quality);
  let guard = 0;
  while (out.length > cap && guard++ < 6) {
    quality = Math.max(0.4, quality - 0.12);
    dim     = Math.round(dim * 0.85);
    out     = toDataUrl(img, dim, quality);
  }
  return out;
}

function loadXlsxLib() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";
    s.onload = res;
    s.onerror = () => rej(new Error('엑셀 라이브러리를 불러올 수 없습니다.'));
    document.head.appendChild(s);
  });
}

/* ═══════════════════════════════════════════════════════════════════
   엑셀로 가족관계 주고받기 (1.05)

   ★ 왜 넣었나
   성도들께 앱을 나눠 드린 뒤 「가족이 이상하게 묶였다」는 말이 나오면
   지금까지는 안내실이 화면에서 한 집 한 집 손으로 고쳐야 했다.
   교회 명단은 원래 엑셀로 관리하므로, ★엑셀에서 고쳐 다시 올리는 것★이
   훨씬 빠르다.

   ★ 두 칸을 쓴다
   · 가족ID   같은 값이 적힌 사람끼리 한 가족 (F001, F002 …)
   · 집안자리 부부 / 자녀 / 조부모 / 손자녀 / 며느리·사위 / 형제자매 …

   ★ 줄 순서에 기대지 않는다 — 가장 중요
   교회 명단은 가족 순으로 정렬되어 있지 않다. 그래서 「위아래 줄이
   한 가족」 같은 규칙을 쓰면 안 된다. 오직 ★가족ID 값★ 으로만 묶는다.
   내보낼 때는 사람이 보기 좋게 가족끼리 모아 정렬해 주지만,
   다시 올릴 때 순서가 뒤바뀌어 있어도 아무 문제가 없다.

   ★ 혼자인 사람에게는 가족ID를 적지 않는다
   손으로 묶은 가족이 있으면 그 사람의 주소 자동 연결이 꺼진다.
   혼자인 사람에게 가족ID를 붙이면 나중에 식구가 이사 와도
   자동으로 묶이지 않는다. 그래서 두 명 이상만 적는다.
═══════════════════════════════════════════════════════════════════ */

/* ═══════════════════════════════════════════════════════════════════
   엑셀 가족 칸 (정식 1.13)

   새 칸 세 개 — 사람이 읽고 고치기 쉬운 형태다
     가족코드      F001 · F002 …   같은 코드끼리 한 집
     대표          그 집의 기준이 되는 분의 이름 (프로그램이 채워 준다)
     대표와의관계   대표에게서 본 그 사람의 자리 — 「아내」「아들」「조모」…
                   대표 본인 줄에는 「대표」라고 적힌다

   ★ 왜 대표를 기준으로 하는가
   1.12까지는 「집안자리」에 부부·자녀처럼 적었다. 그 기준은 프로그램이
   나이로 ★짐작한★ 어른 세대였다. 그래서 조부모와 손자녀만 사는 집에서
   뜻이 어긋나고, 자녀에게 적어 둔 값이 부부 판정에까지 끼어들었다.
   기준을 사람으로 못 박으면 「누구에게서 본 조모인가」가 분명해진다.

   ★ 옛 칸도 그대로 읽는다 — 이미 내려받아 두신 파일이 쓸모없어지지 않게.
═══════════════════════════════════════════════════════════════════ */
const FAM_COL_ID   = '가족코드';
const FAM_COL_HEAD = '대표';
const FAM_COL_REL  = '대표와의관계';
const FAM_COL_OLDID   = '가족ID';      /* 1.12까지 쓰던 이름 — 읽기만 */
const FAM_COL_SLOT    = '집안자리';    /* 1.12까지 쓰던 이름 — 읽기만 */
/* ═══════════════════════════════════════════════════════
   엑셀 칸을 세 묶음으로 나눈다 (정식 1.14)

   ★ 왜 나누는가
   칸이 열아홉이나 되어, 처음 적으시는 분이 「어디까지 채워야 하나」를
   알 수 없었다. 그래서 ★꼭 필요한 것★ 만 먼저 보이게 한다.

   필수 : 이것만 있으면 주소록이 제대로 돈다
   부가 : 있으면 좋지만 없어도 되는 것 (비워 두셔도 화면이 비지 않는다)
   자동 : 프로그램이 채운다 — ★비워 두세요★
═══════════════════════════════════════════════════════ */
const REQ_FIELDS  = ['이름','동명이인구분','구역','소속','성별','휴대폰','주소',
                     FAM_COL_HEAD, FAM_COL_REL];
const AUTO_FIELDS = ['고유ID', FAM_COL_ID, FAM_GEN_FIELD];
/* 사람이 반드시 값을 적어야 하는 칸 (동명이인구분은 같은 이름이 있을 때만,
   대표·대표와의관계는 비워 두면 프로그램이 짐작하므로 여기서 뺀다) */
const REQ_MUST    = ['이름','구역','소속','성별','휴대폰','주소'];

/* 올리기 전 점검 — 어느 칸이 몇 명 비었는지 세어 준다.
   ★ 막지는 않는다. 교회 사정으로 전화번호가 없는 분도 계시기 때문이다.
     대신 ★올리기 전에★ 숫자로 보여 드려 놓친 것을 스스로 알게 한다. */
function checkRequired(rows) {
  const miss = {}, out = { rows: (rows || []).length, miss, dupNoMark: [], noHead: 0 };
  REQ_MUST.forEach(f => { miss[f] = 0; });
  const byName = {};
  (rows || []).forEach(o => {
    REQ_MUST.forEach(f => { if (!String(o[f] || '').trim()) miss[f]++; });
    const n = nk(o['이름']);
    if (n) (byName[n] = byName[n] || []).push(o);
    if (!String(o[FAM_COL_HEAD] || '').trim() &&
        !String(o[FAM_COL_REL] || '').trim()) out.noHead++;
  });
  /* 같은 이름인데 동명이인구분이 비어 있으면 사진·메모가 섞인다 */
  Object.keys(byName).forEach(n => {
    const g = byName[n];
    if (g.length < 2) return;
    if (g.some(o => !String(o['동명이인구분'] || '').trim()))
      out.dupNoMark.push(g[0]['이름'] + ' ' + g.length + '명');
  });
  return out;
}

/* 지금 화면에 보이는 대로 가족을 묶어 낸다 (손으로 묶은 것 + 주소로 찾은 것) */
function collectFamilies(members, fam) {
  const f = normFamily(fam);
  const seen = {}, out = [];
  members.forEach(me => {
    const id = me['고유ID'];
    if (seen[id]) return;
    const others = getFamilyGroup(me, members, f);
    if (!others.length) { seen[id] = 1; return; }
    const group = [me].concat(others);
    group.forEach(p => { seen[p['고유ID']] = 1; });
    out.push(group);
  });
  return out;
}

/* 대표를 정하지 않은 집안의 대표를 골라 준다 —
   ★ 집안에서 ★가장 어른★ (어린이·학생은 빼고 가장 나이 많은 분).

   ★ 왜 「0세대」로 고르지 않는가
   프로그램이 잡는 0세대는 「어른(부부) 세대」인데, 그 판정이
     세대가 둘이면 ★사람이 많은 쪽★
   이다. 그래서 부모 둘에 자녀가 셋인 집은 ★자녀 세대가 0★ 이 되고,
   대표로 자녀가 뽑혀 버렸다 (최병관 가정에서 딸이 대표로 뽑혔다).
   대표는 사람이 읽는 기준이므로 「가장 어른」이 언제나 자연스럽다. */
function autoHead(group, gen, info, fam) {
  const grown = group.filter(p => famBand(p) !== 'kid');
  const pool = (grown.length ? grown : group).slice();
  pool.sort((a, b) => {
    const ya = info[a['고유ID']] ? info[a['고유ID']].y : 9999;
    const yb = info[b['고유ID']] ? info[b['고유ID']].y : 9999;
    if (ya !== yb) return ya - yb;
    const sa = (a['성별'] === '남') ? 0 : 1, sb = (b['성별'] === '남') ? 0 : 1;
    if (sa !== sb) return sa - sb;
    return String(a['이름'] || '').localeCompare(String(b['이름'] || ''), 'ko');
  });

  /* ★ 배우자가 있는 분을 먼저 찾는다 — 그분이 그 집의 기준(세대주)이다.

     ★ 왜 「가장 어른」으로는 안 되는가
     홀로 되신 어머니가 아들·며느리와 함께 사시는 집이 흔하다.
     그 어머니를 대표로 잡으면, 며느리를 대표에게서 보아야 하므로
     ★「딸」로 잘못 적히고★, 그 값이 엑셀에 실려 나가면
     아들과 며느리가 남매로 뒤바뀐다 (노용철 가정이 그런 경우였다).
     배우자가 있는 분을 기준으로 삼으면 이런 어긋남이 생기지 않는다.

     같은 세대의 이성끼리만 살펴보므로 계산이 무겁지 않다. */
  for (let i = 0; i < pool.length; i++) {
    const me = pool[i];
    const gi = gen[me['고유ID']], sx = String(me['성별'] || '');
    if (!sx || gi === undefined) continue;
    for (let j = 0; j < pool.length; j++) {
      const o = pool[j];
      if (o === me) continue;
      if (gen[o['고유ID']] !== gi) continue;
      const so = String(o['성별'] || '');
      if (!so || so === sx) continue;
      const r = guessRelLabel(me, o, group, fam);
      if (r === '남편' || r === '아내') return me['고유ID'];
    }
  }
  return pool.length ? pool[0]['고유ID'] : '';
}

/* 엑셀에 실을 세 칸을 사람마다 계산한다 */
function buildFamilyColumns(members, fam) {
  const fams = collectFamilies(members, fam);
  const byId = {};

  /* 가족을 놓는 순서 — 구역이 앞선 가족부터 (교회에서 보시는 순서) */
  const guOf = g => Math.min.apply(null, g.map(p => parseInt(p['구역'] || '9999', 10) || 9999));
  fams.sort((a, b) => {
    const d = guOf(a) - guOf(b);
    if (d) return d;
    return String(a[0]['이름']).localeCompare(String(b[0]['이름']), 'ko');
  });

  const nf = normFamily(fam);
  const fr = nf.r;
  fams.forEach((g, i) => {
    const fid = 'F' + String(i + 1).padStart(3, '0');
    const { gen, info } = buildGenMap(g, fam);
    /* 대표 — 안내실이 정한 분이 있으면 그분, 없으면 골라 준다 */
    let head = storedHead(g, nf);
    if (!head || !info[head]) head = autoHead(g, gen, info, fam);
    const hm = g.filter(p => p['고유ID'] === head)[0] || null;
    const hName = hm ? (hm['이름'] || '') + (hm['동명이인구분'] || '') : '';

    g.forEach(p => {
      const id  = p['고유ID'];
      const x   = info[id];
      const lab = fr[id];
      let rel;
      if (id === head)                    rel = '대표';
      else if (lab && !isKnownRel(lab))   rel = lab;      /* 직접 적어 두신 말은 그대로 */
      else {
        /* ★ 대표 화면에 실제로 나오는 호칭을 그대로 적어 보낸다.
             확신하지 못해 '가족' 이라고만 나오는 분은 ★빈칸★ 으로 둔다.
             빈칸이면 다시 올렸을 때 프로그램이 계속 짐작한다 —
             틀린 짐작을 엑셀에 못 박아 버리지 않기 위해서다. */
        const guess = hm ? getRelLabel(hm, p, fam, g) : '';
        rel = (guess && guess !== '가족') ? guess : '';
      }
      byId[id] = {
        fid, rel, head: hName, isHead: id === head,
        slot: rel,                                   /* 옛 이름으로도 부를 수 있게 */
        gen:  x ? gen[id] : 0,
        year: x ? x.y : 9999
      };
    });
  });
  return byId;
}

/* 내보낼 줄을 가족끼리 모아 정렬한다 (사람이 고치기 쉽게) */
function sortForFamilyExport(rows, colMap) {
  const key = m => {
    const c = colMap[m['고유ID']];
    const gu = parseInt(m['구역'] || '9999', 10) || 9999;
    if (!c) return [gu, 'zzz', 9, 9, 9999, String(m['이름'] || '')];
    /* 대표를 그 집 맨 위에 놓는다 — 「누구를 기준으로 읽어야 하는가」가 먼저 보인다 */
    return [gu, c.fid, c.isHead ? 0 : 1, c.gen, c.year, String(m['이름'] || '')];
  };
  return rows.slice().sort((a, b) => {
    const ka = key(a), kb = key(b);
    for (let i = 0; i < ka.length; i++) {
      if (ka[i] < kb[i]) return -1;
      if (ka[i] > kb[i]) return 1;
    }
    return 0;
  });
}

/* 엑셀에서 읽은 가족 칸을 설정으로 되돌린다.

   읽는 칸 (새 이름을 먼저 보고, 없으면 옛 이름을 본다)
     가족코드 (없으면 가족ID)        같은 값끼리 한 집
     대표와의관계 (없으면 집안자리)   그 사람의 자리

   ★ 「대표」라고 적힌 줄이 그 집의 대표다.
     아무도 적지 않았으면 골라 준다 — 관계 칸이 빈 분, 그래도 없으면
     가장 나이 많은 분. 골라 준 분의 관계 칸은 지운다 (대표는 0세대이므로
     '부' 같은 값이 함께 남아 있으면 뜻이 어긋난다).

   ★ 가족 칸이 아예 없으면 손대지 않는다 (옛 엑셀 파일 호환) */
function familyFromRows(rows, prevFam) {
  const has = c => rows.some(o => Object.prototype.hasOwnProperty.call(o, c));
  const idCol  = has(FAM_COL_ID) ? FAM_COL_ID : (has(FAM_COL_OLDID) ? FAM_COL_OLDID : '');
  const hasHeadCol = has(FAM_COL_HEAD);
  if (!idCol && !hasHeadCol) return null;
  /* 관계 칸 — 새 이름이 있으면 대표 기준, 없으면 옛 집안자리 */
  const relCol = has(FAM_COL_REL) ? FAM_COL_REL : (has(FAM_COL_SLOT) ? FAM_COL_SLOT : '');
  const headMode = (relCol === FAM_COL_REL) || hasHeadCol;
  const relOf  = o => relCol ? String(o[relCol] || '').trim() : '';
  const headOf = o => hasHeadCol ? String(o[FAM_COL_HEAD] || '').trim() : '';
  /* 이름 + 동명이인구분 — 대표 칸에 적은 이름과 맞춰 보는 데 쓴다 */
  const fullName = o => nk(o['이름']) + nk(o['동명이인구분'] || '');

  /* ═══ 한 집으로 묶는 기준 (정식 1.14) ═══

     ① 「가족코드」에 값이 있으면 그 값으로 묶는다 (한 주소에 두 가정처럼
        딱 잘라 나눠야 할 때 쓴다. 프로그램이 내보낼 때 자동으로 채운다)
     ② 없으면 ★「대표」 칸에 적은 이름★ 으로 묶는다.
        교회에서 손으로 적으실 때는 이 방법이 훨씬 쉽다 —
        코드를 만들지 않고 그 집 어른 이름만 적으면 된다.
          이름   대표     대표와의관계
          양동훈  양동훈    대표
          김영자  양동훈    아내
          양지훈  양동훈    아들
     ③ 대표 칸도 비어 있으면 예전처럼 집주소로 찾는다.

     ★ 같은 이름의 대표가 두 집에 있으면 주소로 다시 나눈다.
       (그래도 헷갈리면 동명이인구분까지 적어 주시면 정확하다) */
  const groups = {};
  rows.forEach(o => {
    const code = idCol ? String(o[idCol] || '').trim() : '';
    const key = code ? ('c:' + code) : (headOf(o) ? ('h:' + nk(headOf(o))) : '');
    if (!key) return;
    (groups[key] = groups[key] || []).push(o);
  });

  /* 대표 이름으로 묶은 무리 중, 그 이름을 가진 사람이 둘 이상이면 주소로 쪼갠다 */
  Object.keys(groups).forEach(key => {
    if (key.indexOf('h:') !== 0) return;
    const list = groups[key], want = key.slice(2);
    if (list.filter(o => fullName(o) === want || nk(o['이름']) === want).length < 2) return;
    delete groups[key];
    list.forEach(o => {
      const a = normAddr(o['주소']) || 'x';
      const k2 = key + '@' + a;
      (groups[k2] = groups[k2] || []).push(o);
    });
  });

  const g = {}, m = {}, r = {};
  Object.keys(groups).forEach(v => {
    const list = groups[v];
    if (list.length < 2) return;              /* 혼자면 묶지 않는다 (주소 자동 연결을 살려 둔다) */
    const fid = 'f' + hashKey(v).slice(0, 8);
    const yr = o => {
      const d = String(normYm(o['생년월']) || '').replace(/[^0-9]/g, '');
      return d.length >= 4 ? parseInt(d.slice(0, 4), 10) : 9999;
    };
    const oldest = pool => pool.slice().sort((a, b) => {
      const d = yr(a) - yr(b);
      if (d) return d;
      const ax = (a['성별'] === '남') ? 0 : 1, bx = (b['성별'] === '남') ? 0 : 1;
      if (ax !== bx) return ax - bx;
      return String(a['이름'] || '').localeCompare(String(b['이름'] || ''), 'ko');
    })[0];

    /* ── 대표 정하기 ── */
    let headRow = null, autoPicked = false;
    if (headMode) {
      /* ① 「대표」 칸에 적은 이름과 같은 사람 */
      const want = nk(headOf(list.filter(o => headOf(o))[0] || {}));
      if (want) headRow = list.filter(o => fullName(o) === want)[0]
                       || list.filter(o => nk(o['이름']) === want)[0] || null;
      /* ② 「대표와의관계」에 '대표' 라고 적은 사람 */
      if (!headRow) headRow = list.filter(o => relOf(o) === '대표')[0] || null;
      /* ③ 아무 표시도 없으면 골라 준다 */
      if (!headRow) {
        const blanks = list.filter(o => !relOf(o));
        headRow = oldest(blanks.length ? blanks : list);
        autoPicked = true;
      }
    }

    /* 가족 이름 — 대표가 있으면 대표 이름, 없으면 옛 방식(부부 중 최고령) */
    const nameRow = headRow ||
      oldest(list.filter(o => relOf(o) === '부부').length
               ? list.filter(o => relOf(o) === '부부') : list);
    g[fid] = { name: ((nameRow && nameRow['이름']) || v) + ' 가정' };
    if (headRow) g[fid].head = String(headRow['고유ID']);

    list.forEach(o => {
      const id = String(o['고유ID']);
      m[id] = fid;
      const s = relOf(o);
      /* 골라 준 대표에게 남아 있던 관계 값은 버린다 (위 주석 참고) */
      if (autoPicked && headRow && id === String(headRow['고유ID'])) return;
      if (s && s !== '가족') r[id] = s;
    });
  });

  /* ★★ 가족 칸을 아무도 채우지 않았으면 ★손대지 않는다★ (정식 1.14)

     교회가 필수 칸만 채워 올리시는 일이 흔하다. 그때 「가족이 0집」이라고
     저장해 버리면, 그동안 손으로 묶어 둔 가족과 정해 둔 대표가
     ★한 번에 전부 지워진다★. 그래서 빈손으로 왔으면 null 을 돌려주고
     기존 가족 설정을 그대로 둔다. */
  if (!Object.keys(g).length) return null;

  /* ★ 가족코드를 비워 둔 사람을 주소로 붙여 준다 — 실전에서 꼭 필요하다

     교회가 아기를 새로 적어 넣으면서 가족ID 칸을 비워 두는 일이 흔하다.
     그런데 그 집 식구들은 이미 손으로 묶인 상태이므로,
     비워 둔 사람은 주소 자동 연결에서도 빠져 ★가족이 아무도 없게★ 된다.
     그래서 주소가 같은 가족이 딱 하나면 그 가족에 넣어 준다. */
  const addrFid = {};
  rows.forEach(o => {
    const fid = m[o['고유ID']];
    if (!fid) return;
    const a = normAddr(o['주소']);
    if (a.length < 10) return;
    if (addrFid[a] === undefined) addrFid[a] = fid;
    else if (addrFid[a] !== fid) addrFid[a] = null;      /* 한 주소에 두 가족 — 손대지 않는다 */
  });
  let joined = 0;
  rows.forEach(o => {
    if (m[o['고유ID']]) return;
    const a = normAddr(o['주소']);
    if (a.length < 10) return;
    const fid = addrFid[a];
    if (fid) { m[o['고유ID']] = fid; joined++; }
  });

  /* 엑셀에 적히지 않은 사람의 옛 호칭은 남겨 둔다 */
  const prev = normFamily(prevFam);
  Object.keys(prev.r).forEach(id => { if (!(id in r) && !(id in m)) r[id] = prev.r[id]; });

  const out = { g, m, r };
  out.__joined = joined;      /* 주소로 붙여 준 인원 — 화면에 알려 준다 */
  return out;
}

/* 엑셀 제목 줄을 다듬는다 (정식 1.14)

   서식 파일의 제목 줄에는 「★ 이름」, 「고유ID (자동)」처럼
   눈에 잘 보이도록 표시를 붙여 두었다. 사람이 채워야 하는 칸을
   한눈에 알 수 있게 하려는 것이다.
   프로그램은 그 표시를 떼고 원래 칸 이름으로 읽는다.

   교회에서 「휴대폰(본인)」처럼 괄호로 메모를 달아 두셔도 함께 읽힌다. */
function normHeader(k) {
  let s = String(k == null ? '' : k).trim();
  s = s.replace(/^[\u2605\u2606*\u273b\u2022\s]+/, '');          /* 앞의 ★ ☆ * 등 */
  s = s.replace(/\s*[(\uff08][^)\uff09]*[)\uff09]\s*$/, '');      /* 뒤의 (자동) 같은 괄호 */
  return s.trim();
}

async function parseXlsx(file) {
  await loadXlsxLib();
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = () => rej(new Error('파일 읽기 실패'));
    r.onload = e => {
      try {
        const wb = XLSX.read(e.target.result, { type: 'array' });
        const sn = wb.SheetNames.find(n => n.includes('정제')) || wb.SheetNames[0];
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { defval: '' });
        let generated = 0;
        const dupCount = {};
        const data = rows.map(row => {
          const o = {};
          Object.keys(row).forEach(k => {
            const key = normHeader(k);
            /* 엑셀에 제목 없는 빈 칸이 섞여 있으면 __EMPTY 라는 이름으로 들어온다.
               그대로 두면 성도 617명 전원에게 쓸모없는 칸이 하나씩 붙어
               Firestore 용량과 통신량만 잡아먹는다. 그래서 버린다. */
            if (!key || key.indexOf('__EMPTY') === 0) return;
            o[key] = isYmField(key)
              ? normYm(row[k])
              : String(row[k] == null ? '' : row[k]).trim();
          });
          if (!o['이름'] && o['성명']) o['이름'] = o['성명'];
          return o;
        }).filter(o => (o['이름'] || '').length > 0)
          .map(o => {
            if (!o['고유ID']) {
              /* 줄 번호로 만들면 엑셀 정렬이 바뀔 때마다 ID가 밀려서
                 사진이 엉뚱한 사람에게 붙는다. 그래서 이름을 기준으로 만든다. */
              const key = nk(o['이름']) + nk(o['동명이인구분'] || '');
              dupCount[key] = (dupCount[key] || 0) + 1;
              const seq = dupCount[key] > 1 ? '-' + dupCount[key] : '';
              o['고유ID'] = 'N' + hashKey(key) + seq;
              generated++;
            }
            return o;
          });
        data.__idGenerated = generated;
        /* ★ 가족ID·집안자리는 명단 문서에 넣지 않는다.
           가족 설정(church/config.family)에만 담고, 내보낼 때 다시 만든다.
           명단에 두면 성도 전원에게 칸이 하나씩 붙고 값이 두 곳에 생겨
           어느 쪽이 맞는지 헷갈린다. */
        data.__family = familyFromRows(data, null);
        /* 세대 번호는 저장할 때 다시 계산한다 — 엑셀에 남아 있던 옛 값은 버린다 */
        data.forEach(o => {
          delete o[FAM_COL_ID];   delete o[FAM_COL_HEAD]; delete o[FAM_COL_REL];
          delete o[FAM_COL_OLDID]; delete o[FAM_COL_SLOT]; delete o[FAM_GEN_FIELD];
        });
        res(data);
      } catch(err) { rej(err); }
    };
    r.readAsArrayBuffer(file);
  });
}

/* 이름을 짧고 안전한 문자열로 (Firestore 문서 이름에 쓰기 좋게) */
/* ═══════════════════════════════════════════════════════
   년월 값 정리

   엑셀에는 같은 칸이라도 "1969.09"(문자)와 날짜 서식 셀이 섞여 있다.
   날짜 서식 셀은 내부적으로 32558 같은 일련번호로 들어오기 때문에
   그대로 쓰면 화면에 숫자가 그대로 찍힌다.
   어떤 형태로 들어와도 "YYYY.MM"으로 맞춰 준다.
═══════════════════════════════════════════════════════ */
const YM_FIELDS = ['생년월','구원년월'];
const isYmField = k => YM_FIELDS.indexOf(k) >= 0 || String(k).indexOf('년월') >= 0;

function excelSerialToYm(n) {
  const d = new Date(Math.round((n - 25569) * 86400000));
  if (isNaN(d)) return '';
  return d.getUTCFullYear() + '.' + String(d.getUTCMonth() + 1).padStart(2, '0');
}

function normYm(v) {
  if (v == null || v === '') return '';

  if (v instanceof Date && !isNaN(v))
    return v.getFullYear() + '.' + String(v.getMonth() + 1).padStart(2, '0');

  if (typeof v === 'number' && isFinite(v)) {
    if (v > 7000 && v < 75000) return excelSerialToYm(v);       /* 엑셀 날짜 일련번호 */
    if (v >= 1900 && v <= 2200) {                               /* 1969.09 같은 숫자 */
      const y  = Math.floor(v);
      const mm = Math.round((v - y) * 100);
      if (mm >= 1 && mm <= 12) return y + '.' + String(mm).padStart(2, '0');
      return String(y);
    }
    return String(v);
  }

  const t  = String(v).trim();
  if (!t) return '';
  const dg = t.replace(/[^0-9]/g, '');

  /* 문자로 저장된 일련번호 ("32558") */
  if (/^\d{5,6}$/.test(dg) && +dg > 7000 && +dg < 75000 && !/[.\-\/년]/.test(t))
    return excelSerialToYm(+dg);

  const m = t.match(/^(\d{4})\s*[.\-\/년]\s*(\d{1,2})/);
  if (m && +m[2] >= 1 && +m[2] <= 12) return m[1] + '.' + String(+m[2]).padStart(2, '0');
  if (/^\d{4}$/.test(dg)) return dg;
  if (/^\d{6}$/.test(dg) || /^\d{8}$/.test(dg)) {
    const y = dg.slice(0, 4), mo = dg.slice(4, 6);
    if (+mo >= 1 && +mo <= 12) return y + '.' + mo;
  }
  return t;
}

function hashKey(str) {
  let h1 = 0x811c9dc5, h2 = 0x01000193;
  for (let i = 0; i < str.length; i++) {
    const c = str.charCodeAt(i);
    h1 = ((h1 ^ c) * 0x01000193) >>> 0;
    h2 = ((h2 + c) * 0x85ebca6b) >>> 0;
  }
  return (h1.toString(36) + h2.toString(36)).slice(0, 12);
}

function nk(s) {
  let t = String(s == null ? '' : s);
  try { t = t.normalize('NFC'); } catch(e) {}
  return t.replace(/\s+/g, '').trim();
}

function nameFromFile(filename) {
  let n = nk(filename).replace(/\.[^.]+$/, '');
  n = n.replace(/^\d+[._\-)]\s*/, '');
  n = n.replace(/[(（]\s*\d+\s*[)）]$/, '');
  n = n.replace(/[-_ ]?(사본|복사본|copy|Copy|COPY)\d*$/, '');
  n = n.replace(/[-_]\d+$/, '');
  return n.trim();
}

function matchFilename(filename, members) {
  const name = nameFromFile(filename);
  if (!name) return [];

  const nm  = m => nk(m['이름']);
  const nmf = m => nk(m['이름']) + nk(m['동명이인구분']);

  let r = members.filter(m => nmf(m) === name);
  if (r.length) return r;

  r = members.filter(m => nm(m) === name);
  if (r.length) return r;

  const core = name.replace(/[A-Za-z0-9]+$/, '');
  if (core && core !== name) {
    r = members.filter(m => nm(m) === core);
    if (r.length) return r;
  }

  const kor = name.replace(/[^가-힣]/g, '');
  if (kor && kor !== name) {
    r = members.filter(m => nm(m) === kor);
    if (r.length) return r;
  }

  return [];
}

function preflight(files, members) {
  const ok = [], dup = [], no = [];
  files.forEach(f => {
    const mt = matchFilename(f.name, members);
    if (mt.length === 1)      ok.push(f);
    else if (mt.length > 1)   dup.push(f);
    else                      no.push(f);
  });
  return { ok, dup, no };
}

/* 옛 무리 상수 — 1.04에서 FAM_BANDS 로 옮겼다. 남겨 두면 헷갈리므로 지웠다. */
const normAddr = a => (a || '').replace(/\s+/g, '').replace(/[()（）]/g, '').toLowerCase();

/* 이 성도의 가족.
   ★ 안내실이 직접 묶어 둔 가족이 있으면 그것이 전부다 (주소는 보지 않는다).
     주소로 잘못 묶인 분을 빼려면 손으로 묶는 수밖에 없기 때문이다.
   ★ 손으로 묶지 않았으면 예전처럼 집주소로 찾는다.
     다만 다른 가족으로 지정된 분은 빼 준다. */
function getFamilyGroup(me, all, fam) {
  const f = normFamily(fam);
  const myFid = f.m[me['고유ID']];
  if (myFid) {
    return all.filter(m => m['고유ID'] !== me['고유ID'] && f.m[m['고유ID']] === myFid);
  }
  const addr = normAddr(me['주소']);
  if (addr.length < 10) return [];
  return all.filter(m => m['고유ID'] !== me['고유ID'] &&
                         normAddr(m['주소']) === addr &&
                         !f.m[m['고유ID']]);
}

/* ═══════════════════════════════════════════════════════════════════
   집안 자리 — 안내실이 손으로 정하는 값 (1.05에서 뜻이 달라졌다)

   ★ 1.04까지 무엇이 문제였나
   호칭을 ★사람마다 한 개★ 로 저장했다. 그래서 김덕현을 '남편' 으로
   적어 두면 ★자녀에게도 '남편'★ 이라고 떴다. 보는 사람이 누구든
   같은 말이 나오기 때문이다.

   ★ 어떻게 고쳤나
   저장한 값을 「이 사람은 집안에서 어느 자리인가」로 읽고,
   화면에 뿌릴 호칭은 ★보는 사람과의 세대 차이로 그때그때 만든다★.
   그래서 부부로 정해 두면 자녀에게는 저절로 부·모로 나온다.

   세대 0 = 어른(부부) 세대. 음수는 위, 양수는 아래.
   계통 = 직계 · 인척(며느리·사위) · 방계(삼촌·조카) · 형제
═══════════════════════════════════════════════════════════════════ */
const ROLE_SLOT = {
  /* ★ 대표 — 이 집안 관계의 기준이 되는 사람 (정식 1.13) */
  '대표':[0,'직계'],
  /* 골라 넣는 새 이름 */
  '부부':[0,'직계'],  '부모':[0,'직계'],  '형제자매':[0,'형제'],
  '삼촌·이모·고모':[0,'방계'],
  '조부모':[-1,'직계'], '증조부모':[-2,'직계'],
  '자녀':[1,'직계'],  '며느리·사위':[1,'인척'], '조카':[1,'방계'],
  '손자녀':[2,'직계'],
  /* 1.04까지 적어 두신 옛 값 — 그대로 읽어 세대로 옮긴다 */
  '남편':[0,'직계'], '아내':[0,'직계'], '부':[0,'직계'], '모':[0,'직계'],
  '형':[0,'형제'], '누나':[0,'형제'], '오빠':[0,'형제'], '언니':[0,'형제'],
  '남동생':[0,'형제'], '여동생':[0,'형제'], '형제':[0,'형제'], '자매':[0,'형제'],
  '삼촌':[0,'방계'], '이모':[0,'방계'], '고모':[0,'방계'],
  '조부':[-1,'직계'], '조모':[-1,'직계'],
  '증조부':[-2,'직계'], '증조모':[-2,'직계'],
  '시부':[-1,'인척'], '시모':[-1,'인척'], '장인':[-1,'인척'], '장모':[-1,'인척'],
  '아들':[1,'직계'], '딸':[1,'직계'],
  '사위':[1,'인척'], '며느리':[1,'인척'],
  '손자':[2,'직계'], '손녀':[2,'직계'], '손주':[2,'직계']
};

/* ═══════════════════════════════════════════════════════════════════
   대표 기준 관계 (정식 1.13)

   ★ 왜 대표를 두는가
   1.12까지는 적어 둔 자리 이름이 「어른(부부) 세대」를 기준으로 한 것이었다.
   그런데 그 기준은 프로그램이 나이로 ★짐작한★ 자리였다. 그래서
     · 적어 둔 세대 폭이 짐작한 폭보다 넓으면 못 박지 못하고 (manualSpan 검사)
     · 가운데값으로 전체를 어림잡아 옮겨야 했고 (median shift)
     · 「누구를 기준으로 조모인가」가 자료에 남지 않았다.

   대표를 사람으로 못 박으면 그 셋이 한꺼번에 사라진다.
     대표 = 0세대.  적어 둔 관계는 대표에게서 본 자리 그대로.
   엑셀에서도 「대표」와 「대표와의관계」 두 칸만 보면 뜻이 분명하다.

   저장 형태 : family.g[fid].head = 대표의 고유ID
═══════════════════════════════════════════════════════════════════ */
function storedHead(group, f) {
  for (let i = 0; i < (group || []).length; i++) {
    const fid = f.m[group[i]['고유ID']];
    if (fid && f.g[fid] && f.g[fid].head) return String(f.g[fid].head);
  }
  return '';
}

/* 대표에게서 본 위·아래 — 나이를 모를 때 형·동생을 가늠하는 데 쓴다 */
const SIB_ORDER = { '형':-1, '누나':-1, '오빠':-1, '언니':-1,
                    '남동생':1, '여동생':1, '동생':1 };

/* ═══════════════════════════════════════════════════════════════════
   대표와의 관계 → [세대 차이, 계통]        (정식 1.13)

   ★ ROLE_SLOT 과 왜 따로 두는가 — 기준이 다르다
   ROLE_SLOT 은 「집안 자리」표다. 기준이 ★어른(부부) 세대★ 이므로
     조모 = 부부의 어머니 = −1,   부 = 부부 본인 = 0,   손자 = 부부의 손자 = +2
   이 표는 「대표와의 관계」표다. 기준이 ★대표 본인★ 이므로
     조모 = 대표의 할머니 = −2,   부 = 대표의 아버지 = −1,  손자 = 대표의 손자 = +2

   두 표를 하나로 합치면 조모가 −1인지 −2인지 알 수 없다.
   대표가 정해진 집안은 이 표를, 정해지지 않은 옛 집안은 ROLE_SLOT 을 쓴다.
═══════════════════════════════════════════════════════════════════ */
const HEAD_SLOT = {
  '대표':[0,'직계'],
  /* 같은 세대 */
  '남편':[0,'직계'], '아내':[0,'직계'], '배우자':[0,'직계'], '부부':[0,'직계'],
  '형':[0,'형제'], '누나':[0,'형제'], '오빠':[0,'형제'], '언니':[0,'형제'],
  '남동생':[0,'형제'], '여동생':[0,'형제'], '동생':[0,'형제'],
  '형제':[0,'형제'], '자매':[0,'형제'], '형제자매':[0,'형제'],
  /* 한 세대 위 */
  '부':[-1,'직계'], '모':[-1,'직계'], '부모':[-1,'직계'],
  '시부':[-1,'인척'], '시모':[-1,'인척'], '장인':[-1,'인척'], '장모':[-1,'인척'],
  '삼촌':[-1,'방계'], '이모':[-1,'방계'], '고모':[-1,'방계'], '삼촌·이모·고모':[-1,'방계'],
  /* 두·세 세대 위 */
  '조부':[-2,'직계'], '조모':[-2,'직계'], '조부모':[-2,'직계'],
  '증조부':[-3,'직계'], '증조모':[-3,'직계'], '증조부모':[-3,'직계'],
  /* 한 세대 아래 */
  '아들':[1,'직계'], '딸':[1,'직계'], '자녀':[1,'직계'],
  '며느리':[1,'인척'], '사위':[1,'인척'], '며느리·사위':[1,'인척'],
  '조카':[1,'방계'],
  /* 두·세 세대 아래 */
  '손자':[2,'직계'], '손녀':[2,'직계'], '손주':[2,'직계'], '손자녀':[2,'직계'],
  '증손자':[3,'직계'], '증손녀':[3,'직계'], '증손주':[3,'직계'], '증손자녀':[3,'직계']
};

/* 이 말이 우리가 아는 관계 이름인가 (어느 표에든 있으면 그렇다).
   여기 없는 말(안내실이 직접 적은 '외조모' 등)은 그대로 화면에 보여 준다. */
function isKnownRel(lab) { return !!(lab && (HEAD_SLOT[lab] || ROLE_SLOT[lab])); }

/* 대표가 있으면 대표 기준 표, 없으면 옛 집안 자리 표 */
function slotFor(lab, headId) {
  if (!lab) return null;
  return (headId ? HEAD_SLOT[lab] : ROLE_SLOT[lab]) || null;
}

/* 안내실이 고르는 「대표와의 관계」 — 세대 순으로 놓는다 */
const SLOT_PRESETS = [
  '증조부','증조모','조부','조모','부','모','시부','시모','장인','장모',
  '남편','아내','형','누나','오빠','언니','남동생','여동생',
  '삼촌','이모','고모','아들','딸','며느리','사위','조카','손자','손녀'
];

/* 세대·계통 → 엑셀에 적는 집안 자리 이름 */
function slotName(g, kind) {
  if (g === 0)  return kind === '형제' ? '형제자매' : kind === '방계' ? '삼촌·이모·고모' : '부부';
  if (g === 1)  return kind === '인척' ? '며느리·사위' : kind === '방계' ? '조카' : '자녀';
  if (g === -1) return kind === '인척' ? '조부모' : '조부모';
  if (g === -2) return '증조부모';
  if (g === 2)  return '손자녀';
  if (g >= 3)   return '증손자녀';
  return '';
}

/* ═══════════════════════════════════════════════════════════════════
   가족 호칭 판정 (1.04에서 기준을 다시 잡고, 1.05에서 세대 기반으로)

   네 가지 단서를 겹쳐 쓴다
   ① 무리(소속·세대구분)  어린이 / 청년 / 장년 / 노년
   ② 생년월              세대 사이 18년 이상 차이로 갈라 놓는다
   ③ 성씨                형제는 성이 같고 부부는 대개 다르다
   ④ 집안 구성            아래 세대가 있으면 그 위는 부모(=부부)다

   그리고 안내실이 정한 집안 자리가 있으면 ★그것이 먼저다★.

   ★ 확신이 없으면 '가족' 이라고만 한다.
     안내실 [가족] 탭 → [호칭 점검] 이 그런 집만 골라 준다.
═══════════════════════════════════════════════════════════════════ */

/* 무리 — 교회마다 소속 이름이 다르므로 설정에서 가져온다 */
const FAM_BANDS = (function() {
  const d = (typeof CHURCH_CFG !== 'undefined' && CHURCH_CFG.bands) || {};
  const g = (k, dflt) => (d[k] && d[k].length) ? d[k].slice() : dflt;
  return {
    kid:    { so:g('kid',    ['유아','유치부','유년부','초등부','중등부','고등부']), lo:0,  hi:22,  est:10 },
    ya:     { so:g('ya',     ['청년회','대학부']),                                   lo:15, hi:45,  est:27 },
    senior: { so:g('senior', ['은장회','은빛장년회']),                               lo:50, hi:110, est:75 },
    adult:  { so:g('adult',  ['봉사회','어머니회']),                                 lo:20, hi:95,  est:50 }
  };
})();
const BAND_ORDER = ['kid','ya','senior','adult'];

function bandFromSe(se) {
  const t = String(se || '');
  if (/어린이|청소년|아동|유아/.test(t)) return 'kid';
  if (/청년|대학/.test(t))               return 'ya';
  if (/노년|은빛|은장/.test(t))          return 'senior';
  if (/장년|성인/.test(t))               return 'adult';
  return '';
}

/* ═══════════════════════════════════════════════════════
   집계표의 세 무리 — 성인 · 교회학교 · 영유아 (정식 1.16)

   교회에서 쓰시는 집계 서식이 이 셋으로 갈라져 있다.
   무엇이 어느 무리인지는 ★교회 설정★ 에서 가져온다.
     영유아   부서 설정의 영유아부(d_baby)에 적힌 소속 — 기본 「유아」
     교회학교 어린이 무리(bands.kid)에서 영유아를 뺀 것
     성인     나머지 전부 (봉사회·어머니회·은장회·청년회…)
   그래서 다른 교회에 드려도 그 교회 소속 이름 그대로 집계된다.
═══════════════════════════════════════════════════════ */
const TAL_BABY_SO = (function() {
  const d = DEPT_DEFS.filter(x => x.id === 'd_baby' || /영유아|영아/.test(x.name))[0];
  return (d && d.so.length) ? d.so.slice() : ['유아'];
})();
const TAL_SCHOOL_SO = FAM_BANDS.kid.so.filter(x => TAL_BABY_SO.indexOf(x) < 0);
const TAL_BANDS = [
  { key:'adult',  label:'성인',   icon:'users' },
  { key:'school', label:'교회학교', icon:'school' },
  { key:'baby',   label:'영유아',  icon:'mood-kid', exempt:true }
];
/* ═══════════════════════════════════════════════════════
   영아 · 유아 · 영유아는 출석상태를 매기지 않는다
   (사용자 결정 2026-09-12)

   ★ 왜
   품에 안겨 오시는 아기에게 「출석A·출석B·미출석」 을 나누는 것은
   뜻이 없다. 교회 집계 서식에서도 영유아는 A·B 로 쪼개지 않고
   인원수 한 칸으로만 적는다.

   ★ 무엇이 달라지나
   · 출석상태 고치는 칸에 ★상태 단추가 나오지 않는다★ (표식은 그대로 쓴다 —
     전입·전출·구원은 아기에게도 생기는 일이다)
   · 출석A·출석B·미출석 어느 숫자에도 들어가지 않는다
   · 집계에서는 「영유아」 칸에 ★전원★ 이 들어가고, 총출석인원에 함께 잡힌다
     (그래서 등록인원 = 총출석인원 + 미출석 이 그대로 맞는다)
   · 주일 참석율에서는 늘 대상이다 — 주일마다 함께 나오시기 때문이다
     (1.16부터 영유아는 자기 구역 명단에서 체크한다)

   교회 설정의 영유아부 소속(TAL_BABY_SO)과, 이름이 「영아·유아·영유아」로
   시작하는 소속을 함께 본다. 유년부·유치부는 걸리지 않는다. */
const ATT_EXEMPT_RE = /^(영아|유아|영유아)/;
function isAttExempt(m) {
  const so = String((m && m['소속']) || '').trim();
  if (!so) return false;
  if (TAL_BABY_SO.indexOf(so) >= 0) return true;
  return ATT_EXEMPT_RE.test(so);
}

function talBand(m) {
  if (isAttExempt(m)) return 'baby';
  const so = String((m && m['소속']) || '').trim();
  if (TAL_SCHOOL_SO.indexOf(so) >= 0) return 'school';
  return 'adult';
}

/* 한 무리를 훑어 집계 한 벌을 만든다 (출석표 [집계] 탭이 쓴다) */
function tallyAtt(list, attStatus) {
  const band = () => ({ ab:0, a:0, b:0, so:{} });
  const r = {
    adult:band(), school:band(), baby:band(),
    absent:0, attended:0, registered:0,
    marks:{ '전입':0, '전출':0, '구원':0 }
  };
  (list || []).forEach(m => {
    const f  = effAttFull(m, attStatus);
    const bd = r[talBand(m)];
    const so = String(m['소속'] || '').trim() || '미지정';
    r.registered++;
    f.marks.forEach(k => { r.marks[k]++; });
    if (!bd.so[so]) bd.so[so] = { a:0, b:0, ab:0 };
    /* ★ 영유아 — 출석상태를 매기지 않으므로 전원이 출석 쪽에 들어간다 */
    if (isAttExempt(m)) { r.attended++; bd.ab++; bd.so[so].ab++; return; }
    if (f.state === '미출석') { r.absent++; return; }
    r.attended++;
    bd.ab++;
    if (f.state === '출석A') bd.a++; else bd.b++;
    bd.so[so].ab++;
    if (f.state === '출석A') bd.so[so].a++; else bd.so[so].b++;
  });
  return r;
}

function famBand(m) {
  const so = String((m && m['소속']) || '').trim();
  for (const k of BAND_ORDER) if (FAM_BANDS[k].so.indexOf(so) >= 0) return k;
  return bandFromSe(m && m['세대구분']) || 'adult';   /* 모르면 어른 — 자녀로 잘못 부르지 않게 */
}

/* 생년월 → 태어난 해. 무리와 어긋나면 버린다 (기본값·오타 방어) */
function famBirthYear(m, band) {
  const d = String(normYm(m && m['생년월']) || '').replace(/[^0-9]/g, '');
  if (d.length < 4) return null;
  const y = parseInt(d.slice(0, 4), 10);
  const now = new Date().getFullYear();
  if (!(y >= 1900 && y <= now)) return null;
  const age = now - y, b = FAM_BANDS[band];
  return (age >= b.lo && age <= b.hi) ? y : null;
}

const SURNAME2 = ['남궁','선우','제갈','황보','사공','서문','독고','동방'];
function surnameOf(name) {
  const n = String(name || '').replace(/[^가-힣]/g, '');
  if (n.length >= 3 && SURNAME2.indexOf(n.slice(0, 2)) >= 0) return n.slice(0, 2);
  return n.slice(0, 1);
}

const FAM_GEN_GAP = 18;   /* 부모와 자녀 사이 최소 나이차 */

/* 집안 사람들에게 세대 번호를 매긴다.
   ★ fam 을 넘기면 안내실이 정한 자리가 우선한다. */
function buildGenMap(group, fam) {
  const now = new Date().getFullYear();
  const f = normFamily(fam);
  /* ★ 대표가 있으면 적어 둔 말을 「대표 기준」으로 읽는다 (HEAD_SLOT 주석 참고) */
  const headId0 = storedHead(group, f);
  const P = group.map(p => {
    const b = famBand(p);
    const y = famBirthYear(p, b);
    const lab = f.r[p['고유ID']];
    const slot = slotFor(lab, headId0);
    return { id:p['고유ID'], p, b, real:y !== null, y: y !== null ? y : now - FAM_BANDS[b].est,
             slot, kind: slot ? slot[1] : '직계' };
  });
  if (!P.length) return { gen:{}, info:{}, anyManual:false };

  /* ★ 명단에 세대 번호가 실려 있으면 그것을 쓴다 (1.11)
     성도 화면에는 생년월이 없어 나이로 세대를 나눌 수 없다.
     안내실이 저장할 때 계산해 넣은 번호를 그대로 쓰면
     성도가 보는 호칭이 안내실이 보는 것과 같아진다.
     ★ 집안 사람 전원에게 있을 때만 쓴다 — 한 사람이라도 빠져 있으면
       (새로 넣은 성도 등) 예전처럼 계산한다. */
  const headId = headId0;

  const pre = P.map(x => parseInt(x.p[FAM_GEN_FIELD], 10));
  if (pre.every(v => !isNaN(v))) {
    P.forEach((x, i) => { x.g = pre[i]; });
    return finishGenMap(P, f, headId);
  }

  P.sort((a, c) => a.y - c.y);
  let g = 0, last = P[0].y;
  P.forEach(x => { if (x.y - last >= FAM_GEN_GAP) g++; x.g = g; last = x.y; });

  /* ① 어린이는 어른·노년과 같은 세대일 수 없다 — 무리가 알려 주는 사실.
     생년월이 기본값(2000 등)으로 들어와 있으면 나이만으로는 갈라지지 않는다. */
  Array.from(new Set(P.map(x => x.g))).sort((a,c)=>a-c).forEach(gi => {
    const mem = P.filter(x => x.g === gi);
    if (mem.some(x => x.b === 'kid') && mem.some(x => x.b === 'adult' || x.b === 'senior')) {
      P.forEach(x => { if (x.g > gi || (x.g === gi && x.b === 'kid')) x.g++; });
    }
  });

  const pack = () => {
    const o = {};
    Array.from(new Set(P.map(x => x.g))).sort((a,c)=>a-c).forEach((v,i) => { o[v] = i; });
    P.forEach(x => { x.g = o[x.g]; });
  };
  pack();

  /* ★ 이웃한 두 세대의 나이 차이가 너무 크면 사이에 빈 세대를 넣는다 (1.08)

     예전에는 18년 이상 벌어지면 무조건 ★한 단계★ 로만 세었다.
     그래서 부모가 집에 없는 ★조모(74세)와 손자(22세)★ 가 한 단계로 붙어
     아들·모 로 떴다. 52년 차이는 한 세대가 아니라 두 세대다.

       18~44년 → 한 세대   45~69년 → 두 세대   70년 이상 → 세 세대

     ★ 왜 pack() 뒤에 하나
       pack() 은 존재하는 세대 번호를 0,1,2… 로 촘촘히 붙인다.
       나이 차이로 미리 벌려 놓으면 pack() 이 그 빈 칸을 없애 버린다.
       그래서 번호를 정리한 ★뒤에★ 벌린다.

     ★ 양쪽 생년월을 모두 믿을 수 있을 때만 벌린다
       유아인데 1920년생, 은장회인데 2000년생처럼 기본값이 들어와 있으면
       무리의 대표 나이로 갈음한 값이다. 그 값으로 세대를 늘리면
       실제로는 모자(母子)인 분들이 조모·손자로 떠 버린다.
       (군산교회 610명 중 55명이 그런 값이었다) */
  const spread = () => {
    const lv = Array.from(new Set(P.map(x => x.g))).sort((a,c)=>a-c);
    for (let i = 1; i < lv.length; i++) {
      const up = P.filter(x => x.g === lv[i-1]);
      const dn = P.filter(x => x.g === lv[i]);
      /* 위 세대에서 가장 어린 사람 ↔ 아래 세대에서 가장 나이 많은 사람 */
      let a = up[0], b = dn[0];
      up.forEach(x => { if (x.y > a.y) a = x; });
      dn.forEach(x => { if (x.y < b.y) b = x; });
      if (!a.real || !b.real) continue;
      const gap = b.y - a.y;
      const extra = gap >= 70 ? 2 : gap >= 45 ? 1 : 0;
      if (extra > 0) P.forEach(x => { if (x.g >= lv[i]) x.g += extra; });
    }
  };
  spread();

  /* ② 배우자 합치기 — 아버지와 아이들의 성이 같은데 그 사이 세대에
     성이 다른 어른이 혼자 있으면, 그 사람은 자녀가 아니라 배우자다.
     (예: 차경식(차)-오수영(오)-차은찬·차은혜(차) → 오수영은 아내) */
  for (let round = 0; round < 3; round++) {
    const gens = Array.from(new Set(P.map(x => x.g))).sort((a,c)=>a-c);
    let moved = false;
    for (let i = 0; i < gens.length - 1; i++) {
      const A = P.filter(x => x.g === gens[i]);
      const B = P.filter(x => x.g === gens[i+1]);
      if (A.length !== 1 || B.length !== 1) continue;
      const y = A[0], x = B[0];
      if ((y.p['성별'] || '') !== '남') continue;
      if (x.b !== 'adult' && x.b !== 'senior') continue;
      if ((x.p['성별'] || '') === '남') continue;
      if (surnameOf(y.p['이름']) === surnameOf(x.p['이름'])) continue;
      const below = P.filter(z => z.g > gens[i+1]);
      if (!below.length) continue;
      const cnt = {};
      below.forEach(z => { const s = surnameOf(z.p['이름']); cnt[s] = (cnt[s]||0)+1; });
      let dom = '', best = 0;
      Object.keys(cnt).forEach(s => { if (cnt[s] > best) { best = cnt[s]; dom = s; } });
      if (dom !== surnameOf(y.p['이름'])) continue;
      x.g = y.g; moved = true;
    }
    if (!moved) break;
    pack();
  }

  /* ③ 어른(부부) 세대를 0으로 잡는다.
     세대가 셋 이상이면 가운데, 둘이면 사람이 많은 쪽, 하나면 그 세대. */
  const gens = Array.from(new Set(P.map(x => x.g))).sort((a,c)=>a-c);
  let base = 0;
  if (gens.length >= 3) base = gens[1];
  else if (gens.length === 2) {
    const n0 = P.filter(x => x.g === gens[0]).length;
    const n1 = P.filter(x => x.g === gens[1]).length;
    base = n1 > n0 ? gens[1] : gens[0];
  }
  P.forEach(x => { x.g -= base; });

  /* ④ ★안내실이 정한 자리가 있으면 그것에 맞춘다★
     적어 두신 자리와 프로그램이 계산한 세대의 차이를 구해
     전체를 그만큼 옮기고, 적어 두신 분은 정확히 그 자리로 못 박는다.
     ★ 대표가 정해져 있으면 그런 어림이 필요 없다 (finishGenMap 참고). */
  return finishGenMap(P, f, headId);
}

/* 안내실이 정한 집안 자리를 얹고 세대 지도를 마무리한다.
   (실려 온 세대를 쓰는 경우와 직접 계산한 경우가 함께 쓴다) */
function finishGenMap(P, f, headId) {
  /* ═══ 대표가 정해진 집안 (정식 1.13) ═══
     적어 둔 관계는 「대표에게서 본 자리」다. 기준이 사람으로 못 박혀 있으므로
     가운데값을 구하거나 세대 폭을 견줄 필요가 없다.
       ① 대표를 0세대로 옮긴다
       ② 관계가 적힌 사람은 그 자리로 그대로 못 박는다
       ③ 적히지 않은 사람은 나이·무리로 잡은 자리를 그대로 쓴다 */
  const head = headId ? P.filter(x => x.id === headId)[0] : null;
  if (head) {
    const shift = -head.g;
    P.forEach(x => { x.g += shift; });
    P.forEach(x => { if (x.slot && x.id !== headId) x.g = x.slot[0]; });
    head.g = 0;
    const hgen = {}, hinfo = {};
    P.forEach(x => { hgen[x.id] = x.g; hinfo[x.id] = x; });
    return { gen:hgen, info:hinfo, anyManual: P.some(x => !!x.slot) };
  }

  /* ═══ 대표가 없는 집안 — 예전 방식 (1.05~1.12) ═══ */
  const fixed = P.filter(x => x.slot);
  let anyManual = fixed.length > 0;
  if (anyManual) {
    const offs = fixed.map(x => x.slot[0] - x.g).sort((a,c)=>a-c);
    const shift = offs[Math.floor(offs.length / 2)];          /* 가운데 값 */
    P.forEach(x => { x.g += shift; });

    /* ★ 적어 두신 자리는 사람을 ★모으는 쪽★ 으로만 쓴다 (1.08)

       적어 두신 자리 이름은 「어른(부부) 세대」를 기준으로 한 것이다.
         조부모 = 부부의 부모 (한 칸 위)   손자녀 = 부부의 손자 (두 칸 아래)
       그래서 부모가 집에 없는 조모·손자 두 분만 사는 집에
       「조부모」와 「손자녀」를 적으면 세 칸이 벌어져 ★증조모★ 가 된다.
       사람은 「할머니와 손자」라고 적었을 뿐인데 뜻이 달라지는 것이다.

       그래서 이렇게 정했다.
       · 적어 두신 간격이 나이로 계산한 간격보다 ★좁거나 같으면★ 그대로 쓴다
         (잘못 갈라진 부부를 「부부」로 모으는 일이 여기 해당한다)
       · 나이보다 더 ★벌어지면★ 못 박지 않고 나이 계산을 그대로 쓴다
         (조부모+손자녀처럼 기준이 어긋난 경우다) */
    const gs = fixed.map(x => x.g),     ss = fixed.map(x => x.slot[0]);
    const autoSpan   = Math.max.apply(null, gs) - Math.min.apply(null, gs);
    const manualSpan = Math.max.apply(null, ss) - Math.min.apply(null, ss);
    if (manualSpan <= autoSpan) fixed.forEach(x => { x.g = x.slot[0]; });
  }

  const gen = {}, info = {};
  P.forEach(x => { gen[x.id] = x.g; info[x.id] = x; });
  return { gen, info, anyManual };
}

/* 화면에 뿌릴 호칭.
   ★ 안내실이 적어 둔 값도 「자리」로만 쓰고, 말은 보는 사람에 맞춰 만든다.
     표에 없는 말(직접 적은 '외조모' 같은 것)은 그대로 보여 준다. */
function getRelLabel(me, other, fam, group) {
  const f = normFamily(fam);
  const lab = f.r[other && other['고유ID']];
  if (lab && !isKnownRel(lab)) return lab;
  /* ★ 대표 화면에서는 적어 둔 관계를 그대로 쓴다 (정식 1.13)
     「대표와의관계」에 적힌 말이 곧 대표가 볼 호칭이다.
     세대 차이로 다시 만들면 형·남동생 같은 위아래가 뭉개진다. */
  const headId = storedHead(group || [me, other], f);
  if (headId && me && me['고유ID'] === headId && lab && lab !== '대표') return lab;
  return guessRelLabel(me, other, group, fam);
}

function guessRelLabel(me, other, group, fam) {
  if (!group || !group.length) group = [me, other];
  const f = normFamily(fam);
  const headId = storedHead(group, f);
  const { gen, info } = buildGenMap(group, fam);
  const mid = me['고유ID'], oid = other['고유ID'];
  if (gen[mid] === undefined || gen[oid] === undefined) return '가족';

  const d  = gen[oid] - gen[mid];
  const ox = other['성별'] || '', mx = me['성별'] || '';
  const mi = info[mid], oi = info[oid];
  const ok = oi.kind;                       /* 상대의 계통 */

  if (d === 0) {
    const gm      = gen[mid];
    const sameGen = Object.keys(gen).filter(k => gen[k] === gm);
    const below   = Object.keys(gen).some(k => gen[k] > gm);
    const grown   = mi.b !== 'kid' && oi.b !== 'kid';
    const sameSur = surnameOf(me['이름']) === surnameOf(other['이름']);
    const diffSex = !!(ox && mx && ox !== mx);

    /* ★★ 부부 판정 (정식 1.13에서 다시 잡았다) ★★

       ★ 1.12까지 무엇이 잘못됐나
       「둘 중 아무에게라도 자리가 적혀 있으면」 부부 쪽으로 기울었다.
       그런데 엑셀 백업을 내려받아 그대로 다시 올리면 ★전원에게★
       자리가 적힌다. 그 순간, 남녀 자녀 둘만 있는 집은 그 둘이 서로를
       ★부부★ 로 보게 됐다. (양동훈 가정이 그런 경우였다)

       ★ 어떻게 고쳤나
       적어 둔 값을 부부의 근거로 쓸 때는 그 말이 정말 ★배우자 자리★
       인지 따진다. '아들'·'딸'(한 세대 아래)이나 '형'·'여동생'(형제)은
       근거가 되지 못한다. 그리고 적어 둔 것이 있으면 ★사람 수를 세지 않는다★ —
       대표의 형이 함께 살아 같은 세대가 세 사람이어도 대표와 아내는 부부다. */

    /* 같은 세대에서 조건에 맞는 사람 수 */
    const nGen  = fn => sameGen.filter(k => fn(info[k])).length;
    const sexOf = x => String((x.p && x.p['성별']) || '');

    /* ★ 적어 둔 관계가 「부부 한 쌍」이 될 수 있는 자리인가
         대표와 같은 세대이거나 ★위 세대★ 여야 한다.

       ★ 왜 위 세대만인가 — 조상은 한 쌍, 자손은 여럿이기 때문이다.
         부 + 모        → 한 쌍이니 부부다
         조부 + 조모    → 한 쌍이니 부부다
         대표 + 아내    → 부부다
         아들 + 딸      → 남매다 (자손은 여러 명이므로)
         손자 + 손녀    → 남매다
         며느리 + 사위  → 남매의 배우자들이므로 부부가 아니다
       1.12까지는 세대를 따지지 않아 아들·딸이 부부로 떴다 (양동훈 가정). */
    const wedLine = x => !!(x.slot && (x.slot[1] === '직계' || x.slot[1] === '인척')
                                   && x.slot[0] <= 0);

    if (grown && diffSex) {
      /* ① 둘 다 적혀 있고, 같은 계통 · 같은 세대 · 대표와 같거나 위 → 부부 */
      if (wedLine(mi) && wedLine(oi) && mi.kind === ok && mi.slot[0] === oi.slot[0])
        return ox === '남' ? '남편' : '아내';

      /* ② 한쪽만 적혀 있고(대표만 적은 경우), 짝이 될 빈칸이 상대 한 사람뿐이다 */
      const only = sex => nGen(x => !x.slot && x.kind === '직계' && sexOf(x) === sex) === 1;
      if ((wedLine(mi) && !oi.slot && only(ox)) ||
          (wedLine(oi) && !mi.slot && only(mx)))
        return ox === '남' ? '남편' : '아내';

      /* ③ 직계 ↔ 인척 — 혼인으로 들어온 분과 그 배우자 (아들과 며느리).
           그 세대에서 짝이 될 직계가 ★한 사람뿐★ 일 때만.
           아들이 둘인데 며느리가 한 분이면 누구의 아내인지 알 수 없다. */
      const inlaw = (mi.kind === '인척' && ok === '직계') ? mi
                  : (ok === '인척' && mi.kind === '직계') ? oi : null;
      if (inlaw && nGen(x => x.kind === '직계' && sexOf(x) === (inlaw === mi ? ox : mx)) === 1)
        return ox === '남' ? '남편' : '아내';

      /* ④ 아무것도 적혀 있지 않을 때의 짐작 (1.12까지의 규칙 그대로) */
      if (!mi.slot && !oi.slot && sameGen.length === 2 &&
          mi.kind === '직계' && ok === '직계' && (below || !sameSur))
        return ox === '남' ? '남편' : '아내';

      /* ⑤ 안전망 — 아래 세대의 부부.
           같은 세대에 단둘, 성이 다르고, 한쪽만 관계가 적혀 있으면 부부다.
           (대표를 할머니로 잡아 며느리 칸이 비었을 때가 이런 경우다)
         ★ 둘 다 적혀 있으면 건드리지 않는다 — 아들·딸이 부부로 뒤바뀌지 않게. */
      if (sameGen.length === 2 && !sameSur &&
          ((mi.slot && mi.kind === '직계' && !oi.slot) ||
           (oi.slot && ok === '직계' && !mi.slot)))
        return ox === '남' ? '남편' : '아내';
    }

    /* ★ 형제 판정 — 「대표의 형」과 「대표의 아내」는 남매가 아니다 (정식 1.13)
         적어 둔 관계가 형제 계통이라도, 상대가 혼인으로 들어온 분이면
         성이 다르다. 그때는 형·오빠라고 부르면 안 된다. */
    const sibs = (mi.kind === '형제' && ok === '형제')                        /* 둘 다 대표의 형제 */
              || ((mi.kind === '형제' || ok === '형제') && sameSur)           /* 한쪽이 대표 — 성이 같아야 */
              || (sameSur && mi.kind === '직계' && ok === '직계');            /* 적힌 것 없는 같은 성 */
    if (sibs) {
      let up = null;                 /* 상대가 나보다 위(-1) 인가 아래(1) 인가 */
      if (mi.real && oi.real && mi.y !== oi.y) up = oi.y < mi.y ? -1 : 1;
      else {
        /* ★ 나이를 모르면 「대표와의관계」에 적힌 위아래로 가늠한다 (정식 1.13)
             성도 화면에는 생년월이 오지 않아 형·동생을 가릴 수 없었다.
             대표의 형 / 대표의 남동생 처럼 적혀 있으면 그것으로 갈린다. */
        const ord = id => SIB_ORDER[f.r[id]] !== undefined ? SIB_ORDER[f.r[id]]
                        : (id === headId ? 0 : null);
        const oo = ord(oid), om = ord(mid);
        if (oo !== null && om !== null && oo !== om) up = oo < om ? -1 : 1;
      }
      if (up === -1) return ox === '남' ? (mx === '남' ? '형' : '오빠')
                                        : (mx === '남' ? '누나' : '언니');
      if (up ===  1) return ox === '남' ? '남동생' : ox === '여' ? '여동생' : '동생';
      return '형제자매';
    }
    return '가족';
  }

  if (d === 1) {
    if (ok === '인척') return ox === '남' ? '사위' : ox === '여' ? '며느리' : '자녀의 배우자';
    if (ok === '방계') return '조카';
    /* ★ 대표의 배우자는 대표 부모의 ★며느리·사위★ 다 (정식 1.14)
         「아내」라고 적혀 있으면 대표의 배우자임이 분명하다.
         그 사람을 대표의 어머니가 보면 딸이 아니라 며느리다. */
    if (headId && oid !== headId && gen[oid] === 0 &&
        oi.slot && oi.slot[0] === 0 && oi.slot[1] === '직계')
      return ox === '남' ? '사위' : ox === '여' ? '며느리' : '자녀의 배우자';
    /* ★ 아버지와 성이 다른 어른은 자녀가 아니다 (배우자·며느리일 가능성) */
    if (!oi.slot && (me['성별'] || '') === '남' && (oi.b === 'adult' || oi.b === 'senior') &&
        surnameOf(me['이름']) !== surnameOf(other['이름'])) return '가족';
    return ox === '남' ? '아들' : ox === '여' ? '딸' : '자녀';
  }

  if (d === -1) {
    if (ok === '방계') return ox === '남' ? '삼촌' : ox === '여' ? '이모' : '가족';
    /* ★ 대표의 배우자가 대표의 부모를 볼 때 — 시부모·장인장모다 (정식 1.14) */
    if (headId && mid !== headId && gen[mid] === 0 && ok === '직계' &&
        mi.slot && mi.slot[0] === 0 && mi.slot[1] === '직계')
      return mx === '남' ? (ox === '남' ? '장인' : ox === '여' ? '장모' : '처가 부모')
                         : (ox === '남' ? '시부' : ox === '여' ? '시모' : '시부모');
    /* ★ 내가 이 집에 혼인으로 들어온 사람이면 위 세대는 시부모·장인장모다 */
    if (mi.kind === '인척')
      return mx === '남' ? (ox === '남' ? '장인' : ox === '여' ? '장모' : '처가 부모')
                         : (ox === '남' ? '시부' : ox === '여' ? '시모' : '시부모');
    if (!mi.slot && (other['성별'] || '') === '남' && (mi.b === 'adult' || mi.b === 'senior') &&
        surnameOf(other['이름']) !== surnameOf(me['이름'])) return '가족';
    return ox === '남' ? '부' : ox === '여' ? '모' : '부모';
  }

  if (d ===  2) return ox === '남' ? '손자' : ox === '여' ? '손녀' : '손주';
  if (d === -2) return ox === '남' ? '조부' : ox === '여' ? '조모' : '조부모';
  if (d ===  3) return ox === '남' ? '증손자' : ox === '여' ? '증손녀' : '증손주';
  if (d === -3) return ox === '남' ? '증조부' : ox === '여' ? '증조모' : '증조부모';
  return '가족';
}

/* ═══════════════════════════════════════════════════════
   사람이 봐야 하는 짝 골라내기

   프로그램이 확신하지 못하는 경우는 두 가지다.

   ① '가족' 이라고만 적은 짝
      어른이 셋 이상이라 누가 부부인지 갈리지 않는 집.

   ② 성이 같은 남녀 어른 둘이 ★단둘이★ 사는 집
      성이 같으면 형제자매로 보는 것이 한국에서는 대체로 맞다.
      그런데 같은 성끼리 결혼한 부부도 드물지 않다 (이씨·김씨).
      부모도 자녀도 없이 단둘이 사시면 둘 중 어느 쪽인지
      자료만으로는 알 수 없다. 그래서 여쭙는다.

      ★ 성이 다르면 부부로 본다. 형제는 성이 같기 때문이다.
        (노희종·강다빈처럼 자녀가 없는 청년 부부가 여기 해당한다)
═══════════════════════════════════════════════════════ */
const SIB_LABELS = ['형제자매','형','누나','오빠','언니','남동생','여동생','동생'];

function famReviewPairs(group, fam) {
  if (!group || group.length < 2) return [];
  const f = normFamily(fam);
  const { gen, info } = buildGenMap(group);
  const out = [];
  group.forEach(a => group.forEach(b => {
    if (a === b) return;
    if (f.r[b['고유ID']]) return;                    /* 손으로 적어 두신 것은 통과 */
    const r = guessRelLabel(a, b, group);
    if (r === '가족') { out.push({ a, b, r, why: '관계를 정하지 못했습니다' }); return; }
    if (SIB_LABELS.indexOf(r) < 0) return;
    const ax = a['성별'] || '', bx = b['성별'] || '';
    if (!ax || !bx || ax === bx) return;
    const ia = info[a['고유ID']], ib = info[b['고유ID']];
    if (!ia || !ib || ia.b === 'kid' || ib.b === 'kid') return;
    const gA = gen[a['고유ID']];
    const alone = !Object.keys(gen).some(k => gen[k] !== gA);   /* 다른 세대가 없다 */
    if (alone && group.length === 2)
      out.push({ a, b, r, why: '형제자매인지 부부인지 확인이 필요합니다' });
  }));
  return out;
}


const SO_ORDER = ['봉사회','어머니회','은장회','은빛장년회','청년회','대학부',
                  '고등부','중등부','초등부','유년부','유치부','유아'];

/* 직분 정렬 순서. 여기에 없는 직분은 뒤로 밀리고 가나다순으로 놓인다.
   엑셀에 새 직분을 적어도 프로그램을 고칠 필요는 없다. */
const JIK_ORDER = ['담임목사','부목사','목사','전도사','전도인','장로','권사','집사','서리집사','성도'];

/* ═══════════════════════════════════════════════════════
   직분 무리 = 엑셀 「직분 카테고리」 칸 (정식 1.18)

   정식 1.17 까지는 세부 직분 이름을 25개 무리표(JIK_GROUPS)에 적어 두고
   프로그램이 그 표를 보고 묶었다. 이제는 그 표가 필요 없다 —
   엑셀 「직분 카테고리」 칸에 교회가 정한 무리 이름이 이미 적혀 있기 때문이다.
   (2026년 직분(임원) 분장 리스트 기준 스물한 가지: 봉사위원회·교구임원·
    구역임원·상담지원부·집사·회별회장단·영아조 …)

   그래서 「임원 및 봉사자 전체」 콤보는 명단에 실제로 적힌 카테고리를
   ★겹치지 않게★ 모아 올리고, 하나를 고르면 그 카테고리가 적힌 사람을 모두 찾는다.
   겸직이면 「구역임원 / 찬양대」처럼 '/' 로 나눠 적히므로 낱개로 쪼개 본다.

   ★ 새 부서가 생겨도 프로그램은 고칠 필요가 없다. 엑셀에 적기만 하면 된다.
   ★ 콤보에 나오는 차례는 아래 CAT_ORDER(설치 마법사에서 정하는 값)를 따르고,
     거기에 없는 카테고리는 뒤에 가나다순으로 붙는다.
═══════════════════════════════════════════════════════ */

/* ── 직분 카테고리 순서 ──────────────────────────────────
   세부 직분('(어)조리부 팀장' 같은 것)은 종류가 100가지가 넘어
   드롭다운에 그대로 넣으면 아무도 못 찾는다.
   그래서 필터는 엑셀의 '직분 카테고리' 칸을 쓴다.

   아래 순서는 교회에서 정해 주신 순서다.
   여기에 없는 부서는 뒤에 가나다순으로 붙고, '교회 직원'이 맨 끝이다.
   엑셀에 새 부서가 생겨도 프로그램을 고칠 필요는 없다.
   ──────────────────────────────────────────────────────── */
/* 교회마다 부르는 이름과 순서가 다르므로 설정에서 가져온다.
   (설치 마법사 9번째 화면에서 정한다) */
const CAT_ORDER = (CHURCH_CFG.catOrder || []).slice();
const CAT_LAST  = (CHURCH_CFG.catLast  || []).slice();

function catRank(c) {
  const i = CAT_ORDER.indexOf(c);
  if (i !== -1) return i;                       /* 교회에서 정한 순서 */
  if (CAT_LAST.indexOf(c) !== -1) return 9000;  /* 맨 끝에 둘 것 */
  return 1000;                                  /* 그 밖의 부서 — 가나다순 */
}

function sortCats(list) {
  return list.slice().sort((a, b) => {
    const ra = catRank(a), rb = catRank(b);
    if (ra !== rb) return ra - rb;
    return a.localeCompare(b, 'ko');
  });
}

/* 한 사람이 여러 직분을 맡는 일이 흔하다.
   엑셀에는 "1교구 교구장 / 11구역 구역장 / 상담부 부장" 처럼 한 칸에 적힌다.
   이것을 통짜 문자열로 다루면 화면이 잘리고 버튼과 겹치므로,
   구분자(/ · | , 줄바꿈)로 쪼개 낱개로 다룬다.
   '11구역 총무'처럼 안에 있는 공백은 그대로 둔다. */
function splitRoles(v) {
  return String(v == null ? '' : v)
    .split(/[\/·|,\n]+/)
    .map(x => x.trim())
    .filter(Boolean);
}
function sortMembers(a, b) {
  const ga = parseInt(a['구역'] || '0', 10) || 999;
  const gb = parseInt(b['구역'] || '0', 10) || 999;
  if (ga !== gb) return ga - gb;
  const oa = SO_ORDER.indexOf(a['소속'] || '');
  const ob = SO_ORDER.indexOf(b['소속'] || '');
  const ra = oa === -1 ? 999 : oa;
  const rb = ob === -1 ? 999 : ob;
  if (ra !== rb) return ra - rb;
  return (a['이름'] || '').localeCompare(b['이름'] || '', 'ko');
}

/* ═══════════════════════════════════════════════════════════════════
   주소록 목록 차례 — 대표 이름 순, 가족은 한 덩어리로 (정식 1.16)

   ★ 무엇이 달라졌나
   예전 sortMembers 는 구역 → 소속 → 이름 순이었다. 그래서 한 집 식구가
   소속(봉사회·청년회·교회학교…)에 따라 목록 여기저기에 흩어졌다.
   이제는 ★가족을 한 덩어리로 묶어★ 대표 이름 가나다순으로 놓는다.
   덩어리 안은  대표 → 부모·조부모 → 배우자·형제 → 자녀 → 손자녀  차례다
   (buildGenMap 이 주는 「대표에게서 본 세대」가 작은 쪽부터. HEAD_SLOT 주석 참고).
   가족이 없는 분은 자기 이름이 곧 대표 이름이라 그 자리에 홀로 들어간다.

   ★ 구역은 그대로 맨 앞 기준이다 — 화면에 구역 머리글이 붙기 때문이다.
     식구가 다른 구역에 적혀 있으면 그 구역 자리에 따로 놓인다.

   ★ 무겁지 않게 (어르신 휴대폰에서 목록은 열 때마다 그리는 곳이다)
   collectFamilies() 는 사람마다 명단 전체를 훑어 O(n²) 이다(610명이면 37만 번).
   여기서는 한 번만 훑어 열쇠(가족번호 또는 집주소)로 모은다 — 결과는 같다.
   집주소가 같은 사람이 아주 많은 곳(기도원·공동주택 대표주소 등)에서는
   autoHead 가 짝을 찾느라 느려지므로, 그런 덩어리는 나이만 보고 대표를 정한다.
═══════════════════════════════════════════════════════════════════ */
const FAM_BIG = 10;      /* 이보다 큰 덩어리는 대표를 나이로만 고른다 */

function buildFamilySortIndex(members, fam) {
  const f = normFamily(fam);
  const out = {};
  const byKey = new Map();

  (members || []).forEach(m => {
    const id  = m['고유ID'];
    const fid = f.m[id];
    let key = '';
    if (fid) key = 'F' + fid;
    else {
      const a = normAddr(m['주소']);
      if (a.length >= 10) key = 'A' + a;
    }
    if (!key) return;
    if (!byKey.has(key)) byKey.set(key, []);
    byKey.get(key).push(m);
  });

  byKey.forEach((g, key) => {
    if (g.length < 2) return;                    /* 혼자면 가족이 아니다 */
    let gen = {}, info = {};
    try { const r = buildGenMap(g, fam); gen = r.gen; info = r.info; } catch(e) {}

    let head = storedHead(g, f);
    if (!head || !info[head]) {
      if (g.length > FAM_BIG) {
        /* 큰 덩어리 — 가장 어른을 대표로 (autoHead 는 짝을 찾느라 무겁다) */
        let best = null, by = 1e9;
        g.forEach(p => {
          const x = info[p['고유ID']];
          const y = x ? x.y : 9999;
          if (y < by) { by = y; best = p; }
        });
        head = best ? best['고유ID'] : g[0]['고유ID'];
      } else {
        try { head = autoHead(g, gen, info, fam); } catch(e) { head = ''; }
      }
    }
    if (!head) head = g[0]['고유ID'];

    const hm = g.filter(p => p['고유ID'] === head)[0] || g[0];
    const hName = String((hm && hm['이름']) || '');
    g.forEach(p => {
      const id = p['고유ID'];
      out[id] = {
        key, head: hName,
        rank: id === head ? 0 : 1,               /* 대표를 덩어리 맨 위로 */
        gen:  gen[id] === undefined ? 0 : gen[id],
        year: info[id] ? info[id].y : 9999
      };
    });
  });
  return out;
}

/* 구역 → 대표 이름 → (같은 이름이 둘이면) 가족 열쇠 → 대표 → 세대 → 나이 → 이름 */
function famSortKey(m, idx) {
  const gu = parseInt(m['구역'] || '0', 10) || 999;
  const nm = String(m['이름'] || '');
  const c  = idx && idx[m['고유ID']];
  return c ? [gu, c.head, c.key, c.rank, c.gen, c.year, nm]
           : [gu, nm,     '',    0,      0,     0,      nm];
}

/* 가족표가 없으면(아직 못 받았을 때) 예전 차례 그대로 */
function sortByFamily(idx) {
  if (!idx) return sortMembers;
  return (a, b) => {
    const ka = famSortKey(a, idx), kb = famSortKey(b, idx);
    for (let i = 0; i < ka.length; i++) {
      const x = ka[i], y = kb[i];
      if (typeof x === 'string' || typeof y === 'string') {
        const d = String(x).localeCompare(String(y), 'ko');
        if (d) return d;
      } else if (x !== y) return x - y;
    }
    return 0;
  };
}

function Bdg({ t, bg, cl, icon }) {

function Avatar({ member, photos, size=48, ring, src }) {
  const [err, setErr] = useState(false);
  const url = src || (photos && member ? photos[member['고유ID']] : null);
  const av  = getAv(member);
  const fs  = Math.max(13, Math.round(size * 0.36));
  const base = {

  return h('div', {

            /* 부모 색을 물려받는다 — 네이비 히어로에서는 흰색, 목록에서는 검정 */
            color:'inherit', opacity:.78,
            display:'flex', alignItems:'center', justifyContent:'center',
            fontSize: Math.max(11, Math.round(nameSize)) + 'px',
            fontWeight:700, letterSpacing:'-.04em',

}

/* 클립보드 복사 — 사파리 구버전과 file:// 환경까지 대비한다 */
async function copyText(t) {
  const s = String(t == null ? '' : t);
  if (!s) return false;
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(s);
      return true;
    }
  } catch(e) {}
  try {
    const ta = document.createElement('textarea');
    ta.value = s;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none';
    document.body.appendChild(ta);
    ta.focus();
    ta.setSelectionRange(0, ta.value.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch(e) { return false; }
}

/* 복사 버튼 — 누르면 잠깐 체크 표시로 바뀐다 */
function CopyBtn({ text, title }) {
  const [state, setState] = useState('');   /* '' | 'ok' | 'fail' */
  const timer = useRef(null);
  useEffect(() => () => clearTimeout(timer.current), []);

  async function go(e) {
    e.stopPropagation(); e.preventDefault();
    const ok = await copyText(text);
    setState(ok ? 'ok' : 'fail');
    clearTimeout(timer.current);
    timer.current = setTimeout(() => setState(''), 1600);
  }

  const icon = state === 'ok' ? 'check' : state === 'fail' ? 'alert-circle' : 'copy';
  return h('button', {
    type:'button', onClick:go,
    className:'act',
    title: state === 'ok' ? '복사했습니다' : state === 'fail' ? '복사 실패' : (title || '복사'),
    'aria-label': title || '복사',
    style: state === 'ok'
      ? { background:'color-mix(in srgb,var(--ok) 16%,var(--surface))',
          borderColor:'color-mix(in srgb,var(--ok) 40%,transparent)', color:'var(--ok)' }
      : state === 'fail'
        ? { background:'color-mix(in srgb,var(--bad) 14%,var(--surface))',
            borderColor:'color-mix(in srgb,var(--bad) 36%,transparent)', color:'var(--bad)' }
        : null
  }, h('i', { className:'ti ti-' + icon }));
}
