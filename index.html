/* ═══════════════════════════════════════════════════════
   심방 메모 카드

   전도인이 심방을 다녀와 그 자리에서 적는 곳이다.
   한 성도에게 여러 건이 날짜별로 쌓이므로,
   목회자가 바뀌어도 지난 심방 이력이 그대로 남는다.

   · 전도인에게만 보인다 (다른 등급은 아예 호출하지 않는다)
   · 엑셀을 다시 올려도 지워지지 않는다 (별도 컬렉션 visits)
   · 저장 전에 서버를 다시 읽으므로 두 사람이 동시에 적어도 안전하다
═══════════════════════════════════════════════════════ */
const VISIT_CACHE = {};

/* 화면 표시는 늘 YYYY.MM.DD 로 맞춘다 */
function ymdToIso(v) {
  const dg = String(v || '').replace(/[^0-9]/g, '');
  if (dg.length !== 8) return '';
  return dg.slice(0,4) + '-' + dg.slice(4,6) + '-' + dg.slice(6,8);
}
function isoToYmd(v) {
  const dg = String(v || '').replace(/[^0-9]/g, '');
  if (dg.length !== 8) return '';
  return dg.slice(0,4) + '.' + dg.slice(4,6) + '.' + dg.slice(6,8);
}

/*#ADMIN_ONLY_START*/
function VisitNotes({ member, dark }) {
  const id = member['고유ID'];

  const [entries, setEntries] = useState(() =>
    VISIT_CACHE[id] !== undefined ? VISIT_CACHE[id] : null);
  const [err,   setErr]   = useState('');
  const [busy,  setBusy]  = useState(false);
  const [open,  setOpen]  = useState(false);
  const [editId, setEditId] = useState('');
  const [fDate, setFDate] = useState(todayYmd());
  const [fBy,   setFBy]   = useState(() => {
    try { return localStorage.getItem('gsc_visit_writer') || ''; } catch(e) { return ''; }
  });
  const [fText, setFText] = useState('');

  useEffect(() => {
    let alive = true;
    if (VISIT_CACHE[id] !== undefined) { setEntries(VISIT_CACHE[id]); return; }
    setEntries(null); setErr('');
    fbLoadVisit(id)
      .then(list => { VISIT_CACHE[id] = list; if (alive) setEntries(list); })
      .catch(e => { if (alive) { setEntries([]); setErr(fsErrMsg(e)); } });
    return () => { alive = false; };
  }, [id]);

  async function reload() {
    setBusy(true); setErr('');
    try {
      const list = await fbLoadVisit(id);
      VISIT_CACHE[id] = list; setEntries(list);
    } catch(e) { setErr(fsErrMsg(e)); }
    setBusy(false);
  }

  function startNew() {
    setEditId(''); setFDate(todayYmd()); setFText(''); setErr(''); setOpen(true);
  }
  function startEdit(en) {
    setEditId(en.id);
    setFDate(en.date || todayYmd());
    setFBy(en.by || fBy);
    setFText(en.text || '');
    setErr(''); setOpen(true);
  }
  function closeForm() {
    setOpen(false); setEditId(''); setFText(''); setErr('');
  }

  async function save() {
    const text = String(fText || '').trim();
    if (!text) { setErr('심방 내용을 적어 주세요'); return; }
    const date = isoToYmd(fDate) || todayYmd();
    const by   = String(fBy || '').trim();
    setBusy(true); setErr('');
    try {
      let next;
      if (editId) {
        next = await fbEditVisit(member, editId, { date, by, text, editedAt: new Date().toISOString() });
      } else {
        const one = { id:newEntryId(), date, by, text, at:new Date().toISOString() };
        next = await fbAddVisit(member, one);
        /* 저장은 됐지만 뒤이은 확인 읽기가 실패했을 때 —
           빈 화면을 보여 드리지 않도록 방금 적은 것을 붙여 둔다.
           ([다시 불러오기]를 누르면 서버의 진짜 목록으로 맞춰진다) */
        if (!next) next = [...(entries || []), one];
      }
      VISIT_CACHE[id] = next;
      setEntries(next);
      try { if (by) localStorage.setItem('gsc_visit_writer', by); } catch(e) {}
      closeForm();
    } catch(e) { setErr(fsErrMsg(e)); }
    setBusy(false);
  }

  async function remove(en) {
    if (!confirm('이 심방 기록을 지울까요?\n\n' +
                 (en.date || '') + (en.by ? ' · ' + en.by : '') + '\n\n' +
                 '되돌릴 수 없습니다.')) return;
    setBusy(true); setErr('');
    try {
      const next = await fbDeleteVisitEntry(member, en.id);
      VISIT_CACHE[id] = next; setEntries(next);
    } catch(e) { setErr(fsErrMsg(e)); }
    setBusy(false);
  }

  const list = sortVisitEntries(entries || []);

  return h('div', { className:'card fade', style:{ overflow:'hidden', padding:0, marginBottom:'12px' } },

    h('div', {
      style:{ padding:'13px 16px', background:'var(--soft)', borderBottom:'1px solid var(--soft-bd)',
              display:'flex', alignItems:'center', gap:'8px' }
    },
      h('i', { className:'ti ti-notes', style:{ fontSize:'19px', color:'var(--navy)' } }),
      h('span', { style:{ fontSize:'15.5px', fontWeight:800, color:'var(--navy)' } }, '심방 메모'),
      entries !== null && h('span', {
        style:{ fontSize:'13px', fontWeight:700, color:'var(--navy)', opacity:.7 }
      }, list.length + '건'),
      h('button', {
        type:'button', onClick:reload, disabled:busy, title:'다시 불러오기',
        style:{ marginLeft:'auto', border:'none', background:'transparent', cursor:'pointer',
                color:'var(--navy)', padding:'4px 6px', borderRadius:'8px' }
      }, busy
          ? h('span', { className:'spinner', style:{ width:'15px', height:'15px', borderWidth:'2px' } })
          : h('i', { className:'ti ti-refresh', style:{ fontSize:'18px' } }))
    ),

    h('div', { style:{ padding:'14px 16px' } },

      h('p', { style:{ fontSize:'12.5px', color:'var(--text-3)', lineHeight:1.7, marginBottom:'12px' } },
        '전도인만 볼 수 있습니다. 엑셀을 다시 올려도 이 메모는 지워지지 않습니다.'),

      err && h('p', { className:'note note-bad', style:{ marginBottom:'12px' } }, err),

      entries === null
        ? h('div', { style:{ display:'flex', alignItems:'center', gap:'9px', padding:'12px 0',
                             color:'var(--text-3)', fontSize:'14px', fontWeight:600 } },
            h('span', { className:'spinner', style:{ width:'16px', height:'16px', borderWidth:'2px' } }),
            '심방 메모를 불러오는 중...')
        : list.length === 0
          ? h('p', { style:{ fontSize:'14.5px', color:'var(--text-3)', fontWeight:600,
                             padding:'8px 0 14px', lineHeight:1.7 } },
              '아직 기록된 심방 내용이 없습니다.')
          : h('div', null,
              list.map(en => h('div', { key:en.id, className:'vnote' },
                h('div', { className:'vnote-h' },
                  h('i', { className:'ti ti-calendar-event',
                           style:{ fontSize:'15px', color:'var(--navy)', opacity:.8 } }),
                  h('span', { className:'vnote-d' }, en.date || '날짜 없음'),
                  en.by && h('span', { className:'vnote-w' }, '· ' + en.by),
                  en.editedAt && h('span', { className:'vnote-w', style:{ opacity:.7 } }, '· 수정됨'),
                  h('span', { style:{ marginLeft:'auto', display:'flex', gap:'2px' } },
                    h('button', { type:'button', className:'vnote-b', disabled:busy,
                                  onClick: () => startEdit(en) }, '수정'),
                    h('button', { type:'button', className:'vnote-b', disabled:busy,
                                  style:{ color:'var(--bad)' },
                                  onClick: () => remove(en) }, '삭제')
                  )
                ),
                h('div', { className:'vnote-t' }, en.text || '')
              ))
            ),

      !open && h('button', {
        type:'button', onClick:startNew, disabled:busy || entries === null,
        className:'btn btn-primary btn-block', style:{ marginTop:'12px' }
      },
        h('i', { className:'ti ti-pencil-plus', style:{ fontSize:'19px' } }), '심방 내용 적기'),

      open && h('div', {
        style:{ marginTop:'14px', paddingTop:'14px', borderTop:'1px solid var(--border)',
                display:'flex', flexDirection:'column', gap:'10px' }
      },
        h('p', { style:{ fontSize:'14px', fontWeight:800, color:'var(--navy)' } },
          editId ? '심방 기록 수정' : (member['이름'] || '') + ' 심방 기록'),

        h('div', { style:{ display:'flex', gap:'8px' } },
          h('div', { style:{ flex:'1 1 45%', minWidth:0 } },
            h('label', { style:{ fontSize:'12.5px', fontWeight:700, color:'var(--text-3)',
                                 display:'block', marginBottom:'4px' } }, '심방 날짜'),
            h('input', { type:'date', value: ymdToIso(fDate),
                         onChange: e => setFDate(isoToYmd(e.target.value) || todayYmd()) })
          ),
          h('div', { style:{ flex:'1 1 55%', minWidth:0 } },
            h('label', { style:{ fontSize:'12.5px', fontWeight:700, color:'var(--text-3)',
                                 display:'block', marginBottom:'4px' } }, '기록한 사람'),
            h('input', { type:'text', placeholder:'예: 김규동 전도사', value:fBy,
                         style:{ padding:'11px 12px' },
                         onChange: e => setFBy(e.target.value) })
          )
        ),

        h('div', null,
          h('label', { style:{ fontSize:'12.5px', fontWeight:700, color:'var(--text-3)',
                               display:'block', marginBottom:'4px' } }, '심방 내용과 사정'),
          h('textarea', {
            className:'vta', value:fText,
            placeholder:'가정 형편, 건강, 기도 부탁, 다음 심방 때 챙길 것 등을 적어 두세요.',
            onChange: e => { setFText(e.target.value); setErr(''); }
          })
        ),

        h('div', { style:{ display:'flex', gap:'8px' } },
          h('button', { type:'button', onClick:save, disabled:busy,
                        className:'btn btn-primary', style:{ flex:1 } },
            busy
              ? h('span', { className:'spinner', style:{ width:'16px', height:'16px', borderWidth:'2px' } })
              : h('i', { className:'ti ti-device-floppy', style:{ fontSize:'19px' } }),
            busy ? '저장 중...' : '저장'),
          h('button', { type:'button', onClick:closeForm, disabled:busy,
                        className:'btn btn-ghost', style:{ padding:'0 18px' } }, '취소')
        )
      )
    )
  );
}

/*#ADMIN_ONLY_END*/
function DetailView({ member: m, allMembers, photos, logoUrl, onBack, onNavigate, onPhotoUpdate,
                      isAdmin, theme, toggle, role, fieldVis, visitCfg, listCfg,
                      attStatus, onAttStatus, family: familyCfg, onHome, onSaveInfo }) {
  const dark   = theme === 'dark';
  const av     = getAv(m, dark);
  const attFull = effAttFull(m, attStatus);
  const att    = attFull.state;
  const attExempt = isAttExempt(m);      /* 영아·유아·영유아 — 출석상태를 매기지 않는다 */
  const badge  = getBadge(att, dark);
  /* ★ 담당자 계정은 자기 명단 성도만 고칠 수 있다 (1.06).
     부서가 구역보다 앞선다 — 11구역에 살아도 청년부에서 체크하는
     청년은 11구역 담당자가 손댈 수 없다. (scopeAllows) */
  /* 안내실이 [표시 설정] 탭의 주소록 설정에서 출석상태 고치기를 잠가 두면
     담당자 화면에서는 배지만 보이고 버튼이 나오지 않는다 (정식 1.12) */
  const canEditAtt = ROLES[role] >= ROLES.leader && !!onAttStatus &&
                     canEditAttCfg(role, listCfg) &&
                     scopeAllows(myScope(), m);
  const see    = f => canSee(f, role, fieldVis);
  const roles  = canSee('직분', role, fieldVis) ? splitRoles(m['직분']) : [];
  /* ★ 안내실의 「정보 고치기」 (정식 1.16) — EDIT_FIELDS 주석 참고 */
  const canEditInfo = !!(isAdmin && onSaveInfo);
  const [editing,  setEditing]  = useState(false);
  const [form,     setForm]     = useState(null);
  const [infoBusy, setInfoBusy] = useState(false);
  const [infoMsg,  setInfoMsg]  = useState('');
  /* 다른 식구로 옮겨 가면 고치던 것을 닫는다 — 남의 칸에 잘못 저장하지 않게 */
  useEffect(() => { setEditing(false); setForm(null); setInfoMsg(''); }, [m && m['고유ID']]);

  function openEdit() {
    const o = {};
    EDIT_FIELDS.forEach(f => {
      o[f.k] = f.k === '구원년월' ? (normYm(m[f.k]) || '')
             : f.k === '성별'    ? normSex(m[f.k])
             : String(m[f.k] == null ? '' : m[f.k]);
    });
    setForm(o); setInfoMsg(''); setEditing(true);
  }
  function setF(k, v) { setForm(o => ({ ...o, [k]: v })); setInfoMsg(''); }

  async function saveEdit() {
    if (infoBusy || !form) return;
    const patch = {};
    EDIT_FIELDS.forEach(f => {
      const raw = String(form[f.k] == null ? '' : form[f.k]).trim();
      patch[f.k] = (f.k === '구원년월') ? (normYm(raw) || '')
                 : (f.k === '성별')    ? normSex(raw)
                 : raw;
    });
    /* 바뀐 것이 하나도 없으면 굳이 명단 네 벌을 다시 만들지 않는다 */
    const same = EDIT_FIELDS.every(f => {
      const was = f.k === '구원년월' ? (normYm(m[f.k]) || '')
                : f.k === '성별'    ? normSex(m[f.k])
                : String(m[f.k] == null ? '' : m[f.k]).trim();
      return was === patch[f.k];
    });
    if (same) { setEditing(false); setInfoMsg(''); return; }
    setInfoBusy(true); setInfoMsg('');
    try {
      await onSaveInfo(m['고유ID'], patch);
      setEditing(false);
      setInfoMsg('ok:저장했습니다.');
    } catch(e) {
      setInfoMsg('err:' + fsErrMsg(e));
    }
    setInfoBusy(false);
  }

  const familyAll = allMembers ? getFamilyGroup(m, allMembers, familyCfg) : [];
  /* 세대를 나누려면 나 자신을 포함한 집안 전체가 필요하다.
     ★ 감춘 식구도 이 계산에는 그대로 넣는다.
       빼 버리면 남은 식구의 호칭이 어긋난다 — 예를 들어 아버지가
       미출석이라 빠졌는데 그 아버지를 계산에서도 빼면
       조부모와 손자녀가 부모·자녀처럼 붙어 버린다. */
  const famGroup = useMemo(() => [m].concat(familyAll), [m, familyAll]);
  /* ★ 화면에 낼 식구 — 주소록 목록과 똑같은 기준으로 감춘다 (정식 1.12).
     목록에서 안 보이는 분이 가족 칸에만 남아 있으면 앞뒤가 맞지 않는다. */
  const family = useMemo(
    () => familyAll.filter(f => listShows(f, attStatus, listCfg, canSee('출석상태', role, fieldVis))),
    [familyAll, attStatus, listCfg, role, fieldVis]);
  const [uploading, setUploading] = useState(false);
  const phone = m['휴대폰'] || m['집전화'];

  const [full, setFull] = useState(() => PHOTO_CACHE[m['고유ID']] || null);
  useEffect(() => {
    let alive = true;
    const id = m['고유ID'];
    if (PHOTO_CACHE[id] !== undefined) { setFull(PHOTO_CACHE[id]); return; }
    setFull(null);
    fbLoadPhoto(id)
      .then(u => { PHOTO_CACHE[id] = u; if (alive) setFull(u); })
      .catch(() => { if (alive) setFull(null); });
    return () => { alive = false; };
  }, [m['고유ID']]);

  const RAW = {
    '직분':    m['직분'],
    '직분 카테고리': m['직분 카테고리'],
    '구역':    m['구역'] ? m['구역'] + '구역' : '',
    '소속':    m['소속'],
    '세대구분': m['세대구분'],
    '성별':    m['성별']==='남' ? '남성' : m['성별']==='여' ? '여성' : m['성별'],
    '생년월':   normYm(m['생년월']),
    '구원년월': normYm(m['구원년월']),
    '집전화':   m['집전화'],
    '휴대폰':   m['휴대폰'],
    '주소':    m['주소'],
    '지역':    m['지역'],
    '출석상태': attExempt
                  ? (attFull.marks.join(' ') || '영유아 (출석상태 없음)')
                  : attText(att, attFull.marks),
    '비고':    m['비고']
  };

  const fields = DETAIL_FIELDS
    .filter(f => see(f))
    .map(f => [f, RAW[f]])
    .filter(([, v]) => v && String(v).trim() && v !== '0' && v !== 'undefined');

  const addr = splitAddress(m['주소']);

  async function handlePhotoChange(e) {
    const file = e.target.files[0]; if (!file) return;
    setUploading(true);
    try {
      const img   = await loadImageFromFile(file);
      const fullU = toDataUrlCapped(img, FULL_DIM, FULL_Q, 850000);
      const thumb = toDataUrl(img, THUMB_DIM, THUMB_Q);
      await fbSavePhotoDoc(m['고유ID'], fullU);
      await fbSaveThumbs({ ...(photos || {}), [m['고유ID']]: thumb });
      PHOTO_CACHE[m['고유ID']] = fullU;
      setFull(fullU);
      onPhotoUpdate && onPhotoUpdate(m['고유ID'], thumb);
    } catch(err) { alert('사진 저장 실패: ' + fsErrMsg(err)); }
    setUploading(false); e.target.value = '';
  }

  return h('div', { className:'screen' },
    h(AppBar, {
      title:'성도 정보', logoUrl, onHome,
      left:  h(NBtn, { onClick:onBack, icon:'arrow-left' }, '목록'),
      right: h(ThemeBtn, { theme, toggle })
    }),

    h('div', { className:'wrap pb-safe', style:{ paddingTop:'14px' } },

      h('div', {
        className:'card fade',
        style:{ overflow:'hidden', padding:0, marginBottom:'12px' }
      },
        h('div', { className:'hero' },
          h('div', { style:{ position:'relative', flexShrink:0 } },
            h(Avatar, { member:m, photos, size:84, ring:true, src: full || undefined }),
            isAdmin && h('label', {
              title:'사진 변경',
              style:{ position:'absolute', bottom:'-2px', right:'-2px', width:'30px', height:'30px',
                      borderRadius:'50%', background:'#fff', display:'flex',
                      alignItems:'center', justifyContent:'center', cursor:'pointer',
                      boxShadow:'0 2px 8px rgba(0,0,0,.25)' }
            },
              uploading
                ? h('div', { className:'spinner', style:{ width:'15px', height:'15px', borderWidth:'2px' } })
                : h('i', { className:'ti ti-camera', style:{ fontSize:'16px', color:'var(--navy)' } }),
              h('input', { type:'file', accept:'image/*', onChange:handlePhotoChange,
                           style:{ display:'none' }, disabled:uploading })
            )
          ),
          h('div', { style:{ flex:1, minWidth:0 } },
            h('p', { style:{ fontSize:'25px', fontWeight:800, letterSpacing:'-.03em',
                             marginBottom: roles.length ? '7px' : '8px' } },
              m['이름'],
              m['동명이인구분'] && h('sup', {
                style:{ fontSize:'12px', opacity:.7, marginLeft:'4px', fontWeight:700 }
              }, m['동명이인구분'])
            ),

            /* 직분은 이름과 같은 줄에 두지 않는다.
               여러 개를 맡으신 분이 흔해서, 한 줄에 넣으면 반드시 잘린다.
               낱개 배지로 나눠 줄바꿈으로 받는다. */
            roles.length > 0 && h('div', { className:'hero-roles' },
              roles.map((r, i) => h('span', { key:i, className:'mrole-hero' },
                i === 0 && h('i', { className:'ti ti-heart-handshake',
                                    style:{ fontSize:'14px', opacity:.9, flexShrink:0 } }),
                h('span', { className:'mrole-t' }, r)
              ))
            ),
            h('div', { style:{ display:'flex', gap:'6px', flexWrap:'wrap', alignItems:'center' } },
              see('구역') && m['구역'] && h('span', {
                style:{ fontSize:'12.5px', fontWeight:700, padding:'3px 10px', borderRadius:'999px',
                        background:'rgba(255,255,255,.18)', border:'1px solid rgba(255,255,255,.26)' }
              }, m['구역'] + '구역'),
              see('소속')    && h(Bdg, { t:m['소속'], bg:av.bg, cl:av.cl }),
              see('출석상태') && h(AttBadges, { value: attText(att, attFull.marks), dark, exempt: attExempt })
            )
          )
        ),

        /* 지도 버튼은 여기에 두지 않는다.
           아래 주소 항목에 T맵·네이버맵·카카오맵 세 가지가 함께 있어
           같은 기능이 한 화면에 두 번 나오면 오히려 헷갈린다. */
        /* 전화·문자는 가장 많이 쓰는 것이므로 크게 나란히 두고,
           메모는 그 아래 한 줄을 통째로 쓴다.
           셋을 한 줄에 넣으면 320px 기기에서 글자가 잘린다. */
        h('div', {
          style:{ padding:'13px 14px', background:'var(--surface-2)',
                  borderTop:'1px solid var(--border)',
                  display:'flex', flexDirection:'column', gap:'10px' }
        },
          hasPhone(phone) && h('div', { style:{ display:'flex', gap:'8px' } },
            h('a', { href:telHref(phone), className:'btn btn-primary', style:{ flex:1 } },
              h('i', { className:'ti ti-phone-filled', style:{ fontSize:'19px' } }), '전화'),
            h('a', { href:smsHref(phone), className:'btn btn-ghost', style:{ flex:1 } },
              h('i', { className:'ti ti-message-2', style:{ fontSize:'19px' } }), '문자')
          ),
          h(NoteButton, { member:m })
        )
      ),

      family.length > 0 && h('div', { className:'card fade', style:{ overflow:'hidden', padding:0, marginBottom:'12px' } },
        h('div', {
          style:{ padding:'13px 18px', background:'var(--soft)',
                  borderBottom:'1px solid var(--soft-bd)', display:'flex',
                  alignItems:'center', gap:'8px' }
        },
          h('i', { className:'ti ti-home-heart', style:{ fontSize:'19px', color:'var(--navy)' } }),
          h('span', { style:{ fontSize:'15.5px', fontWeight:800, color:'var(--navy)' } }, '가족 구성원'),
          h('span', { style:{ fontSize:'13px', color:'var(--navy)', opacity:.7, marginLeft:'auto' } }, '눌러서 이동')
        ),
        family.map(fam => {
          const rel  = getRelLabel(m, fam, familyCfg, famGroup);
          const rc   = getRelTone(rel, dark);
          const fav  = getAv(fam, dark);
          const ffull = effAttFull(fam, attStatus);
          const fatt  = ffull.state;
          const fbdg  = getBadge(fatt, dark);
          const fph  = (see('휴대폰') || see('집전화')) ? (fam['휴대폰'] || fam['집전화']) : '';
          return h('div', {
            key: fam['고유ID'],
            onClick: () => onNavigate(fam),
            style:{ display:'flex', alignItems:'center', gap:'11px',
                    padding:'13px 16px', cursor:'pointer',
                    borderBottom:'1px solid var(--border)' }
          },
            h('span', {
              style:{ minWidth:'52px', textAlign:'center', fontSize:'13px', fontWeight:800,
                      padding:'5px 8px', borderRadius:'999px',
                      background:rc.bg, color:rc.cl, flexShrink:0 }
            }, rel),
            h(Avatar, { member:fam, photos, size:42 }),
            h('div', { style:{ flex:1, minWidth:0 } },
              h('p', { style:{ fontSize:'16px', fontWeight:700, letterSpacing:'-.02em', marginBottom:'2px' } },
                fam['이름'],
                fam['동명이인구분'] && h('sup', { className:'msup' }, fam['동명이인구분'])
              ),
              h('div', { style:{ display:'flex', gap:'5px', alignItems:'center', flexWrap:'wrap' } },
                /* 이 줄은 관계·사진·전화·문자·화살표가 이미 자리를 다 쓴다.
                   여기에 직분을 넣으면 반드시 잘리고, 잘린 글자는 정보가 아니라
                   소음이다. 그래서 직분 하나짜리만 배지로 두고,
                   겸직이면 개수만 조용히 알린 뒤 상세 화면에 맡긴다. */
                /* 이 줄에는 직분을 넣지 않는다.
                   관계·사진·전화·문자·화살표가 자리를 다 써서 글자 자리가
                   40~110px뿐인데, 세부 직분은 '(청)믿음부 서기'처럼 길다.
                   눌러서 들어가면 상세 화면에 전부 있다. */
                see('소속') && h(Bdg, { t:fam['소속'], bg:fav.bg, cl:fav.cl }),
                see('출석상태') && !isAttExempt(fam) && fatt !== '출석A' && h(Bdg, { t:fatt, bg:fbdg.bg, cl:fbdg.cl }),
                see('출석상태') && ffull.marks.map(k => {
                  const t = getMarkBadge(k, dark);
                  return h(Bdg, { key:k, t:k, bg:t.bg, cl:t.cl });
                })
              )
            ),
            h(CallActions, { phone: fph }),
            h('i', { className:'ti ti-chevron-right', style:{ color:'var(--text-3)', fontSize:'19px', flexShrink:0 } })
          );
        })
      ),

      h('div', { className:'card fade', style:{ overflow:'hidden', padding:0, marginBottom:'12px' } },
        h('div', {
          style:{ padding:'12px 18px', background:'var(--surface-2)', borderBottom:'1px solid var(--border)',
                  display:'flex', alignItems:'center', gap:'8px' }
        },
          h('span', { style:{ fontSize:'13px', fontWeight:800, color:'var(--text-3)',
                              letterSpacing:'.04em', flex:1 } }, '상세 정보'),
          canEditInfo && !editing && h('button', {
            type:'button', className:'chip', onClick:openEdit,
            style:{ padding:'5px 12px', fontSize:'13px', flexShrink:0 }
          }, h('i', { className:'ti ti-pencil', style:{ fontSize:'14px', marginRight:'3px' } }), '고치기')
        ),

        /* 저장 결과 한 줄 — 고치는 칸을 닫은 뒤에도 잠깐 남는다 */
        infoMsg && h('div', { style:{ padding:'12px 18px 0' } },
          h('div', {
            className: 'note ' + (infoMsg.startsWith('ok:') ? 'note-ok' : 'note-bad'),
            style:{ margin:0 }
          }, infoMsg.slice(infoMsg.indexOf(':') + 1))),

        /* ── 고치는 칸 ─────────────────────────────────────── */
        editing && form
          ? h('div', { style:{ padding:'16px 18px', display:'flex', flexDirection:'column', gap:'14px' } },
              EDIT_FIELDS.map(f => h('div', { key:f.k },
                h('label', { className:'irow-l', style:{ display:'block', marginBottom:'5px' } },
                  h('i', { className:'ti ti-' + (FIELD_ICONS[f.k] || 'point'),
                           style:{ fontSize:'14px', marginRight:'5px', color:'var(--navy)', opacity:.8 } }),
                  f.label),
                f.choices
                  ? h('div', {
                      className:'seg',
                      style:{ padding:'3px', gap:'3px', maxWidth:'300px',
                              opacity: infoBusy ? .6 : 1 }
                    },
                      f.choices.concat(['']).map(v => h('button', {
                        key: v || '__none', type:'button', disabled: infoBusy,
                        onClick: () => setF(f.k, v),
                        className: (form[f.k] || '') === v ? 'on' : '',
                        style:{ fontSize:'14.5px', padding:'9px 3px',
                                fontWeight: (form[f.k] || '') === v ? 800 : 600 }
                      }, v || '비움'))
                    )
                  : f.area
                  ? h('textarea', {
                      value: form[f.k], rows:3, disabled: infoBusy,
                      placeholder: f.hint,
                      onChange: e => setF(f.k, e.target.value),
                      style:{ minHeight: f.k === '주소' ? '72px' : '90px', resize:'vertical' }
                    })
                  : h('input', {
                      type:'text', inputMode: f.mode, value: form[f.k], disabled: infoBusy,
                      placeholder: f.hint,
                      onChange: e => setF(f.k, e.target.value)
                    }),
                !f.area && f.hint && h('p', {
                  style:{ fontSize:'12.5px', color:'var(--text-3)', marginTop:'5px' }
                }, f.hint)
              )),
              h('div', { style:{ display:'flex', gap:'8px' } },
                h('button', {
                  type:'button', className:'btn btn-ghost', disabled: infoBusy,
                  style:{ flex:'0 0 92px' },
                  onClick: () => { setEditing(false); setForm(null); setInfoMsg(''); }
                }, '취소'),
                h('button', {
                  type:'button', className:'btn btn-primary', disabled: infoBusy, style:{ flex:1 },
                  onClick: saveEdit
                },
                  infoBusy
                    ? h('span', { className:'spinner', style:{ width:'16px', height:'16px', borderWidth:'2px' } })
                    : h('i', { className:'ti ti-device-floppy', style:{ fontSize:'18px' } }),
                  infoBusy ? '저장 중…' : '저장')
              ),
              h('div', { className:'note note-info', style:{ fontSize:'12.5px', lineHeight:1.7 } },
                '저장하면 ', h('b', null, '성도·임원·안내실 화면에 곧바로'), ' 반영됩니다.', h('br'),
                '다만 ', h('b', null, '엑셀을 다시 올리면 그 엑셀 내용으로 덮어써집니다'), '. ',
                '고치신 뒤에는 ', h('b', null, '[관리 화면] → [데이터] 탭'), ' 에서 엑셀을 내려받아 두세요.')
            )
          : fields.map(([lbl, val]) => h('div', { key:lbl, className:'irow' },
          h('i', { className:'ti ti-' + (FIELD_ICONS[lbl] || 'point'), 'aria-hidden':true,
                   style:{ width:'22px', flexShrink:0, color:'var(--navy)', fontSize:'18px',
                           textAlign:'center', opacity:.85, marginTop:'2px' } }),
          h('div', { style:{ flex:1, minWidth:0 } },
            h('div', { className:'irow-l' }, lbl),
            /* 직분과 직분 카테고리는 겸직이 여러 개면 한 줄씩 나눠 적는다 */
            (lbl === '직분' || lbl === '직분 카테고리') && splitRoles(val).length > 1
              ? h('div', null,
                  splitRoles(val).map((r, i) => h('div', {
                    key:i, className:'irow-v',
                    style:{ display:'flex', gap:'7px', alignItems:'flex-start',
                            marginTop: i ? '5px' : 0 }
                  },
                    h('span', { style:{ color:'var(--navy)', opacity:.5, flexShrink:0 } }, '·'),
                    h('span', null, r)
                  ))
                )
              /* 출석상태 — 임원(구역장) 이상이면 여기서 바로 고칠 수 있다.
                 명단 문서가 아니라 attend/status 에 저장되므로
                 엑셀을 다시 올려도 고친 값이 남는다. */
              : lbl === '출석상태'
              ? h('div', null,
                  h(AttPicker, {
                    value: attText(att, attFull.marks), canEdit: canEditAtt, dark,
                    exempt: attExempt,
                    onPick: v => onAttStatus(m['고유ID'], v)
                  }),
                  canEditAtt && h('p', {
                    style:{ fontSize:'12.5px', color:'var(--text-3)', marginTop:'6px', lineHeight:1.5 }
                  }, '누르면 바로 저장됩니다. 엑셀을 다시 올려도 유지됩니다.')
                )
              : lbl === '주소'
              ? h('div', null,
                  h('div', { className:'irow-v' }, addr.base),
                  addr.detail && h('div', {
                    style:{ marginTop:'5px', display:'inline-flex', alignItems:'center', gap:'6px',
                            padding:'3px 10px', borderRadius:'8px',
                            background:'var(--surface-3)', color:'var(--text-2)',
                            fontSize:'14.5px', fontWeight:700 }
                  },
                    h('i', { className:'ti ti-building-community', style:{ fontSize:'15px', opacity:.75 } }),
                    addr.detail),
                  h(MapLinks, { query: addr.base })
                )
              : h('div', { className:'irow-v' }, val)
          ),
          (lbl === '휴대폰' || lbl === '집전화') && hasPhone(val)
            ? h(CallActions, { phone: val })
            : lbl === '주소' && addr.base
              ? h(CopyBtn, { text: addr.base, title:'주소 복사 (동·호수 제외)' })
              : null
        )),

        /* 고칠 수 있는 칸이 모두 비어 있으면 항목이 하나도 안 나온다 —
           그때도 [고치기] 로 들어갈 수 있게 한 줄 안내를 둔다. */
        !editing && canEditInfo && fields.length === 0 && h('div', {
          style:{ padding:'18px', fontSize:'14px', color:'var(--text-3)', lineHeight:1.7 }
        }, '적힌 정보가 없습니다. 위 ', h('b', null, '[고치기]'), ' 를 눌러 채워 주세요.')
      ),

      /* 심방 메모 — 전도인에게만, 전도인이 켜 둔 경우에만 */
      canVisit(role, visitCfg) && h(VisitNotes, { member:m, dark })
    )
  );
}

/*#ADMIN_ONLY_START*/
/* ═══════════════════════════════════════════════════════
   출석표 (v26 개편)

   무엇을 위한 것인가
   ─────────────────
   구역장·부장이 자기 명단을 한 명씩 눌러 체크하고,
   그 자리에서 명단 참석율과 교회 전체 참석율을 함께 보는 화면이다.

   v26에서 달라진 것
   ────────────────
   · 구역만이 아니라 부서(담당자 계정이 있는 부서)와
     전도인이 만든 별도 명단까지 고를 수 있다.
   · 한 사람은 주일에 딱 한 곳에만 나온다 (primaryGid 주석 참고).
   · 주일 말고 지정 날짜 모임(영유아부 모임 목요일 등)도 체크할 수 있다.

   왜 명단을 고르게 하나
   ────────────────────
   계정을 여러 구역장·부장이 함께 쓰기 때문에 프로그램은 누가 어디
   담당인지 알 수 없다. 그래서 처음 한 번 고르게 하고 기기에 기억시킨다
   (gsc_my_group). 그 뒤로는 열면 바로 자기 명단이 나온다.

   읽기 횟수
   ─────────
   화면을 열 때 3회 (명단 묶음 1 + 모임 목록 1 + 그 날짜 1).
   날짜를 바꾸면 1회 더. 명단을 바꿀 때는 0회.
   명단별·전체 참석율은 이미 받아 온 문서로 모두 계산한다.
═══════════════════════════════════════════════════════ */
function AttendView({ members, photos, logoUrl, role, fieldVis, attStatus, onAttStatus, listCfg,
                      onBack, onSelect, theme, toggle, onHome }) {
  const dark    = theme === 'dark';
  const isAdmin = ROLES[role] >= ROLES.admin;   /* 안내실·전도인은 모든 명단 */
  const canEdit = ROLES[role] >= ROLES.leader;
  /* 출석 체크는 그대로 두고 ★출석상태 고치기만★ 잠글 수 있다 (정식 1.12).
     한 번 정리해 두면 한동안 손댈 일이 없어, 주일 아침에 실수로
     상태를 건드리는 일을 막아 준다. */
  const attEditOn = canEditAttCfg(role, listCfg);

  const [groups, setGroups] = useState(null);   /* null = 불러오는 중 */
  const [events, setEvents] = useState(null);
  const [sel,    setSel]    = useState(() => 'w:' + lastSunday());
  const [checks, setChecks] = useState(null);
  const [err,    setErr]    = useState('');
  const [metaErr, setMetaErr] = useState('');
  const [tab,    setTab]    = useState('check');
  /* [집계] 탭에서 보고 있는 범위 — '' 은 교회 전체, 아니면 구역(명단) id */
  const [talGid, setTalGid] = useState('');
  /* 전체집계 표를 화면 가득 채워 보고 있나 (정식 1.18) */
  const [zoom, setZoom] = useState(false);
  const talInit = useRef(false);        /* 전도인 첫 구역을 한 번만 맞추는 표식 */
  const [openId, setOpenId] = useState('');
  const [bulkBusy, setBulkBusy] = useState(false);
  const [saveState, setSaveState] = useState('idle');   /* idle | pending | saving | saved */

  /* ★ 담당자 계정으로 들어오면 명단을 고르지 않는다 —
     계정 이름이 곧 담당 명단이므로 그 명단만 열린다. (1.06) */
  const scope = myScope();

  const [gid, setGid] = useState(() => {
    if (scope) return scope.gid;
    try { return localStorage.getItem('gsc_my_group') || ''; } catch(e) { return ''; }
  });
  function pickGid(v) {
    if (scope) return;                 /* 담당 명단은 바꿀 수 없다 */
    setGid(v); setOpenId('');
    try { v ? localStorage.setItem('gsc_my_group', v) : localStorage.removeItem('gsc_my_group'); } catch(e) {}
  }
  useEffect(() => { if (scope && gid !== scope.gid) setGid(scope.gid); }, [scope && scope.gid]);

  /* 명단 묶음과 모임 목록 — 화면을 열 때 한 번만 (읽기 2회) */
  useEffect(() => {
    let alive = true;
    Promise.all([
      fbLoadGroups().catch(e => { throw e; }),
      fbLoadEvents().catch(() => ({}))
    ]).then(([g, e]) => {
      if (!alive) return;
      setGroups(g); setEvents(e);
    }).catch(e => {
      if (!alive) return;
      setGroups({ list:{}, member:{} }); setEvents({});
      setMetaErr(fsErrMsg(e));
    });
    return () => { alive = false; };
  }, []);

  /* 체크하는 곳 기준 — 명단 고르기와 체크리스트가 이것을 쓴다 */
  const groupList = useMemo(() =>
    groups ? buildGroups(members, groups) : [], [members, groups]);

  /* 통계에 드는 곳 기준 — 참석율 탭의 '구역별'이 이것을 쓴다.
     청년회처럼 구역 통계에 드는 부서가 있으면 두 목록이 달라진다. */
  const statList = useMemo(() =>
    groups ? buildGroups(members, groups, 'stat') : [], [members, groups]);

  /* 옛 버전에서 쓰던 구역 기억값(gsc_my_gu)을 이어받는다 */
  useEffect(() => {
    if (scope || gid || !groups) return;
    try {
      const old = localStorage.getItem('gsc_my_gu');
      if (old) pickGid('gu_' + old);
    } catch(e) {}
  }, [groups]);

  /* 날짜 목록 — 주일 12개 + 내가 볼 수 있는 모임 */
  const sundays = useMemo(() => sundayList(12), []);
  const myEvents = useMemo(() => {
    if (!events) return [];
    return Object.keys(events)
      .map(id => ({ id, ...events[id] }))
      .filter(ev => canSeeEvent(ev, gid, role, members, groups))
      .sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));
  }, [events, gid, role, members, groups]);

  const selKind = sel.slice(0, 1);                 /* 'w' 주일 · 'e' 모임 */
  const selVal  = sel.slice(2);
  const curEvent = (selKind === 'e' && events) ? events[selVal] : null;
  const sheetKey = selKind === 'e' ? ('e_' + selVal) : ('w_' + selVal);

  /* 고른 모임이 사라졌거나(전도인이 지움) 내 담당이 아니게 되면 주일로 되돌린다 */
  useEffect(() => {
    if (selKind !== 'e' || !events) return;
    if (!curEvent || !canSeeEvent({ ...curEvent }, gid, role, members, groups)) setSel('w:' + lastSunday());
  }, [events, gid, role, sel, members, groups]);

  /* 그 날짜의 체크 기록 — 날짜를 바꿀 때만 다시 읽는다 */
  useEffect(() => {
    let alive = true;
    setChecks(null); setErr('');
    fbLoadSheet(sheetKey)
      .then(c => { if (alive) setChecks(c || {}); })
      .catch(e => { if (alive) { setChecks({}); setErr(fsErrMsg(e)); } });
    return () => { alive = false; };
  }, [sheetKey]);

  /* 지금 화면에 뿌릴 명단
     · 주일 : 고른 명단(구역·부서·별도)
     · 모임 : 그 모임의 대상 성도 (명단 선택과 무관) */
  /* ★ 출석상태 순으로 세운다 — 정상 · 주일만 · 불참 · 타지역 (정식 1.15)
     자세한 이유는 ATT_SORT 주석 참고. */
  const rows = useMemo(() => {
    if (!groups) return [];
    const base = curEvent
      ? eventTargets(members, curEvent, groups)
      : ((groupList.find(x => x.id === gid) || {}).list || []);
    return sortByAtt(base, attStatus);
  }, [members, groups, groupList, gid, curEvent, attStatus]);

  /* 묶음마다 몇 명인지 — 줄 사이에 넣는 작은 머리글에 쓴다.
     상태가 한 가지뿐이면 머리글을 넣지 않는다 (쓸모없는 줄이 되므로). */
  /* ★ 영유아는 상태 대신 「영유아」 한 묶음으로 센다 (isAttExempt 주석 참고) */
  const attKey = useCallback(m => isAttExempt(m) ? '영유아' : effAtt(m, attStatus), [attStatus]);
  const attGroups = useMemo(() => {
    const c = {};
    rows.forEach(m => { const k = attKey(m); c[k] = (c[k] || 0) + 1; });
    return { count: c, many: Object.keys(c).length > 1 };
  }, [rows, attKey]);

  /* 집계. 문서 하나로 전부 계산하므로 읽기가 늘지 않는다.

     ★ 교회 전체는 명단별 숫자를 더해서 구하지 않는다.
       청년회처럼 '체크는 청년부, 통계는 구역'인 사람이 있으면
       구역별과 부서별에 같은 사람이 한 번씩 들어간다.
       그것을 더하면 청년이 두 번 잡힌다.
       그래서 전체는 성도 목록을 한 번만 훑어 따로 구한다. */
  const stats = useMemo(() => {
    const calc = list => {
      const r = { total:0, target:0, come:0, absent:0, aCnt:0, bCnt:0, baby:0, inN:0, saveN:0 };
      list.forEach(m => {
        const f  = effAttFull(m, attStatus);
        const st = f.state;
        const on = !!(checks && checks[m['고유ID']]);
        const ex = isAttExempt(m);          /* 영유아 — 출석상태를 매기지 않는다 */
        r.total++;
        /* 전입·구원은 ★표식★ 이라 영유아께도 달 수 있으므로 먼저 센다 (1.18) */
        if (f.marks.indexOf('전입') >= 0) r.inN++;
        if (f.marks.indexOf('구원') >= 0) r.saveN++;
        if (ex) r.baby++;
        else {
          if (st === '출석A')  r.aCnt++;
          if (st === '출석B')  r.bCnt++;
          if (st === '미출석') r.absent++;
        }
        /* 미출석으로 두었던 분이 오랜만에 나오셔서 체크가 되면
           그 주에는 대상과 참석에 함께 넣는다. 그래야 참석율이 100%를
           넘지 않고, 돌아오신 분이 숫자에서 사라지지도 않는다.
           ★ 영유아는 주일 체크를 하지 않으므로 대상이 아니다.
             (별도 명단에 담아 체크하신 경우에만 그 주 대상에 들어간다) */
        if ((!ex && isAttTarget(st)) || on) { r.target++; if (on) r.come++; }
      });
      return r;
    };
    const meta = g => ({ ...calc(g.list), id:g.id, name:g.name, kind:g.kind });
    /* ★ 담당자 계정은 자기 명단만 본다 (1.06).
       남의 구역 숫자를 볼 이유가 없고, 화면도 훨씬 단순해진다. */
    const only = l => scope ? l.filter(g => g.id === scope.gid) : l;
    return {
      gu:    only(statList.filter(g => g.kind === 'gu'  || g.kind === 'none')).map(meta),
      dept:  only(groupList.filter(g => g.kind === 'dept')).map(meta),
      cust:  only(groupList.filter(g => g.kind === 'custom')).map(meta),
      sum:   calc(members),          /* 성도를 한 번만 훑는다 — 겹침 없음 */
      mine:  calc(rows)
    };
  }, [members, groupList, statList, rows, attStatus, checks, scope && scope.gid]);

  /* ═══ [집계] 탭 ═══════════════════════════════════════════
     주일 체크(그 날짜에 오셨나)와는 다른 숫자다.
     여기 나오는 것은 ★지금 등록되어 있는 출석상태★ 의 집계다 —
     교회에서 쓰시는 집계 서식(성인·교회학교·영유아 / 미출석 / 전입·전출·구원)
     을 그대로 화면에 옮겨 놓은 것이다.

     ★ 여기서 말하는 구역은 ★엑셀의 「구역」 칸★ 이다 (참석율 탭의
       통계 묶음이 아니다). 교적 집계이므로 그 구역에 사시는 교회학교
       학생·영유아도 그 구역 숫자에 함께 들어가야 서식의 칸이 채워진다.
       (참석율 탭은 '누가 누구를 체크하는가' 라서 기준이 다르다 — 그쪽은
        아이들이 부서에서 체크되므로 구역 숫자에 넣지 않는다.)

     ★ 담당자 계정으로 들어오시면 콤보 없이 자기 범위로 굳는다.
       구역 담당자는 그 구역, 부서 담당자는 그 부서 인원만 집계한다. */
  const talGus = useMemo(() => {
    const set = {};
    members.forEach(m => { set[String(m['구역'] || '').trim() || '미지정'] = 1; });
    return Object.keys(set).sort((a, b) =>
      (parseInt(a, 10) || 9999) - (parseInt(b, 10) || 9999) || a.localeCompare(b, 'ko'));
  }, [members]);

  /* 구역 담당자로 들어오셨나 — 숫자칸 구성을 정하는 데 쓴다 (정식 1.18) */
  const guScope  = !!(scope && scope.kind === 'gu');
  const talDept  = !!(scope && scope.kind === 'dept');

  /* ★ [집계] 탭을 ★칸마다 이름을 적는★ 방식으로 볼 분 (정식 1.18)
       · 구역 담당자 — 자기 구역 하나
       · 전도인      — 구역을 골라 가며 전 구역
     안내실은 교회 전체 숫자를 다루므로 예전 숫자 집계를 그대로 쓴다. */
  const nameTally = guScope || role === 'master';
  /* 전도인이 [집계] 를 처음 여실 때는 ★첫 구역★ 을 골라 둔다 (정식 1.18).
     교회 전체로 열면 이름이 오백 개 넘게 쏟아져 읽을 수가 없다.
     한 번만 맞추고, 그다음 고르신 것은 그대로 둔다. */
  useEffect(() => {
    if (talInit.current || scope || role !== 'master') return;
    if (!talGus.length) return;
    talInit.current = true;
    setTalGid(talGus[0]);
  }, [talGus, role]);

  /* 최대화 중에는 뒤 화면이 밀리지 않게 잠그고, [뒤로]·ESC 로도 닫는다 */
  useEffect(() => {
    if (!zoom) return;
    try { document.body.classList.add('zoomed'); } catch (e) {}
    const esc = e => { if (e.key === 'Escape') setZoom(false); };
    window.addEventListener('keydown', esc);
    return () => {
      try { document.body.classList.remove('zoomed'); } catch (e) {}
      window.removeEventListener('keydown', esc);
    };
  }, [zoom]);
  /* 탭을 옮기면 최대화는 저절로 풀린다 */
  useEffect(() => { setZoom(false); }, [tab]);

  /* 표를 감싸는 껍데기 — 최대화면 화면 전체, 아니면 카드 안 */
  const zoomBox = (title, node) => zoom
    ? h('div', { className:'zoomfull' },
        h('div', { className:'zoombar' },
          h('span', { style:{ flex:1, minWidth:0, fontSize:'13.5px', fontWeight:800,
                              overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' } }, title),
          h('span', { style:{ fontSize:'11.5px', color:'var(--text-3)', flexShrink:0 } },
            '옆으로 눕히면 더 넓게'),
          h('button', {
            type:'button', className:'btn btn-ghost btn-sm', style:{ flexShrink:0 },
            onClick: () => setZoom(false)
          }, h('i', { className:'ti ti-arrows-minimize', style:{ fontSize:'17px' } }), '닫기')),
        node)
    : node;

  const talPicked = scope ? (talDept ? '' : scope.code) : talGid;
  const talList = useMemo(() => {
    if (talDept)    return members.filter(m => scopeAllows(scope, m));
    if (!talPicked) return members;
    return members.filter(m => (String(m['구역'] || '').trim() || '미지정') === talPicked);
  }, [members, talPicked, talDept, scope && scope.gid]);
  const talName = talDept ? (scope.name || '내 부서')
                : talPicked ? (talPicked === '미지정' ? '구역 미지정' : talPicked + '구역')
                : '교회 전체';

  const tal = useMemo(() => tallyAtt(talList, attStatus), [talList, attStatus]);
  /* 구역별 한 줄 요약 — 전체를 보고 계실 때도 늘 함께 둔다 */
  const talRows = useMemo(() => scope ? [] :
    talGus.map(g => ({
      id: g,
      name: g === '미지정' ? '미지정' : g + '구역',
      t: tallyAtt(members.filter(m => (String(m['구역'] || '').trim() || '미지정') === g), attStatus)
    })),
    [talGus, members, attStatus, scope]);

  /* 소속을 교회에서 정하신 차례로 */
  const soSort = (a, b) => {
    const ia = SO_ORDER.indexOf(a), ib = SO_ORDER.indexOf(b);
    return ((ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib)) || a.localeCompare(b, 'ko');
  };

  /* ★ 고른 명단이 구역이면 — 그 구역인데 이 명단에 없는 분을 알려 준다 (1.16)
       구역장이 「우리 구역 34명인데 왜 31명이지?」 하고 헷갈리지 않도록,
       빠진 분을 ★이름까지★ 짚어 준다.
         · 교회학교 학생 — 그 부서에서 체크한다
         · 영유아        — 주일 체크를 하지 않는다 */
  const outsiders = useMemo(() => {
    if (curEvent || !gid || gid.indexOf('gu_') !== 0) return null;
    const code = gid.slice(3);
    const mine = new Set(((groupList.find(x => x.id === gid) || {}).list || [])
                          .map(m => String(m['고유ID'])));
    const rest = members.filter(m =>
      String(m['구역'] || '').trim() === code && !mine.has(String(m['고유ID'])));
    if (!rest.length) return null;
    const baby = rest.filter(m => isAttExempt(m));
    const byDept = {};
    rest.filter(m => !isAttExempt(m)).forEach(m => {
      const d = deptOf(m);
      const k = (d && d.name) || '다른 명단';
      (byDept[k] = byDept[k] || []).push(m['이름']);
    });
    return { baby: baby.map(m => m['이름']), byDept,
             total: rest.length, code };
  }, [members, groupList, gid, curEvent]);

  /* 구역 통계에 함께 드는 부서가 있는지 — 안내 문구를 낼지 정한다 */
  const inGuDepts = useMemo(() =>
    groups ? groupList.filter(g => g.kind !== 'gu' && g.list.length && groupInGu(g.id, groups)) : [],
    [groupList, groups]);

  const pct = (a, b) => (b > 0 ? Math.round(a / b * 100) : 0);
  const myStat = stats.mine;
  const myName = curEvent
    ? (curEvent.name || '모임')
    : ((groupList.find(x => x.id === gid) || {}).name || '');

  /* ═══════════════════════════════════════════════════
     체크를 모아서 저장한다 (정식 1.0)

     ★ 왜 바꿨나
     전에는 한 사람 누를 때마다 서버에 한 번씩 썼다.
     주일 아침에 구역장 30명이 각자 20명을 두드리면
     ★ 같은 문서 하나 ★ (attend/w_날짜)에 600번이 몰린다.
     Firestore 는 한 문서의 최대 쓰기 속도를 공개하지 않지만,
     "충분히 높은 쓰기 속도에서는 경합·지연·오류가 생긴다"고 안내한다.

     그래서 1.5초 동안 누른 것을 모아 ★ 한 번에 ★ 쓴다.
     20명을 연달아 누르면 쓰기가 20번에서 1번으로 줄어든다.

     ★ 저장을 놓치지 않기 위한 장치
     ① 1.5초 동안 아무것도 누르지 않으면 저장
     ② 모인 것이 12건을 넘으면 기다리지 않고 바로 저장
     ③ 날짜·명단을 바꾸거나 화면을 나가면 그 전에 저장
     ④ 앱을 접거나 화면이 가려지면(홈 버튼 등) 그 즉시 저장
     ⑤ 화면 위에 '저장 중… / 저장됨' 을 늘 보여 준다
        (어르신이 저장됐는지 몰라 불안하지 않게)
     ═══════════════════════════════════════════════════ */
  const ATT_DEBOUNCE_MS = 1500;
  const ATT_FLUSH_AT    = 12;

  const pendRef  = useRef({});     /* 아직 못 보낸 것 { 고유ID: true|false } */
  const timerRef = useRef(null);
  const keyRef   = useRef(sheetKey);
  keyRef.current = sheetKey;

  const flush = useCallback(async () => {
    if (timerRef.current) { clearTimeout(timerRef.current); timerRef.current = null; }
    const pend = pendRef.current;
    const ids  = Object.keys(pend);
    if (!ids.length) return;
    pendRef.current = {};
    const key = keyRef.current;
    setSaveState('saving');
    try {
      await fbSetSheetMixed(key, pend);
      setSaveState('saved');
      setTimeout(() => setSaveState(p => p === 'saved' ? 'idle' : p), 2000);
    } catch(e) {
      /* 실패하면 화면을 원래대로 되돌린다 (모아 둔 것 전부) */
      setChecks(c => {
        const back = { ...(c || {}) };
        ids.forEach(id => { if (pend[id]) delete back[id]; else back[id] = 1; });
        return back;
      });
      setErr(fsErrMsg(e));
      setSaveState('idle');
    }
  }, []);

  /* 날짜·명단이 바뀌거나 화면을 나갈 때 먼저 저장한다 */
  useEffect(() => () => { flush(); }, [flush]);
  useEffect(() => {
    const prev = keyRef.current;
    return () => { if (prev !== sheetKey) flush(); };
  }, [sheetKey, flush]);

  /* 앱을 접거나 화면이 가려질 때 바로 저장 */
  useEffect(() => {
    const go = () => { if (document.visibilityState === 'hidden') flush(); };
    document.addEventListener('visibilitychange', go);
    window.addEventListener('pagehide', flush);
    return () => {
      document.removeEventListener('visibilitychange', go);
      window.removeEventListener('pagehide', flush);
    };
  }, [flush]);

  function toggle(m) {
    if (!canEdit || !checks) return;
    const id = m['고유ID'];
    if (!id) return;
    const on = !checks[id];
    setChecks(c => {
      const nxt = { ...(c || {}) };
      if (on) nxt[id] = 1; else delete nxt[id];
      return nxt;
    });
    setErr('');
    /* 같은 사람을 두 번 눌러 원래대로 돌아왔으면 보낼 것이 없다 */
    const p = pendRef.current;
    p[id] = on;
    setSaveState('pending');
    if (Object.keys(p).length >= ATT_FLUSH_AT) { flush(); return; }
    if (timerRef.current) clearTimeout(timerRef.current);
    timerRef.current = setTimeout(flush, ATT_DEBOUNCE_MS);
  }

  /* ── 명단 전체 체크 / 해제 — 쓰기 1회 ───────────────── */
  async function bulk(on) {
    if (!canEdit || !checks || !rows.length) return;
    await flush();                       /* 모아 둔 것을 먼저 보낸다 */
    const targets = rows.filter(m => !isAttExempt(m) && isAttTarget(effAtt(m, attStatus)));
    if (!targets.length) return;
    if (!on && !confirm(myName + '의 이 날짜 체크를 모두 지울까요?')) return;
    const ids = targets.map(m => m['고유ID']).filter(Boolean);
    const before = { ...checks };
    const nxt = { ...checks };
    ids.forEach(id => { if (on) nxt[id] = 1; else delete nxt[id]; });
    setChecks(nxt); setBulkBusy(true); setErr('');
    try { await fbSetSheetBulk(sheetKey, ids, on); }
    catch(e) { setChecks(before); setErr(fsErrMsg(e)); }
    setBulkBusy(false);
  }

  function shiftWeek(n) {
    if (selKind !== 'w') return;
    flush();
    const d = new Date(selVal + 'T12:00:00');
    d.setDate(d.getDate() + n * 7);
    const v = ymdDash(d);
    if (v > lastSunday()) return;      /* 아직 오지 않은 주일은 열지 않는다 */
    setSel('w:' + v); setOpenId('');
  }

  const isThisWeek = selKind === 'w' && selVal === lastSunday();

  /* 참석율 막대 */
  const bar = (a, b, color) => h('div', {
    style:{ height:'8px', borderRadius:'999px', background:'var(--surface-3)', overflow:'hidden' }
  }, h('div', {
    style:{ width: pct(a,b) + '%', height:'100%', borderRadius:'999px',
            background: color, transition:'width .25s' }
  }));

  const KIND_LABEL = KIND_LABEL_X;

  /* 참석율 한 줄. clickable 이면 눌러서 그 명단의 체크 화면으로 간다
     (구역 줄은 청년 등이 섞여 있어 체크 명단과 다르므로 누를 수 없다) */
  function rateRow(r, clickable) {
    const p   = pct(r.come, r.target);
    const col = p >= 80 ? 'var(--ok)' : p >= 50 ? 'var(--warn)' : 'var(--bad)';
    const go  = clickable && (isAdmin || r.id === gid);
    return h('div', {
      key:r.id,
      onClick: () => { if (go) { pickGid(r.id); setTab('check'); } },
      style:{ cursor: go ? 'pointer' : 'default' }
    },
      h('div', {
        style:{ display:'flex', alignItems:'baseline', justifyContent:'space-between',
                marginBottom:'5px', gap:'8px' }
      },
        h('span', { style:{ fontSize:'15px', fontWeight:700, minWidth:0,
                            overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' } },
          r.name,
          r.id === gid && h('span', {
            style:{ fontSize:'11.5px', fontWeight:800, color:'var(--navy)',
                    marginLeft:'6px', padding:'2px 7px', borderRadius:'999px',
                    background:'var(--soft)' }
          }, '내 명단')
        ),
        h('span', { style:{ fontSize:'13.5px', color:'var(--text-2)', fontWeight:700, flexShrink:0 } },
          r.come + '/' + r.target + '명 · ',
          h('b', { style:{ color:col, fontSize:'15px' } }, p + '%'))
      ),
      bar(r.come, r.target, col)
    );
  }

  return h('div', { className:'screen' },
    h(AppBar, {
      title: curEvent ? '모임 출석' : '주일 출석표', icon:'clipboard-check', logoUrl,
      /* 체크하던 것을 먼저 저장하고 첫 화면으로 간다 */
      onHome: onHome ? (() => { flush(); onHome(); }) : null,
      left:  h(NBtn, { onClick: () => { flush(); onBack(); }, icon:'arrow-left' }, '목록'),
      right: h(ThemeBtn, { theme, toggle })
    }),

    h('div', {
      style:{ background:'var(--surface)', borderBottom:'1px solid var(--border)', display:'flex',
              position:'sticky', top:'calc(var(--bar-h) + env(safe-area-inset-top))', zIndex:20 }
    },
      /* ★ 구역 담당자께는 [참석율] 탭을 두지 않는다 (정식 1.18).
           구역 담당자는 자기 명단 하나뿐이라 명단끼리 견줄 것이 없고,
           그 숫자는 [출석 체크] 탭 맨 위 「내 명단」 칸에 이미 나온다. */
      [['check','출석 체크','checkbox']]
        .concat(guScope ? [] : [['stat','참석율','chart-bar']])
        .concat([['tally','집계','report-analytics']])
        /* 전도인께만 [전체집계] — 전 구역을 한 표에 펼쳐 보는 자리다 (1.18) */
        .concat(role === 'master'
          ? [['all','전체집계','table'], ['all2','전체집계2','table-column']] : []).map(([id, lbl, ic]) =>
        h('button', {
          key:id, type:'button', onClick: () => { flush(); setTab(id); },
          style:{ flex:1, padding:'12px 6px 10px', border:'none', background:'transparent',
                  cursor:'pointer', display:'flex', flexDirection:'column', alignItems:'center', gap:'3px',
                  color: tab === id ? 'var(--navy)' : 'var(--text-3)',
                  fontWeight: tab === id ? 800 : 600, fontSize:'13px',
                  borderBottom:'3px solid ' + (tab === id ? 'var(--navy)' : 'transparent') }
        }, h('i', { className:'ti ti-' + ic, style:{ fontSize:'21px' } }), lbl))
    ),

    h('div', { className:'wrap pb-safe', style:{ paddingTop:'14px', display:'flex', flexDirection:'column', gap:'12px' } },

      metaErr && h('div', { className:'note note-bad' },
        metaErr,
        h('div', { style:{ marginTop:'6px', fontSize:'12.5px', opacity:.85 } },
          '보안 규칙에 ', h('b', null, 'attend'), ' 항목이 있는지 확인하세요.')),

      /* ── 날짜 고르기 ───────────────────────────────────
         ★ [집계] 탭에서는 감춘다 — 집계는 지금 등록된 출석상태를 세는 것이라
           고른 주일과 아무 상관이 없다. 남겨 두면 「이 주일의 집계」로 오해하신다. */
      /* ★ [집계]·[전체집계] 에서는 주일 날짜 칸을 감춘다 — 두 집계 모두
           ★지금 등록된 출석상태★ 를 세는 것이라 고른 주일과 상관이 없다.
           남겨 두면 「이 주일의 집계」 로 오해하신다. */
      tab !== 'tally' && tab !== 'all' && tab !== 'all2' && h(Card, null,
        h('div', { style:{ display:'flex', alignItems:'center', gap:'8px' } },
          h('button', {
            type:'button', className:'act', onClick: () => shiftWeek(-1),
            disabled: selKind !== 'w', style:{ opacity: selKind === 'w' ? 1 : .35 }, title:'지난 주일'
          }, h('i', { className:'ti ti-chevron-left' })),
          h('div', { style:{ flex:1, textAlign:'center', minWidth:0 } },
            curEvent
              ? h(React.Fragment, null,
                  h('p', { style:{ fontSize:'18px', fontWeight:800, letterSpacing:'-.02em' } },
                    curEvent.name || '모임'),
                  h('p', { style:{ fontSize:'13px', color:'var(--navy)', marginTop:'2px', fontWeight:700 } },
                    weekLabel(curEvent.date) + ' (' + dowLabel(curEvent.date) + ')')
                )
              : h(React.Fragment, null,
                  h('p', { style:{ fontSize:'19px', fontWeight:800, letterSpacing:'-.02em' } },
                    weekLabel(selVal), ' 주일'),
                  h('p', { style:{ fontSize:'12.5px', color:'var(--text-3)', marginTop:'2px' } },
                    isThisWeek ? '이번 주일' : selVal)
                )
          ),
          h('button', {
            type:'button', className:'act', onClick: () => shiftWeek(1),
            disabled: selKind !== 'w' || isThisWeek,
            style:{ opacity: (selKind === 'w' && !isThisWeek) ? 1 : .35 }, title:'다음 주일'
          }, h('i', { className:'ti ti-chevron-right' }))
        ),
        h('select', {
          value:sel, onChange: e => { flush(); setSel(e.target.value); setOpenId(''); },
          style:{ marginTop:'10px' }
        },
          h('optgroup', { label:'주일' },
            sundays.map(w => h('option', { key:w, value:'w:' + w },
              weekLabel(w) + ' 주일' + (w === lastSunday() ? ' (이번 주)' : '')))),
          myEvents.length > 0 && h('optgroup', { label:'모임' },
            myEvents.map(ev => h('option', { key:ev.id, value:'e:' + ev.id },
              weekLabel(ev.date) + '(' + dowLabel(ev.date) + ') ' + (ev.name || '모임'))))
        ),
        curEvent && h('p', {
          style:{ fontSize:'12.5px', color:'var(--text-3)', marginTop:'8px', lineHeight:1.6 }
        },
          '대상: ', h('b', null, targetLabel(curEvent, groupList)),
          curEvent.memo ? ' · ' + curEvent.memo : '',
          h('br'),
          '주일 출석과 따로 기록되므로 주일 참석율에는 섞이지 않습니다.'),
        err && h('div', { className:'note note-bad', style:{ marginTop:'10px' } },
          err,
          h('div', { style:{ marginTop:'6px', fontSize:'12.5px', opacity:.85 } },
            '권한 오류라면 Firebase 보안 규칙에 ', h('b', null, 'attend'), ' 항목이 있는지 확인하세요.'))
      ),

      /* ═══ 출석 체크 탭 ═══ */
      tab === 'check' && h(React.Fragment, null,

        /* 모임을 보고 있을 때는 명단을 고르지 않는다 — 대상이 이미 정해져 있다 */
        !curEvent && h(Card, null,
          h(SLabel, { icon:'users-group', text: scope ? '내 명단' : (isAdmin ? '명단 고르기' : '내 명단') }),
          scope
            ? h('div', { style:{ display:'flex', alignItems:'center', gap:'10px', padding:'12px 14px',
                                 background:'var(--soft)', border:'1px solid var(--soft-bd)',
                                 borderRadius:'var(--r)' } },
                h('i', { className:'ti ti-' + (scope.kind === 'dept' ? 'school' : 'map-pin'),
                         style:{ fontSize:'21px', color:'var(--navy)' } }),
                h('div', { style:{ flex:1, minWidth:0 } },
                  h('p', { style:{ fontSize:'17px', fontWeight:800, color:'var(--navy)' } }, scope.name),
                  h('p', { style:{ fontSize:'12.5px', color:'var(--navy)', opacity:.75, marginTop:'1px' } },
                    ((groupList.find(g => g.id === scope.gid) || {}).list || []).length + '명 · 담당하신 명단입니다'))
              )
            : groups === null
            ? h('p', { style:{ fontSize:'14px', color:'var(--text-3)' } }, '불러오는 중...')
            : h('select', { value:gid, onChange: e => pickGid(e.target.value) },
                h('option', { value:'' }, '명단을 골라 주세요'),
                ['gu','dept','custom','none'].map(k => {
                  const ls = groupList.filter(g => g.kind === k);
                  if (!ls.length) return null;
                  return h('optgroup', { key:k, label:KIND_LABEL[k] },
                    ls.map(g => h('option', { key:g.id, value:g.id },
                      g.name + ' (' + g.list.length + '명)')));
                })
              ),
          !isAdmin && !scope && h('p', {
            style:{ fontSize:'12.5px', color:'var(--text-3)', marginTop:'8px', lineHeight:1.55 }
          }, '한 번 고르시면 이 휴대폰은 다음부터 바로 이 명단이 나옵니다.'),
          /* ★ 이 구역인데 이 명단에 없는 분 — 이름까지 짚어 준다 */
          outsiders
            ? h('div', { className:'note note-info',
                         style:{ marginTop:'10px', fontSize:'12.5px', lineHeight:1.65 } },
                h('b', null, outsiders.code + '구역 ' + outsiders.total + '명'),
                '은 이 명단에 없습니다.',
                Object.keys(outsiders.byDept).map(k => h(React.Fragment, { key:k }, h('br'),
                  h('b', null, k + '에서 체크'), ' — ', outsiders.byDept[k].join(', '))),
                outsiders.baby.length > 0 && h(React.Fragment, null, h('br'),
                  h('b', null, '영유아는 주일 체크를 하지 않습니다'), ' — ',
                  outsiders.baby.join(', ')))
            : h('p', {
                style:{ fontSize:'12px', color:'var(--text-3)', marginTop:'6px', lineHeight:1.55 }
              }, (DEPT_DEFS.map(d => d.name).join('·') || '부서') +
                 ' 학생은 그 부서 명단에서 체크합니다. 영유아는 주일 체크를 하지 않습니다. ' +

      /* ═══ 집계 탭 (정식 1.16) ═══════════════════════════════
         교회에서 쓰시는 집계 서식을 그대로 화면에 옮긴 것이다.
           성인   출석A+B · 출석A · 출석B · 소속별 출석A
           교회학교 총원 · 부서별

           미출석 · 전입 · 전출 · 구원
         맨 아래에 「등록인원 = 총출석인원 + 미출석」 이 맞는지 한눈에 보인다. */
      /* ═══ 구역 담당자 집계 — 칸마다 ★이름★ 을 적는다 (정식 1.18) ═══

         교회에서 쓰시는 종이 서식 그대로다 —
           출석A(봉사회·어머니회·은장회·청년회) · 출석B(같은 네 회) ·
           교회학교 · 영유아 · 미출석(성인·학생) · 전입 · 전출 · 구원.
         종이는 가로로 길지만 휴대폰에서는 가로 표를 읽을 수 없으므로
         ★세로로 길게★ 펼쳐 놓았다. 칸마다 그 칸에 드는 분 이름이 들어간다.

         ★ 한 사람은 출석A·출석B·교회학교·영유아·미출석 중 ★한 칸★ 에만 든다.
           전입·전출·구원은 표식이라 위 칸과 겹쳐서 또 나온다.
         ★ 교회학교 학생은 부서에서 체크하지만, 교적 집계라 그 구역 칸에 함께 적는다
           (미출석이면 「미출석 - 학생」 으로 간다). */
      /* ═══ [전체집계] — 가로에 항목, 세로에 구역 (정식 1.18) ═══
         교회 서식 그대로 한 장에 펼친 표다. 세는 일은 buildAllTally 가 한다.
         맨 윗줄(항목)과 왼쪽 구역 칸은 밀어도 제자리에 붙어 있다(틀고정). */
      tab === 'all' && role === 'master' && (() => {
        const T = buildAllTally(members, attStatus, talGus);
        return h(Card, null,
          h('div', { style:{ display:'flex', alignItems:'center', gap:'8px', flexWrap:'wrap' } },
            h('div', { style:{ flex:1, minWidth:0 } },
              h(SLabel, { icon:'table', text:'전체집계 \u2014 구역별 이름' })),
            h('button', {
              type:'button', className:'btn btn-ghost btn-sm', style:{ flexShrink:0 },
              onClick: () => { try { saveAllTallyXlsx(T, 'all'); }
                               catch(e) { alert('엑셀 저장 실패: ' + e.message); } }
            }, h('i', { className:'ti ti-file-spreadsheet', style:{ fontSize:'18px' } }), '엑셀로 저장'),
            h('button', {
              type:'button', className:'btn btn-ghost btn-sm', style:{ flexShrink:0 },
              onClick: () => setZoom(true)
            }, h('i', { className:'ti ti-arrows-maximize', style:{ fontSize:'18px' } }), '최대화')),
          h('p', { style:{ fontSize:'12.5px', color:'var(--text-3)', lineHeight:1.65 } },
            '교회 ', h('b', null, T.allN + '명'), ' 을 구역 차례로 펼쳤습니다. ',
            h('b', null, '봉'), '사회 · ', h('b', null, '어'), '머니회 · ',
            h('b', null, '은'), '장회 · ', h('b', null, '청'), '년회 로 줄여 적었고, ',
            '칸이 많아 ', h('b', null, '가로·세로로 밀어'), ' 보시면 됩니다 \u2014 ',
            '맨 윗줄(항목)과 왼쪽 구역 칸은 밀어도 ', h('b', null, '제자리에 붙어'), ' 있습니다. ',
            '주일 날짜와 상관없이 ', h('b', null, '지금 등록된 출석상태'), ' 를 셉니다. ',
            h('b', null, '[최대화]'), ' 를 누르고 휴대폰을 옆으로 눕히면 훨씬 넓게 보입니다.'),
          zoomBox('전체집계 — 구역별 이름',
          h('div', { className:'alltab-wrap', style:{ margin:'10px -4px 0' } },
            h('table', { className:'alltab' },
              h('thead', null,
                h('tr', null,
                  h('th', { className:'gu sep', rowSpan:2 }, '구역'),
                  T.GROUPS.map((g, gi) => h('th', {
                    key:g.t, colSpan: g.subs ? g.subs.length : 1,
                    rowSpan: g.subs ? 1 : 2, style:{ color:g.c },
                    className: gi < T.GROUPS.length - 1 ? 'sep' : ''
                  }, g.t))
                ),
                h('tr', null,
                  T.GROUPS.filter(g => g.subs).map(g =>
                    g.subs.map((s, si) => h('th', {
                      key:g.t + s, style:{ color:g.c },
                      className: si === g.subs.length - 1 ? 'sep' : ''
                    }, s)))
                )
              ),
              h('tbody', null,
                T.rows.map((r, ri) => h('tr', { key:r.gu, className: ri % 2 ? 'alt' : '' },
                  h('th', { className:'sep' }, (r.gu === '미지정' ? '미지정' : r.gu + '구역'),
                    h('div', { style:{ fontSize:'10px', fontWeight:700, color:'var(--text-3)' } },
                      r.n + '명')),
                  T.KEYS.map(k => allCell(r.c[k], k, T.COL[k], T.SEP[k] ? 'sep' : ''))
                )).concat([
                  h('tr', { key:'__sum', className:'sum' },
                    h('th', { className:'sep' }, '합계',
                      h('div', { style:{ fontSize:'10px', fontWeight:700, color:'var(--text-3)' } },
                        T.allN + '명')),
                    T.KEYS.map(k => h('td', {
                      key:k, className: T.SEP[k] ? 'sep' : '', style:{ color:T.COL[k] }
                    }, T.total[k]))
                  )
                ])
              )
            )))
        );
      })(),

      /* ═══ [전체집계2] — 위 표의 ★가로·세로를 서로 바꾼 것★ (정식 1.18) ═══
         가로 : 첫 구역부터 끝 구역까지, 맨 오른쪽이 합계
         세로 : 출석A(봉·어·은·청) · 출석B(봉·어·은·청) ·
                교회학교 · 영유아 · 미출석 · 전입 · 전출 · 구원
         구역 수가 항목 수보다 많은 교회에서는 이쪽이 읽기 편하다.
         왼쪽 항목 칸과 맨 윗 구역 줄은 밀어도 제자리에 붙어 있다. */
      tab === 'all2' && role === 'master' && (() => {
        const T = buildAllTally(members, attStatus, talGus);
        return h(Card, null,
          h('div', { style:{ display:'flex', alignItems:'center', gap:'8px', flexWrap:'wrap' } },
            h('div', { style:{ flex:1, minWidth:0 } },
              h(SLabel, { icon:'table-column', text:'전체집계2 \u2014 항목별 이름' })),
            h('button', {
              type:'button', className:'btn btn-ghost btn-sm', style:{ flexShrink:0 },
              onClick: () => { try { saveAllTallyXlsx(T, 'all2'); }
                               catch(e) { alert('엑셀 저장 실패: ' + e.message); } }
            }, h('i', { className:'ti ti-file-spreadsheet', style:{ fontSize:'18px' } }), '엑셀로 저장'),
            h('button', {
              type:'button', className:'btn btn-ghost btn-sm', style:{ flexShrink:0 },

            }, h('i', { className:'ti ti-arrows-maximize', style:{ fontSize:'18px' } }), '최대화')),
          h('p', { style:{ fontSize:'12.5px', color:'var(--text-3)', lineHeight:1.65 } },
            '[전체집계] 와 같은 내용을 ', h('b', null, '가로·세로만 바꿔'), ' 놓은 표입니다 \u2014 ',
            '가로가 구역, 세로가 항목입니다. 교회 ', h('b', null, T.allN + '명'), '. ',
            '왼쪽 항목 칸과 맨 윗 구역 줄은 밀어도 ', h('b', null, '제자리에 붙어'), ' 있습니다. ',
            h('b', null, '[최대화]'), ' 를 누르고 휴대폰을 옆으로 눕히면 훨씬 넓게 보입니다.'),
          zoomBox('전체집계2 — 항목별 이름',
          h('div', { className:'alltab-wrap', style:{ margin:'10px -4px 0' } },
            h('table', { className:'alltab tx' },
              h('thead', null,
                h('tr', null,
                  h('th', { className:'gu sep' }, '항목'),
                  T.rows.map((r, ri) => h('th', {
                    key:r.gu, className: ri % 2 ? 'alt' : ''
                  }, (r.gu === '미지정' ? '미지정' : r.gu),
                    h('div', { style:{ fontSize:'10px', fontWeight:700, color:'var(--text-3)' } },
                      r.n + '명'))),
                  h('th', { key:'__t', className:'sum' }, '합계')
                )
              ),
              h('tbody', null,
                T.KEYS.map(k => h('tr', {
                  key:k, className: T.SEP[k] ? 'gsep' : ''
                },
                  h('th', { className:'sep', style:{ color:T.COL[k] } }, T.LABEL[k],
                    h('div', { style:{ fontSize:'10px', fontWeight:700, color:'var(--text-3)' } },
                      T.total[k] + '명')),
                  T.rows.map((r, ri) =>
                    allCell(r.c[k], r.gu, T.COL[k], ri % 2 ? 'alt' : '')),
                  h('td', { key:'__t', className:'sum', style:{ color:T.COL[k] } }, T.total[k])
                ))
              )
            )))
        );
      })(),

      tab === 'tally' && nameTally && (() => {
        const HOE = ['봉사회', '어머니회', '은장회', '청년회', '그 밖'];
        const hoeOf = m => {
          const so = String(m['소속'] || '').trim();
          if (so === '은장회' || so === '은빛장년회') return '은장회';
          if (so === '청년회' || so === '대학부')     return '청년회';
          if (so === '봉사회' || so === '어머니회')   return so;
          return '그 밖';
        };
        const box = { a:{}, b:{}, school:[], baby:[], adultX:[], studentX:[],
                      into:[], out:[], saved:[] };
        talList.forEach(m => {
          const f  = effAttFull(m, attStatus);
          const nm = String(m['이름'] || '').trim();
          if (f.marks.indexOf('전입') >= 0) box.into.push(nm);
          if (f.marks.indexOf('전출') >= 0) box.out.push(nm);
          if (f.marks.indexOf('구원') >= 0) box.saved.push(nm);
          if (isAttExempt(m)) { box.baby.push(nm); return; }
          const student = !!deptOf(m);
          if (f.state === '미출석') { (student ? box.studentX : box.adultX).push(nm); return; }
          if (student) { box.school.push(nm); return; }
          ((f.state === '출석B') ? box.b : box.a)[hoeOf(m)] =
            (((f.state === '출석B') ? box.b : box.a)[hoeOf(m)] || []).concat([nm]);
        });
        const ko = (x, y) => x.localeCompare(y, 'ko');
        [box.a, box.b].forEach(o => Object.keys(o).forEach(k => o[k].sort(ko)));
        [box.school, box.baby, box.adultX, box.studentX,
         box.into, box.out, box.saved].forEach(l => l.sort(ko));
        const sum = o => HOE.reduce((s, k) => s + ((o[k] || []).length), 0);
        const aN = sum(box.a), bN = sum(box.b);
        const xN = box.adultX.length + box.studentX.length;
        const regN = aN + bN + box.school.length + box.baby.length + xN;

        /* 이름 한 줄 — 왼쪽에 칸 이름과 인원, 오른쪽에 이름을 감싸 넣는다 */
        const row = (label, arr, col) => h('div', {
          key: label,
          style:{ display:'flex', gap:'9px', alignItems:'flex-start',
                  padding:'9px 0', borderTop:'1px solid var(--border)' }
        },
          h('div', { style:{ flex:'0 0 58px', paddingTop:'3px' } },
            h('div', { style:{ fontSize:'12.5px', fontWeight:800, letterSpacing:'-.04em',
                               color: col || 'var(--text-2)', whiteSpace:'nowrap' } }, label),
            h('div', { style:{ fontSize:'11px', fontWeight:700, color:'var(--text-3)' } },
              arr.length + '명')),
          h('div', { style:{ flex:1, minWidth:0, display:'flex', flexWrap:'wrap', gap:'4px' } },
            arr.length
              ? arr.map((n, i) => h('span', { key:n + '_' + i,
                  style:{ fontSize:'13.5px', fontWeight:700, padding:'4px 9px',
                          borderRadius:'999px', background:'var(--soft)',
                          border:'1px solid var(--soft-bd)', whiteSpace:'nowrap' } }, n))
              : h('span', { style:{ fontSize:'12.5px', color:'var(--text-3)', paddingTop:'4px' } },
                  '\u2014'))
        );
        const sec = (title, n, col, icon, kids) => h(Card, { key:title },
          h('div', { style:{ display:'flex', alignItems:'center', gap:'7px' } },
            h('i', { className:'ti ti-' + icon, style:{ fontSize:'19px', color:col } }),
            h('span', { style:{ fontSize:'15.5px', fontWeight:800, color:col } }, title),
            h('span', { style:{ fontSize:'13px', fontWeight:800, color:'var(--text-3)' } },
              n + '명')),
          kids
        );
        /* 네 회는 비어 있어도 칸을 둔다 (서식과 줄이 맞아야 읽기 쉽다).
           「그 밖」 은 소속이 비었거나 다른 분이 계실 때만 나온다. */
        const hoeRows = o => HOE.filter(k => k !== '그 밖' || (o[k] || []).length)
                               .map(k => row(k, o[k] || [], null));
        return h(React.Fragment, null,
          /* 담당 구역이 없는 분(전도인)께는 구역을 고르는 칸을 드린다 —
             한 구역씩 넘겨 가며 전 구역을 보실 수 있다. */
          !scope && h(Card, { key:'pick' },
            h(SLabel, { icon:'filter', text:'구역 고르기' }),
            h('select', {
              value: talGid, onChange: e => setTalGid(e.target.value),
              style:{ fontSize:'17px', fontWeight:800, textAlign:'center' }
            },
              talGus.map(g => h('option', { key:g, value:g },
                g === '미지정' ? '구역 미지정' : g + '구역')),
              h('option', { value:'' }, '교회 전체 (이름이 많습니다)')
            ),
            h('div', { style:{ display:'flex', gap:'7px', marginTop:'9px' } },
              [['이전', -1], ['다음', 1]].map(([lbl, d]) => h('button', {
                key: lbl, type:'button', className:'btn btn-ghost btn-sm',
                style:{ flex:1 },
                disabled: !talGid,
                onClick: () => {
                  const i = talGus.indexOf(talGid);
                  if (i < 0) return;
                  const j = i + d;
                  if (j >= 0 && j < talGus.length) setTalGid(talGus[j]);
                }
              }, lbl + ' 구역'))),
            h('p', { style:{ fontSize:'12.5px', color:'var(--text-3)', marginTop:'9px', lineHeight:1.6 } },
              '구역을 고르시면 그 구역의 ', h('b', null, '이름'), ' 이 칸마다 나옵니다. ',
              '구역 담당자께 보이는 것과 같은 화면입니다.')),
          h(Card, { key:'sum' },
            h(SLabel, { icon:'sum', text: talName + ' \u2014 집계' }),
            h('p', { style:{ fontSize:'14px', fontWeight:700, lineHeight:1.75 } },
              '등록 ', h('b', { style:{ fontSize:'17px', color:'var(--navy)' } }, regN + '명'),
              ' = 출석A ', h('b', { style:{ color:'var(--ok)' } }, aN),
              ' · 출석B ', h('b', { style:{ color:'var(--warn)' } }, bN),
              ' · 교회학교 ', h('b', { style:{ color:'var(--navy-2)' } }, box.school.length),
              ' · 영유아 ', h('b', { style:{ color:'var(--violet)' } }, box.baby.length),
              ' · 미출석 ', h('b', { style:{ color:'var(--bad)' } }, xN)),
            h('p', { style:{ fontSize:'12.5px', color:'var(--text-3)', marginTop:'8px', lineHeight:1.6 } },
              '주일 체크와는 다른 숫자입니다. 지금 등록되어 있는 ',
              h('b', null, '출석상태'), ' 를 칸마다 이름으로 적은 것입니다. ',
              '엑셀 「구역」 칸 기준이라 그 구역의 교회학교·영유아도 함께 들어갑니다.')),
          sec('출석A', aN, 'var(--ok)', 'circle-check', hoeRows(box.a)),
          sec('출석B', bN, 'var(--warn)', 'circle-dashed', hoeRows(box.b)),
          sec('교회학교', box.school.length, 'var(--navy-2)', 'school',
              [row('학생', box.school, null)]),
          sec('영유아', box.baby.length, 'var(--violet)', 'mood-kid',
              [row('영유아', box.baby, null)]),
          sec('미출석', xN, 'var(--bad)', 'circle-x',
              [row('성인', box.adultX, null), row('학생', box.studentX, null)]),
          sec('전입 · 전출 · 구원',
              box.into.length + box.out.length + box.saved.length,
              'var(--navy)', 'bookmark',
              [row('전입', box.into, 'var(--violet)'),
               row('전출', box.out, 'var(--bad)'),
               row('구원', box.saved, 'var(--navy-2)')])
        );
      })(),

      tab === 'tally' && !nameTally && h(React.Fragment, null,

        /* ── 범위 고르기 ── */
        h(Card, null,
          h(SLabel, { icon:'filter', text:'집계 범위' }),
          scope
            ? h('p', { style:{ fontSize:'14.5px', color:'var(--text-2)', lineHeight:1.7 } },
                h('b', null, scope.name), ' 만 집계합니다.')
            : h('select', {
                value: talGid, onChange: e => setTalGid(e.target.value),
                style:{ fontSize:'16px', fontWeight:700, textAlign:'center' }
              },
                h('option', { value:'' }, '교회 전체'),
                talGus.map(g => h('option', { key:g, value:g },
                  g === '미지정' ? '구역 미지정' : g + '구역'))
              ),
          h('p', { style:{ fontSize:'12.5px', color:'var(--text-3)', marginTop:'8px', lineHeight:1.6 } },
            '주일 출석 체크와는 다른 숫자입니다. 여기 나오는 것은 ',
            h('b', null, '지금 등록되어 있는 출석상태'), ' 를 센 것입니다. ',
            '구역은 ', h('b', null, '엑셀의 「구역」 칸'), ' 기준이라 그 구역의 교회학교·영유아도 함께 들어갑니다.')
        ),

        /* ── 한눈에 ── */
        h(Card, null,
          h(SLabel, { icon:'sum', text: talName + ' \u2014 총집계' }),
          h('div', { style:{ display:'flex', alignItems:'baseline', gap:'8px', marginBottom:'10px' } },
            h('span', { style:{ fontSize:'42px', fontWeight:800, color:'var(--navy)',
                                letterSpacing:'-.04em', lineHeight:1 } }, tal.attended),
            h('span', { style:{ fontSize:'15px', color:'var(--text-2)', fontWeight:700 } },
              '/ 등록 ' + tal.registered + '명')
          ),
          bar(tal.attended, tal.registered, 'var(--navy)'),
          h('div', { style:{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:'5px', marginTop:'12px' } },
            [ { l:'총출석인원', v:tal.attended,   c:'var(--ok)' },
              { l:'미출석',    v:tal.absent,     c:'var(--bad)' },
              { l:'등록인원',   v:tal.registered, c:'var(--navy)' }
            ].map(({l,v,c}) => h('div', { key:l, className:'stat', style:{ padding:'11px 2px' } },
              h('div', { className:'stat-v', style:{ color:c, fontSize:'21px' } }, v),
              h('div', { className:'stat-l', style:{ fontSize:'11.5px', letterSpacing:'-.03em' } }, l)
            ))
          ),
          h('p', { style:{ fontSize:'12px', color:'var(--text-3)', marginTop:'9px', lineHeight:1.6 } },
            h('b', null, '등록인원 = 총출석인원 + 미출석'), ' 입니다. ',
            '총출석인원은 성인 · 교회학교 · 영유아를 모두 더한 수입니다.')
        ),

        /* ── 무리별 ── */
        TAL_BANDS.map(({ key, label, icon }) => {
          const b   = tal[key];
          const sos = Object.keys(b.so).sort(soSort);
          if (!b.ab && !sos.length) return null;
