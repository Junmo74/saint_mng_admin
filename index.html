/* ═══════════════════════════════════════════════════════
   사진 관리
═══════════════════════════════════════════════════════ */
/* ═══════════════════════════════════════════════════════
   사진 일괄 저장 (안내실 [사진] 탭)

   ★ 왜 길이 둘인가
   요즘 크롬·엣지(컴퓨터)는 ★폴더를 고르면 그 안에 파일을 바로 쓸 수 있다★
   (showDirectoryPicker). 그러면 「김규동.jpg」 처럼 이름 그대로 저장된다.
   사파리·파이어폭스·휴대폰에는 그 기능이 없다. 그때는 한 묶음(zip)으로
   내려받아 풀어 쓰시게 한다.

   ★ 압축은 하지 않는다 ('store' 방식)
   사진은 이미 JPEG 로 눌려 있어 다시 눌러도 줄지 않는다.
   담기만 하면 되므로 바깥 라이브러리 없이 여기서 직접 만든다.
═══════════════════════════════════════════════════════ */
const CRC_TABLE = (function() {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[i] = c >>> 0;
  }
  return t;
})();

function crc32(buf) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

/* data:image/jpeg;base64,... → 바이트 */
function dataUrlBytes(u) {
  const i = String(u || '').indexOf(',');
  if (i < 0) return null;
  let bin;
  try { bin = atob(u.slice(i + 1)); } catch(e) { return null; }
  const out = new Uint8Array(bin.length);
  for (let k = 0; k < bin.length; k++) out[k] = bin.charCodeAt(k);
  return out;
}

function dataUrlExt(u) {
  const m = /^data:image\/([a-z0-9+.-]+)/i.exec(String(u || ''));
  const t = (m ? m[1] : 'jpeg').toLowerCase();
  return (t === 'jpeg' || t === 'jpg') ? 'jpg' : (t === 'svg+xml' ? 'svg' : t);
}

/* 윈도·맥에서 파일 이름에 못 쓰는 글자를 걷어낸다 */
function safeFileName(s) {
  return String(s || '').replace(/[\\/:*?"<>|]/g, '').replace(/\s+/g, ' ').trim() || '이름없음';
}

/* 사진마다 파일 이름을 정한다 — 성도 이름 그대로, 겹치면 뒤에 번호 */
function photoFileNames(ids, byId, all) {
  const used = {}, out = {};
  ids.forEach(id => {
    const m = byId[id];
    const base = m ? safeFileName(String(m['이름'] || '') + String(m['동명이인구분'] || ''))
                   : ('주인없음_' + id);
    const ext = dataUrlExt(all[id]);
    let nm = base + '.' + ext, n = 1;
    while (used[nm.toLowerCase()]) { n++; nm = base + '_' + n + '.' + ext; }
    used[nm.toLowerCase()] = 1;
    out[id] = nm;
  });
  return out;
}

/* 압축 없이 담기만 하는 zip */
function makeStoreZip(files) {
  const enc = new TextEncoder();
  const body = [], dir = [];
  let off = 0, dirSize = 0;
  files.forEach(f => {
    const name = enc.encode(f.name);
    const crc = crc32(f.data), len = f.data.length;

    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true);
    lh.setUint16(6, 0x0800, true);            /* 이름이 UTF-8 이라고 알린다 */
    lh.setUint16(8, 0, true);                 /* 담기만 함 */
    lh.setUint16(10, 0, true); lh.setUint16(12, 0x2821, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, len, true); lh.setUint32(22, len, true);
    lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    body.push(new Uint8Array(lh.buffer), name, f.data);

    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
    ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, 0, true); ch.setUint16(14, 0x2821, true);
    ch.setUint32(16, crc, true); ch.setUint32(20, len, true); ch.setUint32(24, len, true);
    ch.setUint16(28, name.length, true);
    ch.setUint32(38, 0, true); ch.setUint32(42, off, true);
    dir.push(new Uint8Array(ch.buffer), name);

    dirSize += 46 + name.length;
    off     += 30 + name.length + len;
  });
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, dirSize, true); end.setUint32(16, off, true);
  return new Blob(body.concat(dir, [new Uint8Array(end.buffer)]), { type:'application/zip' });
}

/* ═══ [성도 등록 요청] — 구역 담당자 화면 (정식 1.19) ═══════
   새로 오신 분을 적어 보내면 안내실이 주소록에 올린다.
   구역은 「미배정」으로 굳어 있다 — 어느 구역으로 넣을지는
   안내실이 정하는 것이 교회 관례이기 때문이다. */
function RegRequest({ me, members, dark }) {
  const [rec,  setRec]  = useState(blankReq);
  const [list, setList] = useState(null);      /* null = 불러오는 중 */
  const [busy, setBusy] = useState(false);
  const [msg,  setMsg]  = useState('');
  const [open, setOpen] = useState(false);     /* 적는 칸을 펴 두었나 */

  const soList = useMemo(() => {
    const s = [...new Set(members.map(m => String(m['소속'] || '').trim()).filter(Boolean))];
    return s.sort((a, b) => {
      const ia = SO_ORDER.indexOf(a), ib = SO_ORDER.indexOf(b);
      return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib) || a.localeCompare(b, 'ko');
    });
  }, [members]);

  const reload = useCallback(() => {
    fbLoadReqs().then(setList).catch(e => { setList([]); setMsg('bad:' + fsErrMsg(e)); });
  }, []);
  useEffect(() => { reload(); }, [reload]);

  async function send() {
    const nm = String(rec.이름 || '').trim();
    if (!nm) { setMsg('bad:이름을 적어 주세요.'); return; }
    setBusy(true); setMsg('');
    try {
      const one = { ...rec, 이름:nm, 구역:'미배정',
                    id: rec.id || newReqId(),
                    by: rec.by || me,
                    at: rec.at || new Date().toISOString() };
      await fbSaveReq(one);
      setRec(blankReq()); setOpen(false);
      setMsg('ok:' + nm + ' 님 등록 요청을 보냈습니다. 안내실이 확인한 뒤 주소록에 올립니다.');
      reload();
    } catch (e) { setMsg('bad:' + fsErrMsg(e)); }
    setBusy(false);
  }
  async function remove(r) {
    if (!confirm((r.이름 || '') + ' 님 등록 요청을 지울까요?')) return;
    setBusy(true); setMsg('');
    try { await fbDeleteReq(r.id); setMsg('ok:지웠습니다.'); reload(); }
    catch (e) { setMsg('bad:' + fsErrMsg(e)); }
    setBusy(false);
  }

  const mine = (list || []).filter(r => String(r.by || '') === String(me));
  const other = (list || []).filter(r => String(r.by || '') !== String(me));

  return h(React.Fragment, null,
    h(Card, null,
      h(SLabel, { icon:'user-plus', text:'새로 오신 분 등록 요청' }),
      h('p', { style:{ fontSize:'13px', color:'var(--text-3)', lineHeight:1.7, marginBottom:'10px' } },
        '전입하신 분이나 구원받으신 분을 적어 보내시면 ', h('b', null, '안내실'),
        ' 이 확인한 뒤 주소록에 올립니다. 올라가기 전까지는 ',
        h('b', null, '「미배정」'), ' 으로 목록에 보입니다. ',
        '아는 것만 적으셔도 됩니다 — ', h('b', null, '이름'), ' 과 ',
        h('b', null, '사유'), ' 만 있으면 보낼 수 있습니다.'),
      open
        ? h(React.Fragment, null,
            h(ReqForm, { rec, set:setRec, guPick:false, soList, busy }),
            h('div', { style:{ display:'flex', gap:'8px', marginTop:'6px' } },
              h('button', { type:'button', className:'btn btn-primary', style:{ flex:1 },
                            disabled:busy, onClick:send },
                busy ? '보내는 중...' : (rec.id ? '고친 내용 보내기' : '요청 보내기')),
              h('button', { type:'button', className:'btn btn-ghost', disabled:busy,
                            onClick: () => { setRec(blankReq()); setOpen(false); setMsg(''); } }, '그만두기')))
        : h('button', { type:'button', className:'btn btn-primary btn-block',
                        onClick: () => { setRec(blankReq()); setOpen(true); setMsg(''); } },
            h('i', { className:'ti ti-plus', style:{ fontSize:'19px' } }), '새 등록 요청 적기'),
      msg ? h('p', { className:'note ' + (msg.indexOf('ok:') === 0 ? 'note-ok' : 'note-bad'),
                     style:{ marginTop:'10px' } }, msg.slice(msg.indexOf(':') + 1)) : null
    ),

    h(Card, null,
      h(SLabel, { icon:'clock', text:'보낸 요청 ' + (list ? mine.length + '건' : '') }),
      list === null
        ? h('p', { style:{ fontSize:'13.5px', color:'var(--text-3)', padding:'10px 0' } }, '불러오는 중...')
        : mine.length === 0
          ? h('p', { style:{ fontSize:'13.5px', color:'var(--text-3)', padding:'10px 0' } },
              '아직 보낸 요청이 없습니다.')
          : mine.map(r => h(ReqRow, { key:r.id, r,
              right: h('div', { style:{ display:'flex', gap:'6px', flexShrink:0 } },
                h('button', { type:'button', className:'btn btn-ghost btn-sm', disabled:busy,
                              onClick: () => { setRec({ ...blankReq(), ...r }); setOpen(true); setMsg(''); } }, '고치기'),
                h('button', { type:'button', className:'btn btn-ghost btn-sm', disabled:busy,
                              onClick: () => remove(r) }, '지우기')) })),
      other.length > 0 && h('p', {
        style:{ fontSize:'12.5px', color:'var(--text-3)', marginTop:'10px', lineHeight:1.6 }
      }, '다른 구역에서 보낸 요청이 ', h('b', null, other.length + '건'),
         ' 더 있습니다. 목록 화면에서 구역을 ', h('b', null, '「미배정」'), ' 으로 고르시면 함께 보입니다.')
    )
  );
}

/* ═══ [성도 등록] — 안내실·전도인 화면 (정식 1.19) ══════════
   구역에서 올라온 요청을 확인해 내용을 다듬고,
   ★안내실★ 이 구역을 정해 주소록에 올린다.
   전도인은 검토·수정까지만 한다 — 명단·사진 쓰기는 보안 규칙이
   안내실에게만 열려 있기 때문이다 (규칙을 고치지 않았다). */
function RegDesk({ members, photos, fieldVis, family, dark, canRegister, onMembersUpdate, onPhotoUpdate }) {
  const [list, setList] = useState(null);
  const [rec,  setRec]  = useState(null);      /* null = 고른 것 없음 */
  const [isNew, setIsNew] = useState(false);
  const [busy, setBusy] = useState(false);
  const [msg,  setMsg]  = useState('');

  const soList = useMemo(() => {
    const s = [...new Set(members.map(m => String(m['소속'] || '').trim()).filter(Boolean))];
    return s.sort((a, b) => {
      const ia = SO_ORDER.indexOf(a), ib = SO_ORDER.indexOf(b);
      return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib) || a.localeCompare(b, 'ko');
    });
  }, [members]);
  const guCodes = useMemo(() => {
    const s = [...new Set(members.map(m => String(m['구역'] || '').trim()).filter(Boolean))];
    (GU_CODES_FIXED || []).forEach(g => { if (s.indexOf(g) < 0) s.push(g); });
    return s.sort((a, b) => (parseInt(a, 10) || 999) - (parseInt(b, 10) || 999));
  }, [members]);

  const reload = useCallback(() => {
    fbLoadReqs().then(setList).catch(e => { setList([]); setMsg('bad:' + fsErrMsg(e)); });
  }, []);
  useEffect(() => { reload(); }, [reload]);

  async function saveReq() {
    const nm = String(rec.이름 || '').trim();
    if (!nm) { setMsg('bad:이름을 적어 주세요.'); return; }
    setBusy(true); setMsg('');
    try {
      await fbSaveReq({ ...rec, 이름:nm, id: rec.id || newReqId(),
                        at: rec.at || new Date().toISOString() });
      setMsg('ok:요청 내용을 고쳐 두었습니다.'); setRec(null); reload();
    } catch (e) { setMsg('bad:' + fsErrMsg(e)); }
    setBusy(false);
  }

  /* ★ 주소록에 올리기 — 안내실만
       ① 온전한 명단을 읽어 한 줄 더한 뒤 네 벌을 다시 만든다
          (엑셀을 올릴 때와 같은 길이라 보안 규칙을 고칠 필요가 없다)
       ② 사진이 있으면 photos·thumbs 로 옮긴다
       ③ 요청 문서는 지운다 — 이제 주소록에 있으므로 */
  async function register() {
    const nm = String(rec.이름 || '').trim();
    if (!nm) { setMsg('bad:이름을 적어 주세요.'); return; }
    const gu = String(rec.구역 || '').trim();
    if (!gu || gu === '미배정') { setMsg('bad:구역을 정해 주세요.'); return; }
    setBusy(true); setMsg('');
    try {
      const master = await fbLoadMasterMembers();
      if (!master.length) throw new Error('온전한 명단을 읽지 못했습니다.');
      const id = rec.id || newReqId();
      const one = reqToMember({ ...rec, id, 이름:nm, 구역:gu });
      const dup = master.some(x => String(x['고유ID']) === String(id));
      const next = dup
        ? master.map(x => (String(x['고유ID']) === String(id) ? { ...x, ...one } : x))
        : master.concat([one]);
      await fbSaveMembers(next, fieldVis, family);

      if (rec.photo) {
        try {
          const img = await loadImageFromDataUrl(rec.photo);
          const fullU = toDataUrlCapped(img, FULL_DIM, FULL_Q, 850000);
          const thumb = toDataUrl(img, THUMB_DIM, THUMB_Q);
          await fbSavePhotoDoc(id, fullU);
          await fbSaveThumbs({ ...(photos || {}), [id]: thumb });
          onPhotoUpdate && onPhotoUpdate(id, thumb);
        } catch (pe) { /* 사진만 실패해도 등록은 살린다 */ }
      }
      if (rec.id) { try { await fbDeleteReq(rec.id); } catch (de) {} }

      onMembersUpdate && onMembersUpdate(next);
      setRec(null); setIsNew(false);
      setMsg('ok:' + nm + ' 님을 ' + gu + '구역으로 주소록에 올렸습니다.');
      reload();
    } catch (e) { setMsg('bad:' + fsErrMsg(e)); }
    setBusy(false);
  }

  async function remove(r) {
    if (!confirm((r.이름 || '') + ' 님 등록 요청을 지울까요?')) return;
    setBusy(true); setMsg('');
    try { await fbDeleteReq(r.id); setMsg('ok:지웠습니다.'); setRec(null); reload(); }
    catch (e) { setMsg('bad:' + fsErrMsg(e)); }
    setBusy(false);
  }

  const noteBox = msg ? h('p', {
    className:'note ' + (msg.indexOf('ok:') === 0 ? 'note-ok' : 'note-bad'),
    style:{ marginTop:'10px' }
  }, msg.slice(msg.indexOf(':') + 1)) : null;

  return h(React.Fragment, null,
    rec
      ? h(Card, null,
          h(SLabel, { icon:'user-edit', text: isNew ? '새 성도 직접 입력' : '요청 내용 다듬기' }),
          !canRegister && h('div', { className:'note note-info', style:{ marginBottom:'10px' } },
            h('b', null, '주소록에 올리는 것은 안내실이 합니다.'), h('br'),
            h('span', { style:{ fontSize:'13px', opacity:.9 } },
              '여기서 고쳐 두시면 안내실이 그대로 올립니다.')),
          h(ReqForm, { rec, set:setRec, guPick:canRegister, guCodes, soList, busy }),
          h('div', { style:{ display:'flex', gap:'8px', marginTop:'6px', flexWrap:'wrap' } },
            canRegister && h('button', { type:'button', className:'btn btn-primary',
                                         style:{ flex:'1 1 150px' }, disabled:busy, onClick:register },
              busy ? '올리는 중...' : '주소록에 등록'),
            !isNew && h('button', { type:'button', className:'btn btn-ghost',
                                    style:{ flex:'1 1 110px' }, disabled:busy, onClick:saveReq },
              '요청만 고쳐 두기'),
            h('button', { type:'button', className:'btn btn-ghost', disabled:busy,
                          onClick: () => { setRec(null); setIsNew(false); setMsg(''); } }, '그만두기')),
          noteBox)
      : h(Card, null,
          h(SLabel, { icon:'user-plus', text:'성도 등록' }),
          h('p', { style:{ fontSize:'13px', color:'var(--text-3)', lineHeight:1.7, marginBottom:'10px' } },
            '구역에서 올라온 ', h('b', null, '등록 요청'), ' 을 고르면 내용을 다듬을 수 있습니다. ',
            canRegister
              ? h(React.Fragment, null, '구역을 정해 ', h('b', null, '[주소록에 등록]'),
                  ' 을 누르면 명단에 올라가고 요청은 사라집니다.')
              : '주소록에 올리는 것은 안내실이 합니다.'),
          canRegister && h('button', {
            type:'button', className:'btn btn-primary btn-block', disabled:busy,
            onClick: () => { setRec({ ...blankReq(), id:newReqId(), 구역:'' }); setIsNew(true); setMsg(''); }
          }, h('i', { className:'ti ti-plus', style:{ fontSize:'19px' } }), '새 성도 직접 입력'),
          noteBox),

    h(Card, null,
      h(SLabel, { icon:'inbox', text:'등록 요청 ' + (list ? list.length + '건' : '') }),
      list === null
        ? h('p', { style:{ fontSize:'13.5px', color:'var(--text-3)', padding:'10px 0' } }, '불러오는 중...')
        : list.length === 0
          ? h('p', { style:{ fontSize:'13.5px', color:'var(--text-3)', padding:'10px 0' } },
              '올라온 요청이 없습니다.')
          : list.map(r => h(ReqRow, { key:r.id, r,
              right: h('div', { style:{ display:'flex', gap:'6px', flexShrink:0 } },
                h('button', { type:'button', className:'btn btn-ghost btn-sm', disabled:busy,
                              onClick: () => { setRec({ ...blankReq(), ...r }); setIsNew(false); setMsg(''); } },
                  canRegister ? '열기' : '보기'),
                h('button', { type:'button', className:'btn btn-ghost btn-sm', disabled:busy,
                              onClick: () => remove(r) }, '지우기')) }))
    )
  );
}

function PhotoManager({ members, photos, onPhotoUpdate, onPhotosReset, dark }) {
  const [delWord,  setDelWord]  = useState('');
  const [delBusy,  setDelBusy]  = useState(false);
  const [delProg,  setDelProg]  = useState({ done:0, total:0 });
  const [delMsg,   setDelMsg]   = useState('');
  const [step,        setStep]        = useState('idle');
  const [pending,     setPending]     = useState([]);
  const [progress,    setProgress]    = useState({ done:0, total:0 });
  const [conflicts,   setConflicts]   = useState([]);
  const [conflictIdx, setConflictIdx] = useState(0);
  const [unmatched,   setUnmatched]   = useState([]);
  const [resolving,   setResolving]   = useState(false);
  const [pre,         setPre]         = useState(null);
  const [skipExist,   setSkipExist]   = useState(false);
  const [diag,        setDiag]        = useState(null);
  const [diagBusy,    setDiagBusy]    = useState(false);
  const [firstErr,    setFirstErr]    = useState('');
  const abortRef = useRef(false);
  const photoCount = Object.keys(photos || {}).length;

  const [saveBusy, setSaveBusy] = useState(false);
  const [saveProg, setSaveProg] = useState({ done:0, total:0 });
  const [saveMsg,  setSaveMsg]  = useState('');

  /* 저장된 사진을 모두 읽어 성도 이름 그대로 컴퓨터에 저장한다 */
  async function saveAllPhotos() {
    if (!confirm('저장된 사진을 모두 읽어 컴퓨터에 저장합니다.\n\n'
      + '· 사진 수만큼 읽기가 발생합니다 (약 ' + photoCount + '건)\n'
      + '· 파일 이름은 성도 이름 그대로입니다 (예: 김규동.jpg)\n\n계속할까요?')) return;
    setSaveBusy(true); setSaveMsg(''); setSaveProg({ done:0, total:0 });
    try {
      const all = await fbLoadAllPhotos();
      const ids = Object.keys(all);
      if (!ids.length) { setSaveMsg('err:저장된 사진이 없습니다.'); setSaveBusy(false); return; }

      const byId = {};
      (members || []).forEach(m => { byId[String(m['고유ID'])] = m; });
      const names = photoFileNames(ids, byId, all);
      setSaveProg({ done:0, total:ids.length });

      /* ① 폴더를 고를 수 있는 브라우저 — 이름 그대로 바로 쓴다 */
      if (typeof window !== 'undefined' && window.showDirectoryPicker) {
        let dir = null;
        try { dir = await window.showDirectoryPicker({ mode:'readwrite' }); }
        catch(e) { setSaveMsg('err:폴더를 고르지 않으셨습니다.'); setSaveBusy(false); return; }
        let ok = 0;
        for (let i = 0; i < ids.length; i++) {
          const bytes = dataUrlBytes(all[ids[i]]);
          if (bytes) {
            try {
              const fh = await dir.getFileHandle(names[ids[i]], { create:true });
              const w  = await fh.createWritable();
              await w.write(bytes);
              await w.close();
              ok++;
            } catch(e) {}
          }
          if (i % 5 === 0 || i === ids.length - 1) setSaveProg({ done:i + 1, total:ids.length });
        }
        setSaveMsg('ok:사진 ' + ok + '장을 고르신 폴더에 저장했습니다. 이름은 성도 이름 그대로입니다.');
      } else {
        /* ② 그 밖의 브라우저 — 한 묶음으로 내려받는다 */
        const files = [];
        ids.forEach(id => {
          const b = dataUrlBytes(all[id]);
          if (b) files.push({ name:names[id], data:b });
        });
        setSaveProg({ done:ids.length, total:ids.length });
        const d  = new Date();
        const ts = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
        const url = URL.createObjectURL(makeStoreZip(files));
        const a = document.createElement('a');
        a.href = url; a.download = FILE_TAG + '_사진_' + ts + '.zip';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 8000);
        setSaveMsg('ok:사진 ' + files.length + '장을 한 묶음으로 내려받았습니다. 압축을 푸시면 이름 그대로 나옵니다.');
      }
    } catch(e) { setSaveMsg('err:' + fsErrMsg(e)); }
    setSaveBusy(false);
  }

  function handleSelect(e) {
    const files = Array.from(e.target.files);
    if (!files.length) return;
    setPending(files);
    setPre(preflight(files, members));
    setStep('ready');
    setProgress({ done:0, total:files.length });
    setConflicts([]); setUnmatched([]); setFirstErr('');
    e.target.value = '';
  }

  async function runDiag() {
    setDiagBusy(true); setDiag(null);
    const r = await diagnoseFirestore();
    setDiag(r); setDiagBusy(false);
  }

  async function uploadOne(file, member, thumbBag) {
    const img   = await loadImageFromFile(file);
    const fullU = toDataUrlCapped(img, FULL_DIM, FULL_Q, 850000);
    const thumb = toDataUrl(img, THUMB_DIM, THUMB_Q);
    await fbSavePhotoDoc(member['고유ID'], fullU);
    PHOTO_CACHE[member['고유ID']] = fullU;
    thumbBag[member['고유ID']] = thumb;
    onPhotoUpdate(member['고유ID'], thumb);
  }

  async function wipeAllPhotos() {
    if (delWord.trim() !== '삭제') { setDelMsg('err:"삭제"라고 정확히 입력해 주세요'); return; }
    if (!confirm('등록된 사진을 모두 지웁니다.\n\n· 성도 명단과 연락처는 그대로 남습니다\n· 사진만 전부 사라집니다\n· 되돌릴 수 없습니다\n\n계속하시겠습니까?')) return;
    setDelBusy(true); setDelMsg(''); setDelProg({ done:0, total:0 });
    try {
      const n = await fbDeleteAllPhotos((done, total) => setDelProg({ done, total }));
      onPhotosReset && onPhotosReset();
      setDelWord('');
      setStep('idle'); setPending([]); setPre(null); setUnmatched([]);
      setDelMsg('ok:사진 ' + n + '건을 모두 지웠습니다. 이제 처음부터 다시 올리시면 됩니다');
    } catch(e) { setDelMsg('err:' + fsErrMsg(e)); }
    setDelBusy(false);
  }

  async function rebuildThumbs() {
    if (!confirm('Firestore에 저장된 사진을 모두 읽어 목록용 썸네일을 다시 만듭니다.\n사진 수만큼 읽기가 발생합니다. 계속할까요?')) return;
    setStep('rebuilding'); setFirstErr('');
    try {
      const all = await fbLoadAllPhotos();
      const ids = Object.keys(all);
      setProgress({ done:0, total:ids.length });
      const bag = {};
      for (let i = 0; i < ids.length; i++) {
        if (abortRef.current) break;
        try {
          const img = await loadImageFromUrl(all[ids[i]]);
          bag[ids[i]] = toDataUrl(img, THUMB_DIM, THUMB_Q);
          onPhotoUpdate(ids[i], bag[ids[i]]);
        } catch(e) {}
        if (i % 10 === 0 || i === ids.length - 1) setProgress({ done:i+1, total:ids.length });
      }
      const n = await fbSaveThumbs({ ...(photos || {}), ...bag });
      setUnmatched([]);
      setFirstErr('');
      alert('완료했습니다.\n썸네일 ' + Object.keys(bag).length + '명 · 문서 ' + n + '개');
      setStep('idle');
    } catch(e) {
      setFirstErr(fsErrMsg(e));
      setStep('idle');
      alert('실패: ' + fsErrMsg(e));
    }
  }

  async function startUpload() {
    if (!pending.length) return;
    abortRef.current = false;
    setStep('processing'); setFirstErr('');

    const jobs = [], cfls = [], unm = [];
    pending.forEach(file => {
      const mt = matchFilename(file.name, members);
      if (mt.length === 1) {
        if (skipExist && photos && photos[mt[0]['고유ID']]) {
          unm.push({ name:file.name, reason:'이미 사진 있음 (건너뜀)' });
        } else jobs.push({ file, member: mt[0] });
      }
      else if (mt.length > 1) cfls.push({ file, matches: mt });
      else unm.push({ name:file.name, reason:'일치하는 성도 없음' });
    });

    const total = jobs.length;
    let done = 0, failed = 0;
    setProgress({ done:0, total });
    const thumbBag = {};

    let cursor = 0;
    const worker = async () => {
      while (true) {
        if (abortRef.current) return;
        const i = cursor++;
        if (i >= jobs.length) return;
        const { file, member } = jobs[i];
        try {
          await uploadOne(file, member, thumbBag);
          done++;
        } catch(err) {
          failed++;
          const reason = fsErrMsg(err);
          unm.push({ name:file.name, reason });
          if (failed === 1) setFirstErr(reason);
          if (failed >= 5 && done === 0) abortRef.current = true;
        }
        setProgress({ done, total });
      }
    };
    await Promise.all([worker(), worker(), worker(), worker()]);

    if (abortRef.current && done === 0) {
      jobs.slice(cursor).forEach(j => unm.push({ name:j.file.name, reason:'중단됨' }));
    }

    if (Object.keys(thumbBag).length) {
      try { await fbSaveThumbs({ ...(photos || {}), ...thumbBag }); }
      catch(e) { setFirstErr('썸네일 저장 실패: ' + fsErrMsg(e)); }
    }

    setUnmatched(unm); setConflicts(cfls);
    if (cfls.length > 0 && !abortRef.current) { setConflictIdx(0); setStep('conflicts'); }
    else setStep('done');
  }

  async function resolveConflict(member) {
    if (resolving) return; setResolving(true);
    try {
      const bag = {};
      await uploadOne(conflicts[conflictIdx].file, member, bag);
      await fbSaveThumbs({ ...(photos || {}), ...bag });
      setProgress(p => ({ ...p, done: p.done + 1 }));
    } catch(e) {
      setUnmatched(u => [...u, { name:conflicts[conflictIdx].file.name, reason:fsErrMsg(e) }]);
    }
    advance(); setResolving(false);
  }
  function skipConflict() {
    setUnmatched(u => [...u, { name:conflicts[conflictIdx].file.name, reason:'건너뜀' }]);
    advance();
  }
  function advance() {
    const next = conflictIdx + 1;
    if (next >= conflicts.length) setStep('done');
    else setConflictIdx(next);
  }

  return h('div', { style:{ display:'flex', flexDirection:'column', gap:'12px' } },

    h(Card, null,
      h(SLabel, { icon:'photo', text:'사진 현황' }),
      h('div', { style:{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'10px' } },
        [{ l:'사진 등록됨', v:photoCount, c:'var(--ok)' },
         { l:'사진 없음',   v:Math.max(0, members.length - photoCount), c:'var(--text-3)' }]
          .map(({l,v,c}) => h('div', {
            key:l, style:{ background:'var(--surface-2)', border:'1px solid var(--border)',
                           borderRadius:'var(--r)', padding:'14px', textAlign:'center' }
          },
            h('p', { style:{ fontSize:'26px', fontWeight:800, color:c, lineHeight:1.1 } }, v, h('span', { style:{ fontSize:'15px' } }, '명')),
            h('p', { style:{ fontSize:'13px', color:'var(--text-2)', marginTop:'4px', fontWeight:600 } }, l)
          ))
      )
    ),

    h(Card, null,
      h(SLabel, { icon:'download', text:'사진 일괄 저장' }),
      h('p', { style:{ fontSize:'13.5px', color:'var(--text-2)', lineHeight:1.75, marginBottom:'12px' } },
        '올려 둔 사진을 모두 ', h('b', null, '성도 이름 그대로'), ' 컴퓨터에 저장합니다 (예: ',
        h('code', null, '김규동.jpg'), '). 동명이인은 ', h('code', null, '이한나A.jpg'), ' 처럼 나옵니다.', h('br'),
        h('span', { style:{ fontSize:'12.5px', color:'var(--text-3)' } },
          '컴퓨터 크롬·엣지에서는 폴더를 고르면 그 안에 바로 저장되고, ',
          '그 밖의 브라우저에서는 한 묶음(zip)으로 내려받습니다.')),
      h('button', {
        type:'button', onClick:saveAllPhotos, disabled:saveBusy || !photoCount,
        className:'btn btn-primary btn-block'
      },
        saveBusy
          ? h('span', { className:'spinner', style:{ width:'16px', height:'16px', borderWidth:'2px' } })
          : h('i', { className:'ti ti-download', style:{ fontSize:'19px' } }),
        saveBusy
          ? (saveProg.total ? '저장 중... ' + saveProg.done + ' / ' + saveProg.total : '사진을 읽는 중...')
          : '사진 ' + photoCount + '장 모두 저장'),
      saveMsg && h('p', {
        className: 'note ' + (saveMsg.startsWith('ok:') ? 'note-ok' : 'note-bad'),
        style:{ marginTop:'10px' }
      }, saveMsg.slice(saveMsg.indexOf(':') + 1))
    ),

    h(Card, null,
      h(SLabel, { icon:'plug-connected', text:'저장 상태 점검' }),

      h('div', { className:'note note-info', style:{ marginBottom:'12px' } },
        '사진은 ', h('b', null, 'Firestore'), '에 저장됩니다. Cloud Storage(유료)는 쓰지 않습니다.', h('br'),
        h('span', { style:{ fontSize:'13px', opacity:.85 } },
          '목록에는 작은 썸네일만, 원본은 성도 상세 화면을 열 때만 불러옵니다.')
      ),

      h('div', { style:{ display:'flex', gap:'8px', flexWrap:'wrap' } },
        h('button', {
          type:'button', onClick:runDiag, disabled:diagBusy,
          className:'btn btn-ghost btn-sm', style:{ flex:'1 1 140px' }
        },
          diagBusy
            ? h('span', { className:'spinner', style:{ width:'15px', height:'15px', borderWidth:'2px' } })
            : h('i', { className:'ti ti-stethoscope', style:{ fontSize:'18px' } }),
          diagBusy ? '확인 중...' : '연결 진단'
        ),
        h('button', {
          type:'button', onClick:rebuildThumbs,
          disabled: step === 'processing' || step === 'rebuilding',
          className:'btn btn-ghost btn-sm', style:{ flex:'1 1 140px' }
        }, h('i', { className:'ti ti-refresh', style:{ fontSize:'18px' } }), '썸네일 다시 만들기')
      ),

      step === 'rebuilding' && h('div', { style:{ marginTop:'12px' } },
        h('div', { style:{ display:'flex', justifyContent:'space-between', fontSize:'14px',
                           marginBottom:'8px', fontWeight:700 } },
          h('span', null, '기존 사진 변환 중...'),
          h('span', { style:{ color:'var(--navy)' } }, progress.done + ' / ' + progress.total)
        ),
        h('div', { className:'progress' },
          h('div', { style:{ width:(progress.total ? Math.round(progress.done/progress.total*100) : 0) + '%' } }))
      ),

      diag && h('div', {
        className: 'note ' + (diag.ok ? 'note-ok' : 'note-bad'),
        style:{ marginTop:'12px' }
      },
        h('b', null, diag.ok ? '연결 정상' : '연결 실패'), h('br'),
        diag.msg,
        diag.code ? h('span', { style:{ opacity:.7 } }, ' (' + diag.code + ')') : null,
        diag.hint ? h('div', {
          style:{ marginTop:'8px', paddingTop:'8px', borderTop:'1px solid currentColor',
                  opacity:.9, fontSize:'13px', whiteSpace:'pre-wrap',
                  fontFamily:'ui-monospace,SFMono-Regular,monospace', lineHeight:1.6 }
        }, diag.hint) : null
      ),

      h('p', { style:{ fontSize:'13px', color:'var(--text-3)', marginTop:'12px', lineHeight:1.7 } },
        '이미 Firestore에 사진이 있는데 목록에 안 보이면 ', h('b', null, '썸네일 다시 만들기'), '를 한 번 눌러 주세요.', h('br'),
        '썸네일 규격이 64px로 바뀌었습니다. 한 번 다시 만들면 성도들의 첫 접속이 더 빨라집니다.')
    ),

    h(Card, { style:{ borderColor:'color-mix(in srgb,var(--bad) 34%,var(--border))' } },
      h(SLabel, { icon:'trash', text:'사진 전체 삭제' }),

      h('div', { className:'note note-warn', style:{ marginBottom:'14px' } },
        '사진이 엉뚱한 사람에게 붙어 꼬였을 때 쓰는 기능입니다.', h('br'),
        h('b', null, '성도 명단·연락처·주소는 그대로 남습니다.'), ' 사진만 지웁니다.', h('br'),
        h('span', { style:{ fontSize:'13px', opacity:.85 } },
          '지운 뒤 파일명을 확인해서 처음부터 다시 올리시면 깔끔해집니다.')
      ),

      h('div', { style:{ display:'flex', alignItems:'center', gap:'10px',
                         background:'var(--surface-2)', border:'1px solid var(--border)',
                         borderRadius:'var(--r)', padding:'12px', marginBottom:'12px' } },
        h('span', { style:{ fontSize:'26px', fontWeight:800, color:'var(--bad)', lineHeight:1 } },
          Object.keys(photos || {}).length),
        h('span', { style:{ fontSize:'14px', color:'var(--text-2)', fontWeight:600 } },
          '명의 사진이 등록되어 있습니다')
      ),

      h('p', { style:{ fontSize:'14px', color:'var(--text-2)', marginBottom:'8px', fontWeight:600 } },
        '확인을 위해 아래 칸에 ', h('b', { style:{ color:'var(--bad)' } }, '삭제'), ' 라고 입력하세요'),
      h('input', {
        type:'text', value:delWord, placeholder:'삭제', disabled:delBusy,
        onChange: e => { setDelWord(e.target.value); setDelMsg(''); },

      }),

      delBusy && h('div', { style:{ marginBottom:'10px' } },
        h('div', { style:{ display:'flex', justifyContent:'space-between', fontSize:'14px',

          h('span', { style:{ color:'var(--bad)' } }, delProg.done + ' / ' + delProg.total)
        ),
        h('div', { className:'progress' },
          h('div', { style:{ width:(delProg.total ? Math.round(delProg.done/delProg.total*100) : 0) + '%',

      h('button', {
        type:'button', onClick:wipeAllPhotos,
        disabled: delBusy || delWord.trim() !== '삭제',
        className:'btn btn-block',
        style: (delBusy || delWord.trim() !== '삭제')
          ? { background:'var(--surface-3)', color:'var(--text-3)' }

      },
        delBusy
          ? h('span', { className:'spinner', style:{ width:'16px', height:'16px', borderWidth:'2px' } })
          : h('i', { className:'ti ti-trash', style:{ fontSize:'19px' } }),
        delBusy ? '지우는 중...' : '사진 전체 삭제'
      ),

      delMsg && h('p', {
        className: 'note ' + (delMsg.startsWith('ok:') ? 'note-ok' : 'note-bad'),
        style:{ marginTop:'10px' }
      }, delMsg.slice(delMsg.indexOf(':') + 1))
    ),

    h(Card, null,
      h(SLabel, { icon:'upload', text:'사진 일괄 업로드' }),
      h('div', { className:'note note-info', style:{ marginBottom:'14px' } },
        '파일명을 ', h('b', null, '성도 이름'), '으로 준비하세요', h('br'),
        '예: ', h('span', { className:'mono' }, '김규동.jpg'), ' ', h('span', { className:'mono' }, '김한솔.png'), h('br'),
        '동명이인: ', h('span', { className:'mono' }, '이한나A.jpg'), ' ', h('span', { className:'mono' }, '이한나B.jpg'), h('br'),
        h('span', { style:{ color:'var(--ok)', fontWeight:700 } }, '자동 압축 · 원본 480px + 목록용 80px'), h('br'),
        h('span', { style:{ fontSize:'13px', opacity:.85 } },
          '맥·윈도 한글 파일명, 앞머리 번호(01_김규동), 복사본(김규동(1))도 자동 인식합니다.')
      ),

      step === 'idle' && h('label', { className:'btn btn-primary btn-block' },
        h('i', { className:'ti ti-photo-plus', style:{ fontSize:'20px' } }),
        '사진 파일 선택 (여러 장 가능)',
        h('input', { type:'file', accept:'image/*', multiple:true, onChange:handleSelect, style:{ display:'none' } })
      ),

      step === 'ready' && h('div', null,
        h('div', { className:'note note-info', style:{ marginBottom:'10px' } },
          h('b', null, pending.length + '개'), ' 파일이 선택되었습니다'),

        pre && h('div', { style:{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:'8px', marginBottom:'12px' } },
          [{ l:'바로 등록', v:pre.ok.length,  c:'var(--ok)' },
           { l:'동명이인',  v:pre.dup.length, c:'var(--warn)' },
           { l:'이름 불일치', v:pre.no.length, c:pre.no.length ? 'var(--bad)' : 'var(--text-3)' }]
            .map(({l,v,c}) => h('div', {
              key:l, style:{ background:'var(--surface-2)', border:'1px solid var(--border)',
                             borderRadius:'var(--r)', padding:'11px 6px', textAlign:'center' }
            },
              h('p', { style:{ fontSize:'22px', fontWeight:800, color:c, lineHeight:1.1 } }, v),
              h('p', { style:{ fontSize:'12px', color:'var(--text-2)', marginTop:'3px', fontWeight:600 } }, l)
            ))
        ),

        pre && pre.no.length > 0 && h('div', { className:'note note-warn', style:{ marginBottom:'12px' } },
          h('b', null, '주소록에 없는 이름 ' + pre.no.length + '건'), h('br'),
          pre.no.slice(0, 8).map(f => f.name.replace(/\.[^.]+$/,'')).join(', '),
          pre.no.length > 8 ? ' 외 ' + (pre.no.length - 8) + '건' : '',
          h('br'),
          h('span', { style:{ fontSize:'13px', opacity:.85 } },
            '엑셀 주소록의 이름과 파일명이 정확히 같은지 확인해 주세요. 이 파일들은 건너뜁니다.')
        ),

        h('label', {
          style:{ display:'flex', alignItems:'center', gap:'9px', marginBottom:'12px',
                  fontSize:'14.5px', fontWeight:600, cursor:'pointer', color:'var(--text-2)' }
        },
          h('input', {
            type:'checkbox', checked:skipExist,
            onChange: e => setSkipExist(e.target.checked),
            style:{ width:'19px', height:'19px', accentColor:'var(--navy)', cursor:'pointer' }
          }),
          '이미 사진이 등록된 성도는 건너뛰기'
        ),

        h('div', { style:{ display:'flex', gap:'8px' } },
          h('button', {
            type:'button', onClick:startUpload,
            className:'btn btn-primary', style:{ flex:1 },
            disabled: pre && pre.ok.length === 0 && pre.dup.length === 0
          }, h('i', { className:'ti ti-cloud-upload', style:{ fontSize:'20px' } }), '업로드 시작'),
          h('button', {
            type:'button', className:'btn btn-ghost', style:{ padding:'0 16px' },
            onClick: () => { setStep('idle'); setPending([]); setPre(null); }
          }, '취소')
        )
      ),

      step === 'processing' && h('div', null,
        h('div', { style:{ display:'flex', justifyContent:'space-between', fontSize:'14px',
                           marginBottom:'8px', fontWeight:700 } },
          h('span', null, '업로드 중... (동시 4장)'),
          h('span', { style:{ color:'var(--navy)' } }, progress.done + ' / ' + progress.total)
        ),
        h('div', { className:'progress' },
          h('div', { style:{ width: (progress.total ? Math.round(progress.done / progress.total * 100) : 0) + '%' } })
        ),
        firstErr && h('div', { className:'note note-bad', style:{ marginTop:'10px' } },
          h('b', null, '오류 발생'), h('br'), firstErr),
        h('button', {
          type:'button', className:'btn btn-ghost btn-block btn-sm', style:{ marginTop:'10px' },
          onClick: () => { abortRef.current = true; }
        }, '중단하기')
      ),

      step === 'conflicts' && h('div', null,
        h('div', { className:'note note-warn', style:{ marginBottom:'12px' } },
          h('b', null, '동명이인 확인 — ' + (conflictIdx+1) + ' / ' + conflicts.length + '건'), h('br'),
          '파일: ', h('span', { className:'mono' }, conflicts[conflictIdx] ? conflicts[conflictIdx].file.name : '')
        ),
        h('p', { style:{ fontSize:'14px', color:'var(--text-2)', marginBottom:'10px', fontWeight:600 } }, '어떤 분의 사진인가요?'),
        (conflicts[conflictIdx] ? conflicts[conflictIdx].matches : []).map(fam =>
          h('div', {
            key: fam['고유ID'],
            onClick: () => !resolving && resolveConflict(fam),
            className:'mcard', style:{ marginBottom:'8px' }
          },
            h(Avatar, { member:fam, photos, size:44 }),
            h('div', { style:{ flex:1, minWidth:0 } },
              h('p', { className:'mname', style:{ fontSize:'16px' } }, fam['이름']),
              h('p', { style:{ fontSize:'13px', color:'var(--text-2)' } },
                (fam['구역'] || '') + '구역 · ' + (fam['소속'] || '') + (fam['지역'] ? ' · ' + fam['지역'] : ''))
            ),
            h('i', { className:'ti ti-chevron-right', style:{ color:'var(--navy)', fontSize:'20px' } })
          )
        ),
        h('button', { type:'button', onClick:skipConflict, className:'btn btn-ghost btn-block btn-sm', style:{ marginTop:'4px' } }, '건너뛰기')
      ),

      step === 'done' && h('div', null,
        h('div', { className:'note note-ok', style:{ marginBottom:'10px' } },
          h('b', null, '업로드 완료'), h('br'),
          '완료 ' + progress.done + '명',
          unmatched.length > 0 ? ' · 미처리 ' + unmatched.length + '건' : ''
        ),
        unmatched.length > 0 && h('div', { style:{ marginBottom:'10px' } },
          h('p', { style:{ fontSize:'13.5px', fontWeight:700, marginBottom:'6px', color:'var(--bad)' } },
            '미처리 파일 ' + unmatched.length + '건'),
          h('div', {
            style:{ maxHeight:'220px', overflowY:'auto', background:'var(--surface-2)',
                    border:'1px solid var(--border)', borderRadius:'var(--r)', padding:'10px 12px' }
          },
            unmatched.map((u, i) => h('p', {
              key:i, style:{ fontSize:'13px', color:'var(--text-2)', margin:'3px 0' }
            }, u.name + ' — ' + u.reason))
          )
        ),
        h('button', {
          type:'button', className:'btn btn-ghost btn-block',
          onClick: () => { setStep('idle'); setPending([]); setPre(null); }
        }, '새로 업로드')
      )
    )
  );
}

/* ═══════════════════════════════════════════════════════
   심방 메모 관리 (전도인)

   · 기능을 켜고 끈다
   · 누구까지 열람·기록할 수 있는지 정한다
   · 메모 전체를 엑셀로 받아 둔다 (목회자 인계용 종이 자료)
   · 주인을 잃은 메모(엑셀에서 고유ID가 사라진 경우)를 찾아 준다
═══════════════════════════════════════════════════════ */
function VisitAdmin({ members, cfg, onCfgUpdate, dark }) {
  const [c,      setC]      = useState(() => normVisitCfg(cfg));
  const [msg,    setMsg]    = useState('');
  const [saving, setSaving] = useState(false);
  const [busy,   setBusy]   = useState(false);
  const [stat,   setStat]   = useState(null);
  const [statMsg, setStatMsg] = useState('');

  useEffect(() => { setC(normVisitCfg(cfg)); }, [cfg]);

  const changed = c.enabled !== normVisitCfg(cfg).enabled || c.level !== normVisitCfg(cfg).level;

  async function save() {
    setSaving(true); setMsg('');
    try {
      const saved = await fbSaveVisitCfg(c);
      onCfgUpdate && onCfgUpdate(saved);
      setMsg('ok:저장했습니다. 각 기기는 다음 접속 때 새 설정을 받습니다.');
    } catch(e) { setMsg('err:' + fsErrMsg(e)); }
    setSaving(false);
  }

  /* 컬렉션을 한 번만 읽어서 점검과 내보내기를 함께 처리한다 */
  async function scan(doExport) {
    setBusy(true); setStatMsg('');
    try {
      const docs = await fbLoadAllVisits();
      const byId = {};
      members.forEach(mm => { byId[mm['고유ID']] = mm; });

      const rows = [];
      const orphans = [];
      let entryCount = 0;

      docs.forEach(d => {
        const owner = byId[d.id];
        if (!owner && d.entries.length) orphans.push({ id:d.id, name:d.name, n:d.entries.length });
        sortVisitEntries(d.entries).forEach(en => {
          entryCount++;
          rows.push({
            '이름':      (owner && owner['이름']) || d.name || '(이름 모름)',
            '동명이인구분': (owner && owner['동명이인구분']) || d.dup || '',
            '직분':      (owner && owner['직분']) || '',
            '구역':      (owner && owner['구역']) || '',
            '고유ID':    d.id,
            '심방날짜':   en.date || '',
            '기록자':    en.by || '',
            '심방내용':   en.text || '',
            '명단연결':   owner ? '연결됨' : '★ 주인 없음'
          });
        });
      });

      rows.sort((a, b) => {
        const n = String(a['이름']).localeCompare(String(b['이름']), 'ko');
        if (n) return n;
        return String(b['심방날짜']).localeCompare(String(a['심방날짜']));
      });

      setStat({ docs: docs.filter(d => d.entries.length).length, entries: entryCount, orphans });

      if (!doExport) {
        setStatMsg('ok:점검을 마쳤습니다.');
      } else if (!rows.length) {
        setStatMsg('err:내보낼 심방 메모가 아직 없습니다.');
      } else {
        await loadXlsxLib();
        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.json_to_sheet(rows);
        /* 날짜 칸이 엑셀에서 숫자로 바뀌지 않도록 전부 문자로 고정한다 */
        Object.keys(ws).forEach(addr => {
          if (addr[0] === '!') return;
          const cell = ws[addr];
          if (cell && typeof cell.v === 'string') { cell.t = 's'; delete cell.z; }
        });
        ws['!cols'] = [{wch:10},{wch:8},{wch:10},{wch:6},{wch:12},{wch:12},{wch:14},{wch:70},{wch:12}];
        XLSX.utils.book_append_sheet(wb, ws, '심방메모');
        const d  = new Date();
        const ts = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
        XLSX.writeFile(wb, FILE_TAG + '_심방메모_' + ts + '.xlsx');
        setStatMsg('ok:' + rows.length + '건을 엑셀로 내려받았습니다.');
      }
    } catch(e) { setStatMsg('err:' + fsErrMsg(e)); }
    setBusy(false);
  }

  const note = s => s ? h('p', {
    className: 'note ' + (s.startsWith('ok:') ? 'note-ok' : 'note-bad'),
    style:{ marginTop:'10px' }
  }, s.slice(s.indexOf(':') + 1)) : null;

  return h(React.Fragment, null,

    h(Card, null,
      h(SLabel, { icon:'notes', text:'심방 메모 사용 설정' }),

      h('div', { className:'note note-info', style:{ marginBottom:'14px' } },
        '전도인이 심방을 다녀와 ', h('b', null, '성도 상세 화면'), '에서 날짜별로 내용을 적어 두는 기능입니다.', h('br'),
        h('span', { style:{ fontSize:'13px', opacity:.9 } },
          '명단과 따로 보관하므로 엑셀을 다시 올려도 메모는 지워지지 않습니다. 목회자가 바뀌어도 그대로 남습니다.')
      ),

      h('p', { style:{ fontSize:'13px', fontWeight:800, color:'var(--text-3)', marginBottom:'6px' } }, '기능 사용'),
      h('div', { className:'seg', style:{ marginBottom:'14px' } },
        [[true,'사용함'],[false,'사용 안 함']].map(([v, lbl]) => h('button', {
          key:String(v), type:'button',
          className: c.enabled === v ? 'on' : '',
          onClick: () => { setC(o => ({ ...o, enabled:v })); setMsg(''); }
        }, lbl))
      ),

      h('p', { style:{ fontSize:'13px', color:'var(--text-2)', lineHeight:1.75, marginBottom:'14px' } },
        c.enabled
          ? '심방 메모는 전도인만 열람·기록합니다. 성도·담당자·안내실 화면에는 심방 메모 칸이 아예 보이지 않습니다.'
          : '심방 메모 칸이 모두에게 보이지 않습니다. 이미 적어 둔 메모는 지워지지 않고 그대로 보관됩니다.'),

      h('button', {
        type:'button', onClick:save, disabled:saving || !changed,
        className:'btn btn-primary btn-block', style: changed ? null : { opacity:.5 }
      },
        saving
          ? h('span', { className:'spinner', style:{ width:'16px', height:'16px', borderWidth:'2px' } })
          : h('i', { className:'ti ti-device-floppy', style:{ fontSize:'19px' } }),
        saving ? '저장 중...' : (changed ? '저장' : '변경된 내용 없음')),
      note(msg)
    ),

    h(Card, null,
      h(SLabel, { icon:'file-download', text:'심방 메모 백업 · 점검' }),
      h('p', { style:{ fontSize:'13.5px', color:'var(--text-2)', lineHeight:1.7, marginBottom:'12px' } },
        '지금까지 적힌 심방 메모를 성도별·날짜별로 엑셀 한 장에 모아 내려받습니다. ',
        '목회자 인계 때 종이로 넘겨 드릴 자료로 쓰시면 됩니다.'),

      h('div', { style:{ display:'flex', gap:'8px', flexWrap:'wrap' } },
        h('button', { type:'button', onClick: () => scan(true), disabled:busy,
                      className:'btn btn-primary', style:{ flex:'1 1 160px' } },
          busy
            ? h('span', { className:'spinner', style:{ width:'16px', height:'16px', borderWidth:'2px' } })
            : h('i', { className:'ti ti-file-download', style:{ fontSize:'19px' } }),
          busy ? '처리 중...' : '엑셀로 내려받기'),
        h('button', { type:'button', onClick: () => scan(false), disabled:busy,
                      className:'btn btn-ghost', style:{ flex:'1 1 120px' } },
          h('i', { className:'ti ti-stethoscope', style:{ fontSize:'19px' } }), '메모 점검')
      ),
      note(statMsg),

      stat && h('div', { style:{ marginTop:'14px' } },
        h('div', { style:{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'10px' } },
          [{ l:'메모가 있는 성도', v:stat.docs + '명', cc:'var(--navy)' },
           { l:'심방 기록 건수',   v:stat.entries + '건', cc:'var(--ok)' }]
            .map(({l,v,cc}) => h('div', {
              key:l, style:{ background:'var(--surface-2)', border:'1px solid var(--border)',
                             borderRadius:'var(--r)', padding:'13px', textAlign:'center' }
            },
              h('p', { style:{ fontSize:'19px', fontWeight:800, color:cc } }, v),
              h('p', { style:{ fontSize:'13px', color:'var(--text-2)', marginTop:'2px', fontWeight:600 } }, l)
            ))
        ),
        stat.orphans.length > 0
          ? h('div', { className:'note note-bad', style:{ marginTop:'12px' } },
              h('b', null, '주인을 잃은 메모 ' + stat.orphans.length + '건'),
              h('br'),
              '아래 고유ID가 현재 명단에 없습니다. 엑셀에서 고유ID 칸을 바꾸거나 그 성도를 지우면 이렇게 됩니다. ',
              '엑셀의 고유ID를 원래대로 돌려놓으면 메모가 다시 붙습니다.',
              h('div', { style:{ marginTop:'8px', fontSize:'13px', lineHeight:1.8 } },
                stat.orphans.slice(0, 20).map(o =>
                  h('div', { key:o.id }, (o.name || '(이름 없음)') + ' — ' + o.id + ' (' + o.n + '건)')),
                stat.orphans.length > 20 && h('div', null, '… 외 ' + (stat.orphans.length - 20) + '명')
              )
            )
          : h('p', { className:'note note-ok', style:{ marginTop:'12px' } },
              '모든 메모가 명단의 성도와 제대로 연결되어 있습니다.')
      ),

      h('div', { style:{ height:'1px', background:'var(--border)', margin:'16px 0' } }),

      /* ★ v25 추가 — 심방 메모 연결 진단
         "응답 없음"만 보고 파이어베이스 장애인지 권한 문제인지
         짐작해야 했던 것을 없애기 위한 칸이다. */
      h(DiagBox, {
        title:'심방 메모 연결 진단',
        icon:'stethoscope',
        run: diagnoseVisits,
        colName:'visits',
        hint:'읽기·쓰기를 각각 시험해 실제 오류 코드를 보여 줍니다. ' +
             '"응답 없음"은 대개 보안 규칙에 visits 항목이 없어 거부된 것이 원인입니다.'
      }),

      h('div', { style:{ height:'1px', background:'var(--border)', margin:'16px 0' } }),

      h('div', { className:'note note-info' },
        h('b', null, '꼭 지켜야 할 두 가지'), h('br'),
        '① Firebase 콘솔의 보안 규칙에 ', h('b', null, 'visits'), ' 항목을 추가해야 메모가 저장됩니다. ',
        '(첨부한 Firestore_보안규칙.txt 참고)', h('br'),
        '② 엑셀의 ', h('b', null, '고유ID 칸을 지우거나 값을 바꾸지 마세요.'), ' ',
        '메모는 고유ID로 성도를 찾습니다. 사진도 같은 방식입니다.'
      ),

      h('p', { style:{ fontSize:'13px', color:'var(--text-3)', marginTop:'14px', lineHeight:1.8 } },
        '· 기록자 이름은 손으로 적는 칸입니다. 공용 계정이라 사람을 자동으로 알 수 없습니다.', h('br'),
        '· 저장할 때마다 서버를 다시 읽고 쓰므로, 두 분이 같은 성도를 동시에 적어도 지워지지 않습니다.', h('br'),
        '· 메모는 전도인이 수정·삭제도 할 수 있습니다. 지운 기록은 되돌릴 수 없으니 백업을 받아 두세요.')
    )
  );
}

/* ═══════════════════════════════════════════════════════
   관리 화면 (안내실 · 전도인)
═══════════════════════════════════════════════════════ */
/* ═══════════════════════════════════════════════════════
   연결 진단 칸 (v25 추가) — 심방 메모·출석이 함께 쓴다

   왜 만들었나
   ───────────
   지금까지는 실패하면 화면에 "응답 없음"만 남았다.
   그런데 그 문장은 인터넷이 끊겼을 때도, 보안 규칙이 거부했을 때도
   똑같이 나온다. 원인이 전혀 다른데 화면이 같으니 짐작할 수밖에 없었다.
   그래서 읽기와 쓰기를 따로 시험해 실제 오류 코드를 그대로 보여 준다.
   전화로 물어보실 때 이 화면만 읽어 주시면 원인이 바로 잡힌다.
═══════════════════════════════════════════════════════ */
function DiagBox({ title, icon, run, colName, hint }) {
  const [busy, setBusy] = useState(false);
  const [res,  setRes]  = useState(null);

  async function go() {
    setBusy(true); setRes(null);
    try { setRes(await run()); }
    catch(e) { setRes({ ok:false, read:{ ok:false, msg:fsErrMsg(e), code:'' }, write:null }); }
    setBusy(false);
  }

  const line = (lbl, r) => !r ? null : h('div', {
    style:{ display:'flex', alignItems:'flex-start', gap:'8px', marginTop:'7px' }
  },
    h('i', {
      className:'ti ti-' + (r.ok ? 'circle-check' : 'circle-x'),
      style:{ fontSize:'18px', flexShrink:0, marginTop:'1px',
              color: r.ok ? 'var(--ok)' : 'var(--bad)' }
    }),
    h('div', { style:{ flex:1, minWidth:0 } },
      h('span', { style:{ fontSize:'14px', fontWeight:700 } }, lbl + ' — ' + r.msg),
      r.code && h('div', {
        style:{ fontSize:'11px', opacity:.7, marginTop:'2px', wordBreak:'break-all',
                fontFamily:'ui-monospace,SFMono-Regular,monospace' }
      }, r.code)
    )
  );

  return h('div', null,
    h(SLabel, { icon: icon || 'stethoscope', text: title }),
    hint && h('p', { style:{ fontSize:'12.5px', color:'var(--text-3)', lineHeight:1.6, marginBottom:'10px' } }, hint),
    h('button', {
      type:'button', onClick:go, disabled:busy, className:'btn btn-ghost btn-block btn-sm'
    },
      busy
        ? h('span', { className:'spinner', style:{ width:'15px', height:'15px', borderWidth:'2px' } })
        : h('i', { className:'ti ti-plug-connected', style:{ fontSize:'17px' } }),
      busy ? '시험 중...' : '연결 진단'),

    res && h('div', {
      className: 'note ' + (res.ok ? 'note-ok' : 'note-bad'),
      style:{ marginTop:'10px' }
    },
      line('읽기', res.read),
      line('쓰기', res.write),
      !res.ok && h('div', {
        style:{ marginTop:'10px', paddingTop:'9px', borderTop:'1px solid currentColor',
                fontSize:'12.5px', lineHeight:1.65, opacity:.9 }
      },
        h('b', null, '권한 오류(permission-denied)라면'), h('br'),
        'Firebase 콘솔 → Firestore Database → 규칙 에 ',
        h('b', null, colName), ' 항목이 있는지 확인하고 다시 ',
        h('b', null, '게시'), '하세요. 첨부한 Firestore_보안규칙.txt 를 그대로 붙여넣으면 됩니다.', h('br'),
        h('b', null, '응답 없음이라면'), ' 인터넷 연결을, ',
        h('b', null, '무료 사용량 초과'), '라면 내일 다시 시도하세요.'
      )
    )
  );
}

/* ═══════════════════════════════════════════════════════
   전도인 관리 [출석] 탭 (v26 개편)

   네 가지를 여기서 합니다
   ─────────────────────
   ① 명단 묶음 — 영유아부처럼 구역과 별개로 모이는 명단 만들기
   ② 모임 — 주일이 아닌 지정 날짜(영유아부 모임 목요일 등) 만들기
   ③ 출석상태 현황 · 옛 표기 정리 · 주인 없는 값 점검
   ④ 엑셀 내려받기 · 연결 진단

   읽기 횟수
   ─────────
   탭을 열 때 2회 (명단 묶음 1 + 모임 목록 1).
   엑셀 내보내기는 (고른 주 수 + 그 기간의 모임 수)만큼. 성도 수와 무관합니다.
═══════════════════════════════════════════════════════ */
/* 모임 대상 하나를 켜고 끄는 칩 (정식 1.13) */
function EvTgtChip({ on, label, n, onClick }) {

}

function AttendAdmin({ members, attStatus, onAttStatus, onAttReload, onAttend, dark, only }) {
  /* only === 'events' 이면 「모임」 칸 하나만 보여 준다 — 안내실 [모임] 탭.
     그 밖(전도인 [출석] 탭)에서는 모임 칸만 빼고 나머지를 다 보여 준다.
     모임 만들기는 안내실 몫으로 옮겼기 때문이다. */
  const evOnly = (only === 'events');
  const [busy,  setBusy]  = useState(false);
  const [msg,   setMsg]   = useState('');
  const [nWeek, setNWeek] = useState(8);

  const [groups, setGroups] = useState(null);
  const [events, setEvents] = useState(null);
  const [loadErr, setLoadErr] = useState('');

  /* 명단 묶음 편집 */
  const [newName,  setNewName]  = useState('');
  const [editGid,  setEditGid]  = useState('');   /* 지금 인원을 손보는 명단 */
  const [pickSrch, setPickSrch] = useState('');
  const [gMsg,     setGMsg]     = useState('');

  /* 모임 만들기 */
  const [evDate,  setEvDate]  = useState(() => todayYmd().replace(/\./g, '-'));
  const [evName,  setEvName]  = useState('');
  const [evTgt,   setEvTgt]   = useState([]);   /* 고른 대상 낱개들 (정식 1.13) */
  const [evMemo,  setEvMemo]  = useState('');
  const [eMsg,    setEMsg]    = useState('');

  useEffect(() => {
    let alive = true;
    Promise.all([fbLoadGroups(), fbLoadEvents().catch(() => ({}))])
      .then(([g, e]) => { if (alive) { setGroups(g); setEvents(e); } })
      .catch(e => { if (alive) { setGroups({ list:{}, member:{} }); setEvents({}); setLoadErr(fsErrMsg(e)); } });
    return () => { alive = false; };
  }, []);

  const groupList = useMemo(() =>
    groups ? buildGroups(members, groups) : [], [members, groups]);
  const statList = useMemo(() =>
    groups ? buildGroups(members, groups, 'stat') : [], [members, groups]);

  /* 대상 낱개 하나를 켜고 끈다 */
  function toggleTgt(t) {
    setEMsg('');
    setEvTgt(p => p.indexOf(t) >= 0 ? p.filter(x => x !== t) : p.concat([t]));
  }
  /* 지금 고른 대상의 실제 인원 — 겹치는 분은 한 번만 (eventTargets 와 같은 규칙) */
  const evCount = useMemo(() => {
    if (!groups) return 0;
    return eventTargets(members, { target: evTgt.length ? evTgt.join(',') : 'all' }, groups).length;
  }, [members, groups, evTgt]);

  const evList = useMemo(() => {
    if (!events) return [];
    return Object.keys(events).map(id => ({ id, ...events[id] }))
      .sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));
  }, [events]);

  const uSo = useMemo(() => {
    const s = [...new Set(members.map(m => m['소속']).filter(Boolean))];
    return s.sort((a,b) => {
      const ia = SO_ORDER.indexOf(a), ib = SO_ORDER.indexOf(b);
      return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
    });
  }, [members]);

  const stat = useMemo(() => {
    let aCnt = 0, bCnt = 0, absent = 0, baby = 0;
    const mk = { '전입':0, '전출':0, '구원':0 };
    members.forEach(m => {
      const f = effAttFull(m, attStatus);
      /* 영아·유아·영유아는 출석상태를 매기지 않는다 (isAttExempt 주석 참고) */
      if (isAttExempt(m)) baby++;
      else if (f.state === '출석A') aCnt++;
      else if (f.state === '출석B') bCnt++;
      else                          absent++;
      f.marks.forEach(k => { mk[k]++; });
    });
    const ids = new Set(members.map(m => m['고유ID']));
    const keys = Object.keys(attStatus || {});
    return {
      aCnt, bCnt, absent, baby, mk,
      manual: keys.length,
      orphans: keys.filter(k => !ids.has(k))
    };
  }, [members, attStatus]);

  const note = (s, cls) => s ? h('div', {
    className: 'note ' + (cls || (s.startsWith('ok:') ? 'note-ok' : 'note-bad')),
    style:{ marginTop:'10px' }
  }, s.slice(s.indexOf(':') + 1)) : null;

  /* ── 명단 묶음 ───────────────────────────────────────── */
  async function addGroup() {
    const nm = newName.trim();
    if (!nm) { setGMsg('err:명단 이름을 적어 주세요.'); return; }
    setBusy(true); setGMsg('');
    try {
      const gid = 'c' + Date.now().toString(36);
      const order = Object.keys(groups.list).length + 1;
      await fbSaveGroupMeta(gid, { name:nm, order });
      setGroups(g => ({ ...g, list:{ ...g.list, [gid]:{ name:nm, order } } }));
      setNewName(''); setEditGid(gid);
      setGMsg('ok:「' + nm + '」 명단을 만들었습니다. 아래에서 성도를 담아 주세요.');
    } catch(e) { setGMsg('err:' + fsErrMsg(e)); }
    setBusy(false);
  }

  async function removeGroup(gid, nm) {
    if (!confirm('「' + nm + '」 명단을 지울까요?\n\n담겨 있던 성도들은 원래 구역·부서 명단으로 돌아갑니다.\n이미 체크한 출석 기록은 지워지지 않습니다.')) return;
    setBusy(true); setGMsg('');
    try {
      await fbDeleteGroup(gid, groups.member);
      setGroups(g => {
        const list = { ...g.list }; delete list[gid];
        const member = { ...g.member };
        Object.keys(member).forEach(k => { if (member[k] === gid) delete member[k]; });
        return { list, member };
      });
      if (editGid === gid) setEditGid('');
      setGMsg('ok:「' + nm + '」 명단을 지웠습니다.');
    } catch(e) { setGMsg('err:' + fsErrMsg(e)); }
    setBusy(false);
  }

  /* 이 명단 사람을 구역 참석율에도 넣을지 바꾼다 (청년회처럼) */
  async function toggleInGu(gid, cur) {
    setBusy(true); setGMsg('');
    try {
      await fbSaveGroupOpt(gid, { inGu: !cur });
      setGroups(g => ({ ...g, opt:{ ...(g.opt || {}), [gid]:{ inGu: !cur } } }));
      setGMsg('ok:' + (!cur ? '구역 참석율에 함께 넣습니다.' : '구역 참석율에서 뺐습니다.'));
    } catch(e) { setGMsg('err:' + fsErrMsg(e)); }
    setBusy(false);
  }

  /* 성도 한 명을 이 명단에 담거나 뺀다 */
  async function assign(id, gid) {
    setBusy(true); setGMsg('');
    try {
      await fbSetMemberGroup(id, gid);
      setGroups(g => {
        const member = { ...g.member };
        if (gid) member[id] = gid; else delete member[id];
        return { ...g, member };
      });
    } catch(e) { setGMsg('err:' + fsErrMsg(e)); }
    setBusy(false);
  }

  async function assignBulk(ids, gid) {
    if (!ids.length) return;
    setBusy(true); setGMsg('');
    try {
      const map = {};
      ids.forEach(id => { map[id] = gid; });
      await fbSetMemberGroupBulk(map);
      setGroups(g => {
        const member = { ...g.member };
        ids.forEach(id => { if (gid) member[id] = gid; else delete member[id]; });
        return { ...g, member };
      });
      setGMsg('ok:' + ids.length + '명을 담았습니다.');
    } catch(e) { setGMsg('err:' + fsErrMsg(e)); }
    setBusy(false);
  }

  const editGroup   = editGid && groups ? (groups.list[editGid] || DEPT_BY_ID[editGid]) : null;
  const editName    = editGroup ? (editGroup.name || '') : '';
  const editMembers = useMemo(() => {
    if (!editGid || !groups) return [];
    return members.filter(m => primaryGid(m, groups) === editGid).slice().sort(sortMembers);
  }, [members, groups, editGid]);

  /* 유아 어머니 후보 — 이미 담긴 분은 빼고 보여 준다 */
  const babyCands = useMemo(() => {
    if (!groups) return [];
    return findBabyParents(members).filter(m => primaryGid(m, groups) !== editGid);
  }, [members, groups, editGid]);

  const searchHits = useMemo(() => {
    const q = pickSrch.trim().toLowerCase().replace(/\s/g, '');
    if (!q || !groups) return [];
    return members.filter(m => {
      if (primaryGid(m, groups) === editGid) return false;
      const hay = [(m['이름']||''), (m['소속']||''), (m['구역']||''), (m['휴대폰']||'')]
        .join('|').toLowerCase().replace(/\s/g, '');
      const cho = getChoseong((m['이름']||'').toLowerCase().replace(/\s/g,''));
      return hay.includes(q) || cho.includes(q);
    }).slice().sort(sortMembers).slice(0, 30);
  }, [members, groups, editGid, pickSrch]);

  /* ── 모임 ────────────────────────────────────────────── */
  async function addEvent() {
    const nm = evName.trim();
    if (!nm)     { setEMsg('err:모임 이름을 적어 주세요.'); return; }
    if (!evDate) { setEMsg('err:날짜를 골라 주세요.'); return; }
    setBusy(true); setEMsg('');
    try {
      const eid = newEventId();
      const ev = { date:evDate, name:nm,
                   target: evTgt.length ? evTgt.join(',') : 'all',
                   memo: evMemo.trim() };
      await fbSaveEvent(eid, ev);
      setEvents(e => ({ ...e, [eid]:ev }));
      setEvName(''); setEvMemo(''); setEvTgt([]);
      setEMsg('ok:「' + nm + '」 모임을 만들었습니다 (대상 ' + evCount + '명). '
            + '담당자 화면의 날짜 목록에 나옵니다.');
    } catch(e) { setEMsg('err:' + fsErrMsg(e)); }
    setBusy(false);
  }

  async function removeEvent(eid, nm) {
    if (!confirm('「' + nm + '」 모임을 목록에서 지울까요?\n\n이미 체크한 출석 기록은 지워지지 않습니다. 같은 이름으로 다시 만들면 되살릴 수 있습니다.')) return;
    setBusy(true); setEMsg('');
    try {
      await fbDeleteEvent(eid);
      setEvents(e => { const n = { ...e }; delete n[eid]; return n; });
      setEMsg('ok:모임을 지웠습니다.');
    } catch(e) { setEMsg('err:' + fsErrMsg(e)); }
    setBusy(false);
  }

  /* ── 출석상태 ────────────────────────────────────────── */
  async function reload() {
    setBusy(true); setMsg('');
    try { await onAttReload(); setMsg('ok:출석상태를 서버에서 다시 받았습니다.'); }
    catch(e) { setMsg('err:' + fsErrMsg(e)); }
    setBusy(false);
  }

  /* 엑셀의 옛 표기를 세 가지로 옮겨 attend 에 저장한다.
     구역장이 이미 손으로 고쳐 둔 값은 그대로 둔다 (덮어쓰지 않는다). */
  async function normalizeAll() {
    const todo = {};
    members.forEach(m => {
      const id = m['고유ID'];
      if (!id) return;
      if (attStatus && attStatus[id]) return;      /* 손으로 고친 값은 유지 */
      const f = parseAtt(m['출석상태']);
      todo[id] = attText(f.state, f.marks);
    });
    const n = Object.keys(todo).length;
    if (!n) { setMsg('ok:정리할 것이 없습니다. 이미 모두 정리되어 있습니다.'); return; }
    if (!confirm(n + '명의 출석상태를 출석A·출석B·미출석 세 가지로 정리해 저장할까요?\n\n'
               + '옛 표기(정상→출석A, 주일만→출석B, 타지역·불참→미출석)가 함께 정리됩니다.\n'
               + '구역장이 이미 손으로 고쳐 둔 값은 그대로 둡니다.')) return;
    setBusy(true); setMsg('');
    try {
      await fbSetAttStatusBulk(todo);
      await onAttReload();
      setMsg('ok:' + n + '명을 정리해 저장했습니다.');
    } catch(e) { setMsg('err:' + fsErrMsg(e)); }
    setBusy(false);
  }

  /* ── 엑셀 내려받기 ───────────────────────────────────── */
  async function exportXlsx() {
    setBusy(true); setMsg('');
    try {
      const weeks  = sundayList(nWeek);
      const oldest = weeks[weeks.length - 1];
      const evs    = evList.filter(ev => String(ev.date || '') >= oldest);
      const keys   = weeks.map(w => 'w_' + w).concat(evs.map(ev => 'e_' + ev.id));
      const data   = await fbLoadSheets(keys);
      await loadXlsxLib();

      const gl = groupList;
      const gidName = {};
      gl.forEach(g => { gidName[g.id] = g.name; });

      /* 한 명단(또는 전체)의 대상·참석을 센다 — 화면과 똑같은 규칙 */
      const count = (list, c) => {
        let target = 0, come = 0;
        list.forEach(m => {
          const st = effAtt(m, attStatus);
          const on = !!c[m['고유ID']];
          if (isAttTarget(st) || on) { target++; if (on) come++; }
        });
        return { target, come };
      };
      const rate = r => (r.target ? Math.round(r.come / r.target * 100) : 0) + '%';

      /* ① 주일 요약 — 화면의 참석율 탭과 같은 세 묶음 + 교회 전체
         ★ 구역 줄은 '통계에 드는 곳'(statList) 기준이라 청년회가 함께 잡힌다.
           그래서 구역과 부서를 더하면 전체보다 커진다.
           전체는 성도를 한 번만 세어 따로 적는다. */
      const sum = [];
      weeks.slice().reverse().forEach(wk => {
        const c = data['w_' + wk] || {};
        const block = (list, kindLabel) => list.forEach(g => {
          if (!g.list.length) return;
          const r = count(g.list, c);
          sum.push({
            '주일': wk, '구분': kindLabel, '명단': g.name,
            '대상': r.target, '참석': r.come, '참석율': rate(r)
          });
        });
        block(statList.filter(g => g.kind === 'gu' || g.kind === 'none'), '구역');
        block(gl.filter(g => g.kind === 'dept'),   '부서');
        block(gl.filter(g => g.kind === 'custom'), '별도 명단');
        const t = count(members, c);
        sum.push({
          '주일': wk, '구분':'', '명단':'★ 교회 전체 (겹침 없이 1회씩)',

/* ═══════════════════════════════════════════════════════
   안내실 관리 [가족] 탭 (v27 추가)

   무엇을 하는 곳인가
   ─────────────────
   ① 주소가 없어서 자동으로 묶이지 않는 가족을 손으로 묶는다
   ② 할머니와 사는 청년처럼, 프로그램이 짐작할 수 없는 호칭을 적어 준다
      (짐작하면 '부모'라고 적어 버린다 — 실제로는 '조모'다)

   저장은 church/config 안에 얹으므로 읽기 횟수가 늘지 않는다.
   자세한 이유는 위 DEFAULT_FAMILY 주석 참고.

   ★ 손으로 묶은 가족이 있으면 그 성도에게는 주소 자동 연결이 통째로
     꺼진다. 그래서 새 가족을 만드실 때는 [주소로 찾은 가족 담기] 를
     먼저 눌러 이미 잘 잡혀 있던 분들을 함께 담아 두시는 것이 좋다.
     그러지 않으면 원래 보이던 가족이 사라진다.
═══════════════════════════════════════════════════════ */
function FamilyAdmin({ members, family, fieldVis, onFamilyUpdate, onMembersUpdate, dark }) {
  const fam = useMemo(() => normFamily(family), [family]);

  const [busy,   setBusy]   = useState(false);
  const [msg,    setMsg]    = useState('');
  const [editFid, setEditFid] = useState('');
  /* 손보기 칸이 열리면 그 자리로 데려다 드린다 (정식 1.19) */
  const editRef = useRef(null);
  useEffect(() => {
    if (!editFid || !editRef.current) return;
    const t = setTimeout(() => {
      try { editRef.current.scrollIntoView({ block:'start', behavior:'smooth' }); }
      catch (e) { try { editRef.current.scrollIntoView(); } catch (e2) {} }
    }, 60);
    return () => clearTimeout(t);
  }, [editFid]);
  const [srch,   setSrch]   = useState('');
  const [newName, setNewName] = useState('');
  const [relEdit, setRelEdit] = useState('');   /* 호칭을 고치는 중인 성도 */
  const [showCheck, setShowCheck] = useState(false);
  const [relFree, setRelFree] = useState('');

  const byId = useMemo(() => {
    const o = {};
    members.forEach(m => { o[m['고유ID']] = m; });
    return o;
  }, [members]);

  /* 가족 묶음 목록 — 인원이 많은 순이 아니라 이름순으로 (찾기 쉽게) */
  const famList = useMemo(() => {
    const cnt = {};
    Object.keys(fam.m).forEach(id => {
      const f = fam.m[id];
      cnt[f] = (cnt[f] || 0) + 1;
    });
    return Object.keys(fam.g).map(fid => ({
      id: fid,
      name: (fam.g[fid] && fam.g[fid].name) || '이름 없는 가족',
      n: cnt[fid] || 0
    })).sort((a, b) => String(a.name).localeCompare(String(b.name), 'ko'));
  }, [fam]);

  const editMembers = useMemo(() => {
    if (!editFid) return [];
    return members.filter(m => fam.m[m['고유ID']] === editFid).slice().sort(sortMembers);
  }, [members, fam, editFid]);

  const editName = editFid ? ((fam.g[editFid] && fam.g[editFid].name) || '') : '';

  /* 이 가족에 담긴 분들의 집주소로 찾은, 아직 안 담긴 가족 후보 */
  const addrCands = useMemo(() => {
    if (!editFid || !editMembers.length) return [];
    const addrs = new Set(editMembers.map(m => normAddr(m['주소'])).filter(a => a.length >= 10));
    if (!addrs.size) return [];
    return members.filter(m =>
      !fam.m[m['고유ID']] && addrs.has(normAddr(m['주소']))
    ).slice().sort(sortMembers);
  }, [members, fam, editFid, editMembers]);

  const hits = useMemo(() => {
    const q = srch.trim().toLowerCase().replace(/\s/g, '');
    if (!q) return [];
    return members.filter(m => {
      if (fam.m[m['고유ID']] === editFid) return false;
      const hay = [(m['이름']||''), (m['구역']||''), (m['소속']||''), (m['휴대폰']||''), (m['주소']||'')]
        .join('|').toLowerCase().replace(/\s/g, '');
      const cho = getChoseong((m['이름']||'').toLowerCase().replace(/\s/g,''));
      return hay.includes(q) || cho.includes(q);
    }).slice().sort(sortMembers).slice(0, 30);
  }, [members, fam, editFid, srch]);

  const note = s => s ? h('div', {
    className: 'note ' + (s.startsWith('ok:') ? 'note-ok' : 'note-bad'),
    style:{ marginTop:'10px' }
  }, s.slice(s.indexOf(':') + 1)) : null;

  async function save(next, okMsg) {
    setBusy(true); setMsg('');
    try {
      const saved = await fbSaveFamily(next);
      onFamilyUpdate && onFamilyUpdate(saved);
      if (okMsg) setMsg('ok:' + okMsg);
      return saved;
    } catch(e) { setMsg('err:' + fsErrMsg(e)); return null; }
    finally { setBusy(false); }
  }

  async function addFamily() {
    const nm = newName.trim();
    if (!nm) { setMsg('err:가족 이름을 적어 주세요. (예: 김규동 가정)'); return; }
    const fid = newFamilyId();
    const next = { ...fam, g:{ ...fam.g, [fid]:{ name:nm } } };
    const saved = await save(next, '「' + nm + '」 가족을 만들었습니다. 아래에서 식구를 담아 주세요.');
    if (saved) { setNewName(''); setEditFid(fid); setSrch(''); }
  }

  async function removeFamily(fid, nm) {
    if (!confirm('「' + nm + '」 가족 묶음을 지울까요?\n\n'
      + '담겨 있던 분들은 다시 ★ 집주소로 자동 연결 ★ 됩니다.\n'
      + '적어 두신 호칭도 함께 지워집니다.')) return;
    const g = { ...fam.g }; delete g[fid];
    const m = { ...fam.m }, r = { ...fam.r };
    Object.keys(m).forEach(id => { if (m[id] === fid) { delete m[id]; delete r[id]; } });
    const saved = await save({ g, m, r }, '「' + nm + '」 가족 묶음을 지웠습니다.');
    if (saved && editFid === fid) setEditFid('');
  }

  async function rename(fid) {
    const cur = (fam.g[fid] && fam.g[fid].name) || '';
    const nm = prompt('가족 이름을 고쳐 주세요.', cur);
    if (nm === null) return;
    const t = nm.trim();
    if (!t) return;
    await save({ ...fam, g:{ ...fam.g, [fid]:{ ...(fam.g[fid]||{}), name:t } } }, '이름을 고쳤습니다.');
  }

  async function put(id, fid) {
    const m = { ...fam.m };
    const r = { ...fam.r };
    if (fid) m[id] = fid; else { delete m[id]; delete r[id]; }
    await save({ ...fam, m, r });
  }

  async function putBulk(ids, fid) {
    if (!ids.length) return;
    const m = { ...fam.m };
    ids.forEach(id => { m[id] = fid; });
    await save({ ...fam, m }, ids.length + '명을 담았습니다.');
  }

  async function setRel(id, v) {
    const r = { ...fam.r };
    if (v) r[id] = v; else delete r[id];
    const saved = await save({ ...fam, r });
    if (saved) { setRelEdit(''); setRelFree(''); }
  }

  /* 이 가족의 대표를 정한다 (정식 1.13)
     ★ 대표가 바뀌면 다른 식구의 관계는 그대로 두어도
       기준이 옮겨진 만큼 저절로 다시 계산된다.
       다만 새 대표에게 적혀 있던 관계는 지운다 —
       대표는 언제나 0세대이므로 '부' 같은 값이 남아 있으면 뜻이 어긋난다. */
  async function setHead(fid, id) {
    const g = { ...fam.g };
    const cur = g[fid] || {};
    g[fid] = { ...cur, head: id || undefined };
    if (!id) delete g[fid].head;
    const r = { ...fam.r };
    if (id) { delete r[id]; }
    await save({ ...fam, g, r },
      id ? '대표를 정했습니다. 다른 식구의 관계는 대표 기준으로 다시 계산됩니다.'

  /* 지금 손보는 가족의 대표 (정식 1.13) */

  /* ═══════════════════════════════════════════════════════

  ═══════════════════════════════════════════════════════ */
  const checkList = useMemo(() => {
    if (!showCheck) return [];
    const seen = {}, out = [];
    members.forEach(me => {
      const g = getFamilyGroup(me, members, fam);
      if (!g.length) return;
      const ids = [me['고유ID']].concat(g.map(x => x['고유ID'])).sort();
      const key = ids.join('|');
      if (seen[key]) return;
      seen[key] = 1;
      const group = [me].concat(g);
      const pairs = famReviewPairs(group, fam);
      if (pairs.length) {
        const why = {};
        pairs.forEach(p => {
          const k = p.why;
          (why[k] = why[k] || []).push(p.a['이름'] + ' → ' + p.b['이름'] +
                                       (p.r === '가족' ? '' : ' (지금 「' + p.r + '」)'));

  async function recalcGen() {

      await fbSaveMembers(members, fieldVis, fam);

                      h('input', {
                        type:'text', value:relFree, placeholder:'직접 적기 (예: 외조모 — 이 말은 모든 식구에게 그대로 보입니다)',
                        onChange: e => setRelFree(e.target.value),

                        onClick: () => setRel(id, relFree.trim()),

                      }, '적용')
                    ),
                    rel && h('button', {

                      style:{ marginTop:'8px', color:'var(--bad)' }
                    }, '관계 지우기 (프로그램 짐작으로 되돌림)')
                  )
                );
              })
        ),

        h('button', {
          type:'button', onClick: () => { setEditFid(''); setSrch(''); setRelEdit(''); },
          className:'btn btn-ghost btn-sm btn-block', style:{ marginTop:'12px' }

      )
,


      /* 만들어 둔 가족 목록 */

        h('p', { style:{ fontSize:'13px', fontWeight:800, color:'var(--text-3)', letterSpacing:'.04em', marginBottom:'8px' } },
          '손으로 묶은 가족 (' + famList.length + '가족 · ' + Object.keys(fam.m).length + '명)'),
        famList.length === 0
          ? h('p', { style:{ fontSize:'14px', color:'var(--text-3)', padding:'8px 2px', lineHeight:1.6 } },
              '아직 없습니다. 모두 집주소로 자동 연결되고 있습니다.')
          : h('div', { style:{ display:'flex', flexDirection:'column', gap:'7px' } },
              famList.map(f => h('div', {
                key:f.id,
                style:{ display:'flex', alignItems:'center', gap:'9px', padding:'10px 12px',
                        background:'var(--surface-2)', border:'1px solid var(--border)',
                        borderRadius:'var(--r)' }
              },
                h('span', { style:{ flex:1, minWidth:0, fontSize:'15px', fontWeight:700,
