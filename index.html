/* ═══════════════════════════════════════════════════════
   출석 — attend 컬렉션 (v25 추가)

   왜 명단과 따로 두는가 (심방 메모와 같은 이유)
   ─────────────────────────────────────────────
   엑셀을 다시 올리면 church/m_* 문서는 통째로 새로 만들어진다.
   구역장이 화면에서 손으로 고친 출석상태와 매주 체크한 출석 기록을
   명단 안에 넣으면 그때 전부 날아간다.
   그래서 별도 컬렉션 attend 에 둔다. 엑셀 업로드는 attend 를 건드리지 않는다.

   문서 두 종류뿐이다 — 읽기 횟수를 아끼기 위한 설계다.

   attend/status          { s: { 고유ID: '출석A 전입' }, updatedAt }
   attend/w_2026-09-06    { c: { 고유ID: 1 }, updatedAt }   주일 하루치 체크

   ★ 610명을 성도별 문서로 두면 접속마다 610번 읽어 무료 한도가 하루도 못 간다.
     문서 하나에 지도(map)로 모으면 접속당 2회(상태 1 + 그 주 1)로 끝난다.

   ★ 두 구역장이 동시에 체크해도 서로의 기록을 지우지 않는다.
     set({ s:{ 한 사람만 } }, { merge:true }) 는 Firestore 가 지도 안의
     그 칸만 바꾸고 나머지는 그대로 둔다. 화면에 들고 있던 옛 지도를
     통째로 덮어쓰지 않기 때문이다.
═══════════════════════════════════════════════════════ */
const ATT_TIMEOUT = 15000;
/* ═══════════════════════════════════════════════════════
   출석상태 = 「배타 상태 하나」 + 「표식 여럿」   (정식 1.16)

     배타 상태  출석A · 출석B · 미출석      셋 중 ★하나만★
     표식       전입 · 전출 · 구원          여럿을 함께 달 수 있다

   ★ 전출은 자동으로 미출석이다. 그리고 전입·구원과 함께 달 수 없다.
     교회를 떠나신 분이므로 다른 표식이 붙을 자리가 없다.
   ★ 전입·구원은 출석A·출석B·미출석 어디와도 함께 달 수 있다.

   저장은 ★한 칸에 글자 하나★ 로 한다 — 띄어쓰기로 이어 붙인다.
     '출석A'            '출석B 전입'        '미출석 전출'      '출석A 전입 구원'
   attend/status 의 지도(s)에도, 엑셀의 「출석상태」 칸에도 같은 글이 들어간다.
   칸을 늘리지 않으므로 엑셀 서식이 그대로다.
═══════════════════════════════════════════════════════ */
const ATT_STATES  = ['출석A','출석B','미출석'];
const ATT_MARKS   = ['전입','전출','구원'];

function attRef(name) { return _db.collection('attend').doc(name); }

/* 심방 메모와 같은 이유로 서버에서 직접 읽는다 (getServerDoc 설명 참고) */
function getAttDoc(ref, label) {
  return getServerDoc(ref, label, ATT_TIMEOUT);
}

/* ── 출석상태 ──────────────────────────────────────────────
   구역장이 손으로 고친 값만 담긴다.
   비어 있는 성도는 엑셀의 '출석상태' 칸을 그대로 쓴다. */

/* 출석상태는 기기에도 저장해 둔다.
   접속 직후 첫 화면에서 배지가 옛 값으로 잠깐 보이는 일을 막는다. */
function readAttCache() {
  try {
    const v = localStorage.getItem('gsc_att_status');
    const o = v ? JSON.parse(v) : null;
    return (o && typeof o === 'object') ? o : {};
  } catch(e) { return {}; }
}
function writeAttCache(map) {
  try { localStorage.setItem('gsc_att_status', JSON.stringify(map || {})); } catch(e) {}
}

async function fbLoadAttStatus() {
  const snap = await getAttDoc(attRef('status'), '출석상태 불러오기');
  if (!snap.exists) return {};
  const d = snap.data() || {};
  const map = (d.s && typeof d.s === 'object') ? d.s : {};
  writeAttCache(map);
  return map;
}

async function fbSetAttStatus(id, v) {
  const patch = {};
  patch[String(id)] = v;
  await withTimeout(attRef('status').set({
    s: patch,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }, { merge:true }), ATT_TIMEOUT, '출석상태 저장');
}

/* 여러 명을 한 번에 (옛 표기 정리 등) */
async function fbSetAttStatusBulk(map) {
  const patch = {};
  Object.keys(map || {}).forEach(k => { patch[String(k)] = map[k]; });
  if (!Object.keys(patch).length) return;
  await withTimeout(attRef('status').set({
    s: patch,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }, { merge:true }), ATT_TIMEOUT, '출석상태 저장');
}

/* ═══════════════════════════════════════════════════════
   명단 묶음 (v26 추가) — 누가 누구를 체크하는가

   왜 구역만으로는 안 되는가
   ────────────────────────
   주일에 교회학교 학생은 부서에서 따로 말씀을 듣습니다.
   그런데 그분들도 어느 구역에는 속해 있습니다.
   구역 명단에 그대로 두면 구역장은 자기가 만나지도 못한 분을
   체크해야 하고, 교회 전체 참석자 수는 한 사람이 두 번 잡힙니다.

   ★ 그래서 한 사람은 주일에 딱 한 곳에만 나옵니다.
     이 "딱 한 곳"을 primaryGid() 가 정합니다.

   순서대로 따집니다
   ────────────────
   ① 전도인이 직접 지정한 명단이 있으면 그곳       (attend/groups.member)
   ② 소속이 부서에 해당하고 ★그 부서에 담당자 계정이 있으면★ 그 부서
      (DEPT_DEFS + 교회 설정의 deptAccounts)
      계정이 없는 부서는 아무도 열지 못하는 명단이 되므로 ★자기 구역★ 에서 체크한다 (1.16)
   ③ 그 밖에는 자기 구역                          (gu_3 …)
   ④ 구역도 소속도 없으면 '미지정'

   그래서 모든 그룹의 인원을 더하면 정확히 전체 성도 수가 됩니다.
   겹치지도, 빠지지도 않습니다.

   저장 형태
   ────────
   attend/groups {
     list:   { c1a2b3: { name:'영유아부', order:1 } },   전도인이 만든 별도 명단
     member: { 고유ID: 'c1a2b3' }                        이 성도의 담당 명단
   }
═══════════════════════════════════════════════════════ */

/* 소속으로 자동 판정되는 부서.
   ★ 여기 없는 소속(봉사회·어머니회·은장회 등)은 부서로 잡지 않습니다.
     그분들은 주일에 본당에서 함께 예배하시므로 구역에서 체크하고,
     봉사회 모임·어머니회 모임처럼 따로 모이는 날은
     '모임'(지정 날짜)으로 관리합니다. */
/* inGu — 이 부서 사람을 ★ 구역 참석율에도 넣을지 ★

   왜 필요한가
   ──────────
   청년회는 주일에 청년부에서 따로 말씀을 듣기 때문에 체크는 청년부에서
   합니다. 그런데 청년은 성인이고 자기 구역의 구역원입니다.
   구역장이 "우리 구역 몇 명 나왔나"를 볼 때 청년이 빠져 있으면
   구역 인원과 맞지 않습니다.

   그래서 두 가지를 나누었습니다.
   · 체크하는 곳 (primaryGid) — 청년부. 구역 명단에는 나오지 않습니다.
   · 통계에 드는 곳 (statGid)  — 자기 구역. 구역 참석율에 함께 잡힙니다.

   ★ 1.16에서 한 가지를 더했습니다 — 부서에 ★담당자 계정이 없으면★
     체크하는 곳도 자기 구역이 됩니다. 열 사람이 없는 명단에 두면
     아무도 체크하지 않은 채 구역 참석율 분모만 커지기 때문입니다.
     그래서 춘천교회에서는 유초등부·중고등부만 따로 남습니다.
     (DEPT_HAS_ACCOUNT 주석 참고)

   교회학교(유초등부·중고등부)는 구역 통계에 넣지 않습니다.
   구역은 장년 조직이라 아이들까지 넣으면 구역 참석율의 뜻이 흐려집니다.

   ★ 1.16 현재 춘천교회에는 담당자 계정이 있는 부서가 유초등부·중고등부
     둘뿐이고, 영유아부·청년·대학부 부서는 설정에서 아예 없앴습니다.
     그 소속(유아·청년회·대학부) 성도는 자기 구역에서 체크합니다.
     그래서 inGu 는 지금 쓰이는 곳이 없지만, 부서를 다시 두는 교회를 위해
     기능은 그대로 둡니다.

   ★ 전도인이 관리 화면 [출석] 탭에서 부서·별도 명단마다 바꿀 수 있습니다.
     (영유아부에 담은 어머니들을 구역 통계에 넣고 싶으실 때 쓰십니다)
     바꾼 값은 attend/groups.opt 에 저장됩니다. */
/* 교회마다 부서 이름과 「소속」 칸 표기가 다르므로 설정에서 가져온다.
   (설치 마법사 9번째 화면에서 정한다) */
const DEPT_DEFS = (CHURCH_CFG.deptDefs || [])
  .filter(d => d && d.id && d.name && (d.so || []).length)
  .map(d => ({ id:d.id, name:d.name, so:(d.so || []).slice(), inGu: !!d.inGu }));
/* 화면에 붙이는 구분 이름 — 여러 곳에서 함께 쓴다 */
const KIND_LABEL_X = { gu:'구역', dept:'부서', custom:'별도 명단', none:'미지정' };

const DEPT_BY_ID = {};
DEPT_DEFS.forEach(d => { DEPT_BY_ID[d.id] = d; });

/* ═══════════════════════════════════════════════════════
   이 부서에 ★로그인할 담당자 계정★ 이 있나 (정식 1.16)

   교회 설정의 deptAccounts 에 적힌 부서만 로그인 계정이 있다.
   춘천교회는 유초등부(child@) · 중고등부(teen@) 둘뿐이고,
   청년·대학부와 영유아부에는 계정이 없다.

   ★ 왜 이걸 따지게 되었나 — 청년이 출석체크에서 통째로 빠졌다
   청년회·대학부는 소속으로 「청년·대학부」 부서 명단에 잡히므로
   구역 명단에는 나오지 않는다. 그런데 그 부서로 로그인할 계정이 없으니
   ★아무도 그 명단을 열지 못했다★. 게다가 청년은 inGu 라 구역 참석율의
   분모에는 들어가서, 체크는 안 되는데 분모만 커져 구역 참석율이
   실제보다 낮게 나왔다. 영유아부도 같은 처지였다(계정이 없다).

   그래서 primaryGid 의 규칙을 이렇게 정했다 (사용자 결정 2026-09-12) —
   ★담당자 계정이 있는 부서만 따로 체크한다. 없는 부서는 자기 구역에서 체크한다.★
   춘천교회에서는 유초등부(child@)·중고등부(teen@) 둘만 남고,
   영유아부·청년·대학부 사람은 자기 구역 명단에 함께 나온다.
   체크하는 곳과 통계에 드는 곳이 같아지므로 구역 참석율도 실제와 맞는다.

   ★ 그래도 따로 체크하고 싶으시면 — 전도인이 관리 화면 [출석] 탭에서
     그분들을 ★별도 명단★ 으로 지정하면 된다(attend/groups.member 가
     이 규칙보다 앞선다). 아래 primaryGid 의 ① 을 보라. */
const DEPT_HAS_ACCOUNT = {};
Object.keys(DEPT_ACCOUNTS).forEach(k => { DEPT_HAS_ACCOUNT[DEPT_ACCOUNTS[k]] = true; });
function deptHasAccount(id) { return !!DEPT_HAS_ACCOUNT[id]; }

function normGroups(v) {
  const o = (v && typeof v === 'object') ? v : {};
  return {
    list:   (o.list   && typeof o.list   === 'object') ? o.list   : {},
    member: (o.member && typeof o.member === 'object') ? o.member : {},
    opt:    (o.opt    && typeof o.opt    === 'object') ? o.opt    : {}
  };
}

/* 이 명단 사람을 구역 참석율에도 넣을까 */
function groupInGu(gid, groups) {
  const g = normGroups(groups);
  const o = g.opt[gid];
  if (o && o.inGu !== undefined) return !!o.inGu;      /* 전도인이 정한 값이 우선 */
  if (DEPT_BY_ID[gid]) return !!DEPT_BY_ID[gid].inGu;  /* 부서 기본값 */
  return false;                                        /* 별도 명단은 기본 제외 */
}

function deptOf(m) {
  const so = nk((m && m['소속']) || '');
  if (!so) return null;
  for (const d of DEPT_DEFS) {
    if (d.so.some(k => so.indexOf(k) >= 0)) return d;
  }
  return null;
}

/* 이 성도가 주일에 나오는 딱 한 곳 */
function primaryGid(m, groups) {
  const g  = normGroups(groups);
  const ov = g.member[m && m['고유ID']];
  if (ov) {
    if (DEPT_BY_ID[ov]) return ov;                 /* 부서로 지정 */
    if (g.list[ov]) return ov;                     /* 별도 명단으로 지정 */
    if (String(ov).indexOf('gu_') === 0) return ov;/* 구역으로 되돌림 */
  }
  const d  = deptOf(m);
  const gu = m && m['구역'];
  if (d) {
    /* ★ 담당자 계정이 없는 부서는 구역에서 체크한다 (1.16)
       — 열 사람이 없는 명단을 따로 두지 않는다. DEPT_HAS_ACCOUNT 주석 참고 */
    if (gu && !deptHasAccount(d.id)) return 'gu_' + gu;
    return d.id;
  }
  if (gu) return 'gu_' + gu;
  return 'none';
}

/* 이 성도가 ★ 통계에 드는 곳 ★ — 체크하는 곳(primaryGid)과 다를 수 있다.

   청년회처럼 inGu 가 켜진 명단에 있고 구역이 적혀 있으면 그 구역으로 잡는다.
   그래서 청년은 청년부에서 체크되지만 구역 참석율에도 함께 들어간다.
   (체크 기록은 하나뿐이므로 같은 체크가 두 통계에 쓰이는 것이다) */
function statGid(m, groups) {
  const p = primaryGid(m, groups);
  if (p.indexOf('gu_') === 0) return p;
  if (groupInGu(p, groups)) {
    const gu = m && m['구역'];
    if (gu) return 'gu_' + gu;
  }
  return p;
}

/* 화면에 뿌릴 그룹 목록 — 구역 → 부서 → 별도 명단 → 미지정 */
/* by:'check' (기본) = 체크하는 곳 기준 · by:'stat' = 통계에 드는 곳 기준 */
function buildGroups(members, groups, by) {
  const g   = normGroups(groups);
  const pick = (by === 'stat') ? statGid : primaryGid;
  const map = new Map();
  const put = (id, name, kind) => {
    if (!map.has(id)) map.set(id, { id, name, kind, list:[] });
    return map.get(id);
  };

  members.forEach(m => {
    /* ★ 영아·유아·영유아는 주일 출석 체크를 하지 않는다 (사용자 결정 2026-09-12).
         품에 안겨 오시는 아기를 매주 체크하는 것은 뜻이 없고, 집계에서는
         「영유아」 칸에 전원이 그대로 들어가므로 숫자도 빠지지 않는다.
       ★ 전도인이 별도 명단에 직접 담아 두었으면 그 지정이 앞선다. */
    if (isAttExempt(m) && !g.member[m && m['고유ID']]) return;
    const id = pick(m, g);
    let name = '미지정', kind = 'none';
    if (id.indexOf('gu_') === 0)      { name = id.slice(3) + '구역';        kind = 'gu'; }
    else if (DEPT_BY_ID[id])          { name = DEPT_BY_ID[id].name;         kind = 'dept'; }
    else if (g.list[id])              { name = g.list[id].name || '이름 없음'; kind = 'custom'; }
    put(id, name, kind).list.push(m);
  });

  /* 아직 아무도 담기지 않은 별도 명단도 목록에는 보여 준다 */
  Object.keys(g.list).forEach(gid => {
    if (!map.has(gid)) put(gid, g.list[gid].name || '이름 없음', 'custom');
  });

  const rank = { gu:0, dept:1, custom:2, none:3 };
  return [...map.values()].sort((a, b) => {
    if (rank[a.kind] !== rank[b.kind]) return rank[a.kind] - rank[b.kind];
    if (a.kind === 'gu')   return (parseInt(a.id.slice(3),10)||9999) - (parseInt(b.id.slice(3),10)||9999);
    if (a.kind === 'dept') return DEPT_DEFS.findIndex(d=>d.id===a.id) - DEPT_DEFS.findIndex(d=>d.id===b.id);
    if (a.kind === 'custom') {
      const oa = (g.list[a.id] && g.list[a.id].order) || 0;
      const ob = (g.list[b.id] && g.list[b.id].order) || 0;
      if (oa !== ob) return oa - ob;
    }
    return String(a.name).localeCompare(String(b.name), 'ko');
  }).map(x => ({ ...x, list: x.list.slice().sort(sortMembers) }));
}

async function fbLoadGroups() {
  const snap = await getAttDoc(attRef('groups'), '명단 묶음 불러오기');
  return normGroups(snap.exists ? snap.data() : null);
}

/* 이 명단을 구역 참석율에 넣을지 저장 */

  patch[String(gid)] = opt;
  await withTimeout(attRef('groups').set({
    opt: patch,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }, { merge:true }), ATT_TIMEOUT, '명단 설정 저장');
}

async function fbSaveGroupMeta(gid, meta) {
  const patch = {};
  patch[String(gid)] = meta;
  await withTimeout(attRef('groups').set({
    list: patch,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }, { merge:true }), ATT_TIMEOUT, '명단 저장');
}

/* 명단을 지울 때는 그 명단을 가리키던 성도들의 지정도 함께 지운다.
   안 그러면 아무 데도 없는 명단을 가리키는 성도가 남는다. */
async function fbDeleteGroup(gid, memberMap) {
  const DEL  = firebase.firestore.FieldValue.delete();
  const lp   = {}; lp[String(gid)] = DEL;
  const mp   = {};
  Object.keys(memberMap || {}).forEach(k => { if (memberMap[k] === gid) mp[k] = DEL; });
  const op = {}; op[String(gid)] = DEL;
  const body = { list: lp, opt: op, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
  if (Object.keys(mp).length) body.member = mp;
  await withTimeout(attRef('groups').set(body, { merge:true }), ATT_TIMEOUT, '명단 삭제');
}

/* 성도 한 명의 담당 명단 지정 (gid 가 빈 값이면 자동 판정으로 되돌린다) */
async function fbSetMemberGroup(id, gid) {
  const patch = {};
  patch[String(id)] = gid ? String(gid) : firebase.firestore.FieldValue.delete();
  await withTimeout(attRef('groups').set({
    member: patch,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }, { merge:true }), ATT_TIMEOUT, '명단 지정 저장');
}

async function fbSetMemberGroupBulk(map) {
  const patch = {};
  Object.keys(map || {}).forEach(k => {
    patch[String(k)] = map[k] ? String(map[k]) : firebase.firestore.FieldValue.delete();
  });
  if (!Object.keys(patch).length) return;
  await withTimeout(attRef('groups').set({
    member: patch,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }, { merge:true }), ATT_TIMEOUT, '명단 지정 저장');
}

/* 유아가 있는 어머니 후보 찾기 — 영유아부 명단을 만들 때 쓴다.
   소속이 '유아'인 아이와 집주소가 같은 여자 장년을 모은다.
   ★ 짐작이므로 화면에 후보로만 보여 주고, 안내실이 골라 담는다.
     아버지나 할머니가 대신 나오시는 경우가 있어 자동으로 담지 않는다. */
function findBabyParents(members) {
  const babies = members.filter(m => {
    const d = deptOf(m);
    return d && d.id === 'd_baby';
  });
  if (!babies.length) return [];
  const addrs = new Set(babies.map(b => normAddr(b['주소'])).filter(a => a.length >= 10));
  if (!addrs.size) return [];
  return members.filter(m => {
    if (deptOf(m)) return false;                        /* 아이·학생은 제외 */
    const a = normAddr(m['주소']);
    if (a.length < 10 || !addrs.has(a)) return false;
    return String(m['성별'] || '').indexOf('여') >= 0;   /* 어머니 후보 */
  }).slice().sort(sortMembers);
}

/* ═══════════════════════════════════════════════════════
   모임 (v26 추가) — 주일이 아닌 지정 날짜

   왜 필요한가
   ──────────
   영유아부 모임(목요일), 봉사회 모임, 어머니회 모임처럼
   주일이 아닌 날 따로 모이는 자리가 있습니다.
   주일 출석표와 섞으면 참석율이 뒤죽박죽이 되므로 문서를 따로 둡니다.

   attend/events { e: { eid: { date, name, target, memo } } }
   attend/e_{eid} { c: { 고유ID: 1 } }

   target 형태
   ──────────
   'all'          전체 성도
   'so:봉사회'     소속이 봉사회인 성도 (여러 구역에 걸쳐 있는 모임)
   'g:c1a2b3'     그 명단(구역·부서·별도 명단)에 담긴 성도
═══════════════════════════════════════════════════════ */
function normEvents(v) {
  const o = (v && typeof v === 'object') ? v : {};
  return (o.e && typeof o.e === 'object') ? o.e : {};
}

async function fbLoadEvents() {
  const snap = await getAttDoc(attRef('events'), '모임 목록 불러오기');
  return normEvents(snap.exists ? snap.data() : null);
}

/* 모임을 지워도 이미 체크한 기록(attend/e_xxx)은 남겨 둔다.
   실수로 지웠을 때 되살릴 수 있고, 문서 하나라 용량도 문제되지 않는다. */
async function fbDeleteEvent(eid) {
  const patch = {};
  patch[String(eid)] = firebase.firestore.FieldValue.delete();
  await withTimeout(attRef('events').set({
    e: patch,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }, { merge:true }), ATT_TIMEOUT, '모임 삭제');
}

function newEventId() {
  return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

/* 모임 대상을 낱개로 쪼갠다 (정식 1.13 — 여러 개를 고를 수 있다)

   target 은 쉼표로 이어 붙인 글이다.
     'all'                     전체 성도
     'so:청년회,so:대학부'       소속 두 개  ← 「청년 70인의 날」이 이런 경우다
     'g:gu_11,so:봉사회'        명단과 소속을 섞어서도 된다

   ★ 옛 판에서 만든 모임(하나만 고른 것)도 그대로 읽힌다.
     쉼표가 없으면 낱개가 하나인 목록이 될 뿐이다. */
function evTgtList(ev) {
  return String((ev && ev.target) || 'all')
    .split(',').map(s => s.trim()).filter(Boolean);
}

/* 이 모임의 대상 성도.
   ★ 여러 대상에 겹쳐 드는 분도 ★한 번만★ 센다 (filter 로 훑기 때문). */
function eventTargets(members, ev, groups) {
  const ts = evTgtList(ev);
  if (!ts.length || ts.indexOf('all') >= 0) return members;
  const so = {}, gs = {};
  ts.forEach(t => {
    if (t.indexOf('so:') === 0)     so[nk(t.slice(3))] = 1;
    else if (t.indexOf('g:') === 0) gs[t.slice(2)] = 1;
  });
  if (!Object.keys(so).length && !Object.keys(gs).length) return members;
  return members.filter(m => so[nk(m['소속'])] || gs[primaryGid(m, groups)]);
}

/* 이 모임을 이 사람에게 보여 줄까 (정식 1.12에서 고쳤다)

   · 안내실·전도인은 전부
   · 전체 성도가 대상이면 모두에게
   · 명단이 대상이면 그 명단을 고른 담당자에게만
   · 소속(봉사회·어머니회·청년회…)이 대상이면
     ★ 그 소속 성도가 내 명단에 실제로 담겨 있을 때만 ★

   ★ 왜 바꿨나
     전에는 소속 모임이 임원 모두에게 보였다. 그래서 부서 담당자에게
     은장회 모임까지 날짜 목록에 떴고, 눌러도 대상 성도가 한 명도 없었다.
     거꾸로 11구역 담당자에게는 11구역에 계신 봉사회·어머니회·은장회
     성도의 모임이 필요하다. 그 판단을 명단으로 하면 정확히 맞는다.
       · 중고등부 계정 → 중등부·고등부 모임 + 전체 모임
       · 11구역 계정  → 전체 모임 + 11구역 명단 모임 + 봉사회·어머니회·은장회 모임
     (1.16부터 청년은 자기 구역에서 체크하므로 11구역 담당자에게 청년회 모임이 뜬다) */
function canSeeEvent(ev, myGid, role, members, groups) {
  if (ROLES[role || 'member'] >= ROLES.admin) return true;
  const ts = evTgtList(ev);
  if (!ts.length || ts.indexOf('all') >= 0) return true;
  /* 고른 대상 중 ★하나라도★ 내 몫이면 보여 준다 */
  return ts.some(t => {
    if (t.indexOf('g:') === 0) return t.slice(2) === myGid;
    if (t.indexOf('so:') === 0) {
      /* 명단을 아직 못 받았거나 담당 명단이 없으면 가리지 않는다 */
      if (!myGid || !groups || !members || !members.length) return true;
      const v = nk(t.slice(3));
      return members.some(m => nk(m['소속']) === v && primaryGid(m, groups) === myGid);
    }
    return true;
  });
}

function targetLabel(ev, groupList) {
  const ts = evTgtList(ev);
  if (!ts.length || ts.indexOf('all') >= 0) return '전체 성도';
  const names = ts.map(t => {
    if (t.indexOf('so:') === 0) return t.slice(3);
    if (t.indexOf('g:') === 0) {
      const g = (groupList || []).find(x => x.id === t.slice(2));
      return g ? g.name : '지워진 명단';
    }
    return '';
  }).filter(Boolean);
  return names.length ? names.join(' · ') : '전체 성도';
}

async function diagnoseAttend() {

  }
  out.ok = !!(out.read.ok && out.write.ok);
  return out;
}

/* ── 주일 날짜 다루기 ──────────────────────────────────────
   문서 이름에 쓰는 형식은 'YYYY-MM-DD' (그 주 주일 날짜).
   화면에 보여 줄 때는 'M월 D일'로 고쳐 적는다.

   ★ 주일은 접속한 날짜에서 계산한다. 9월이 되면 9월 주일이,
     10월이 되면 10월 주일이 저절로 나온다. 손댈 것이 없다. */
function ymdDash(d) {
  return d.getFullYear() + '-' +
         String(d.getMonth() + 1).padStart(2, '0') + '-' +
         String(d.getDate()).padStart(2, '0');
}

/* 오늘이 속한 주의 주일. 주일 당일이면 오늘.
   월~토요일이면 바로 지난 주일을 가리킨다 (그 주의 출석을 적는 것이므로). */
function lastSunday(base) {
  const d = base ? new Date(base) : new Date();
  d.setHours(12, 0, 0, 0);
  d.setDate(d.getDate() - d.getDay());
  return ymdDash(d);
}

function sundayList(n) {
  const out = [];
  const d = new Date(lastSunday() + 'T12:00:00');
  for (let i = 0; i < n; i++) {
    out.push(ymdDash(d));
    d.setDate(d.getDate() - 7);
  }
  return out;
}

function weekLabel(wk) {
  const p = String(wk || '').split('-');
  if (p.length !== 3) return String(wk || '');
  return Number(p[1]) + '월 ' + Number(p[2]) + '일';
}

const DOW_KO = ['주일','월','화','수','목','금','토'];
function dowLabel(ymd) {
  try {
    const d = new Date(String(ymd) + 'T12:00:00');
    if (isNaN(d.getTime())) return '';
    return DOW_KO[d.getDay()];
  } catch(e) { return ''; }
}

const CHUNK_LIMIT = 700000;

/* 기기 캐시를 먼저 보고 없으면 서버에서 받는다 (사진처럼 잘 안 바뀌는 것).
   ★ 안쪽에도 타임아웃을 걸어 둔다 — 부르는 쪽이 잊더라도 멈추지 않게. */
async function getDoc(ref, preferCache) {

      const s = await withTimeout(ref.get({ source:'cache' }), 5000, '기기 저장분');

}

/* 기기에 저장해 둔 사진 캐시 */
function readThumbCache(rev) {
  try {
    if (rev && localStorage.getItem('gsc-thumb-rev') !== rev) return null;
    const hit = localStorage.getItem('gsc-thumb-data');
    return hit ? JSON.parse(hit) : null;
  } catch(e) { return null; }
}
/* ═══════════════════════════════════════════════════════
   로그아웃하면 사람 자료를 기기에서 지운다 (정식 1.0)

   ★ 왜 필요했나
   전에는 로그아웃해도 gsc_members_m_admin 같은 명단이
   그 휴대폰의 저장 공간에 그대로 남았다.
   안내실이 남의 휴대폰으로 한 번 로그인했다가 나가면
   안내실용 명단(생년월·비고 포함)이 그 기기에 남는 것이다.
   화면에 쓰이지는 않지만 남겨 둘 이유가 없다.

   ★ 무엇을 남기나
   · 사진 썸네일(gsc-thumb-*) — 남긴다.
     이름이 아니라 고유ID로만 묶인 64px 얼굴이라 명단 없이는 뜻이 없고,
     지우면 다음 로그인 때 1.1MB 를 다시 받아야 한다.
   · 교회 로고, 화면 밝기, 내 담당 명단, 심방 기록자 이름 — 남긴다.
     사람의 개인 정보가 아니고 그 기기의 편의를 위한 값이다.
═══════════════════════════════════════════════════════ */
function clearPersonCache() {
  try {
    const keep = ['gsc-theme','gsc-thumb-data','gsc-thumb-rev','gsc_logoUrl','gsc_logoRev',
                  'gsc_my_group','gsc_my_gu','gsc_visit_writer','gsc_photo_stale','gsc_legacyLogo',
                  'gsc_note_shortcut'];
    const drop = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k) continue;
      if (k.indexOf('gsc') !== 0) continue;      /* 우리 것만 건드린다 */
      if (keep.indexOf(k) >= 0) continue;
      drop.push(k);
    }
    drop.forEach(k => localStorage.removeItem(k));
  } catch(e) {}
}

function clearThumbCache() {
  try {
    localStorage.removeItem('gsc-thumb-data');
    localStorage.removeItem('gsc-thumb-rev');
  } catch(e) {}
}

async function fbLoadThumbs() {
  const idxRef = _db.collection('thumbs').doc('_index');
  let idx;
  await softWait(_fsReady, 2000);
  try { idx = await withTimeout(idxRef.get(), FS_TIMEOUT, '사진 목록'); }
  catch(e) {
    /* 인터넷이 불안한 것뿐이라면, 저장해 둔 사진이라도 보여 준다.
       (서버 확인 실패를 '사진이 지워졌다'고 오해하면 안 된다) */
    return readThumbCache(null) || {};
  }

  /* 색인이 사라졌다 = 안내실이 사진을 전부 지웠다는 뜻.
     이 기기에 남은 캐시도 함께 비운다. */
  if (!idx.exists) { clearThumbCache(); return {}; }

  const n   = idx.data().chunks || 0;
  const rev = String(idx.data().rev || '');

  /* 판번호가 같으면 기기에 저장해 둔 사진을 그대로 쓴다.
     휴대폰에서 1MB 넘는 사진을 매번 내려받지 않게 하는 핵심 부분.
     안내실이 사진을 바꾸면 판번호가 달라져 자동으로 새로 받는다. */
  if (rev) {
    const hit = readThumbCache(rev);
    if (hit) return hit;
  }

  /* 사진이 하나도 없는 상태 */
  if (n === 0) { clearThumbCache(); return {}; }

  /* 새로 받기 전에 기기에 있던 것을 들고 있는다 — 바뀐 사람을 찾기 위해 */
  const before = readThumbCache(null) || {};

  const snaps = await Promise.all(
    Array.from({ length:n }, (_, i) =>
      withTimeout(getDoc(_db.collection('thumbs').doc('c' + i), false), FS_T_THUMBS, '사진 목록')
        .catch(() => null))
  );
  const out = {};
  snaps.forEach(s => { if (s && s.exists) Object.assign(out, s.data()); });

  /* 썸네일이 달라진 사람 = 사진을 바꾼 사람.
     그 사람의 큰 사진만 다음에 서버에서 다시 받게 표시해 둔다.
     (fbLoadPhoto 주석 참고) */
  try {
    const changed = Object.keys(out).filter(k => before[k] && before[k] !== out[k]);
    if (changed.length) addPhotoStale(changed);
  } catch(e) {}

  try {
    localStorage.setItem('gsc-thumb-data', JSON.stringify(out));
    localStorage.setItem('gsc-thumb-rev', rev);
  } catch(e) {
    try { localStorage.removeItem('gsc-thumb-data'); localStorage.removeItem('gsc-thumb-rev'); } catch(e2) {}
  }
  return out;
}

/* ═══════════════════════════════════════════════════════
   사진이 바뀐 사람만 다시 받는다 (정식 1.0)

   ★ 예전에는 무엇이 문제였나
   상세 화면의 큰 사진을 "기기 캐시가 있으면 서버를 보지 않는다"로 읽었다.
   통신량은 아꼈지만, 사진을 새로 올려도 ★ 그 기기에서는 옛 사진이
   계속 보였다 ★. 목록의 작은 사진만 바뀌어 더 헷갈렸다.

   ★ 지금 방식 — 썸네일을 비교해 바뀐 사람만 찾아낸다
   썸네일 전체는 판번호(rev)가 바뀔 때만 새로 받는다.
   그때 ★ 기기에 있던 옛 썸네일과 새 썸네일을 비교 ★ 하면
   사진이 실제로 바뀐 사람이 정확히 드러난다.
   그 사람들만 'gsc_photo_stale' 에 적어 두고,
   상세 화면을 열 때 그 사람은 서버에서 다시 받는다 (그리고 목록에서 지운다).

   그래서 추가 통신은 ★ 실제로 바뀐 사람의 사진을 실제로 열어 볼 때 ★
   한 번뿐이다. 나머지는 예전처럼 기기 캐시로 0회다.
═══════════════════════════════════════════════════════ */
function readPhotoStale() {
  try {
    const v = localStorage.getItem('gsc_photo_stale');
    const a = v ? JSON.parse(v) : null;
    return Array.isArray(a) ? a : [];
  } catch(e) { return []; }
}
function addPhotoStale(ids) {
  if (!ids || !ids.length) return;
  try {
    const set = new Set(readPhotoStale());
    ids.forEach(i => set.add(String(i)));
    localStorage.setItem('gsc_photo_stale', JSON.stringify([...set].slice(0, 2000)));
  } catch(e) {}
}
function dropPhotoStale(id) {
  try {
    const a = readPhotoStale().filter(x => x !== String(id));
    if (a.length) localStorage.setItem('gsc_photo_stale', JSON.stringify(a));
    else localStorage.removeItem('gsc_photo_stale');
  } catch(e) {}
}

async function fbLoadPhoto(id) {
  const stale = readPhotoStale().indexOf(String(id)) >= 0;
  let s;
  if (stale) {
    /* 사진이 바뀐 사람 — 서버에서 다시 받는다 (그 뒤로는 다시 캐시) */
    try {
      s = await withTimeout(_db.collection('photos').doc(id).get({ source:'server' }), 15000, '사진');
      dropPhotoStale(id);
    } catch(e) {
      s = await withTimeout(getDoc(_db.collection('photos').doc(id), true), 15000, '사진');
    }
  } else {
    s = await withTimeout(getDoc(_db.collection('photos').doc(id), true), 15000, '사진');
  }
  return s.exists ? (s.data().url || '') : '';
}

async function fbSavePhotoDoc(id, dataUrl) {
  await withTimeout(_db.collection('photos').doc(id).set({ url: dataUrl }), 45000, '사진 저장');
}

async function fbSaveThumbs(thumbMap) {
  const ids = Object.keys(thumbMap).filter(k => thumbMap[k]);
  const chunks = [];
  let cur = {}, size = 0;
  ids.forEach(id => {
    const v = thumbMap[id];
    if (size + v.length > CHUNK_LIMIT && Object.keys(cur).length) { chunks.push(cur); cur = {}; size = 0; }
    cur[id] = v; size += v.length;
  });
  if (Object.keys(cur).length) chunks.push(cur);

  const idxRef = _db.collection('thumbs').doc('_index');
  let oldN = 0;
  try {
    const p = await withTimeout(idxRef.get(), FS_TIMEOUT, '사진 색인');
    if (p.exists) oldN = p.data().chunks || 0;
  } catch(e) {}

  for (let i = 0; i < chunks.length; i++) {
    await withTimeout(_db.collection('thumbs').doc('c' + i).set(chunks[i]), 60000, '사진 목록 저장');
  }
  for (let i = chunks.length; i < oldN; i++) {
    try { await _db.collection('thumbs').doc('c' + i).delete(); } catch(e) {}
  }
  const rev = String(Date.now());
  await withTimeout(idxRef.set({ chunks: chunks.length, rev, count: ids.length }), FS_TIMEOUT, '사진 색인 저장');
  try { localStorage.setItem('gsc-thumb-rev', rev); } catch(e) {}
  return chunks.length;
}

/* 사진 전부 지우기 — 원본·썸네일·기기 캐시까지 */
async function fbDeleteAllPhotos(onProgress) {
  const snap = await withTimeout(_db.collection('photos').get(), 60000, '사진 목록 읽기');
  const docs = snap.docs;
  let done = 0;
  onProgress && onProgress(0, docs.length);
  for (let i = 0; i < docs.length; i += 300) {
    const batch = _db.batch();
    docs.slice(i, i + 300).forEach(d => batch.delete(d.ref));
    await withTimeout(batch.commit(), 60000, '사진 삭제');
    done = Math.min(docs.length, i + 300);
    onProgress && onProgress(done, docs.length);
  }
  /* 목록용 썸네일 문서와 색인도 함께 */
  try {
    const t = await withTimeout(_db.collection('thumbs').get(), 30000, '사진 목록 읽기');
    if (t.docs.length) {
      const b = _db.batch();
      t.docs.forEach(d => b.delete(d.ref));
      await withTimeout(b.commit(), 60000, '사진 목록 삭제');
    }
  } catch(e) {}
  try {
    localStorage.removeItem('gsc-thumb-data');
    localStorage.removeItem('gsc-thumb-rev');
  } catch(e) {}
  Object.keys(PHOTO_CACHE).forEach(k => delete PHOTO_CACHE[k]);
  return docs.length;
}

}

/* ═══════════════════════════════════════════════════════
   출석상태 — 옛 값을 새 값으로 옮겨 읽는다 (정식 1.16)

   전 (엑셀·attend 에 쌓여 있던 값)      →  후
   ──────────────────────────────────────────────
   정상출석 / 정상                        →  출석A
   주일만                                 →  출석B
   타지역                                 →  미출석
   상·하반기불참 / 상반기불참 …            →  미출석
   상·하반기잠 / 하반기잠 …                →  미출석

   ★ 왜 타지역이 표식이 아니라 미출석인가 (2026-09-12 결정)
     타지역으로 적어 두신 분들 중에는 실제로 교적을 옮기신 분과
     그냥 멀리 사시는 분이 섞여 있었다. 전부 전출로 잡으면
     떠나지 않으신 분까지 전출로 세어진다. 그래서 미출석으로만 옮기고,
     실제 전출은 교회에서 다시 표식을 달아 주시는 편이 안전하다.

   ★ 참석율 대상(분모)은 '출석A + 출석B'다.
     미출석은 분모에서 빠진다 — 매주 나오실 수 없는 분들을 분모에 넣으면
     구역장이 실제로 챙기는 인원과 무관한 숫자가 된다.
     대신 그분이 오셔서 체크되면 그 날짜에는 대상과 참석에 함께 들어간다.

   ★ 엑셀 값을 고치지 않아도 된다.
     parseAtt() 가 옛 값을 알아서 옮겨 읽는다.
     구역장이 화면에서 고친 값은 attend/status 에 따로 쌓이고,
     그 값이 엑셀 값보다 우선한다. 엑셀을 다시 올려도 남는다.
═══════════════════════════════════════════════════════ */
const ATT_TONE  = { '출석A':'green', '출석B':'amber', '미출석':'red' };
const MARK_TONE = { '전입':'blue',   '전출':'gray',   '구원':'violet' };

/* ═══════════════════════════════════════════════════════
   출석표에 성도를 세우는 순서 (정식 1.15)

   ★ 왜 이 순서인가
   구역장이 주일 아침에 실제로 두드리는 분은 ★출석A★ 다.
   그런데 이름순으로만 놓으면 출석·미출석이 뒤섞여,
   손가락이 오르내리며 「이분은 안 나오시는 분」을 매번 건너뛰어야 했다.

   그래서 손이 가는 순서대로 세운다.
     ① 출석A   매주 오시는 분 — 맨 위
     ② 출석B   이따금 오시는 분
     ③ 미출석  당분간 나오지 않으시는 분 — 맨 아래

   같은 묶음 안에서는 예전처럼 이름순이다 (sortMembers).
═══════════════════════════════════════════════════════ */
const ATT_SORT = { '출석A':0, '출석B':1, '미출석':2 };
function attSortKey(st) {
  const v = ATT_SORT[normAtt(st)];
  return v === undefined ? 9 : v;
}
/* 출석상태 순 → 이름순 으로 줄을 세운다 */
function sortByAtt(list, attStatus) {
  return (list || []).slice().sort((a, b) => {
    const d = attSortKey(effAtt(a, attStatus)) - attSortKey(effAtt(b, attStatus));
    if (d) return d;
    return sortMembers(a, b);
  });
}

/* 낱말 하나를 배타 상태로 읽는다. 관계없는 낱말이면 빈 글자를 준다.
   ★ 보는 순서가 중요하다 — '정상출석' 에는 '출석' 이 들어 있고,
     '미출석' 에도 '출석' 이 들어 있다. 좁은 쪽부터 본다. */
function attWordState(t) {
  if (!t) return '';
  if (t.indexOf('미출석') >= 0) return '미출석';
  if (/출석\s*[Aa]/.test(t) || t === 'A' || t === 'a') return '출석A';
  if (/출석\s*[Bb]/.test(t) || t === 'B' || t === 'b') return '출석B';
  /* 1.15까지 쓰던 값 */
  if (t.indexOf('타지역') >= 0) return '미출석';
  if (t.indexOf('주일')   >= 0) return '출석B';
  if (t.indexOf('불참')   >= 0) return '미출석';
  if (t.indexOf('잠')     >= 0) return '미출석';   /* 잠적 → 미출석 */
  if (t.indexOf('정상')   >= 0) return '출석A';
  return '';
}

/* 적힌 글 한 줄 → { state, marks }.
   띄어쓰기·쉼표·가운뎃점 어느 것으로 나누어 적어도 읽는다. */
function parseAtt(v) {
  const words = String(v == null ? '' : v).split(/[\s,，·・\/|;]+/).filter(Boolean);
  let state = '';
  const got = {};
  words.forEach(w => {
    ATT_MARKS.forEach(k => { if (w.indexOf(k) >= 0) got[k] = 1; });
    if (!state) { const st = attWordState(w); if (st) state = st; }
  });
  /* ★ 전출은 자동으로 미출석이고, 다른 표식과 함께 달 수 없다 */
  if (got['전출']) return { state:'미출석', marks:['전출'] };
  return { state: state || '출석A', marks: ATT_MARKS.filter(k => got[k]) };
}

/* { state, marks } → 저장할 글 한 줄 */
function attText(state, marks) {
  const st = ATT_STATES.indexOf(state) >= 0 ? state : '출석A';
  const mk = (marks || []).filter(k => ATT_MARKS.indexOf(k) >= 0);
  if (mk.indexOf('전출') >= 0) return '미출석 전출';
  return [st].concat(ATT_MARKS.filter(k => mk.indexOf(k) >= 0)).join(' ');
}

function normAtt(v) { return parseAtt(v).state; }

/* 이 성도의 지금 출석상태.
   구역장이 화면에서 고친 값(attend/status)이 엑셀 값보다 앞선다. */
function effAttFull(m, ovr) {
  const id = m && m['고유ID'];
  const o  = (ovr && id) ? ovr[id] : null;
  return parseAtt(o || (m && m['출석상태']));
}
function effAtt(m, ovr)   { return effAttFull(m, ovr).state; }
function effMarks(m, ovr) { return effAttFull(m, ovr).marks; }
function hasMark(m, ovr, k) { return effAttFull(m, ovr).marks.indexOf(k) >= 0; }

/* 참석율의 분모는 '출석A + 출석B'다.
   미출석으로 지정해 둔 분까지 넣으면 구역장이 실제로 챙기는 인원 대비
   참석율이 아니라 명부 대비 숫자가 되어 매주 낮게만 나온다. */
function isAttTarget(state) { return state === '출석A' || state === '출석B'; }

/* dataURL 로 담아 둔 사진을 다시 그림으로 — 요청 사진을 주소록으로 옮길 때 쓴다 */
function loadImageFromDataUrl(url) {

/* 목록 아바타는 화면에서 50px 동그라미로 보인다.
   64px면 충분하고, 80px 대비 전송량이 약 18% 줄어든다. */
const THUMB_DIM = 64, THUMB_Q = 0.60;

function loadImageFromFile(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = () => rej(new Error('파일을 읽을 수 없습니다'));
    r.onload = e => {
      const img = new Image();
      img.onerror = () => rej(new Error('이미지를 열 수 없습니다 (HEIC 등 미지원 형식)'));
      img.onload  = () => res(img);
      img.src = e.target.result;
    };
    r.readAsDataURL(file);
