/* ═══════════════════════════════════════════════════════
   주소록 설정 (정식 1.12)
   공지 한 줄 · 목록에서 감출 분 · 출석상태 고치기 잠금
═══════════════════════════════════════════════════════ */
function ListCfgAdmin({ members, attStatus, cfg, onCfgUpdate }) {
  const [c,      setC]      = useState(() => normListCfg(cfg));
  const [msg,    setMsg]    = useState('');
  const [saving, setSaving] = useState(false);

  useEffect(() => { setC(normListCfg(cfg)); }, [cfg]);

  /* 지금 출석상태 기준으로 목록에서 빠질 분들.
     성도 기기는 출석상태를 못 받으므로 이 고유ID 목록을 함께 보낸다
     (normListCfg 주석 참고). */
  const hideIds = useMemo(() => hideIdsNow(members, attStatus, c),
    [members, attStatus, c.hideAway, c.hideAbsent]);

  /* 저장된 목록과 지금 기준이 어긋난 분들 — 누가 달라졌는지 이름으로 보여 준다 */
  const drift = useMemo(() => {
    const saved = new Set(normListCfg(cfg).hidden.map(String));
    const now   = new Set(hideIds.map(String));
    const name  = id => {
      const m = members.filter(x => String(x['고유ID']) === String(id))[0];
      return m ? ((m['이름'] || '') + (m['동명이인구분'] || '')) : ('알 수 없음(' + id + ')');
    };
    return {
      add:  hideIds.filter(id => !saved.has(String(id))).map(name),   /* 이제 빠져야 할 분 */
      keep: [...saved].filter(id => !now.has(String(id))).map(name)   /* 이제 다시 나와야 할 분 */
    };
  }, [members, hideIds, cfg]);

  const base = normListCfg(cfg);
  const changed = c.notice     !== base.notice
               || c.hideAway   !== base.hideAway
               || c.hideAbsent !== base.hideAbsent
               || c.statusEdit !== base.statusEdit
               || hideIds.join(',') !== base.hidden.join(',');

  async function save() {
    setSaving(true); setMsg('');
    try {
      const saved = await fbSaveListCfg({ ...c, hidden: hideIds });
      onCfgUpdate && onCfgUpdate(saved);
      setMsg('ok:저장했습니다. 각 기기는 다음 접속 때 새 설정을 받습니다.');
    } catch(e) { setMsg('err:' + fsErrMsg(e)); }
    setSaving(false);
  }

  const note = s => s ? h('p', {
    className: 'note ' + (s.startsWith('ok:') ? 'note-ok' : 'note-bad'),
    style:{ marginTop:'10px' }
  }, s.slice(s.indexOf(':') + 1)) : null;

  const pick = (key, val) => { setC(o => ({ ...o, [key]:val })); setMsg(''); };

  const row = (label, key, on, off, hint) =>
    h('div', { style:{ marginBottom:'14px' } },
      h('p', { style:{ fontSize:'13px', fontWeight:800, color:'var(--text-3)', marginBottom:'6px' } }, label),
      h('div', { className:'seg' },
        [[true, on],[false, off]].map(([v, lbl]) => h('button', {
          key:String(v), type:'button',
          className: c[key] === v ? 'on' : '',
          onClick: () => pick(key, v)
        }, lbl))
      ),
      hint && h('p', { style:{ fontSize:'12.5px', color:'var(--text-3)', marginTop:'6px', lineHeight:1.6 } }, hint));

  return h(Card, null,
    h(SLabel, { icon:'megaphone', text:'주소록 설정' }),

    /* ── 공지 한 줄 ── */
    h('p', { style:{ fontSize:'13px', fontWeight:800, color:'var(--text-3)', marginBottom:'6px' } },
      '공지·안내 한 줄'),
    h('input', {
      type:'text', value:c.notice, maxLength:200,
      placeholder:'예: 10/15 추계야외교제 · 전 성도 오전 11시',
      onChange: e => { setC(o => ({ ...o, notice:e.target.value })); setMsg(''); }
    }),
    h('p', { style:{ fontSize:'12.5px', color:'var(--text-3)', marginTop:'6px', lineHeight:1.6 } },
      '주소록 목록의 ', h('b', null, '인원수 옆'), '에 나옵니다. 비워 두면 나오지 않습니다.'),
    c.notice.trim() && h('div', {
      style:{ marginTop:'8px', padding:'10px 12px', background:'var(--soft)',
              border:'1px solid var(--soft-bd)', borderRadius:'var(--r)',
              fontSize:'14px', color:'var(--text-2)', fontWeight:600, lineHeight:1.6 }
    },
      h('strong', { style:{ color:'var(--navy)', fontSize:'15.5px' } }, members.length), '명\u2002',
      h('i', { className:'ti ti-speakerphone',
               style:{ fontSize:'15px', verticalAlign:'-2px', marginRight:'3px',
                       color:'var(--navy)', opacity:.9 } }),
      h('span', { style:{ color:'var(--navy)', fontWeight:700 } }, c.notice.trim())),

    h('div', { style:{ height:'1px', background:'var(--border)', margin:'16px 0' } }),

    /* ── 목록에서 감추기 ── */
    row('전출 성도',   'hideAway', '목록에서 제외', '목록에 포함'),
    row('미출석 성도', 'hideAbsent', '목록에서 제외', '목록에 포함',
        '감추는 것은 주소록 목록뿐입니다. 출석표와 출석상태 화면에는 그대로 나오고, 자료도 지워지지 않습니다.'),

    (c.hideAway || c.hideAbsent) && h('div', {
      className:'note note-info', style:{ marginBottom:'14px' }
    },
      '지금 기준으로 ', h('b', null, hideIds.length + '명'), ' 이 주소록 목록에서 빠집니다.', h('br'),
      h('span', { style:{ fontSize:'13px', opacity:.9 } },
        '성도 화면에는 출석상태가 아예 가지 않으므로, 이 목록을 저장할 때 함께 실어 보냅니다. ',
        '성도·임원·안내실이 모두 ', h('b', null, '이 목록 하나'), ' 를 봅니다.')),

    /* ★ 저장된 목록이 낡았으면 — 세 화면이 어긋나 있는 상태다 */
    (c.hideAway || c.hideAbsent) && (drift.add.length + drift.keep.length) > 0 && h('div', {
      className:'note note-warn', style:{ marginBottom:'14px' }
    },
      h('b', null, '저장된 목록이 지금 출석상태와 ' +
        (drift.add.length + drift.keep.length) + '명 다릅니다.'), h('br'),
      '아래 ', h('b', null, '[저장]'), ' 을 한 번 눌러 주세요. 누르시기 전까지는 예전 목록이 그대로 쓰입니다.',
      drift.add.length > 0 && h(React.Fragment, null, h('br'),
        h('span', { style:{ fontSize:'13px' } },
          '이제 ', h('b', null, '빠져야 할 분'), ' — ',
          drift.add.slice(0, 12).join(', '),
          drift.add.length > 12 ? ' 외 ' + (drift.add.length - 12) + '명' : '')),
      drift.keep.length > 0 && h(React.Fragment, null, h('br'),
        h('span', { style:{ fontSize:'13px' } },
          '이제 ', h('b', null, '다시 나와야 할 분'), ' — ',
          drift.keep.slice(0, 12).join(', '),
          drift.keep.length > 12 ? ' 외 ' + (drift.keep.length - 12) + '명' : ''))),

    h('div', { style:{ height:'1px', background:'var(--border)', margin:'16px 0' } }),

    /* ── 출석상태 고치기 잠금 ── */
    row('담당자의 출석상태 설정', 'statusEdit', '사용함', '잠금',
        c.statusEdit
          ? '구역장·부서 담당자가 출석표와 성도 화면에서 출석상태(출석A·출석B·미출석)와 표식(전입·전출·구원)을 고칠 수 있습니다.'
          : '출석 체크는 그대로 되고, 출석상태만 고칠 수 없습니다. 한 번 정리해 두셨으면 잠가 두시면 실수로 바뀌지 않습니다. (전도인은 언제나 고칠 수 있습니다)'),

    h('button', {
      type:'button', onClick:save, disabled:saving || !changed,
      className:'btn btn-primary btn-block', style: changed ? null : { opacity:.5 }
    },
      saving
        ? h('span', { className:'spinner', style:{ width:'16px', height:'16px', borderWidth:'2px' } })
        : h('i', { className:'ti ti-device-floppy', style:{ fontSize:'19px' } }),
      saving ? '저장 중...' : (changed ? '저장' : '변경된 내용 없음')),
    note(msg)
  );
}

function AdminView({ members, photos, fieldVis, logoUrl, visitCfg, listCfg, attStatus, family, hasLegacyLogo,
                     onOpenWizard, role,
                     onBack, onMembersUpdate, onFieldVisUpdate, onVisitCfgUpdate, onListCfgUpdate,
                     onFamilyUpdate, onAttStatus, onAttReload, onAttend,
                     onPhotoUpdate, onPhotosReset, onLogoUpdate, onPreview, theme, toggle, onHome }) {
  /* ═══ 이 화면은 등급에 따라 둘로 갈린다 (등급 개편) ═══
       안내실 — 데이터 · 사진 · 표시 설정 · 가족 · 비밀번호 · 교회 설정
       전도인 — 출석 · 심방 메모
     계정과 비밀번호는 예전 그대로다. 보이는 탭만 달라진다. */
  const isEvang = role === 'master';
  const isLead  = role === 'leader';          /* 구역·부서 담당자 */
  const [tab,       setTab]       = useState(isLead ? 'myatt' : isEvang ? 'attend' : 'upload');
  const [uploading, setUploading] = useState(false);
  const [uploadMsg, setUploadMsg] = useState('');
  const [logoBusy,  setLogoBusy]  = useState(false);
  const [logoMsg,   setLogoMsg]   = useState('');
  const [legacy,    setLegacy]    = useState(!!hasLegacyLogo);
  const [vis,       setVis]       = useState(() => ({ ...DEFAULT_VIS, ...(fieldVis || {}) }));
  const [visMsg,    setVisMsg]    = useState('');
  const [visSaving, setVisSaving] = useState(false);
  const dark = theme === 'dark';

  async function handleFile(e) {
    const f = e.target.files[0]; if (!f) return;
    setUploading(true); setUploadMsg('');
    try {
      const data = await parseXlsx(f);
      /* ★ 가족 설정을 먼저 정해야 세대 번호를 바르게 계산할 수 있다.
         엑셀에 가족ID 칸이 없으면 지금 설정을 그대로 쓴다. */
      const famNext = data.__family || family;
      await fbSaveMembers(data, vis, famNext);
      onMembersUpdate(data);
      let extra = '';
      /* 엑셀에 가족ID 칸이 있으면 가족 연결도 그 값으로 새로 세운다.
         칸이 없으면(옛 파일) 지금 가족 설정을 건드리지 않는다. */
      if (data.__family) {
        const nFam = Object.keys(data.__family.g).length;
        const nJoin = data.__family.__joined || 0;
        const saved = await fbSaveFamily(data.__family);
        onFamilyUpdate && onFamilyUpdate(saved);
        extra = ' · 가족 ' + nFam + '집 반영' +
                (nJoin ? ' (가족ID 비어 있던 ' + nJoin + '명은 주소로 붙였습니다)' : '');
      }
      /* ★ 올린 뒤에 놓친 칸을 숫자로 알려 드린다 (정식 1.14) */
      const chk = checkRequired(data);
      const holes = Object.keys(chk.miss).filter(k => chk.miss[k] > 0)
                      .map(k => k + ' ' + chk.miss[k] + '명');
      let warn = '';
      if (holes.length) warn += ' · 비어 있는 필수 칸: ' + holes.join(', ');
      if (chk.dupNoMark.length)
        warn += ' · 같은 이름인데 동명이인구분이 비었습니다 (' +
                chk.dupNoMark.slice(0, 3).join(', ') +
                (chk.dupNoMark.length > 3 ? ' 외 ' + (chk.dupNoMark.length - 3) + '건' : '') + ')';
      setUploadMsg('ok:' + data.length + '명 저장 완료 (등급별 사본 4개 생성)' + extra + warn);
    } catch(err) { setUploadMsg('err:' + fsErrMsg(err)); }
    setUploading(false); e.target.value = '';
  }

  async function handleLogoUpload(e) {
    const file = e.target.files[0]; if (!file) return;
    setLogoBusy(true); setLogoMsg('');
    try {
      const img = await loadImageFromFile(file);
      const dataUrl = toDataUrlCapped(img, 240, 0.85, 100000);
      await fbSaveLogo(dataUrl);
      onLogoUpdate(dataUrl);
      setLegacy(false);
      setLogoMsg('ok:로고를 바꿨습니다. 성도 화면에도 보이려면 보안 규칙에 church/logo 가 있어야 합니다.');
    } catch(err) { setLogoMsg('err:로고 저장 실패 - ' + fsErrMsg(err)); }
    setLogoBusy(false); e.target.value = '';
  }

  async function handleLogoDelete() {
    if (!confirm('로고를 삭제하고 기본 교회 아이콘으로 돌아갈까요?')) return;
    setLogoBusy(true); setLogoMsg('');
    try {
      await fbDeleteLogo();
      onLogoUpdate('');
      setLegacy(false);
      setLogoMsg('ok:기본 아이콘으로 변경되었습니다');
    } catch(err) { setLogoMsg('err:' + fsErrMsg(err)); }
    setLogoBusy(false);
  }

  /* 예전 방식(config 안)에 들어 있는 로고를 church/logo 로 옮긴다.
     옮기면 접속마다 따라오던 약 98KB 가 사라진다 (fbLoadLogo 주석 참고). */
  async function migrateLogo() {
    if (!logoUrl) { setLogoMsg('err:옮길 로고가 없습니다.'); return; }
    if (!confirm('로고를 따로 저장해 통신량을 줄일까요?\n\n'
      + '· 성도 한 사람당 접속마다 약 98KB 를 아낍니다 (월 2GB 이상)\n'

  async function exportBackup() {
    try {
      if (!members.length) { alert('내보낼 자료가 없습니다.'); return; }
      await loadXlsxLib();
      /* 백업은 최후의 보루다 — 반드시 온전한 명단으로 받는다 */
      const base = await fullList();
      const wb = XLSX.utils.book_new();
      /* 년월은 문자로 내보낸다. 숫자로 나가면 엑셀이 날짜로 바꿔 버린다. */
      /* ★ 가족관계를 두 칸으로 실어 보낸다.
         교회에서 엑셀로 고쳐 다시 올리면 그대로 반영된다. */
      const famCols = buildFamilyColumns(base, family);
      const sorted  = sortForFamilyExport(base, famCols);
      const rowsOut = sorted.map(mm => {
        const o = {};
        Object.keys(mm).forEach(k => { o[k] = isYmField(k) ? normYm(mm[k]) : mm[k]; });
        const c = famCols[mm['고유ID']];
        o[FAM_COL_ID]   = c ? c.fid  : '';
        o[FAM_COL_HEAD] = c ? c.head : '';
        o[FAM_COL_REL]  = c ? c.rel  : '';
        return o;
      });
      /* ★ 헤더를 정해 줄 때 목록에 없는 칸을 빠뜨리면 안 된다.
         백업은 최후의 보루다. 교회가 엑셀에 칸을 하나 추가했는데
         그 칸이 이 목록에 없으면 백업에서 ★소리 없이 사라진다★.
         그래서 아는 칸을 먼저 순서대로 놓고, 나머지 칸을 뒤에 붙인다. */
      /* 세대 번호는 프로그램이 계산하는 값이므로 백업에 넣지 않는다.
         엑셀에 보이면 사람이 고치려 하고, 다시 올릴 때 버려져 혼란만 준다. */
      const known = ALWAYS_FIELDS.filter(k => k !== FAM_GEN_FIELD).concat(DETAIL_FIELDS);
      const extra = [];
      const FAM_COLS = [FAM_COL_ID, FAM_COL_HEAD, FAM_COL_REL];
      rowsOut.forEach(o => Object.keys(o).forEach(k => {
        if (FAM_COLS.indexOf(k) >= 0 || k === FAM_GEN_FIELD) return;
        if (known.indexOf(k) < 0 && extra.indexOf(k) < 0) extra.push(k);
      }));
      const head = known.filter(k => rowsOut.some(o => k in o))
                     .concat(extra, FAM_COLS);
      const ws = XLSX.utils.json_to_sheet(rowsOut, { header: head });
      Object.keys(ws).forEach(addr => {
        if (addr[0] === '!') return;
        const c = ws[addr];
        if (c && typeof c.v === 'string') { c.t = 's'; delete c.z; }
      });
      XLSX.utils.book_append_sheet(wb, ws, '성도명단');
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
        DETAIL_FIELDS.map(f => ({ 항목:f, 공개범위:VIS_LABEL[vis[f]] || VIS_LABEL.all }))
      ), '표시설정');
      const d  = new Date();
      const ts = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
      XLSX.writeFile(wb, FILE_TAG + '_성도주소록_백업_' + ts + '.xlsx');
    } catch(e) { alert('내보내기 실패: ' + e.message); }
  }

/* ═══════════════════════════════════════════════════════
   구역·부서 담당자 계정 (1.06)

   계정을 만드는 것은 Firebase 콘솔에서만 된다 (프로그램에서 못 만든다).
   그래서 여기서는 ① 만들 계정 목록을 보여 주고 ② 이미 만든 계정의
   비밀번호를 바꿀 수 있게 한다.
═══════════════════════════════════════════════════════ */
function LeaderAccounts({ members }) {
  const list = useMemo(() => leaderAccounts(members), [members]);
  const [sel,  setSel]  = useState('');
  const [cur,  setCur]  = useState('');
  const [nw,   setNw]   = useState('');
  const [busy, setBusy] = useState(false);
  const [msg,  setMsg]  = useState('');

  async function go() {
    if (!sel) { setMsg('err:계정을 골라 주세요.'); return; }
    if (nw.length < 6) { setMsg('err:새 비밀번호는 6자 이상이어야 합니다.'); return; }
    setBusy(true); setMsg('');
    try {
      await changeAccountPassword(sel, cur, nw);
      setMsg('ok:' + sel + ' 비밀번호를 바꿨습니다.');
      setCur(''); setNw('');
    } catch(e) { setMsg('err:' + authErrMsg(e)); }
    setBusy(false);
  }

  const all = list.map(a => a.email).join('\n');

  return h(React.Fragment, null,
    h(Card, null,
      h(SLabel, { icon:'users-group', text:'구역·부서 담당자 계정 ' + list.length + '개' }),
      h('div', { className:'note note-info', style:{ margin:'10px 0 12px' } },
        h('b', null, '계정은 Firebase 콘솔에서 만듭니다.'), ' 관리자에게 문의 하세요.', h('br'),
        '아래 주소를 복사해 하나씩 만드시고 비밀번호를 정해 주세요 (6자 이상).', h('br'),
        h('span', { style:{ fontSize:'13px', opacity:.85 } },
          '담당자가 로그인하면 ', h('b', null, '자기 명단만'), ' 열립니다. 남의 구역은 보이지 않습니다.')),
      h('button', {
        type:'button', className:'btn btn-ghost btn-sm btn-block',
        onClick: async e => {
          const ok = await copyText(all);
          e.currentTarget.textContent = ok ? '복사했습니다' : '복사 실패';
        }
      }, '계정 ' + list.length + '개 주소 한꺼번에 복사'),
      h('div', { style:{ display:'flex', flexDirection:'column', gap:'6px', marginTop:'12px' } },
        list.map(a => h('div', {
          key:a.email,
          style:{ display:'flex', alignItems:'center', gap:'9px', padding:'9px 11px',
                  background:'var(--surface-2)', border:'1px solid var(--border)',
                  borderRadius:'10px' }
        },
          h('i', { className:'ti ti-' + (a.kind === 'dept' ? 'school' : 'map-pin'),
                   style:{ fontSize:'17px', color:'var(--navy)', flexShrink:0 } }),
          h('code', { style:{ flex:1, minWidth:0, fontSize:'13.5px', wordBreak:'break-all' } }, a.email),
          h('span', { style:{ fontSize:'12.5px', color:'var(--text-3)', whiteSpace:'nowrap' } }, a.name)
        ))
      )
    ),

    h(Card, null,
      h(SLabel, { icon:'lock', text:'담당자 비밀번호 바꾸기' }),
      h('p', { style:{ fontSize:'13.5px', color:'var(--text-2)', margin:'8px 0 12px', lineHeight:1.7 } },
        '지금 비밀번호를 알고 계실 때만 바꿀 수 있습니다. ',
        '잊어버렸다면 관리자에게 문의하세요.'),
      h('div', { style:{ display:'flex', flexDirection:'column', gap:'9px' } },
        h('select', { value:sel, disabled:busy, onChange: e => { setSel(e.target.value); setMsg(''); } },
          h('option', { value:'' }, '계정을 고르세요'),
          list.map(a => h('option', { key:a.email, value:a.email }, a.name + ' — ' + a.email))),
        h('input', { type:'password', value:cur, disabled:busy, placeholder:'지금 비밀번호',
          onChange: e => { setCur(e.target.value); setMsg(''); } }),
        h('input', { type:'password', value:nw, disabled:busy, placeholder:'새 비밀번호 (6자 이상)',
          onChange: e => { setNw(e.target.value); setMsg(''); } }),
        h('button', { type:'button', className:'btn btn-primary btn-block', disabled:busy, onClick:go },
          busy ? '바꾸는 중...' : '비밀번호 바꾸기')
      ),
      msg && h('p', {
        className:'note ' + (msg.startsWith('ok:') ? 'note-ok' : 'note-bad'),
        style:{ marginTop:'10px', fontSize:'14px' }
      }, msg.slice(msg.indexOf(':') + 1))
    )
  );
}

/* role 을 주면 그 등급 계정을, email 을 주면 그 계정 하나를 바꾼다.
   담당자(11@ · child@ …)는 등급 표가 없으므로 email 로 넘긴다. */
function PwdCard({ role, email, icon, title, desc }) {
  const [cur,  setCur]  = useState('');
  const [a,    setA]    = useState('');
  const [b,    setB]    = useState('');
  const [m,    setM]    = useState('');
  const [busy, setBusy] = useState(false);

  async function go() {
    if (!cur)         { setM('err:현재 비밀번호를 입력하세요'); return; }
    if (!a)           { setM('err:새 비밀번호를 입력하세요'); return; }
    if (a !== b)      { setM('err:두 번 입력한 값이 다릅니다'); return; }
    if (a.length < 6) { setM('err:6자 이상으로 정해 주세요'); return; }
    setBusy(true);
    try {
      if (email) await changeAccountPassword(email, cur, a);
      else       await changeRolePassword(role, cur, a);
      setM('ok:변경했습니다'); setCur(''); setA(''); setB('');
    } catch(e) { setM('err:' + authErrMsg(e)); }
    setBusy(false);
  }

  return h(Card, null,
    h(SLabel, { icon, text:title }),
    desc && h('p', { style:{ fontSize:'13.5px', color:'var(--text-2)', marginBottom:'12px', lineHeight:1.6 } }, desc),
    h('div', { style:{ display:'flex', flexDirection:'column', gap:'10px' } },
      h('input', { type:'password', placeholder:'현재 비밀번호',  value:cur, autoComplete:'off',
                   onChange: e => { setCur(e.target.value); setM(''); } }),
      h('input', { type:'password', placeholder:'새 비밀번호 (6자 이상)', value:a, autoComplete:'new-password',
                   onChange: e => { setA(e.target.value); setM(''); } }),
      h('input', { type:'password', placeholder:'새 비밀번호 다시', value:b, autoComplete:'new-password',
                   onChange: e => { setB(e.target.value); setM(''); },
                   onKeyDown: e => e.key === 'Enter' && go() }),
      h('button', { type:'button', onClick:go, disabled:busy, className:'btn btn-primary btn-block' },
        busy
          ? h('span', { className:'spinner', style:{ width:'16px', height:'16px', borderWidth:'2px' } })
          : h('i', { className:'ti ti-device-floppy', style:{ fontSize:'19px' } }),
        busy ? '변경 중...' : '변경')
    ),
    m && h('p', {
      className: 'note ' + (m.startsWith('ok:') ? 'note-ok' : 'note-bad'),
      style:{ marginTop:'10px' }
    }, m.slice(m.indexOf(':') + 1))
  );
}

═══════════════════════════════════════════════════════ */
/* ═══════════════════════════════════════════════════════════════════
   설치 마법사 — 도구 부분

   ★ 왜 마법사가 필요한가
   이 프로그램은 빌드 도구가 없는 단일 HTML 파일이다.
   그런데 파이어베이스 설정과 계정 도메인은 「파이어베이스에 붙기 전에」
   있어야 하는 값이라서 파이어베이스에 저장해 둘 수가 없다.
   (저장해 두려면 저장소에 붙어야 하고, 붙으려면 그 값이 필요하다)

   그래서 마법사가 화면에서 값을 받아, 지금 열려 있는 이 파일을
   다시 써서 완성된 파일을 내려 준다.

   ★ 자기 자신을 어떻게 읽나
   file:// 로 열었을 때는 fetch 가 막히는 브라우저가 있다.
   그래서 파일을 다시 읽지 않고, 브라우저가 이미 들고 있는
   화면 구조(document.documentElement)를 글자로 되돌린다.
   script 태그 안의 글씨는 그대로 보존되므로 원본과 같은 파일이 나온다.
   혹시 실패하면 「파일 직접 고르기」로 넘어간다.
═══════════════════════════════════════════════════════════════════ */

/* 지금 열려 있는 이 파일을 글자로 되돌린다 */
function serializeSelf(cfg) {
  const clone = document.documentElement.cloneNode(true);
  clone.setAttribute('data-theme', 'light');

  const root = clone.querySelector('#root');
  if (root) root.innerHTML = '';

  /* 화면을 열 때 프로그램이 만들어 붙인 것은 파일에 남기지 않는다 */
  Array.prototype.forEach.call(clone.querySelectorAll('link[rel="manifest"]'), n => n.remove());
  const bc = clone.querySelector('#brand-css'); if (bc) bc.remove();

  /* 머리말의 고정 값 — 파일을 열기 전에도 제 교회 것으로 보이게 */
  const set = (sel, attr, val) => { const el = clone.querySelector(sel); if (el && val) el.setAttribute(attr, val); };
  const title = clone.querySelector('title');
  if (title) title.textContent = (cfg.appTitle || ((cfg.churchName || '우리교회') + ' 성도주소록'));
  set('meta[name="apple-mobile-web-app-title"]', 'content', cfg.shortName || '성도주소록');
  if (cfg.icon) set('link[rel="apple-touch-icon"]', 'href', cfg.icon);
  const bar = applyBrandColor(cfg.brand || DEFAULT_BRAND);
  set('meta[name="theme-color"][media*="light"]', 'content', bar.light);
  set('meta[name="theme-color"][media*="dark"]',  'content', bar.dark);

  return '<!DOCTYPE html>\n' + clone.outerHTML + '\n';
}

const CFG_MARK_A = '/* CHURCH_CFG' + '_START */';
const CFG_MARK_B = '/* CHURCH_CFG' + '_END */';

function injectCfg(src, cfg) {
  const i = src.indexOf(CFG_MARK_A), j = src.indexOf(CFG_MARK_B);
  if (i < 0 || j < 0 || j < i) throw new Error('설정 블록을 찾지 못했습니다');
  return src.slice(0, i) + CFG_MARK_A + '\nconst CHURCH_CFG = ' +
         JSON.stringify(cfg, null, 2) + ';\n' + CFG_MARK_B + src.slice(j + CFG_MARK_B.length);
}

/* 관리 구역 표식 — 글자로 통째 적으면 build.py 가 이 줄까지 표식으로 본다.
   그래서 둘로 쪼개 이어 붙인다 (CFG_MARK_A 와 같은 요령). */
const ADM_MARK_A = '/*#ADMIN' + '_ONLY_START*/';
const ADM_MARK_B = '/*#ADMIN' + '_ONLY_END*/';

/* BUILD 줄을 바꿔 끼운다 */
function setBuildKind(src, kind) {
  const m = src.match(/const BUILD = '(?:all|member|admin)';/);
  if (!m) throw new Error('BUILD 줄을 찾지 못했습니다');
  return src.replace(m[0], "const BUILD = '" + kind + "';");
}

/* 임원용 글자 → 성도용 글자 (build.py 의 strip_admin 과 같은 일) */
function toMemberSource(src) {
  if (src.indexOf(ADM_MARK_A) < 0)
    throw new Error('관리 구역 표식이 없는 파일입니다 — 안내실·전도인용 파일로 해 주세요');
  let out = '', i = 0;
  for (;;) {
    const a = src.indexOf(ADM_MARK_A, i);
    if (a < 0) { out += src.slice(i); break; }
    const b = src.indexOf(ADM_MARK_B, a);
    if (b < 0) throw new Error('관리 구역 끝 표식을 찾지 못했습니다');
    out += src.slice(i, a);
    i = b + ADM_MARK_B.length;
  }
  if (out.indexOf('function App() {') < 0) throw new Error('App 자리를 찾지 못했습니다');
  out = out.replace('function App() {', MEMBER_STUB + 'function App() {');
  return setBuildKind(out, 'member');
}

/* 임원용 글자 — 표식은 ★남겨 둔다★.
   나중에 이 파일로 마법사를 다시 돌려 성도용을 또 만들 수 있어야 하기 때문이다. */
function toAdminSource(src) {
  return setBuildKind(src, 'admin');
}

function downloadText(text, filename, mime) {
  const b = new Blob([text], { type: (mime || 'text/plain') + ';charset=utf-8' });
  const u = URL.createObjectURL(b);
  const a = document.createElement('a');
  a.href = u; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 4000);
}

/* ── 보안 규칙 만들기 (정식 1.0 규칙 · church/logo 포함) ────────── */
function buildRulesText(cfg) {
  const d = cfg.domain, em = r => "'" + r + '@' + d + "'";
  /* 부서 담당자 계정 — 설정에 적힌 이름을 그대로 규칙에 넣는다 */
  const deptEmails = Object.keys((cfg.deptAccounts) ||
      { child:1, teen:1, youth:1 }).map(k => em(k)).join(', ');
  return [
    "rules_version = '2';",
    '',
    'service cloud.firestore {',
    '  match /databases/{database}/documents {',
    '',
    '    /* ── 누가 누구인지 — 로그인한 이메일로 가린다 ───────── */',
    '    function email() {',
    "      return request.auth != null ? request.auth.token.email : '';",
    '    }',
    '    function isSignedIn() { return request.auth != null; }',
    '',
    '    /* 임원 이상 = 임원·안내실·전도인 (출석을 체크할 수 있는 등급)',
    '',
    '       ★ 구역·부서 담당자 계정도 여기 든다 (1.06)',
    '         11@ 12@ … 처럼 ★숫자로 된 계정★ 은 구역 담당자,',
    '         아래 적힌 이름은 부서 담당자다.',
    '         구역이 늘어도 규칙을 고칠 필요가 없다 — 숫자면 통과한다. */',
    '    function isLeader() {',
    '      return isSignedIn() && (',
    '        email() in [',
    '          ' + em('leader') + ',',
    '          ' + em('staff') + ',',
    '          ' + em('master'),
    '        ]',
    "        || email().matches('^[0-9]{1,3}@" + d.replace(/\./g, '[.]') + "$')",
    '        || email() in [' + deptEmails + ']',
    '      );',
    '    }',
    '',
    '    /* 안내실·전도인 = 교회 사무를 맡은 두 등급 */',
    '    function isStaff() {',
    '      return isSignedIn() && email() in [',
    '        ' + em('staff') + ',',
    '        ' + em('master'),
    '      ];',
    '    }',
    '',
    '    /* 안내실 = 명단·사진·설정을 고치는 등급 */',
    '    function isOffice() {',
    '      return isSignedIn() && email() == ' + em('staff') + ';',
    '    }',
    '',
    '    /* 전도인 = 출석과 심방을 맡은 등급 */',
    '    function isMaster() {',
    '      return isSignedIn() && email() == ' + em('master') + ';',
    '    }',
    '',
    '    /* ── 명단 ───────────────────────────────────────────',
    '       등급별로 문서가 따로 있다. 감출 항목은 애초에 그 문서에',
    '       담지 않으므로, 개발자도구로 뜯어도 나오지 않는다.       */',
    '    /* 설정은 안내실이 고친다. 전도인도 [심방 메모] 켜고 끄기를 여기에',
    '       담으므로 쓰기를 두 등급에 함께 연다. */',
    '    match /church/config   { allow read: if isSignedIn(); allow write: if isStaff(); }',
    '    match /church/m_member { allow read: if isSignedIn(); allow write: if isOffice(); }',
    '    match /church/m_leader { allow read: if isLeader();   allow write: if isOffice(); }',
    '    match /church/m_admin  { allow read: if isStaff();    allow write: if isOffice(); }',
    '    /* 온전한 명단 — 전도인이 보고, 안내실도 백업·표시설정 때 읽는다 */',
    '    match /church/m_master { allow read: if isStaff();    allow write: if isOffice(); }',
    '',
    '    /* ★ 교회 로고 — config 밖으로 뺐다.',
    '       config 는 접속마다 반드시 읽는 문서라 그 안에 98KB 를 두면',
    '       성도 300명 기준 월 2GB 가 그냥 나간다.',
    '       이 줄이 없으면 성도 화면에 기본 교회 아이콘이 나온다. */',
    '    match /church/logo     { allow read: if isSignedIn(); allow write: if isOffice(); }',
    '',
    '    /* 위에 이름이 적히지 않은 나머지 church 문서는 안내실·전도인만.',
    '       ★ Firestore 는 겹치는 규칙 중 하나라도 허용하면 허용하므로,',
    '         위의 개별 규칙이 이 줄에 막히지 않는다. */',
    '    match /church/{doc}    { allow read: if isStaff();    allow write: if isOffice(); }',
    '',
    '    /* ── 사진 ───────────────────────────────────────────── */',
    '    match /photos/{id}  { allow read: if isSignedIn(); allow write: if isOffice(); }',
    '    match /thumbs/{id}  { allow read: if isSignedIn(); allow write: if isOffice(); }',
    '',
    '    /* ── 심방 메모 ───────────────────────────────────────',
    '       심방은 전도인 전용이다. 성도·임원·안내실은 요청 자체가',
    '       거부된다. 화면에서 가리는 것이 아니다.               */',
    '    match /visits/{id} { allow read, write: if isMaster(); }',
    '',
    '    /* ── 출석 ────────────────────────────────────────────',
    '       읽기는 임원 이상. 쓰기는 두 가지로 나눈다.',
    '       · groups → 전도인만 (명단 구성)',
    '       · events → 전도인과 안내실 (모임 개설은 안내실 몫)',
    '       · 그 밖 → 임원 이상',
    '       ★ 두 줄로 나누어 쓰면 안 된다. 겹치는 규칙 중 하나라도',
    '         허용하면 허용되므로, 한 줄에 조건으로 갈라 적어야 막힌다. */',
    '    match /attend/{id} {',
    '      allow read:  if isLeader();',
    '      allow write: if isMaster()',
    "                   || (isOffice() && id == 'events')",
    "                   || (isLeader() && id != 'groups' && id != 'events');",
    '    }',
    '',
    '    /* ── 연결 진단용 ─────────────────────────────────────── */',
    '    match /_diagnostic/{id} { allow read, write: if isStaff(); }',
    '  }',
    '}'
  ].join('\n');
}

async function downloadExcelTemplate(cfg) {
  await loadXlsxLib();
  const wb = XLSX.utils.book_new();
  const fix = ws => {
    Object.keys(ws).forEach(a => {
      if (a[0] === '!') return;
      const c = ws[a];
      if (c && typeof c.v === 'string') { c.t = 's'; delete c.z; }
    });
    return ws;
  };

  /* ── 성도명단 : 제목 줄만 (예시 줄 없음) ── */
  const ws = fix(XLSX.utils.aoa_to_sheet([SHEET_COLS]));
  ws['!cols'] = SHEET_COLS.map(c =>
    ({ wch: /주소/.test(c) ? 34 : /직분$/.test(c) ? 18 : /대표와의관계/.test(c) ? 14
           : /동명이인구분/.test(c) ? 13 : /휴대폰|집전화/.test(c) ? 15 : /구역|성별/.test(c) ? 7 : 12 }));
  ws['!freeze'] = { xSplit:0, ySplit:1 };
  XLSX.utils.book_append_sheet(wb, ws, '성도명단');

  /* ── 작성예시 ── */
  const wsE = fix(XLSX.utils.aoa_to_sheet(EX_HELP));
  wsE['!cols'] = [{wch:12},{wch:13},{wch:8},{wch:11},{wch:7},{wch:16},{wch:36},{wch:12},{wch:14}];
  XLSX.utils.book_append_sheet(wb, wsE, '작성예시');

  /* ── 작성안내 ── */

  wsH['!cols'] = [{wch:16},{wch:16},{wch:92}];
  XLSX.utils.book_append_sheet(wb, wsH, '작성안내');

  /* ── 가족관계 ── */
  const wsR = fix(XLSX.utils.aoa_to_sheet(REL_HELP));
  wsR['!cols'] = [{wch:28},{wch:12},{wch:70}];
  XLSX.utils.book_append_sheet(wb, wsR, '가족관계');

  /* ── 부서 ── */
  const depts = [['부서','소속 칸에 이렇게 적으세요','구역 통계에 넣나']];

    (d.so || []).forEach(s => depts.push([d.name, s, d.inGu ? '넣음' : '넣지 않음']));
  });
  const wsD = fix(XLSX.utils.aoa_to_sheet(depts));
  wsD['!cols'] = [{wch:16},{wch:26},{wch:18}];
  XLSX.utils.book_append_sheet(wb, wsD, '부서');

/* ── 파이어베이스 설정 붙여넣기 읽어내기 ────────────────────────── */
const FB_KEYS = ['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId'];

function parseFbPaste(text) {
  const out = {};
  FB_KEYS.forEach(k => {
    const m = String(text || '').match(new RegExp('["\']?' + k + '["\']?\\s*:\\s*["\']([^"\']*)["\']'));
    if (m) out[k] = m[1].trim();
  });
  if (out.projectId) {
    if (!out.authDomain)    out.authDomain    = out.projectId + '.firebaseapp.com';
    if (!out.storageBucket) out.storageBucket = out.projectId + '.firebasestorage.app';
  }
  return { cfg: out, missing: ['apiKey','projectId','appId'].filter(k => !out[k]) };
}

/* ── 연결 시험 ──────────────────────────────────────────────────
   틀린 비밀번호로 일부러 로그인을 시도한다.
   돌아오는 오류 코드가 설정이 맞는지, 로그인 기능을 켰는지,
   저장소를 만들었는지까지 알려 준다. */
async function probeFirebase(fb, domain) {
  const notes = [];
  let app = null;
  try { app = firebase.app('setupProbe'); } catch(e) {}
  if (app) { try { await app.delete(); } catch(e) {} }
  app = firebase.initializeApp(fb, 'setupProbe');

  let authOk = false;
  try {
    await withTimeout(app.auth().signInWithEmailAndPassword('master@' + domain, 'x'.repeat(24) + '_probe'),
                      12000, '로그인 시험');
    authOk = true;
    notes.push(['warn', '어쩌다 비밀번호가 맞았습니다. 전도인 비밀번호를 바꿔 주세요.']);
    try { await app.auth().signOut(); } catch(e) {}
  } catch(e) {
    const c = (e && e.code) || '', msg = String((e && e.message) || '');
    if (c === 'auth/invalid-api-key' || c === 'auth/api-key-not-valid' || msg.indexOf('api-key-not-valid') >= 0)
      notes.push(['bad', 'apiKey 가 틀렸습니다. 콘솔에서 다시 복사해 주세요.']);
    else if (c === 'auth/configuration-not-found')
      notes.push(['bad', 'Authentication 을 아직 시작하지 않았습니다. 1단계를 다시 보세요.']);
    else if (c === 'auth/operation-not-allowed')
      notes.push(['bad', '「이메일/비밀번호」 로그인이 꺼져 있습니다. 1단계를 다시 보세요.']);
    else if (c === 'auth/network-request-failed')
      notes.push(['bad', '인터넷 연결을 확인해 주세요.']);
    else if (c === 'auth/invalid-credential' || c === 'auth/wrong-password' ||
             c === 'auth/user-not-found'     || c === 'auth/invalid-login-credentials') {
      authOk = true; notes.push(['ok', '파이어베이스 설정이 정상입니다.']);
    } else if (c === 'auth/too-many-requests') {
      authOk = true; notes.push(['warn', '시험을 너무 자주 했습니다. 설정 자체는 정상으로 보입니다.']);
    } else notes.push(['bad', '알 수 없는 오류: ' + (c || msg)]);
  }

  try {
    await withTimeout(app.firestore().collection('church').doc('config').get(), 12000, '저장소 시험');
    notes.push(['ok', '저장소(Firestore)가 열려 있습니다.']);
  } catch(e) {
    const c = (e && e.code) || '', msg = String((e && e.message) || '');
    if (c === 'permission-denied')
      notes.push(['ok', '저장소가 있습니다. (보안 규칙이 작동 중 — 정상입니다)']);
    else if (c === 'not-found' || c === 'failed-precondition' || msg.indexOf('does not exist') >= 0)
      notes.push(['bad', '저장소(Firestore)를 아직 만들지 않았습니다. 1단계를 다시 보세요.']);
    else if (c === 'unavailable' || c === 'deadline-exceeded')
      notes.push(['warn', '저장소 응답이 없습니다. 인터넷을 확인하고 다시 해 보세요.']);
    else notes.push(['warn', '저장소 확인 중 오류: ' + (c || msg)]);
  }

  try { await app.delete(); } catch(e) {}
  return { ok: authOk && !notes.some(n => n[0] === 'bad'), notes };
}

/* ── 아이콘 만들기 ─────────────────────────────────────────────
   ★ 로고를 넣지 않으셔도 아이콘은 반드시 새로 만든다.
     그러지 않으면 설치판에 들어 있는 기본 아이콘이 그대로 남아
     다른 교회 홈 화면에 남의 교회 그림이 뜬다. */
function makeAppIcon(img, bg) {
  const S = 180, PAD = 20;
  const cv = document.createElement('canvas');
  cv.width = S; cv.height = S;
  const cx = cv.getContext('2d');
  cx.fillStyle = bg || '#FFFFFF';
  cx.fillRect(0, 0, S, S);
  const box = S - PAD * 2;
  const r = Math.min(box / img.width, box / img.height);
  const w = img.width * r, hh = img.height * r;
  cx.drawImage(img, (S - w) / 2, (S - hh) / 2, w, hh);
  return cv.toDataURL('image/png');
}

/* 로고가 없을 때 — 상징색 바탕에 교회 그림을 직접 그린다 */
function drawDefaultIcon(brand) {
  const S = 180;
  const cv = document.createElement('canvas');
  cv.width = S; cv.height = S;
  const c = cv.getContext('2d');
  const base = String(brand || DEFAULT_BRAND).trim();
  const hs = hexToHsl(base);
  const bg = base.toUpperCase() === DEFAULT_BRAND ? DEFAULT_BRAND : hsl(hs, 30, hs.s);
  c.fillStyle = bg; c.fillRect(0, 0, S, S);
  c.fillStyle = '#FFFFFF';
  c.fillRect(84, 24, 12, 38);                       /* 십자가 세로 */
  c.fillRect(72, 34, 36, 12);                       /* 십자가 가로 */
  c.beginPath();                                    /* 지붕 */
  c.moveTo(90, 60); c.lineTo(146, 104); c.lineTo(34, 104); c.closePath(); c.fill();
  c.fillRect(42, 104, 96, 48);                      /* 몸체 */
  c.fillStyle = bg;                                 /* 문·창을 파낸다 */
  c.beginPath();
  c.moveTo(78, 152); c.lineTo(78, 132);
  c.arc(90, 132, 12, Math.PI, 0); c.lineTo(102, 152); c.closePath(); c.fill();
  c.fillRect(54, 118, 14, 16);
  c.fillRect(112, 118, 14, 16);
  return cv.toDataURL('image/png');
}

     「닫으면 처음부터 다시」는 그 자체로 시작 전에 부담을 준다.
     엑셀 작성은 며칠 걸리므로 반드시 이어서 할 수 있어야 한다. */
const WIZ_KEY = 'gsc_setup_progress';

/* ★ 저장이 실제로 되는지 먼저 확인한다.
   시크릿 창이나 「모든 쿠키 차단」 설정에서는 저장이 막힌다.
   그런 기기에서 "닫으셔도 됩니다"라고 안내해 두면
   창을 닫으신 뒤 처음부터 다시 하시게 된다. 약속을 하지 말아야 한다. */
const WIZ_CAN_SAVE = (function() {
  try {
    localStorage.setItem('__wz_test', '1');
    const ok = localStorage.getItem('__wz_test') === '1';
    localStorage.removeItem('__wz_test');
    return ok;
  } catch(e) { return false; }
})();
function loadWizProgress() {
  try { return JSON.parse(localStorage.getItem(WIZ_KEY) || 'null'); } catch(e) { return null; }
}
function saveWizProgress(o) {
  if (!WIZ_CAN_SAVE) return;
  try { localStorage.setItem(WIZ_KEY, JSON.stringify(o)); } catch(e) {}
}
function clearWizProgress() {
  try { localStorage.removeItem(WIZ_KEY); } catch(e) {}
}

  }, h('i', { className:'ti ti-external-link' }), children);
}

/* 복사 단추 (글자가 보이는 큰 것) */
function CopyLine({ text, label }) {
  const [ok, setOk] = useState(false);
  return h('div', {
    style:{ display:'flex', alignItems:'center', gap:'10px', padding:'11px 12px',
            background:'var(--surface-2)', border:'1px solid var(--border)', borderRadius:'10px' }
  },
    h('code', { style:{ flex:1, minWidth:0, fontSize:'14px', wordBreak:'break-all',
                        fontFamily:'ui-monospace,Menlo,monospace' } }, text),
    h('button', {
      type:'button',
      onClick: async () => { setOk(await copyText(text)); setTimeout(() => setOk(false), 1600); },
      style:{ flexShrink:0, padding:'7px 12px', borderRadius:'9px', cursor:'pointer',
              border:'1px solid var(--border-2)', background:'var(--surface)',
              color: ok ? 'var(--ok)' : 'var(--navy)', fontSize:'13.5px', fontWeight:700 }
    }, ok ? '복사됨' : (label || '복사'))
  );
}

/* ── 단계 정의 ──────────────────────────────────────────────────
   네 마당(stage)으로 나눈다. 위쪽 띠에 네 개만 보이므로
   「지금 어디쯤인지」가 늘 한눈에 들어온다. */
const STAGES = [
  { key:'prep',  name:'준비',  icon:'cloud-plus',      time:'20분' },
  { key:'excel', name:'명단',  icon:'table',           time:'반나절' },
  { key:'setup', name:'설정',  icon:'settings',        time:'15분' },
  { key:'go',    name:'완성',  icon:'rocket',          time:'10분' }
];

/* 화면 목록 — [마당, 제목] */
const SCREENS = [
  ['start', '시작'],
  ['prep',  '파이어베이스 만들기'],
  ['prep',  '넷리파이 가입'],
  ['excel', '성도 명단'],
  ['setup', '교회 이름'],
  ['setup', '파이어베이스 연결'],
  ['setup', '로그인 계정'],
  ['setup', '로고와 색'],
  ['setup', '직분과 부서'],
  ['go',    '완성 파일'],
  ['go',    '인터넷에 올리기'],
  ['go',    '명단 올리고 규칙 게시'],
  ['go',    '점검'],
  ['go',    '끝']
];

function StageBar({ at }) {
  const cur = SCREENS[at][0];
  const curIdx = cur === 'start' ? -1 : STAGES.findIndex(s => s.key === cur);
  return h('div', {
    style:{ display:'flex', gap:'6px', padding:'12px 14px 14px',
            background:'var(--surface)', borderBottom:'1px solid var(--border)',
            position:'sticky', top:'calc(var(--bar-h) + env(safe-area-inset-top))', zIndex:20 }
  },
    STAGES.map((s, i) => {
      const state = i < curIdx ? 'done' : i === curIdx ? 'now' : 'todo';
      return h('div', {
        key:s.key,
        style:{ flex:1, minWidth:0, textAlign:'center', padding:'8px 4px', borderRadius:'11px',
                background: state === 'now' ? 'var(--soft)' : 'transparent',
                border:'1px solid ' + (state === 'now' ? 'var(--soft-bd)' : 'transparent'),
                opacity: state === 'todo' ? .45 : 1 }
      },
        h('i', { className:'ti ti-' + (state === 'done' ? 'circle-check-filled' : s.icon),
                 style:{ fontSize:'19px', color: state === 'todo' ? 'var(--text-3)' : 'var(--navy)' } }),
        h('div', { style:{ fontSize:'12.5px', fontWeight: state === 'now' ? 800 : 600,
                           color: state === 'now' ? 'var(--navy)' : 'var(--text-2)', marginTop:'2px' } }, s.name),
        h('div', { style:{ fontSize:'11px', color:'var(--text-3)' } }, s.time)
      );
    })
  );
}

/* 화면 제목 */
function Head({ t, s }) {
  return h('div', { style:{ marginBottom:'18px' } },
    h('h2', { style:{ fontSize:'25px', fontWeight:800, letterSpacing:'-.03em',
                      lineHeight:1.32, marginBottom: s ? '7px' : 0 } }, t),
    s ? h('p', { style:{ fontSize:'16px', lineHeight:1.65, color:'var(--text-2)' } }, s) : null
  );
}

const stack = (gap, ...kids) => h('div', {
  style:{ display:'flex', flexDirection:'column', gap:gap + 'px' } }, kids);

/* ═══════════════════════════════════════════════════════════════════
   마법사 본체
═══════════════════════════════════════════════════════════════════ */
function SetupWizard({ initial, onClose, startAt }) {
  const [theme, toggle] = useTheme();
  const saved = initial ? null : loadWizProgress();

  const [at,   setAt]   = useState(() => startAt !== undefined ? startAt : (saved ? (saved.at || 0) : 0));
  const [cfg,  setCfg]  = useState(() =>
    JSON.parse(JSON.stringify(initial || (saved && saved.cfg) || CHURCH_CFG)));
  const [done, setDone] = useState(() => (saved && saved.done) || {});

  const [fbPaste,  setFbPaste]  = useState(() => (saved && saved.fbPaste) || '');
  const [fbMsg,    setFbMsg]    = useState('');
  const [probing,  setProbing]  = useState(false);
  const [probeRes, setProbeRes] = useState(null);
  const [logoMsg,  setLogoMsg]  = useState('');
  const [genMsg,   setGenMsg]   = useState('');
  const [needPick, setNeedPick] = useState(false);
  const [pickKind, setPickKind] = useState('admin');   /* 직접 고른 파일로 무엇을 만들 차례인가 */

  const LAST = SCREENS.length - 1;
  const set  = (k, v) => setCfg(p => ({ ...p, [k]: v }));
  const tick = k => setDone(p => ({ ...p, [k]: !p[k] }));

  useEffect(() => { applyBrandColor(cfg.brand || DEFAULT_BRAND); }, [cfg.brand]);

  /* 진행 상태를 계속 저장한다 — 창을 닫아도 이어서 할 수 있게 */
  useEffect(() => {
    if (initial) return;                      /* 재설정으로 연 경우는 저장하지 않는다 */
    saveWizProgress({ at, cfg, done, fbPaste });
  }, [at, cfg, done, fbPaste, initial]);

  useEffect(() => {
    if (cfg.fb && cfg.fb.projectId && !fbPaste) setFbPaste(JSON.stringify(cfg.fb, null, 2));
  }, []);

  const d = (cfg.domain || '').trim().toLowerCase().replace(/^@/, '');
  const ROLES4 = [
    ['member', '성도용',              'users'],
    ['leader', '임원용 (구역장·부장)', 'clipboard-check'],
    ['staff',  '안내실용',            'user-shield'],
    ['master', '전도인용',            'notes']
  ];
  const emails = ROLES4.map(r => r[0] + '@' + d);

  function applyPaste(txt) {
    setFbPaste(txt);
    if (!txt.trim()) { setFbMsg(''); return; }
    const r = parseFbPaste(txt);
    if (r.missing.length) setFbMsg('err:' + r.missing.join(', ') + ' 을(를) 못 찾았습니다. 콘솔의 글 전체를 다시 복사해 주세요.');
    else { setCfg(p => ({ ...p, fb:{ ...p.fb, ...r.cfg } })); setFbMsg('ok:' + r.cfg.projectId + ' — 여섯 칸 모두 찾았습니다.'); setProbeRes(null); }
  }

  async function runProbe() {
    setProbing(true); setProbeRes(null);
    try {
      if (!d) setProbeRes({ ok:false, notes:[['bad','먼저 다음 화면에서 계정 뒷부분을 정해 주세요.']] });
      else setProbeRes(await probeFirebase(cfg.fb, d));
    } catch(e) { setProbeRes({ ok:false, notes:[['bad', (e && e.message) || '시험 실패']] }); }
    setProbing(false);
  }

  async function onLogoPick(e) {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    setLogoMsg('');
    try {
      const img = await loadImageFromFile(f);
      setCfg(p => ({ ...p, logo: toDataUrlCapped(img, 240, 0.85, 100000), icon: makeAppIcon(img, '#FFFFFF') }));
      setLogoMsg('ok:로고와 아이콘을 만들었습니다.');
    } catch(err) { setLogoMsg('err:그림을 읽지 못했습니다.'); }
    e.target.value = '';
  }

  function finalCfg() {
    return {
      ...cfg,
      configured: true,
      churchName: (cfg.churchName || '').trim(),
      appTitle:   (cfg.appTitle || '').trim(),
      appTitleAdmin: (cfg.appTitleAdmin || '').trim(),
      shortName:  (cfg.shortName || '성도주소록').trim(),
      domain: d,
      icon: cfg.icon || drawDefaultIcon(cfg.brand),   /* ★ 비우면 남의 교회 그림이 남는다 */
      catOrder: (cfg.catOrder || []).map(s => String(s).trim()).filter(Boolean),
      deptDefs: (cfg.deptDefs || []).filter(x => x && x.name && (x.so || []).length)
    };
  }

  /* ★ 완성 파일을 ★두 개★ 만든다 (설치판 이원화)
       성도용         — 관리 구역을 들어낸 파일. 성도들께 알리는 주소에 올린다.
       안내실·전도인용 — 통째로. 담당자 · 안내실 · 전도인만 아는 주소에 올린다.
     둘 다 파일 이름이 index.html 이라 한꺼번에 내려받으면 헷갈린다.
     그래서 단추를 둘로 두고, 하나 받아 폴더에 넣으신 뒤 다음을 받으시게 한다. */
  function generate(kind, srcText) {
    const c  = finalCfg();
    const nm = (kind === 'member') ? '성도용' : '안내실·전도인용';
    try {
      const raw  = srcText || serializeSelf(c);
      const body = (kind === 'member') ? toMemberSource(raw) : toAdminSource(raw);
      const out  = injectCfg(body, c);
      if (out.indexOf('"configured": true') < 0) throw new Error('설정을 넣지 못했습니다');
      downloadText(out, 'index.html', 'text/html');
      setGenMsg('ok:' + nm + ' index.html 을 내려받았습니다. 이름을 바꾸지 마시고 폴더에 넣어 두세요.');
      setNeedPick(false);
    } catch(e) {
      setGenMsg('err:' + nm + ' — ' + ((e && e.message) || '만들지 못했습니다')
                + ' · 아래 「파일 직접 고르기」로 해 보세요.');
      setPickKind(kind);
      setNeedPick(true);
    }
  }

  async function generateFromPick(e) {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    try {
      const txt = await f.text();
      if (txt.indexOf(CFG_MARK_A) < 0) setGenMsg('err:설정 블록이 없는 파일입니다. 설치판 HTML 을 골라 주세요.');
      else generate(pickKind, txt);
    } catch(err) { setGenMsg('err:파일을 읽지 못했습니다.'); }
    e.target.value = '';
  }

  const msg = s => s ? h('p', {
    className:'note ' + (s.startsWith('ok:') ? 'note-ok' : 'note-bad'),
    style:{ marginTop:'10px', fontSize:'14.5px', lineHeight:1.65 }
  }, s.slice(s.indexOf(':') + 1)) : null;

  /* 다음으로 갈 수 있나 */
  function blocked() {
    if (at === 4 && !(cfg.churchName || '').trim()) return '교회 이름을 적어 주세요.';
    if (at === 5 && parseFbPaste(fbPaste).missing.length) return '파이어베이스 설정을 붙여넣어 주세요.';
    if (at === 6) {
      if (!d) return '계정 뒷부분을 적어 주세요.';
      if (!/^[a-z0-9][a-z0-9.\-]*\.[a-z]{2,}$/.test(d)) return '예: ourchurch.org 형태로 적어 주세요.';
    }
    return '';
  }
  const stop = blocked();

  /* ─────────────────────────────────────────────────────────────
     화면들
  ───────────────────────────────────────────────────────────── */
  const S = [];

  /* 0 · 시작 */
  S.push(stack(16,
    h('div', { key:'i', style:{ textAlign:'center', padding:'8px 0 4px' } },
      h('img', { src: cfg.icon || drawDefaultIcon(cfg.brand),
        style:{ width:'86px', height:'86px', borderRadius:'22px' } })),
    h(Head, { key:'h', t:'성도주소록을 만듭니다', s:'네 마당으로 나눠 하나씩 짚어 드립니다. 전부 무료이고, 컴퓨터를 잘 다루지 못하셔도 됩니다.' }),
    h('div', { key:'g', style:{ display:'flex', flexDirection:'column', gap:'9px' } },
      STAGES.map((s, i) => h('div', {
        key:s.key,
        style:{ display:'flex', alignItems:'center', gap:'14px', padding:'15px 16px',
                background:'var(--surface)', border:'1px solid var(--border)', borderRadius:'13px' }
      },
        h('i', { className:'ti ti-' + s.icon, style:{ fontSize:'26px', color:'var(--navy)', flexShrink:0 } }),
        h('div', { style:{ flex:1 } },
          h('div', { style:{ fontSize:'17px', fontWeight:700 } }, (i+1) + '. ' + s.name),
          h('div', { style:{ fontSize:'14.5px', color:'var(--text-2)' } },
            ['구글·넷리파이에 무료 가입', '엑셀에 성도를 적기', '교회 이름·계정·색 정하기', '올리고 확인하기'][i])),
        h('span', { style:{ fontSize:'13px', color:'var(--text-3)', fontWeight:700, flexShrink:0 } }, s.time)
      ))),
    saved && saved.at > 0
      ? h('div', { key:'r', className:'note note-info', style:{ fontSize:'15px' } },
          '지난번 ', h('b', null, SCREENS[saved.at][1]), ' 까지 하셨습니다. 이어서 하시면 됩니다.')
      : WIZ_CAN_SAVE
        ? h('div', { key:'r2', className:'note note-info', style:{ fontSize:'15px', lineHeight:1.7 } },
            h('b', null, '중간에 창을 닫으셔도 됩니다.'), ' 하신 데까지 저장해 두었다가 다음에 이어서 합니다.')
        : h('div', { key:'r3', className:'note note-warn', style:{ fontSize:'15px', lineHeight:1.7 } },
            h('b', null, '이 브라우저는 진행 상태를 저장하지 못합니다.'), h('br'),
            '시크릿 창이거나 쿠키가 막혀 있습니다. ',
            h('b', null, '일반 창에서 여시면'), ' 창을 닫아도 이어서 하실 수 있습니다.')
  ));

  /* 1 · 파이어베이스 */
  S.push(stack(14,
    h(Head, { key:'h', t:'① 파이어베이스 만들기', s:'성도 자료를 보관하는 곳입니다. 구글이 운영하고 무료입니다.' }),
    h(OpenBtn, { key:'o', href:'https://console.firebase.google.com' }, '파이어베이스 콘솔 열기'),
    h('p', { key:'l', style:{ fontSize:'14.5px', color:'var(--text-3)', textAlign:'center', marginTop:'-2px' } },
      '새 창에서 아래 다섯 가지를 하시고, 하나씩 눌러 지워 나가세요'),
    stack(9,
      h(Task, { key:'t1', done:done.fb1, onToggle:() => tick('fb1') },
        h('b', null, '프로젝트 만들기'), ' — 이름은 영문 소문자로. 애널리틱스는 ', h('b', null, '사용 안 함')),
      h(Task, { key:'t2', done:done.fb2, onToggle:() => tick('fb2') },
        h('b', null, 'Authentication → 시작하기'), ' → ', h('b', null, '이메일/비밀번호'), ' 켜기'),
      h(Task, { key:'t3', done:done.fb3, onToggle:() => tick('fb3') },
        h('b', null, 'Firestore Database → 데이터베이스 만들기'), h('br'),
        h('span', { style:{ color:'var(--bad)', fontWeight:700 } }, '위치는 asia-northeast3 (서울)'),
        h('span', { style:{ fontSize:'14px', color:'var(--text-3)' } }, ' — 나중에 못 바꿉니다')),
      h(Task, { key:'t4', done:done.fb4, onToggle:() => tick('fb4') },
        h('b', null, '⚙ 프로젝트 설정 → 내 앱 → 웹 '), h('code', null, '</>'), ' 등록'),
      h(Task, { key:'t5', done:done.fb5, onToggle:() => tick('fb5') },
        h('b', null, 'firebaseConfig 글 복사해 두기'), ' — 6번째 화면에서 씁니다')
    ),
    h(More, { key:'m', title:'막히면 여기를 보세요' },
      h('p', { style:{ marginBottom:'8px' } }, h('b', null, '화면이 영어로 나와요'), h('br'),
        '오른쪽 위 사람 아이콘 → 언어에서 한국어를 고르시면 됩니다.'),
      h('p', { style:{ marginBottom:'8px' } }, h('b', null, '「이메일 링크」도 켜야 하나요'), h('br'),
        '아니요. 위쪽 「이메일/비밀번호」 스위치 하나만 켜면 됩니다.'),
      h('p', { style:{ marginBottom:'8px' } }, h('b', null, '「Firebase 호스팅도 설정」이 나와요'), h('br'),
        '체크하지 마세요. 넷리파이를 쓸 것입니다.'),
      h('p', null, h('b', null, 'firebaseConfig 화면을 닫아 버렸어요'), h('br'),
        '⚙ 프로젝트 설정 → 내 앱 → SDK 설정 및 구성에서 「구성」을 고르면 다시 나옵니다.'))
  ));

  /* 2 · 넷리파이 */
  S.push(stack(14,
    h(Head, { key:'h', t:'① 넷리파이 가입', s:'주소록 화면을 인터넷에 올리는 곳입니다. 이것도 무료입니다.' }),
    h(OpenBtn, { key:'o', href:'https://app.netlify.com/signup' }, '넷리파이 가입 열기'),
    stack(9,
      h(Task, { key:'n1', done:done.nl1, onToggle:() => tick('nl1') },
        h('b', null, '구글 계정으로 가입'), ' — 가장 빠릅니다'),
      h(Task, { key:'n2', done:done.nl2, onToggle:() => tick('nl2') },
        h('b', null, 'Sites 화면까지 들어가 보기'), ' — 아직 비어 있으면 정상입니다')
    ),
    h('div', { key:'i', className:'note note-info', style:{ fontSize:'15px', lineHeight:1.7 } },
      '결제 정보를 묻지 않습니다. 이 규모는 무료 범위 안입니다.')
  ));

  /* 3 · 엑셀 */
  S.push(stack(14,
    h(Head, { key:'h', t:'② 성도 명단 적기', s:'가장 오래 걸리는 일입니다. 지금 시작해 두고 나머지를 이어서 하셔도 됩니다.' }),
    h('button', { key:'b', type:'button', className:'btn btn-primary',
      style:{ width:'100%' },
      onClick: () => downloadExcelTemplate(finalCfg()).catch(e => alert('실패: ' + e.message)) },
      h('i', { className:'ti ti-file-spreadsheet' }), '엑셀 서식 내려받기'),
    stack(9,
      h(Task, { key:'e1', done:done.ex1, onToggle:() => tick('ex1') },
        h('b', null, '「성도명단」 시트'), '에 성도를 적습니다 — 예시 세 줄은 지우세요'),
      h(Task, { key:'e2', done:done.ex2, onToggle:() => tick('ex2') },
        h('b', null, '「고유ID」 칸은 비워 두세요'), ' — 프로그램이 만듭니다'),
      h(Task, { key:'e3', done:done.ex3, onToggle:() => tick('ex3') },
        h('b', null, '첫 줄 칸 이름은 그대로'), ' — 프로그램이 이 이름으로 칸을 찾습니다')
    ),
    h('div', { key:'w', className:'note note-bad', style:{ fontSize:'15px', lineHeight:1.7 } },
      h('b', null, '구역 이름 표기를 통일하세요.'), ' ',
      h('code', null, '11구역'), ' 과 ', h('code', null, '11 구역'), ' 이 섞이면 출석 명단이 둘로 나옵니다.'),
    h(More, { key:'m', title:'꼭 채워야 하는 칸은?' },
      h('p', { style:{ marginBottom:'8px' } },
        h('b', null, '「이름」 하나뿐입니다.'), ' 나머지는 비워도 돌아갑니다.'),
      h('p', { style:{ marginBottom:'8px' } },
        '실제로 쓰시려면 ', h('b', null, '휴대폰 · 주소 · 구역 · 직분'), ' 네 가지를 채우시면 충분합니다.'),

    type:'button', title, 'aria-label':title, onClick,
    style:{ width:'36px', height:'36px', flexShrink:0, borderRadius:'9px', cursor:'pointer',

/* 설정이 아직 없을 때도 파일 이름을 만들 수 있게 */
function FILE_TAG_OF(cfg) {
  return String((cfg && cfg.churchName) || '우리교회').replace(/\s+/g, '_');
}

/*#ADMIN_ONLY_END*/
function App() {
  /* 설치 전이면 주소록 대신 마법사를 띄운다.
     파이어베이스에 붙지 않았으므로 아래 상태들은 만들지 않는다. */
  const [wizard, setWizard] = useState(false);
  if (!IS_CONFIGURED) return h(SetupWizard, { initial:null, onClose:null });
  if (FB_INIT_ERR) return h(FbErrorView, { msg:FB_INIT_ERR });

}

/* 파이어베이스 연결 자체가 실패했을 때 — 하얀 화면을 남기지 않는다 */
function FbErrorView({ msg }) {
  return h('div', { className:'screen', style:{ justifyContent:'center', padding:'28px 20px' } },
    h('div', { className:'wrap', style:{ textAlign:'center' } },
      h('i', { className:'ti ti-plug-connected-x', style:{ fontSize:'52px', color:'var(--bad)' } }),
      h('h2', { style:{ fontSize:'21px', fontWeight:800, margin:'14px 0 8px' } },
        '파이어베이스에 연결하지 못했습니다'),

    )
  );
}

/* 교회 설정(마법사)에서 왼쪽 위 [목록] 을 눌러 나왔나.
   마법사 분기는 상태를 만들기 전에 갈라지므로 setPhase 를 바로 부를 수 없다.
   그래서 표시만 남기고, 아래 useEffect 가 화면을 목록으로 옮긴다. */
let WIZ_TO_MAIN = false;

function AppReady({ wizard, setWizard }) {
  const [theme, toggle] = useTheme();

  /* 안내실이 [교회 설정] 탭에서 연 경우 —
     지금 설정을 채운 채로 마법사를 띄운다. 설정 마당(5번째 화면)부터 시작한다.
     ★ 나갈 때 원래 색을 다시 입힌다 (마법사에서 색을 만졌을 수 있다) */
  if (wizard) return h(SetupWizard, {
    initial: CHURCH_CFG, startAt: 4,
    onClose: () => {
      applyBrandColor(CHURCH_CFG.brand || DEFAULT_BRAND);
      WIZ_TO_MAIN = true;          /* 나가면 주소록 목록으로 */
      setWizard(false);
    }
  });

  const cachedRole = (() => {
    try { return localStorage.getItem('gsc_user_role') || 'member'; } catch(e) { return 'member'; }
  })();

  const cachedData = (() => {
    try {
      const docName = MEMBER_DOC[cachedRole] || 'm_member';
      const mStr = localStorage.getItem(`gsc_members_${docName}`);
      const vStr = localStorage.getItem('gsc_fieldVis');
      const cStr = localStorage.getItem('gsc_visitCfg');
      const lStr = localStorage.getItem('gsc_listCfg');
      const fStr = localStorage.getItem('gsc_family');
      if (mStr) {
        const parsed = JSON.parse(mStr);
        if (parsed && parsed.length) {
          return {
            members: parsed,
            fieldVis: vStr ? JSON.parse(vStr) : DEFAULT_VIS,
            visitCfg: normVisitCfg(cStr ? JSON.parse(cStr) : DEFAULT_VISIT_CFG),
            listCfg:  normListCfg(lStr ? JSON.parse(lStr) : DEFAULT_LIST_CFG),
            family:   normFamily(fStr ? JSON.parse(fStr) : DEFAULT_FAMILY)
          };
        }
      }
    } catch(e) {}
    return null;
  })();

  const cachedLogo = (() => {
    try { return localStorage.getItem('gsc_logoUrl') || ''; } catch(e) { return ''; }
  })();

  /* 로그인 화면의 담당 구역 목록.

     ★ 아직 로그인하지 않아 서버를 읽을 수 없다.
       그래서 ① 설정에 적어 둔 구역 목록과 ② 기기에 남아 있는 명단에서
       뽑은 구역을 합쳐 쓴다.
     ★ 둘 다 비는 경우(처음 켠 새 휴대폰, 쿠키가 막힌 기기)에는
       로그인 화면이 구역을 ★직접 적는 칸★ 으로 바뀐다.
       그러지 않으면 새 구역장이 아예 로그인할 수 없다. */
  const guCodes = useMemo(() => {
    const set = {};
    try {
      (GU_CODES_FIXED || []).forEach(g => { set[String(g).trim()] = 1; });
    } catch(e) {}
    try {
      Object.keys(localStorage).forEach(k => {
        if (k.indexOf('gsc_members_') !== 0) return;
        (JSON.parse(localStorage.getItem(k) || '[]') || []).forEach(m => {
          const g = String((m && m['구역']) || '').trim();
          if (g && /^[0-9]{1,3}$/.test(g)) set[g] = 1;
        });
      });
    } catch(e) {}
    return Object.keys(set).filter(g => /^[0-9]{1,3}$/.test(g))
                 .sort((a, b) => parseInt(a,10) - parseInt(b,10));
  /* ★ useMemo 로 감싼다. 이 계산은 기기에 저장된 명단 전체를 JSON 으로
     다시 읽으므로, 화면이 다시 그려질 때마다 하면 출석 체크처럼 자주
     누르는 곳에서 눈에 띄게 느려진다. 한 번만 하면 된다. */
  }, []);

  const [role,     setRole]     = useState(cachedRole);
  const [phase,    setPhase]    = useState(() => cachedData ? (cachedRole === 'master' ? 'admin' : 'main') : 'login');
  const [members,  setMembers]  = useState(() => cachedData ? cachedData.members : []);
  const [photos,   setPhotos]   = useState({});
  /* 저장소에 로고가 없으면 설치할 때 넣은 로고를 쓴다 */
  const [logoUrl,  setLogoUrl]  = useState(cachedLogo || CHURCH_CFG.logo || '');
  const [fieldVis, setFieldVis] = useState(() => cachedData ? cachedData.fieldVis : { ...DEFAULT_VIS });
  const [visitCfg, setVisitCfg] = useState(() => normVisitCfg(cachedData ? cachedData.visitCfg : DEFAULT_VISIT_CFG));
  /* 주소록 설정(공지 한 줄·목록에서 감출 분·출석상태 잠금) — church/config 안에 함께 온다 */
  const [listCfg,  setListCfg]  = useState(() => normListCfg(cachedData ? cachedData.listCfg : DEFAULT_LIST_CFG));
  /* 가족 연결 — church/config 안에 함께 오므로 추가 읽기가 없다 */
  const [family,   setFamily]   = useState(() => normFamily(cachedData ? cachedData.family : DEFAULT_FAMILY));
  const [selected, setSelected] = useState(null);
  const [loadErr,  setLoadErr]  = useState('');
  /* 예전 방식(config 안)에 로고가 남아 있나 — 안내실 화면에서 옮기라고 권한다 */
  const [hasLegacyLogo, setHasLegacyLogo] = useState(() => {
    try { return localStorage.getItem('gsc_legacyLogo') === '1'; } catch(e) { return false; }
  });
  /* 구역장이 손으로 고친 출석상태 (attend/status).
     성도 등급은 이 자료를 아예 읽지 않는다. */
  const [attStatus, setAttStatus] = useState(() => readAttCache());

  /* 출석상태 불러오기 — 임원 등급부터. 읽기 1회.
     로그인 경로가 둘이라 두 번 부를 수 있으므로 여기서도 한 번으로 묶는다. */
  const attInflight = useRef(null);
  const loadAtt = useCallback(async r => {
    if (ROLES[r || 'member'] < ROLES.leader) { setAttStatus({}); writeAttCache({}); return; }
    if (!attInflight.current) {
      attInflight.current = fbLoadAttStatus().finally(() => { attInflight.current = null; });
    }
    try { setAttStatus(await attInflight.current); } catch(e) { /* 캐시 값을 그대로 쓴다 */ }
  }, []);

  /* 출석상태 한 사람 바꾸기 — 저장이 끝난 뒤에 화면 값을 옮긴다 */
  const changeAtt = useCallback(async (id, v) => {
    await fbSetAttStatus(id, v);
    setAttStatus(p => {
      const n = { ...p, [id]: v };
      writeAttCache(n);
      return n;
    });
  }, []);

  /* 구역에서 올라온 「성도 등록 요청」 (정식 1.19)
     ★ 임원 등급(구역·부서 담당자·안내실·전도인)부터만 읽는다.
       성도 화면은 이 자료를 아예 부르지 않아 새 분이 비치지 않는다.
     ★ 주소록(members)과 섞지 않는다. 목록의 구역 칸에서 「미배정」 을
       고르셨을 때만 이분들을 대신 보여 드린다 — 인원수·출석표는 그대로다.
     ★ 관리 화면에 다녀오실 때마다 다시 받는다. 안내실이 주소록에 올린
       분이 목록에 그대로 남아 있으면 두 번 올리시기 때문이다. */
  const [reqs, setReqs] = useState([]);
  useEffect(() => {
    if (ROLES[role || 'member'] < ROLES.leader) { setReqs([]); return; }
    if (phase !== 'main' && phase !== 'admin') return;
    let live = true;
    fbLoadReqs().then(r => { if (live) setReqs(r || []); }).catch(e => {});
    return () => { live = false; };
  }, [role, phase]);

  /* 진행 상황 통로를 꽂아 둔다 (불러오기 화면이 무엇을 받는지 보여 준다) */
  const [step, setStep] = useState('auth');
  /* 방금 로그인한 등급 — [다시 받기] 가 비밀번호 없이 이어가는 데 쓴다 */
  const lastRole = useRef('');
  useEffect(() => { setLoadStep(setStep); return () => setLoadStep(null); }, []);
  /* 접속마다 config 를 읽을 때 새 주소록 설정을 곧바로 화면에 꽂는다 */
  useEffect(() => { setListCfgLive(setListCfg); return () => setListCfgLive(null); }, []);

  /* ★ 사진은 명단을 받은 뒤에 받는다 (정식 1.03)

     예전에는 앱이 뜨자마자 사진 목록(약 1.1MB)을 받기 시작했다.
     그래서 두 가지 문제가 있었다.
     ① 첫 로그인 때 명단(234KB)과 대역폭을 다투어 명단이 늦어졌다
     ② 그 읽기가 오프라인 캐시 준비보다 먼저 끝나 버려
        enablePersistence() 가 조용히 실패했다 (_fsReady 주석 참고)

     명단이 화면에 뜬 뒤에 받으면 둘 다 사라진다.
     사진은 없어도 이름으로 찾을 수 있으니 조금 늦게 와도 괜찮다. */
  const thumbsOnce = useRef(false);
  useEffect(() => {
    if (thumbsOnce.current) return;
    if (['main','admin','detail','attend'].indexOf(phase) < 0) return;
    thumbsOnce.current = true;
    fbLoadThumbs().then(t => setPhotos(t || {})).catch(()=>{});
  }, [phase]);

  useEffect(() => {
    const un = _auth.onAuthStateChanged(async u => {
      if (!u) {
        setPhase('login');
        setLoadErr('');
        return;
      }
      const r = roleFromEmail(u.email);
      if (!r) { await signOutAll(); setPhase('login'); return; }

      try {
        const d = await loadForRoleOnce(r);
        setMembers(d.members);
        setFieldVis(d.fieldVis);
        if (d.visitCfg) setVisitCfg(normVisitCfg(d.visitCfg));
        if (d.listCfg)  setListCfg(normListCfg(d.listCfg));
        if (d.family)   setFamily(normFamily(d.family));
        if (d.photos) setPhotos(d.photos);
        if (d.logoUrl !== undefined) setLogoUrl(d.logoUrl || CHURCH_CFG.logo || '');
        if (d.hasLegacyLogo !== undefined) setHasLegacyLogo(!!d.hasLegacyLogo);
        setRole(r);
        localStorage.setItem('gsc_user_role', r);
        /* 이 기기에서 처음 뜨는 것일 때만 「구역」 칸을 맞춘다 (1.18) —
           보시던 중에 로그인 확인이 다시 일어나도 필터가 되돌아가지 않게. */
        if (!viewInit.current) { viewInit.current = true; setView(homeView(u.email)); }
        loadAtt(r);
        setPhase(p => (p === 'login' || p === 'loading') ? (r === 'master' ? 'admin' : 'main') : p);
      } catch(e) {
        /* 기기에 저장해 둔 명단이 있으면 그것으로라도 화면을 띄운다.
           없으면 로그인 화면으로 돌리고 ★ 원인을 반드시 보여 준다 ★.
           (전에는 아무 안내 없이 로그인 화면으로만 돌아가 원인을 알 수 없었다) */
        if (cachedData) {
          setMembers(cachedData.members);
          setFieldVis(cachedData.fieldVis);
          setVisitCfg(normVisitCfg(cachedData.visitCfg));
          setListCfg(normListCfg(cachedData.listCfg));
          setFamily(normFamily(cachedData.family));
          setPhase('main');
        } else if (recoverFsOnce(e)) {
          /* SDK 가 깨진 경우 — 화면을 자동으로 다시 불러 되살린다 */
          setStep('recover');
        } else {
          /* 로그인은 되어 있으므로 로그아웃시키지 않는다 (위 handleLogin 주석 참고) */
          setLoadErr(fsErrMsg(e));
          setPhase('loadfail');
        }
      }
    });
    return () => un && un();
  }, []);

  /* 목록 화면의 검색·필터·스크롤 위치 */
  const [view, setView] = useState(homeView());
  const listScroll = useRef(0);
  /* 로그인 한 번에 딱 한 번만 「구역」 칸을 맞춘다 (정식 1.18).
     로그인 상태를 다시 확인할 때마다 맞추면, 보시던 필터가 갑자기 되돌아간다. */
  const viewInit = useRef(false);

  /* 상세·관리 화면으로 갈 때만 맨 위로. 목록 복귀는 MainView가 맡는다 */
  useEffect(() => {
    if (phase !== 'main') window.scrollTo(0, 0);
  }, [phase, selected]);

  /* ═══════════════════════════════════════════════════
     휴대폰 뒤로 가기 버튼 (정식 1.13)

     ★ 무엇이 불편했나
     성도 상세 화면을 보다가 휴대폰의 뒤로 가기를 누르면
     ★앱이 그대로 닫혔다★. 화면 왼쪽 위 [뒤로] 를 손으로 찾아
     눌러야만 목록으로 돌아올 수 있었다.

     ★ 어떻게 했나
     깊은 화면(성도 상세·출석표)으로 들어갈 때 브라우저 방문 기록을
     하나 쌓아 둔다. 뒤로 가기가 오면 그 기록이 하나 걷히면서
     우리 코드가 불려 오고, 그때 ★왼쪽 위 [뒤로] 와 똑같은 일★ 을 한다.

     목록(성도용)·관리 화면처럼 ★뿌리 화면★ 에서는 그대로 앱을 닫는다.
     안드로이드에서는 그것이 관례이고, 그때는 불편하다는 말씀도 없었다.

     ★ 기록 수를 세어 두는 이유
     출석표 → 성도 상세 처럼 두 단계 들어갔다가 [뒤로] 를 누르면
     화면은 목록으로 한 번에 돌아간다. 그때 쌓아 둔 기록 두 개를
     함께 걷지 않으면, 목록에서 뒤로 가기를 두 번 눌러야 앱이 닫힌다.
     ═══════════════════════════════════════════════════ */
  const histDepth = useRef(0);   /* 우리가 쌓아 둔 방문 기록 수 */
  const ignorePop = useRef(0);   /* 우리가 직접 부른 뒤로 가기는 무시한다 */

  const pushHist = useCallback(() => {
    try { history.pushState({ gsc: Date.now() }, ''); histDepth.current++; } catch(e) {}
  }, []);

  /* 쌓아 둔 기록을 전부 걷는다 (history.go 는 popstate 를 한 번만 낸다) */
  const clearHist = useCallback(() => {
    const n = histDepth.current;
    if (n <= 0) return;
    histDepth.current = 0; ignorePop.current++;
    try { history.go(-n); } catch(e) { ignorePop.current--; }
  }, []);

  /* 왼쪽 위 [뒤로] 와 똑같은 일 — 버튼과 뒤로 가기가 이것을 함께 쓴다 */
  const backRef = useRef(null);
  useEffect(() => {
    backRef.current = () => {
      if (phase === 'detail') { clearHist(); setPhase('main'); return true; }
      if (phase === 'attend') { clearHist(); setPhase('main'); return true; }
      return false;                     /* 뿌리 화면 — 앱을 닫는다 */
    };
  }, [phase, role, clearHist]);

  useEffect(() => {
    const onPop = () => {
      if (ignorePop.current > 0) { ignorePop.current--; return; }
      /* 기록 하나가 이미 걷혔다. 나머지는 backRef 안의 clearHist 가 걷는다. */
      if (histDepth.current > 0) histDepth.current--;
      const fn = backRef.current;
      if (fn) fn();
    };
    window.addEventListener('popstate', onPop);
    return () => window.removeEventListener('popstate', onPop);
  }, []);

  /* ★ 안내실이 성도 정보를 고쳤다 (정식 1.16)

     온전한 명단(m_master)을 한 번 읽어 그 한 사람만 고친 뒤,
     fbSaveMembers 로 네 벌(master·admin·leader·member)을 다시 만든다.
     엑셀을 올릴 때와 똑같은 길이라 보안 규칙을 고칠 필요가 없고,
     성도 화면에도 곧바로 반영된다.
     쓰기는 안내실만 허용되어 있으므로 화면에서도 안내실에게만 연다. */
  const saveMemberInfo = useCallback(async (id, patch) => {
    const master = await fbLoadMasterMembers();
    if (!master.length) throw new Error('온전한 명단을 읽지 못했습니다.');
    let found = false;
    const next = master.map(x => {
      if (String(x['고유ID']) !== String(id)) return x;
      found = true;
      return { ...x, ...patch };
    });
    if (!found) throw new Error('명단에서 이 성도를 찾지 못했습니다. 엑셀을 다시 올려 주세요.');
    await fbSaveMembers(next, fieldVis, family);
    /* 화면이 들고 있는 명단도 곧바로 고친다 — 다시 받지 않아도 보이게 */
    setMembers(p => p.map(x =>
      String(x['고유ID']) === String(id) ? { ...x, ...patch } : x));
    setSelected(p => (p && String(p['고유ID']) === String(id)) ? { ...p, ...patch } : p);
  }, [fieldVis, family]);

  const updatePhoto = (id, url) => setPhotos(p => ({ ...p, [id]: url }));
  const goDetail    = m => {
    listScroll.current = window.scrollY || 0;
    setSelected(m); pushHist(); setPhase('detail');
  };
  const goAttend    = () => { pushHist(); setPhase('attend'); };
  /* 화면 안의 [뒤로] 버튼 — 뒤로 가기와 같은 길을 쓴다 */
  const goBack      = () => { const fn = backRef.current; if (fn) fn(); };

  /* ★ 상단 가운데 로고·제목을 누르면 — 로그인 후 첫 화면(주소록 목록)으로.

     어느 화면에 계시든 한 번에 처음 자리로 돌아오시게 하는 길이다.
     검색어·구역·소속·출석·직분 필터와 스크롤 자리까지 처음 상태로 되돌린다.
     명단을 서버에서 다시 받지는 않는다 — 기다리는 화면 없이 바로 떠야
     '새로고침' 이 눌린 느낌이 나기 때문이다. (자료를 다시 받는 길은
     불러오기 실패 화면의 [다시 받기] 에 따로 있다.) */
  const goHome = useCallback(() => {
    clearHist();
    setSelected(null);
    setView(homeView());          /* 구역 담당자면 자기 구역이 다시 골라진다 (1.18) */
    listScroll.current = 0;
    setPhase('main');
    try { window.scrollTo(0, 0); } catch(e) {}
  }, [clearHist]);

  async function logout() {
    clearHist();
    await signOutAll();
    setRole('member'); setSelected(null);
    setMembers([]); setPhotos({});
    setAttStatus({});
    setFamily({ g:{}, m:{}, r:{} });
    setFieldVis({ ...DEFAULT_VIS });
    setView({ search:'', fGu:'', fSo:'', fAtt:'', fCat:'', limit:60 });
    viewInit.current = false;     /* 다음에 로그인하시면 그분 구역으로 다시 맞춘다 */
    listScroll.current = 0;
    /* 명단·가족·출석상태를 이 기기에서 지운다 (clearPersonCache 주석 참고) */
    clearPersonCache();
    Object.keys(PHOTO_CACHE).forEach(k => delete PHOTO_CACHE[k]);
    Object.keys(VISIT_CACHE).forEach(k => delete VISIT_CACHE[k]);
    setPhase('login');
  }

  async function handleLogin(r) {
    lastRole.current = r;
    setPhase('loading'); setLoadErr(''); setStep('auth');
    try {
      const d = await loadForRoleOnce(r);
      setMembers(d.members); setFieldVis(d.fieldVis);
      if (d.visitCfg) setVisitCfg(normVisitCfg(d.visitCfg));
      if (d.listCfg)  setListCfg(normListCfg(d.listCfg));
      if (d.family)   setFamily(normFamily(d.family));
      if (d.photos) setPhotos(d.photos);
      if (d.logoUrl !== undefined) setLogoUrl(d.logoUrl || CHURCH_CFG.logo || '');
      if (d.hasLegacyLogo !== undefined) setHasLegacyLogo(!!d.hasLegacyLogo);
      setRole(r);
      localStorage.setItem('gsc_user_role', r);
      /* 구역 담당자면 목록의 「구역」 칸을 자기 구역으로 맞춰 둔다 (1.18) */
      viewInit.current = true;
      try { setView(homeView(_auth.currentUser && _auth.currentUser.email)); } catch(e) {}
      await loadAtt(r);
      setPhase('main');
    } catch(e) {
      /* ★ 정식 1.03 — 여기서 로그아웃하지 않는다.

         예전에는 명단 받기가 실패하면 signOutAll() 로 로그아웃시키고
         로그인 화면으로 되돌렸다. 그러면 어르신은 비밀번호를 다시 치셔야 했고,
         그것이 ★ '몇 번 튕긴다' ★ 는 경험의 정체였다.
         로그인은 이미 성공했는데 명단만 못 받은 것이므로,
         비밀번호를 다시 받을 이유가 없다.

         그래서 로그인 상태를 그대로 두고 [다시 받기] 만 눌러 이어가게 한다. */
      if (recoverFsOnce(e)) { setStep('recover'); return; }
      setLoadErr(fsErrMsg(e));
      setPhase('loadfail');
    }
  }

  /* 명단만 다시 받는다 — 비밀번호를 다시 치지 않아도 된다.
     등급은 세 곳에서 찾는다. 어느 하나가 비어 있어도 이어갈 수 있게. */
  async function retryLoad() {
    let r = lastRole.current;
    if (!r) {
      try {
        const u = _auth.currentUser;
        if (u) r = roleFromEmail(u.email);
      } catch(e) {}
    }
    if (!r) { try { r = localStorage.getItem('gsc_user_role') || ''; } catch(e) {} }
    if (!r) { setLoadErr(''); setPhase('login'); return; }
    await handleLogin(r);
  }

  /* 경과 초·단계 안내는 LoadingView 가 스스로 보여 준다 (위 주석 참고) */

  /* 모든 화면이 함께 받는 것 — 밝기와 [처음 화면으로] */
  const tp = { theme, toggle, onHome: goHome };

  /* 교회 설정에서 [목록] 으로 나온 직후라면 주소록 목록을 띄운다 */
  useEffect(() => {
    if (!WIZ_TO_MAIN) return;
    WIZ_TO_MAIN = false;
    setSelected(null);
    setPhase('main');
  });

  if (phase === 'loading') return h(LoadingView, {
    text:'성도 정보를 불러오는 중...', step,
    first: !cachedData          /* 기기에 명단이 없으면 첫 접속이다 */
  });

  /* 로그인은 됐는데 명단을 못 받았을 때 — 비밀번호를 다시 받지 않는다 */
  if (phase === 'loadfail') return h('div', {
    className:'screen',
    style:{ alignItems:'center', justifyContent:'center', gap:'14px', padding:'28px 26px' }
  },
    h('i', { className:'ti ti-cloud-off',
             style:{ fontSize:'54px', color:'var(--text-3)', opacity:.6 } }),
    h('p', { style:{ fontSize:'18px', fontWeight:800, textAlign:'center' } },
      '성도 명단을 받지 못했습니다'),
    h('p', { style:{ fontSize:'14px', color:'var(--text-2)', textAlign:'center',
                     lineHeight:1.8, maxWidth:'330px' } },
      h('b', null, '로그인은 되었습니다.'), ' 비밀번호를 다시 치실 필요는 없습니다.', h('br'),
      isFsAssertion(loadErr)
        ? h(React.Fragment, null, '앱을 잠시 닫았다 열면 생기는 문제입니다.', h('br'),
            h('b', null, '아래 [연결 되살리기] 를 눌러 주세요.'))
        : '아래 [다시 받기] 를 눌러 주세요.'),
    loadErr && h('div', { className:'note note-bad', style:{ maxWidth:'330px', fontSize:'13px' } },
      loadErr),
    h('button', {
      type:'button', onClick:retryLoad, className:'btn btn-primary btn-block',
      style:{ maxWidth:'330px' }
    }, h('i', { className:'ti ti-refresh', style:{ fontSize:'19px' } }),
       isFsAssertion(loadErr) ? '다시 받기' : '다시 받기'),

    /* ★ SDK 가 깨진 경우에는 이 화면에서 [다시 받기] 를 눌러도 같은 오류가 또 난다.
       인스턴스가 이미 망가져 있어서 화면을 다시 불러야 풀린다.
       그래서 오프라인 캐시를 끄고 다시 불러오는 버튼을 따로 둔다. */
    isFsAssertion(loadErr) && h('button', {
      type:'button', className:'btn btn-primary btn-block',
      style:{ marginTop:'10px' },
      onClick: () => { markFsBroken(); location.reload(); }
    }, h('i', { className:'ti ti-plug-connected', style:{ fontSize:'19px' } }), '연결 되살리기'),
    h('p', { style:{ fontSize:'12.5px', color:'var(--text-3)', textAlign:'center',
                     lineHeight:1.7, maxWidth:'330px' } },
      '신호가 약한 곳이면 잠시 뒤 다시 눌러 보세요.', h('br'),
      '와이파이가 있으면 연결하시면 훨씬 빠릅니다.'),
    h('button', {
      type:'button', onClick:logout, className:'btn btn-ghost btn-sm',
      style:{ marginTop:'6px', color:'var(--text-3)' }
    }, '처음 화면으로')
  );

  if (phase === 'login') return h(React.Fragment, null,
    h(LoginView, { ...tp, onLogin: handleLogin, logoUrl, guCodes }),
    /* 자료를 못 받았을 때 — 원인과 다시 시도를 함께 보여 준다 */
    loadErr && h('div', {
      style:{ position:'fixed', left:'50%', bottom:'26px', transform:'translateX(-50%)',
              width:'min(340px,90vw)', zIndex:50 }
    }, h('div', { className:'note note-bad' },
      loadErr,
      h('div', { style:{ marginTop:'8px', fontSize:'12.5px', opacity:.9, lineHeight:1.6 } },
        '· 인터넷 연결을 확인해 주세요.', h('br'),
        '· 계속 같은 안내가 나오면 목사님께 알려 주세요.'),
      h('button', {
        type:'button',
        onClick: () => { setLoadErr(''); location.reload(); },
        className:'btn btn-ghost btn-sm btn-block', style:{ marginTop:'10px' }
      }, h('i', { className:'ti ti-refresh', style:{ fontSize:'16px' } }), '다시 시도')))
  );

  if (phase === 'attend') return h(AttendView, {
    ...tp, members, photos, logoUrl, role, fieldVis, attStatus, listCfg,
    onAttStatus: changeAtt,
    onBack:   goBack,
    onSelect: goDetail
  });

  if (phase === 'detail' && selected) return h(DetailView, {
    ...tp, member:selected, allMembers:members, photos, logoUrl, role, fieldVis, visitCfg, listCfg,
    attStatus, onAttStatus: changeAtt, family,
    isAdmin: role === 'admin',   /* 사진 변경·정보 고치기는 안내실 몫이다 (등급 개편) */
    onSaveInfo:    role === 'admin' ? saveMemberInfo : null,
    onBack:        goBack,
    onNavigate:    m  => setSelected(m),
    onPhotoUpdate: updatePhoto
  });

  if (phase === 'admin') return h(AdminView, {
    ...tp, role, members, photos, fieldVis, logoUrl, visitCfg, listCfg, attStatus, family, hasLegacyLogo,
    onFamilyUpdate:    setFamily,
    onAttStatus:       changeAtt,
    onAttReload:       () => loadAtt(role),
    onAttend:          goAttend,
    onBack:            logout,
    onPreview:         () => setPhase('main'),
    onMembersUpdate:   setMembers,
    onFieldVisUpdate:  setFieldVis,
    onVisitCfgUpdate:  setVisitCfg,
    onListCfgUpdate:   setListCfg,
    onPhotoUpdate:     updatePhoto,
    onPhotosReset:     () => setPhotos({}),
    onLogoUpdate:      setLogoUrl,
    onOpenWizard:      () => setWizard(true)
  });

  return h(MainView, {
    ...tp, members, photos, logoUrl, role, fieldVis, attStatus, listCfg, family, reqs,
    view, setView, scrollRef: listScroll,
    onLogout:     logout,
    onSelect:     goDetail,
    /* 출석표 — 담당자와 전도인만. 안내실은 출석을 다루지 않는다 (등급 개편) */
    onAttend:     (role !== 'admin' && ROLES[role] >= ROLES.leader) ? goAttend : null,
    /* 관리 화면 — 안내실과 전도인이 모두 들어간다. 보이는 탭이 서로 다르다 */
    onAdminPanel: ROLES[role] >= ROLES.leader ? () => setPhase('admin') : null
  });
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
<script>
(function(){
  try{
    var el = document.querySelector('link[rel="apple-touch-icon"]');
    if(!el) return;
    var m = { name: document.title, short_name: (function(){
                try { var t = document.querySelector('meta[name="apple-mobile-web-app-title"]');
                      return (t && t.getAttribute('content')) || '성도주소록'; }
                catch(e) { return '성도주소록'; } })(),
              start_url:".", scope:".", display:"standalone",
              background_color:"#F3F6FA", lang:"ko",
              theme_color: (function(){
                try { var t = document.querySelector('meta[name="theme-color"][media*="light"]');
                      return (t && t.getAttribute('content')) || "#1F4E79"; }
                catch(e) { return "#1F4E79"; } })(),
              icons:[{ src:el.href, sizes:"180x180", type:"image/png", purpose:"any maskable" }] };
    var b = new Blob([JSON.stringify(m)], {type:"application/manifest+json"});
    var l = document.createElement("link");
    l.rel = "manifest"; l.href = URL.createObjectURL(b);
    document.head.appendChild(l);
  }catch(e){}
})();
</script>
